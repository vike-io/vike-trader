# <project>/settings/flags.toml — FEATURE FLAGS. Every one is a bool, every one DEFAULTS TO FALSE.
#
#     cp settings/flags.example.toml settings/flags.toml
#     $EDITOR settings/flags.toml
#     vike-cli config show --filter flags    # confirm what the binaries will read
#
# Every line below is COMMENTED OUT and set to its default (`false`), so this file AS SHIPPED
# configures NOTHING, and uncommenting a line as written still turns nothing on. Set a flag by
# uncommenting its line AND changing it to `true`.
#
# ⚠ ONE EXCEPTION, and it is written as `true` for a reason: `reconcile`. It became a FORCE-ON when
# reconciliation went on by default for live mounts, so `reconcile = false` is a line that no longer
# means anything — the loader warns at startup about a written one and points at `reconcile_off`.
# A template must not teach a value that does nothing, so this one is shown in the state that does
# something. Uncommenting it is still harmless on a paper box: with no live venue armed there is no
# read client for the driver to use, and it says so at WARN.
#
# Override chain, highest first: environment variable > this file > default. The environment grammar
# is the EXACT string "1" or "0" — any other value is a startup ERROR, never a silent false.
#
# ⚠ `vike-cli config show`'s READ column is worth a look before you set one of these. Some flags in
# this file are read by a LIBRARY that resolves its own environment variable rather than by the
# settings loader, so setting them HERE does nothing yet — the column says `NO` for exactly those,
# and the `--json` view carries each one's reason. That is a wiring gap being closed key by key, not
# a broken file; the ones that already read this file report `yes`.
#
# ⚠⚠ AND A `NO` DOES NOT MEAN "EXPORT THE VARIABLE INSTEAD". For `poly_heartbeat`,
# `poly_auto_redeem`, `poly_redeem_halt`, `pm_resolve` and `hl_outcome` — and for
# `record_chains` the environment variable is dead too: the code that reads it sits inside a poller
# (or a recorder constructor) that no shipped binary ever builds, so NEITHER spelling does anything
# today. `config show` says which of the two you are looking at, per key, in one line above the
# reason. The features are unmounted, not removed — each is waiting on a decision to mount it, not
# on a line of wiring — and the `# Env:` lines below name the variable each flag WOULD resolve
# against rather than promising it works.

# -- reconciliation: diff venue reports against local state ---------------------------------------
# ⚠ Reconciliation is ON BY DEFAULT for any mount that arms a LIVE venue account, under the
# quarantine policy (it asks; it folds no divergence without you — but it DOES seed the venue's
# balance authoritatively every pass, which moves your margin ceiling; see docs/ops/reconcile-on-restart.md).
# This flag is the FORCE-ON, not the
# gate: it turns the driver on where the armed-live probe reports nothing. The OFF switch is
# the `reconcile_off` line at the bottom of this file.
# Env: VIKE_RECONCILE
# reconcile = true
# Adopt a venue order with no local match (a TERMINAL one whose fills fell outside the lookback).
# Env: VIKE_RECONCILE_GENERATE_MISSING
# reconcile_generate_missing = false
# Env: VIKE_RECONCILE_BALANCE
# reconcile_balance = false

# -- order emulation ------------------------------------------------------------------------------
# Env: VIKE_OCO_CANCEL_SIBLING_ON_DEAD_EXIT
# oco_cancel_sibling_on_dead_exit = false

# -- the headless daemon (vike-tradehub) ----------------------------------------------------------
# Mount the LIVE twelve-venue core instead of the paper exchange. ⚠ REAL MONEY, gated additionally
# by the per-venue credentials being present — absent creds keep that venue paper regardless.
# Env: VIKE_TRADEHUB_LIVE
# tradehub_live = false
# Accept WRITES on the node server. Off, a Control-scope peer is refused at the handshake and every
# connection is observe-only, however good its key.
# Env: VIKE_TRADEHUB_CONTROL
# tradehub_control = false
# ⚠ Let the node server bind a NON-LOOPBACK address (`0.0.0.0`, `::`, or a specific interface).
# Off — the default — the daemon REFUSES such a bind and keeps trading headless, because that
# surface's handshake is plaintext and authenticates the connection rather than each frame: reach it
# over an SSH tunnel instead (`ssh -L 7879:localhost:7879 <host>`), the way vike-datahub is reached.
# Turn this on only when the listening network is itself trusted (a VPN interface, a private LAN);
# every start then warns that the surface is exposed.
# Env: VIKE_TRADEHUB_ALLOW_PUBLIC_BIND
# tradehub_allow_public_bind = false
# ⚠ The Telegram control channel: a REMOTE ORDER-ORIGINATION path reachable from a third-party chat
# service. This runtime flag is the LAST of its gates — a default build does not compile the module
# at all (`--features telegram`), and the bot token plus a non-empty chat allowlist must be in
# `secrets.env` on top of this.
# Env: VIKE_TELEGRAM_CONTROL
# telegram_control = false
# Env: VIKE_TRADEHUB_RECORD
# tradehub_record = false
# Cancel every RESTING ORDER while the daemon shuts down. OFF (the default, and what has always
# happened) leaves your quotes live at the venue with nothing left running to manage them. It never
# FLATTENS — positions survive either way; `market-exit` is the verb that closes them.
# ⚠ Only reached by a stop that actually tears down: an interactive `shutdown`/`quit`/Ctrl-D. Under
# the shipped systemd unit stdin is /dev/null and SIGTERM has no handler, so `systemctl stop` kills
# the process before this can run. See docs/ops/kill-switches.md §D.
# Env: VIKE_CANCEL_ORDERS_ON_SHUTDOWN
# cancel_orders_on_shutdown = false

# -- polymarket -----------------------------------------------------------------------------------
# Mount the LIVE execution client. ⚠ This also STARTS THE USER-WS FILL PUMP: on this venue every
# post-acceptance terminal arrives only on the user channel, so exec without the pump would accept
# orders that can never reach a terminal. The two are deliberately inseparable.
# Env: POLY_EXEC
# poly_exec = false
# ⚠ Reconcile WITHOUT `poly_exec` diffs live venue state against a PAPER engine — two different
# accounts — and under the `hybrid` policy `PositionDrift` AUTO-APPLIES: it folds the LIVE account's
# position into the paper engine's books at the venue's avg price. Alone, run `quarantine`.
# ⚠ This line said "every local order diffs as an orphan and auto-cancels every pass", which was
# false in both halves and was corrected everywhere else on 2026-08-06: `OrphanLocalOrder` folds
# ZERO events under every policy, and nothing in the reconcile path synthesizes a cancel at all
# (`crates/vike-exec/tests/recon/recon_policy_pin.rs` pins every kind). The hazard is the position
# side, not the order side. The `Flags::poly_reconcile` doc this file mirrors was fixed then; this
# copy — the one an OPERATOR actually reads — was missed.
# Env: POLY_RECONCILE
# poly_reconcile = false
# Env: POLY_HEARTBEAT
# poly_heartbeat = false
# Redeem resolved WINNING positions via the gasless relayer (at-most-once, ledger-backed).
# Env: POLY_AUTO_REDEEM
# poly_auto_redeem = false
# ⚠ INVERTED — the auto-redeem KILL SWITCH. `true` HALTS redemption. Its environment layer is
# PRESENCE-based (the variable existing arms it, whatever the value), because a kill switch no value
# can un-set is the only kind worth having.
# Env: POLY_REDEEM_HALT
# poly_redeem_halt = false
# Env: VIKE_PM_RESOLVE
# pm_resolve = false

# -- per-venue behaviour --------------------------------------------------------------------------
# Env: VIKE_HL_OUTCOME
# hl_outcome = false
# Env: HYPERLIQUID_HIP3
# hyperliquid_hip3 = false

# -- recorders (write extra series into the hist store) --------------------------------------------
# Env: VIKE_RECORD_PROPERTIES
# record_properties = false
# Env: VIKE_RECORD_CHAINS
# record_chains = false
# ⚠ `record_dvol` is GONE — DELETED, not deferred. It was the one key with no reader on either
# spelling, so writing it now FAILS startup by name (`vike_config::DEAD_FLAG_KEYS`).

# -- SAFETY OVERRIDES: read the sentence twice ----------------------------------------------------
# ⚠ Permit API keys that carry WITHDRAW permission. The default refusal exists because a key that
# can move funds off the venue has no business signing orders.
# Env: VIKE_ALLOW_WITHDRAW_KEYS
# allow_withdraw_keys = false
# ⚠ Skip the startup preflight — the checks that catch a misconfigured mount BEFORE it trades.
# Env: VIKE_PREFLIGHT_SKIP
# preflight_skip = false
# ⚠ Refuse the DEFAULT-ON live reconcile. A mount that arms a live venue account otherwise asks that
# venue what it holds at startup and every minute after, and HOLDS every divergence for you
# (quarantine — nothing is folded without your confirm). Setting this means the daemon never asks:
# an unclean restart can leave resting orders and position state wrong with nothing to say so.
# The reason to set it is a venue you must keep armed but must not read — see
# docs/ops/reconcile-on-restart.md. Restart-required.
# Env: VIKE_RECONCILE_OFF
# reconcile_off = false
# ⚠ Refuse the DEFAULT-ON venue catalog on a `vike-datahub`. A data daemon otherwise answers a
# client asking for ONE venue's PUBLIC instrument list — which is what fills the symbol picker, and
# therefore what makes it possible to pick a symbol at all. Setting this means the daemon serves no
# catalog: the verb is still answered (having called no venue), the `venue_catalog` capability is
# absent from the handshake, and a connected desktop renders the reason instead of an empty list.
# The reason to set it is a box whose venue-API budget is reserved for something else, or one you
# do not want an Observe-scope client able to make call a venue at all. Restart-required.
# ⚠ It does NOT bound the cost of a fetch: the per-venue token buckets, the memo TTL and each
# bridge's own pager do that, and none of them moves with this key. It makes the feature ABSENT.
# ⚠ The OLD arming `VIKE_DATAHUB_VENUE_CATALOG=1` configures nothing now. A value that used to mean
# OFF is warned about at startup; `=1` is silent, because what it asks for is what it now gets.
# See docs/decisions/0066-the-venue-catalog-is-on-by-default-and-the-switch-is-its-refusal.md
# Env: VIKE_DATAHUB_VENUE_CATALOG_OFF
# venue_catalog_off = false
