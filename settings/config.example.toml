# <project>/settings/config.toml — DEPLOYMENT CONFIG: where things live, what listens where.
#
#     cp settings/config.example.toml settings/config.toml
#     $EDITOR settings/config.toml
#     vike-cli config show --filter config    # confirm what the binaries will read
#
# Every line below is COMMENTED OUT, so this file AS SHIPPED configures NOTHING — copy it and you
# still have the compiled-in defaults. Uncomment only what you mean to SET: where a key has a real
# default the line shows it, and where its default is absence (an `Option`) the line shows a working
# example value, so uncommenting THAT line sets it.
#
# Full override chain, highest first: environment variable > this file > default. Each key names its
# own variable below; `vike-cli config show` prints which layer actually won on this box.
#
# A path key that is omitted does NOT mean "no directory" — it means the reading binary falls back to
# its own default, which is not the same for every binary. `config show`'s DEFAULT column is the
# authority for each one.

# Historical data store root — the DataFusion+Parquet hist store every backtest, backfill and Studio
# read opens. Omitted = the platform user-data directory (`~/.local/share/vike-data` on Linux).
# Env: VIKE_HIST_STORE
# store_root = "/data/vike/hist"

# Where the rolling JSON trace log is written. Omitted = `<project>/settings/state/logs`, falling
# back to `<exe_dir>/logs` when no project sits above the working directory.
# ⚠ This is the SIZE knob's neighbour, not the size knob: the file layer defaults to `trace` and
# ignores RUST_LOG entirely. Turn the volume down with `preferences.log_file_level`.
# Env: VIKE_LOG_DIR
# log_dir = "/var/log/vike"

# The write-ahead command journal directory (crash-recoverable order intents). Omitted = disabled.
# Env: VIKE_JOURNAL_DIR
# journal_dir = "/var/lib/vike/journal"

# Where `vike-cli backtest run` READS HISTORY from — the vike-datahub data server,
# usually reached over an SSH tunnel (`ssh -L 7878:localhost:7878 the CI box`). Must contain a ':'.
# ⚠ It is no longer where those commands ship a PROFILE: ruling 7 moved the compute verbs to the
# `backtest_addr` daemon below. This key still governs the STORE plane (the Studio's remote history,
# the Data Manager's catalog and coverage, backfill and delete).
# Env: VIKE_DATAHUB_ADDR
# datahub_addr = "127.0.0.1:7878"

# The COMPUTE daemon's address: where `vike-backend backtest --addr` BINDS on this box, and where
# `vike-cli backtest run` and `vike-cli research study` DIAL it. Omitted (the default) = 127.0.0.1:7880.
# Must contain a ':'.
# ⚠ ONE key for both ends, unlike every other address here, and that is deliberate rather than an
# oversight: the compute daemon runs on the same box as the store it computes over, so the value a
# deployment writes once is the value both its unit file and that box's clients want. The
# LISTEN/DIAL pairs above exist because a tunnel puts a different value on each side, and nothing
# tunnels between a daemon and the store beside it.
# ⚠ 7880 rather than 7879, and the two digits matter: 7879 is the LIVE ORDER-SIGNING daemon's port
# (`tradehub_addr` below, and `vike-cli backend setup`'s default). A compute client defaulting
# there would open a connection to the trading socket and speak a protocol it does not serve. Two
# daemons on one box at 7879 is a loud failure — whichever starts second exits with AddrInUse — but
# a CLIENT dialling the wrong one is not, which is why the default moved rather than the warning.
# Env: VIKE_BACKTEST_ADDR
# backtest_addr = "127.0.0.1:7880"

# The address vike-tradehub's authenticated node server BINDS, and the one `vike-cli trade --node`
# connects to. Omitted (the default) = NO node server at all: the daemon trades headless and has no
# network surface. Must contain a ':'.
# ⚠ Setting this opens a socket. Observe (read) is always available to a peer holding
# VIKE_TRADEHUB_OBSERVE_KEY; WRITES additionally need `flags.tradehub_control`.
# Env: VIKE_TRADEHUB_ADDR
# tradehub_addr = "127.0.0.1:7879"

# The datahub dial address this daemon ADVERTISES to its clients (split-plane REQ-2): set, and every
# `Welcome.features` the node server sends carries `datahub=<addr>`, so a client that has NOT set its
# own `datahub_addr` dials the data service there — one configured address reaches both planes.
# Omitted (the default) = advertise nothing. Must contain a ':'.
# ⚠ THREE of this file's addresses meet here — `backtest_addr` above and `node_addr` below are
# the other two, and `node_addr`'s comment sorts every one of them by whose box holds the value.
# `tradehub_addr` above is where the
# DAEMON LISTENS; `datahub_addr` above is where THIS box's CLIENT dials (an explicit value always
# WINS over any advertisement); this key is where the daemon TELLS clients to dial the datahub it
# fronts. So its value must be valid FROM THE CLIENT'S SIDE of the wire — with the tunnel posture
# both servers ship with, that is the client-local tunnel mouth (`ssh -L 7878:localhost:7878`), not
# this box's private interface.
# Advertisement, never proxying: data traffic never flows through the process holding live orders.
# Env: VIKE_DATAHUB_ADVERTISE_ADDR
# datahub_advertise_addr = "127.0.0.1:7878"

# WHICH BOX this daemon reports itself to be running on — stamped into the identity block every
# published frame carries, so a thin client's Connections strip can name the box instead of the
# tunnel. ⚠ OMITTED (the default) IS NOT "report nothing": the daemon discovers its own source
# address from the kernel's routing table (the same answer `ip route get` prints as `src`) and
# reports THAT, so you configure nothing to see a real address. Must contain a ':'.
# ⚠ This is an ADVERTISEMENT OF IDENTITY, not a dial address — it is the one address in this file
# nobody connects to. A daemon that binds loopback is reachable only through a tunnel, so the
# address it reports for itself names the BOX and is not an endpoint a client can dial. Nothing
# routes by it; it opens no socket and changes no traffic.
# SET IT when the route lookup cannot answer:
#   behind NAT   the lookup returns this box's PRIVATE address, because the kernel does not know
#                the public one in front of it and asking a third party to find out is refused
#   a box whose useful name is not the routed interface (a management VLAN, a second provider)
#   a loopback-only container, where there is no route to name a source address from at all
# Env: VIKE_TRADEHUB_ADVERTISE_ADDR
# tradehub_advertise_addr = "203.0.113.7:7879"

# The ACCOUNT-ADMIN BARRIER an operator DECLARES before this daemon will administer accounts over
# the node wire — add, rename, deactivate, remove, and the one verb that carries a CREDENTIAL VALUE
# (docs/decisions/0065). THREE values, not a boolean, and unset is the default:
#
#   unset / "off"  nothing is armed. No admin key is read, no `account-verbs` capability is
#                  advertised, and this daemon is byte-identical to a build without the verb.
#   "loopback"     you assert this node server is on loopback and reached through an SSH tunnel.
#                  The daemon CHECKS it against its own bind and REFUSES the capability when the
#                  bind is not loopback — and `tradehub_allow_public_bind` does NOT waive that
#                  refusal: that flag is consent to publish an ORDER surface, not a key-material one.
#   "contained"    you assert the barrier is OUTSIDE this process — a container port published to
#                  127.0.0.1, a private interface. The daemon CANNOT verify this and says so on
#                  every start. If the assertion is false, every credential written over this wire
#                  crosses it in PLAINTEXT: the node wire has no TLS and authenticates the
#                  connection rather than each frame.
#
# ⚠ Arming also needs a VIKE_TRADEHUB_ADMIN_KEY in the node-key store — a THIRD key, separate from
# the observe/control pair, so the key a desktop carries to place orders is not the key that writes
# key material. A declaration with no such key arms nothing and logs why.
# ⚠ An UNRECOGNISED value is treated as OFF rather than refusing to start: a typo must never arm a
# credential surface. The value you typed is logged so you are told rather than left believing the
# barrier is up.
# Restart required.
# Env: VIKE_TRADEHUB_ACCOUNT_ADMIN
# tradehub_account_admin = "loopback"

# This deployment's ORIGIN TAG — 1 to 4 letters/digits, stamped into the client order id of every
# order this instance places (`<origin>V<session><seq>`), so a SECOND instance trading the SAME
# venue account is recognisable on reconcile instead of anonymous. Omitted (the default) = ids
# exactly as they have always been minted, and every reconcile fold decision unchanged.
# ⚠ SET A DIFFERENT VALUE ON EVERY DEPLOYMENT THAT SHARES A VENUE API KEY. Two boxes carrying the
# same tag read as ONE instance, which is the honest answer to the only evidence the system has —
# and is exactly the state this key exists to let you leave. Case-insensitive (`West` == `west`).
# ⚠ It reaches the wire on the next FRESH coid session: a restart RESUMES its journalled session
# verbatim (replay determinism), so a core that was already running keeps minting its old ids and
# says so with a startup warning. docs/ops/double-live-instances.md is the operator page.
# Env: VIKE_INSTANCE_ORIGIN
# instance_origin = "west"

# Where THIS box's `vike-cli` dials a running vike-tradehub node when `--node` is not given —
# the CLIENT-side inverse of `tradehub_addr` above. Omitted (the default) = `--node` stays
# required on every node-facing verb, exactly as before this key existed. Must contain a ':'.
# ⚠ FIVE addresses, five jobs — sort them by WHOSE box holds the value and whether that box
# LISTENS on it or DIALS it:
#   tradehub_addr           the DAEMON's box, LISTEN — where vike-tradehub binds
#   datahub_addr            a CLIENT's box, DIAL     — where this machine reaches a datahub
#   datahub_advertise_addr  the DAEMON's box, DIAL-FOR-SOMEBODY-ELSE — what the node tells its
#                           clients to use for the datahub it fronts
#   node_addr               a CLIENT's box, DIAL     — where this machine reaches a tradehub node
#   backtest_addr           BOTH boxes               — the compute daemon binds it, a compute
#                           client dials it; see its own block ABOVE for why one key serves both
# So this key is `datahub_addr`'s exact twin one plane over, and it is NOT called `tradehub_addr`
# because that spelling is the daemon's BIND: with a tunnel in front the two are set on different
# machines and only agree by coincidence of the tunnel. It is named for the FLAG it defaults.
# ⚠ It has NO environment variable, and it is the ONLY key here that does not: `--node` is
# already its per-invocation override, so a third spelling would add a place to look and no
# capability. (`backtest_addr` above was the second such key for exactly as long as its client
# half stood alone; the daemon half brought `VIKE_BACKTEST_ADDR` with it, and this line is the
# one that had to be told.)
# `vike-cli backend connect <host>` writes this line for you after it raises the tunnel.
# node_addr = "127.0.0.1:7879"
