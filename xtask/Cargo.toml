# The repository's own build tooling — the `xtask` convention, a task runner written in the language
# the project is already in. It answers ONE question: what does CI run? — for CI, for the justfile
# and for a developer, out of one implementation instead of the three languages plus a hand copy that
# used to answer it.
#
# Entry point: `just xtask <cmd>`, which is `cargo run -p xtask -- <cmd>`. ⚠ NOT `cargo xtask`: an
# alias would have to live in `.cargo/config.toml`, `xtask/tests/build_config_gate.rs`
# requires every leaf path there to sit under `target.x86_64-pc-windows-msvc`, and cargo does not
# allow `[alias]` to be target-scoped. The convention's spelling is unavailable in this repository.
#
# ⚠ IT IS A WORKSPACE MEMBER AND A FULL CI CRATE — it is NOT in `EXCLUDE_FROM_CI`. That is the
# opposite of the usual xtask advice, and the reasons are this repository's own gates:
# `xtask/tests/feature_lane_coverage.rs`'s `every_workspace_member_is_built_by_some_lane`
# refuses a member no lane builds, and `crate_of` maps a path under a NON-member to no crate — so a
# workspace-excluded xtask could change and CI would plan nothing at all. Being in the roster costs
# one small crate in the fast lane and buys tests plus `clippy -D warnings` on the code that derives
# the merge gate. `crates/vike-ops` also DEV-depends on it, so the differential gate calls the
# library in-process rather than spawning a nested cargo build.
#
# ⚠ ITS DEPENDENCY SET IS THE POINT. The roster has to be answerable BEFORE the workspace is built —
# in a cold CI `plan` job, and in every justfile recipe that needs the roster — so this crate takes
# exactly one NORMAL dependency (serde_json, to read `cargo metadata`'s JSON) and no vike-* crate at all.
# MEASURED on the dev box, warm registry: 6 compile units, 1.8-2.1 s cold, 86-122 ms warm. Adding a
# dependency here makes the question slower to ask than the answer is worth. (⚠ This read "on every
# `just` invocation" while the justfile bound the roster to a VARIABLE, which `just` evaluates
# eagerly for any recipe it runs; the binding moved into the recipe bodies, so only a recipe that
# needs the roster pays for it now.)
# The "no vike-* crate" half is HELD, not only stated, since 2026-09-29:
# `crates/vike-ops/tests/architecture/layer_gate/vike_free.rs`'s `every_vike_free_crate_names_no_vike_crate`, through this
# crate's `VIKE_FREE_CRATES` row — the tier-15 rule alone would admit `vike-model` (10) and
# `vike-marketdata` (5). The "exactly one dependency" half is held by nothing.
#
# ⚠ THE GATES THAT LIVE IN `tests/` ADD DEV-DEPENDENCIES AND NOTHING ELSE (2026-10-08, the vike-ops gate
# regroup moved the CI-derivation gates here so they run when this crate changes). `cargo run -p xtask`
# builds the bin target, which compiles NO dev-dependency, so the cold `plan` job and every roster recipe
# still compile serde_json alone. The dev-dependencies are the three external crates those gates parse
# with (`tempfile`, `toml`, `proc-macro2`) and they are NEVER a `vike-*` crate: a dev-dependency does not
# trip the vike-free gate above, but it is what would make every vike-model change select this crate
# through the planner's reverse-dependency closure, and one gate that wanted such an edge stayed in
# vike-ops for it (`xtask/CLAUDE.md`'s "Gates that live here").
[package]
name = "xtask"
version.workspace = true
edition = "2024"
publish = false

# Layer 15 = `leaf` in `crates/vike-ops/tests/architecture/layer_gate.rs`'s TIERS: a pure leaf with no vike-*
# dependency of its own. It is not part of the product's architecture at all — nothing in the
# workspace may depend on it normally, and the one edge that exists (vike-ops, dev-only) is a test
# edge that the layer gate exempts by construction.
[package.metadata.vike]
layer = 15

[dependencies]
serde_json = { workspace = true }

# Workspace lint policy (root manifest): forbids `unsafe_code`. Cargo binds `[workspace.lints]` only
# to members that opt in, so a crate without these two lines is silently outside the policy —
# `crates/vike-ops/tests/hygiene/unsafe_and_toolchain_gate.rs` is what refuses that. This crate is unsafe-free.
[lints]
workspace = true

# Only the integration gates in `tests/` use these (see the header): none is built by `cargo run -p xtask`.
# `tempfile` — the planted git topologies and shell sandboxes; `toml` — `build_config_gate`'s parser (the
# axis a line scanner cannot close, reasoned at that gate); `proc-macro2` — `ci_plan_gate`'s cfg-token
# classifier. Versions and features come from the workspace entries, so no new package enters the lockfile
# (the delta is three names in this crate's own dependency list).
[dev-dependencies]
tempfile = "3"
toml = { workspace = true }
proc-macro2 = { workspace = true }
