[package]
name = "vike-fills"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the shared FILL cluster: cost scalars, tiered fill-price models (bar / L1 tick / L2 book-walk), intrabar fill resolution and the stale-price wait. Depends on vike-model only, so the paper exchange and the simulator share ONE definition of a fill."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain` — one hop over the vocabulary: a single-purpose pure core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 20

[dependencies]
# The ONLY dependency, by design (see the crate doc): Bar / L2Book / OrderKind / WorkingOrder, the
# `order_fill_price` trigger oracle and the `book_taker_price` taker law all live in vike-model.
# Adding vike-exec, vike-core or vike-data here would defeat the reason this crate exists — it must
# stay a leaf that BOTH the simulator and a live-adjacent paper executor can depend on.
vike-model = { path = "../vike-model" }

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
