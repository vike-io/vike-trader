[package]
name = "vike-backtesthub"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
# Every test binary is a `[[test]]` row at the end of this file. Discovery is off so the suites `tests/integration.rs`
# groups stay at their paths, the paths their citations name, without also becoming binaries of their own.
autotests = false
description = "vike's backtesthub and backtest tool: the `backtest` CLI (`backtest_cli`, the library function behind both the `backtesthub` bin and the `vike-backend backtesthub` multicall arm), the daemon it becomes under `--addr` (`backtesthub_server`, which serves the seven backtest verbs over the hub protocol), the Studio's run pipeline those verbs run (`studio_run`, over `vike-studio-core`'s vocabulary), the `vike-study` study CLI, and the Polymarket cheap_np research bins. It computes and owns no store. The harness itself stays in `vike-backtest`."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `daemon` — a headless top-of-graph binary: nothing may depend on it.
# 65 is the rank of its sibling daemons (`vike-datahub`, `vike-tradehub`), and the arithmetic floor is
# 46: the ceiling is `vike-study-runner` (45), the study host it serves, over `vike-studio-core` (30), the crate
# whose Studio VOCABULARY the backtesthub's run pipeline (`studio_run`, that crate's until 2026-11-10) speaks. This code was `vike-backtest`'s (30) until the change that deleted that crate's
# `datafusion-store` and `venue-fetch` features and the boxed-function seam
# (`StudioRunTable`/`StudyRunFn`) the layer rule forced while the server sat BELOW the crate that owns
# the runners (`crates/vike-backtesthub/CLAUDE.md` carries the change).
# ⚠ The layer rule alone does not keep a venue or collector (40-42) off the harness through this
# crate's neighbours; that is `crates/vike-ops/tests/architecture/layer_gate/fences.rs`'s
# `no_venue_or_collector_names_the_research_harness`, which fences `vike-backtest` and walks the
# normal closure. Nothing in the 40-42 band names this crate, and nothing may.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 65

[dependencies]
# The HARNESS the daemon and the CLI serve: `run::run_backtest`/`run_paramscan`/
# `run_walkforward`, the search family, `data_plan`, `run_fingerprint`, `trial_ledger`. Layer 30, a
# plain DataFusion-free library. Since 2026-11-10 it is also what `studio_run` (the Studio's run
# pipeline) and `harness_sim` drive, both `vike-studio-core`'s until then.
vike-backtest = { path = "../vike-backtest" }
# The Studio's VOCABULARY: `DataSlice`, `StrategySpec`, `RunError`, `StudioParamscan`, the `wire_run`
# conversions `studio_run`'s `*_local` entries call, and a study run's manifest vocabulary
# (`study_run::StudyDetail`, `StudyMetric`). Layer 35 — the crate this one used to sit BELOW, which is why
# the runners were injected as boxed functions. ⚠ The RUNNERS themselves are this crate's since 2026-11-10
# (`studio_run`): `vike-studio-core` is what the desktop links, and it links no engine
# (docs/decisions/0078's amendment of that day).
vike-studio-core = { path = "../vike-studio-core" }
# The STUDY HOST this daemon runs (`RunStudy`, `ListStudies`, `ListRuns`) and `study_cli` runs: the listings,
# `study_dispatch::run_study_plan` and the interpreted tier, which run here. Layer 45. It left
# `vike-studio-core` on 2026-11-19, when studies came to run only on the server (the owner's ruling of that
# day), because the desktop links that crate and runs no study.
vike-study-runner = { path = "../vike-study-runner" }
# The SHARED hub-protocol substrate: the HMAC-SHA256 nonce-challenge handshake generalized over its
# domain separator (`auth`) and the length-prefixed frame codec (`frame`). Names no vike-* crate.
vike-hub-protocol = { path = "../vike-hub-protocol" }
# This daemon's own wire: its `Request`/`Response`, the scope and name of each verb, the Studio DTOs and
# the named run's bounds (decision 0252's verdict 4). `vike-datahub-client` below stays for history.
vike-backtesthub-client = { path = "../vike-backtesthub-client" }
# The WIRE (`Request`/`Response`, the shared plane/scope tables, the bind guard both daemons
# enforce) and the HISTORY ROUTE (`hist-route`: the hub keys and `config.datahub_addr` that decide
# which datahub the CLI and the daemon read history from). The route is ALWAYS on here — it was
# `vike-backtest`'s `datafusion-store` feature.
vike-datahub-client = { path = "../vike-datahub-client", features = ["hist-route"] }
vike-model = { path = "../vike-model" }
# The compensated sum (`vike_math::summation::compensated_sum`, decision 0294): layer 2, `libm` only, already in
# this crate's closure through vike-model.
vike-math = { path = "../vike-math" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../vike-venues" }
# The pure helpers (decision 0141, layer 3) this crate calls: `fnv`, `calendar`, and `cli` (decision 0155),
# the rules every command line obeys on top of `clap`: the `backtest` CLI and every bin read their argv through it.
vike-utility = { path = "../vike-utility", features = ["cli"] }
# `#[derive(clap::Parser)]` on each program's args struct (decision 0155): named directly, never re-exported.
clap = { workspace = true }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../vike-paths" }
# `vike_boot::descriptors`: this root does not boot, and its `.rs` runs start a strategy process, so it
# runs the boot's step 0 itself (no inherited descriptor reaches that child; the owner, 2026-11-14). Layer 25.
vike-boot = { path = "../vike-boot" }
# The run directory every backtest and search writes and reads back (`vike_runs::X`).
vike-runs = { path = "../vike-runs" }
vike-marketdata = { path = "../vike-marketdata" }
# `vike_simulator::{StrategyEngine, StrategyEngineConfig, Tick, LatencyModelKind}` — the research bins drive the
# engine directly.
vike-simulator = { path = "../vike-simulator" }
vike-analytics = { path = "../vike-analytics" }
# ⚠ NO `vike-rust-strategy` (the strategy file LOADER) in this table, and there was one until plan 2b: a request whose
# strategy is a strategy file runs in a sandboxed child (`src/strategy_sandbox.rs`), so this daemon loads no code, as the
# order-signing daemon does not. `crates/vike-ops/tests/architecture/named_run_closure_gate/fences.rs`'s
# `STRATEGY_FILE_LOADER_FENCE` holds it.
# `spawn_strategy_process`: how that child starts (an empty environment, `/`, three pipes). Layer 15, std plus the
# Linux jail crates; this side spawns and never jails itself. The artifact's PATH is the child's to compute (its build
# folder names the loader's ABI and fingerprint, `vike_rust_strategy::artifact::build_folder`): this side hands it the
# directory and the sha.
vike-sandbox = { path = "../vike-sandbox" }
# The sandboxed child's frame BODIES (`src/strategy_sandbox/wire.rs`): msgpack keeps every `f64` bit, NaN included,
# where JSON writes `null` and cannot read it back. They are written by the child pipe's codec
# (`vike_hub_protocol::child_pipe`, the live verb's too); this edge is the row count's peek at a body
# (`wire::row_count`). Already a workspace pin; an edge, not a crate.
rmp-serde = { workspace = true }
# `harness_sim::HarnessSim` implements `vike_user_research::StudySim`, and `studio_run::run_study_local` and
# `study_cli` hand a study its learner as `vike_user_research::StudyLearner`. Already in this closure through
# `vike-study-runner` (layer 25 against 65); named directly since HarnessSim moved here (2026-11-10).
vike-user-research = { path = "../vike-user-research" }
# `vike_ml_training::GbdtLearner`, the learner `run_study_local` and `study_cli` construct for a study that fits (and the
# `TpeConfig` `backtest_cli`'s search-flag tests build). A DEV edge until those two moved here from
# `vike-studio-core` (2026-11-10); already in this closure through `vike-study-runner`.
vike-ml-training = { path = "../vike-ml-training" }
# The `HistoryStore` trait and the row types the research bins read.
vike-data = { path = "../vike-data" }
# ⚠ NO `vike-store` and NO `ureq` in this table: this crate computes and owns no store. Its daemon, its
# CLI and its research bins read history over the wire, and what managed a store is
# `vike-backend datahub store` (`docs/decisions/0084-only-the-datahub-touches-the-store.md`).
# `ci.yml`'s `datahub-all` guard (K) holds `cargo tree -p vike-backtesthub -e normal` to that sentence.
# The datahub NODE KEYS the daemon arm reads, and `config.backtest_addr`. ⚠ `vike-secrets`, NOT
# `vike-bridge-core`: that crate owns the ureq/tungstenite/rustls transport stack, which must not
# join this crate's graph to read a `.env`. Both are light leaves (layers 15 and 20).
vike-secrets = { path = "../vike-secrets" }
vike-config = { path = "../vike-config" }
vike-log = { path = "../vike-log" }
# `load_and_install_user_indicators`, the once-per-process Rhai indicator install that `backtest_cli`'s
# `run` performs for every invocation (a one-shot run compiles a Rhai strategy exactly as the daemon does).
vike-rhai = { path = "../vike-rhai" }
# `vike_strategy::file` (the folder scan `ListStrategies` answers, the file language a run routes on),
# and the maths the `cheap_np_*` research bins read (`fair_value`, `cheap_np_ask`). No strategy is
# built from it here.
vike-strategy = { path = "../vike-strategy" }
# `src/run_fingerprint.rs`'s INPUT ADDRESS over (resolved config text, data fingerprint). No new
# crate joins the workspace for it: `vike-hub-protocol` declares `sha2` NON-optionally already.
# ⚠ NOT a hand-rolled 64-bit mixer: `vike-backtest`'s `src/search/genetic.rs` records `DefaultHasher`
# as rejected because std leaves its algorithm unspecified, and a false equality in a content address
# says "your engine edit changed nothing" when it did.
sha2 = { workspace = true }
# `DataFingerprint`, the run's input record in the manifest.
serde = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }

# `crate::test_support`: the loopback backtesthub over `vike_data::HistoryStoreMemory` that this crate's and
# vike-cli's suites spawn (through `vike_log::loopback::spawn_on_loopback`, vike-log's `test-support`). Only DEV edges may turn it on (`crates/vike-ops/tests/architecture/test_surface_gate.rs`).
[features]
test-support = ["vike-data/test-support", "vike-log/test-support"]

[dev-dependencies]
# Self-referential dev-dep (the `vike-execution`/`vike-model` idiom): turns `test-support` on for THIS crate's
# own `tests/` targets.
vike-backtesthub = { path = ".", features = ["test-support"] }
# The real history SERVER, for the tests that drive the shipped `backtesthub` binary over a scratch
# store (`tests/engine_cli/optimizer_cli.rs`, `tests/engine_cli/search_persist_cli.rs`, through `tests/support/
# local_datahub.rs`). Since the owner closed the local READ door on 2026-09-25 (decision 0084) the
# binary refuses `--store DIR` and reads every byte of history through a datahub, so those tests
# serve their store with `vike_datahub::serve` on a loopback port — the production route in
# miniature, not a double. An UPWARD edge (vike-datahub is layer 65, this crate's own rank, so a
# NORMAL edge would be refused), legal only because it is a dev-dependency.
vike-datahub = { path = "../vike-datahub" }
# The real store those tests seed and serve, and the persist tests read back. A DEV edge only: the layer
# gate's `STORE_DEV_NAMERS` row for this crate is the declaration.
vike-store = { path = "../vike-store" }
# The in-memory `HistoryStore` double, `vike_data::HistoryStoreMemory`, which `src/backtesthub_server.rs`'s unit
# tests and `tests/backtest_plane.rs` hand to the server in place of a store.
vike-data = { path = "../vike-data", features = ["test-support"] }
# The shared market-data test builders (`vike_marketdata::test_support`).
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }
# `vike_secrets::plant_settings_rows` (behind its `test-support`), which `tests/support/engine.rs`
# uses to write the `config.datahub_addr` row a spawned `backtest` dials: decision 0111 retired
# the variable, so a test names its hub in the child's settings database. A DEV edge with the
# feature, never a normal one.
vike-secrets = { path = "../vike-secrets", features = ["test-support"] }
tempfile = { workspace = true }
# The Studio fixtures `studio_run`'s tests and `tests/{studio_wire_parity,walkforward_annualization}.rs`
# share with `vike-studio-core`'s own (`vike_studio_core::test_support`: the seeded walk and the two Rhai scripts).
# They came here with the run pipeline (2026-11-10); a DEV edge turning the test feature on, never a normal one.
vike-studio-core = { path = "../vike-studio-core", features = ["test-support"] }
# `vike_catalog::kept_contract_value`: the `forward_report` fixture study this crate's round-trip test compiles
# values its kept row with it, as a host does.
vike-catalog = { path = "../vike-catalog" }
# `tests/studio_wire_parity.rs`'s bar fixture (`vike_backtesthub_client::test_support::btcusdt_1m_bars`).
vike-backtesthub-client = { path = "../vike-backtesthub-client", features = ["test-support"] }
# The shipped taker FILES, compiled in the dev-only strategy-lab crate: the stand-in every test hands
# `StrategyFiles::stand_in` and `test_support::spawn_server*` (`vike_strategy_lab::stand_in`). A DEV
# edge only (the layer gate refuses a normal one), so the daemon links no strategy.
vike-strategy-lab = { path = "../vike-strategy-lab" }
# ⚠ No `vike-rust-strategy`, not even as a dev edge: the proofs through the sandboxed child are
# `crates/vike-backend/tests/strategy_file_run.rs` and `crates/vike-backend/tests/strategy_sandbox_backtest.rs`, where the
# `vike-backend` binary the child is exists.

[[bin]]
# The `backtesthub` shim over `backtest_cli::run`: BacktestNode-lite, opens no store of its own (it
# reads history through a datahub) and becomes the backtesthub under `--addr`.
name = "backtesthub"

[[bin]]
# Resting-depth measurement for `cheap_np`: rebuilds the recorded L2 book (the pmxt archive,
# ingested by the since-deleted `pmxt_backfill`) at each entry moment and turns the ask side into a size → PnL
# curve — the CAPACITY question the per-share reference numbers cannot answer.
name = "cheap_np_depth"

[[bin]]
# Ask-gate measurement for `cheap_np`: re-gates and re-prices every fired signal on the RESTING
# ASK a taker could actually lift (the engine's own `book_taker_price` law over the same
# reconstructed book `cheap_np_depth` uses), and applies Polymarket's venue-enforced 250 ms taker
# delay — reporting fills, rests and misses separately.
name = "cheap_np_askgate"

[[bin]]
# The study runner that can FIT (`study_cli::run`), kept as a bin beside the `vike-backend study` multicall arm
# that reaches the same function; `tests/study_cli_argv.rs` spawns it. `vike-studio-core`'s bin, behind its
# `study-cli` feature, until 2026-11-10.
name = "vike-study"

# The plain suites, ONE binary: `tests/integration.rs` makes each a module (its `//!` says why the six rows
# after it stay their own binaries).
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "engine_cli"
path = "tests/engine_cli.rs"

[[test]]
name = "paramscan_profile_summary"
path = "tests/paramscan_profile_summary.rs"

[[test]]
name = "sandbox_child_memory"
path = "tests/sandbox_child_memory.rs"

[[test]]
name = "sdk_source"
path = "tests/sdk_source.rs"

[[test]]
name = "strategy_file_build"
path = "tests/strategy_file_build.rs"

[[test]]
name = "studio_summary"
path = "tests/studio_summary.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
