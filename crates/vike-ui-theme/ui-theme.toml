# ---- Window values (crates/vike-ui-theme/src/value.rs) ------------------------------------------------
# Every design value that is NOT a step of the three scales above and that one window owns: a column's width, a
# marker's inset, the strength of a hover wash, a series' colour. Each `[[value]]` row becomes
# `vike_ui_theme::value::<group>::<NAME>` (a constant of the row's kind), a `--value-<group>-<name>` CSS variable and a
# row of the brand book's "Window values" section, and the code reads the constant instead of a local `const`.
#
#   group  the window or area that owns the value (`trade`, `data_manager`, ...). A group exists when it has a sentinel
#          line below; a new one is a new sentinel plus a blank line, nothing else.
#   name   UPPER_SNAKE: the Rust constant. Unique within its group. `ENTRIES` is taken.
#   kind   f32 | f64 | u8 | i8 | u16 | vec2 (a pair `[width, height]`, an egui::Vec2) | colour ("#rrggbb" or "#rrggbbaa").
#          The kind is the constant's Rust type: use the type the code needs (egui's Margin and CornerRadius take i8 and u8;
#          f64 is for a number the code works with in f64, such as a width in egui_plot's bar-width x-units).
#   unit   what the number MEANS, so the page can draw it. Required for every kind but colour:
#          px (a length in points) | ratio (a unitless factor) | alpha (an opacity, 0..=255) | count (a whole number).
#          f32 and f64: px, ratio or alpha. u8: px, alpha or count. i8 and vec2: px. u16: px or count.
#   value  a number (a whole number for u8, i8 and u16), a pair, or a hex string. Today's value EXACTLY.
#   doc    ONE line: what it is on screen.
#
# ADDING ROWS (many people do this at once, so the layout is what keeps the merges clean):
#   1. Put your rows directly UNDER your group's sentinel line (below the blank line that follows it), each row followed
#      by a blank line. Never between another group's rows, never at the end of the file.
#   2. Regenerate on a lane and look: `VIKE_REGEN_BRAND_ASSETS=1 cargo test -p vike-ui-theme --test brand_assets`.
#      The generated files (value_tokens.rs, ui-theme.css, brand-book.html) hold the groups alphabetically, whatever
#      order they are written in here, and each group has a frame of its own even while it has no rows.
#   3. Delete the local `const` and make the call sites read `vike_ui_theme::value::<group>::<NAME>`.
# A row under the wrong sentinel, a group with no sentinel, a duplicate name, an unknown kind or a value that does not
# fit its kind stops the generator and names the row.

