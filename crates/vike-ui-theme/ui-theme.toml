# ---- Account modes (crates/vike-ui-theme/src/roles.rs, components/chip.rs, components/venue_chip.rs) -------------
# Where an account trades, and which colour each part of its chip wears. A part is named by a ROLE, never by a hex,
# so the row says "DEMO is outlined in the info blue" and the colour stays where it is defined: the theme's own
# fields, or the `[[status]]` table above. A role is resolved at run time against the theme the trader chose.
#
#   name         the label the chip prints, and the Rust constant that carries the row (`roles::modes::DEMO`).
#                The kit's `chip::Mode` has one variant per row, and a test fails when either side has none.
#   fill         the chip's fill: a role, or `none` for an outlined chip.
#   stroke       the chip's outline: a role, or `none` for a filled chip.
#   text         the chip's label: a role (never `none`).
#   mark         the venue chip's mark: `filled` (a disc) or `ring`.
#   mark_colour  the mark's colour: a role (never `none`).
#   doc          ONE line: what the mode is and why it wears these colours.
#
# The roles are `vike_ui_theme::roles::ColourRole`, the one list: accent border text text2 text3 bg surface card hover
# text_ui grad_top analysis_line (the theme's own), up down up_text down_text (the market set's), ok warning error info
# muted (the status colours, the same in every theme), on_fill (the label on a filled control) and none. The generator refuses any other word, and the brand book prints the list.
#
# TO CHANGE A MODE'S COLOUR: edit its row here, regenerate (`VIKE_REGEN_BRAND_ASSETS=1 cargo test -p vike-ui-theme
# --test brand_assets`) and look at the "Account modes" section of the brand book. The tests that PIN the owner's
# present ruling (`live_is_the_accent_demo_the_info_paper_the_border` in `components/chip.rs`,
# `a_mode_is_a_dot_whose_shape_carries_it` in `components/venue_chip.rs`) will then fail by name: that is the
# ruling being changed, so change what they assert in the same PR.
[[mode]]
name = "LIVE"
fill = "accent"
stroke = "none"
text = "on_fill"
mark = "filled"
mark_colour = "accent"
doc = "Real money, and one of the accent's six shapes (spec §2): a fill in the theme's accent with the on-fill label, and no other mode is filled in the accent (the owner's ruling B of 2026-10-03, over the danger red the Trade window's build had filled it in). The venue chip's mark is a filled disc in the accent."

[[mode]]
name = "DEMO"
fill = "none"
stroke = "info"
text = "info"
mark = "ring"
mark_colour = "info"
doc = "A real venue, play money: outlined in the info blue with its label in the same blue, which is the v3 design's own colour (the owner, 2026-10-05: let it be as in design, over the warning amber ruling B had given it). LIVE is told from DEMO by shape, filled against outlined, and on Carbon, whose amber accent sat 4 degrees of hue from that amber, by colour as well. The venue chip's mark is a ring in the info blue."

[[mode]]
name = "PAPER"
fill = "none"
stroke = "border"
text = "text2"
mark = "ring"
mark_colour = "text3"
doc = "Nothing leaves the box: outlined in the theme's border grey with its label in the secondary text. The venue chip's mark is a ring in the caption grey."

# ---- Maps (crates/vike-ui-theme/src/maps.rs) ---------------------------------------------------------------------
# "Which colour, word or icon does this state or kind use": one row per state or kind, grouped by the MAPPING it belongs
# to. The state is a Rust enum the code already has; the code binds each of its variants to a row with an exhaustive
# `match` (`fn row(self) -> &'static MapRow { match self { State::A => &maps::<map>::A, ... } }`), so a variant without a
# row does not compile and a row without a variant is a test failure. Each row becomes `vike_ui_theme::maps::<map>::<KEY>`
# (a `MapRow`), and a table of the brand book's "Maps" section.
#
#   map     snake_case: the mapping this row belongs to (`connection`, `strip`). A map exists when it has a sentinel line
#           below; a new one is a new sentinel plus a blank line, nothing else.
#   key     UPPER_SNAKE: the state or kind (`DISCONNECTED`), the Rust constant. Unique within its map. `ALL` is taken.
#   colour  optional: a colour ROLE, the row's main colour (a dot, a mark, a glyph).
#   fill    optional: a colour role: a fill behind the label.
#   stroke  optional: a colour role: an outline.
#   text    optional: a colour role: the label.
#           The roles are the vocabulary of the Account modes table above (`vike_ui_theme::roles::ColourRole`): accent border
#           text text2 text3 bg surface card hover text_ui grad_top analysis_line up down up_text down_text ok warning error
#           info muted on_fill none. A part is a role, never a hex. A part
#           the row leaves out is `none`. Which of the four a map uses for what is the MAP's own: its comment says.
#   word    optional: a string, the label shown to the user. One line, no space at either end.
#   icon    optional: the KEY of an icon of the kit's registry: the constant's name in `registry!` of
#           `crates/vike-ui-theme/src/icons.rs`, UPPER_SNAKE (`CONNECTIONS`, `WARNING`), never the Phosphor name. The
#           generator refuses a key the registry does not have.
#   count   optional: a whole number 0..=255 (the bars lit, the steps).
#   flag    optional: true or false (dashed, drawn).
#   doc     ONE line: what the row is on screen. Required.
#
# ADDING ROWS (many people do this at once, so the layout is what keeps the merges clean):
#   1. Put your rows directly UNDER your map's sentinel line (below the blank line that follows it), each row followed by a
#      blank line, in the order the code lists its states. Never between another map's rows, never at the end of the file.
#   2. Regenerate on a lane and look: `VIKE_REGEN_BRAND_ASSETS=1 cargo test -p vike-ui-theme --test brand_assets`. The
#      generated files (map_tokens.rs, brand-book.html) hold the maps alphabetically, whatever order they are written in
#      here, and each map has a frame of its own even while it has no rows.
#   3. Bind your enum to the rows with an exhaustive `match`, and delete the Rust colour match it replaces.
# A row under the wrong sentinel, a map with no sentinel, a duplicate key, an unknown field, role or icon, a key that is not
# UPPER_SNAKE, a doc over more than one line or a count that does not fit u8 stops the generator and names the row.

