use = "Icons: one glyph per meaning."

# The rules of use. A value says WHAT; a rule says WHERE. Each rule NAMES the tests that fail when the code
# breaks it, as `repo-relative path::test fn`; `crates/vike-ops/tests/docs/rules_of_use_gate.rs` opens every
# one and fails when a name no longer resolves. A rule with an empty `checked_by` is words only — the
# brand book says so on its own line, so a rule nothing can fail is never mistaken for one that is
# enforced.
[[rule]]
id = "words-are-inter"
text = "Words are Inter. A venue name, an account NAME (`main`), a label, a button, a menu item."
checked_by = ["crates/vike-ui-theme/src/components/account_menu.rs::the_venue_is_regular_and_the_account_is_dim_and_smaller"]

[[rule]]
id = "numbers-are-mono"
text = "Anything read character by character is JetBrains Mono: prices, sizes, counts, addresses, account NUMBERS (`3709890`)."
checked_by = ["crates/vike-ui-theme/src/components/account_menu.rs::the_venue_is_regular_and_the_account_is_dim_and_smaller"]

[[rule]]
id = "menus-are-regular"
text = "Menu items, buttons and tabs are the Strong role at regular weight (400). Semibold (600) is ruled only where the design draws it — the places listed under `weight_use` below — and is never a venue or a label."
checked_by = ["crates/vike-ui-theme/src/components/account_menu.rs::the_venue_is_regular_and_the_account_is_dim_and_smaller", "crates/vike-ops/tests/gui/ui_literal_ratchet.rs::no_file_gains_a_heavy_weight"]

[[rule]]
id = "two-things-by-size-and-ink"
text = "Two things on one line (a venue and its account) are told apart by size and ink — the primary ink for the first, the dim ink and the Body size for the second — not by weight."
checked_by = ["crates/vike-ui-theme/src/components/account_menu.rs::the_venue_is_regular_and_the_account_is_dim_and_smaller"]

[[rule]]
id = "accent-is-a-shape"
text = "The accent is a shape (an underline, a fill, a ring, an edge), never the colour of a number or a word."
checked_by = ["crates/vike-ui-theme/src/components/input.rs::selected_text_is_never_drawn_in_the_accent"]

[[rule]]
id = "status-colours-do-not-move"
text = "The status colours are the same in every theme. \"Connected\" is the status green, never the accent."
checked_by = ["crates/vike-ui-theme/src/components/mod.rs::status_colours_are_fixed_and_never_the_accent", "crates/vike-ui-theme/src/status.rs::no_status_colour_is_a_theme_or_market_colour"]

[[rule]]
id = "one-title-bar"
text = "Every window has the same 25 pt title bar at every density. Density scales the controls inside a window, never the bar around it."
checked_by = []

[[rule]]
id = "text-size-reaches-everything"
text = "A size is a ROLE. A literal font size anywhere in a GUI crate fails a gate: the Text size setting must reach every window."
checked_by = ["crates/vike-ops/tests/gui/ui_literal_ratchet.rs::no_file_gains_a_literal_text_size"]

