[package]
name = "vike-desktop"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
# ⚠ It used to say "chart renderer + (in progress) the HFT trading core port". The trading core is
# not in this binary any more, by ruling: it observes a remote one and sends every order there.
description = "Native egui/wgpu vike-trader desktop: the window shell and the chart's wgpu candle layer (the chart itself is vike-chart), a read-only/controlling client of a remote vike-tradehub core."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `app` — the desktop application: the outermost shell.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 90

[dependencies]
# The SHARED hub-protocol substrate: the HMAC-SHA256 nonce-challenge handshake generalized over
# its domain separator (`auth`) and the length-prefixed frame codec (`frame`). ⚠ Both were
# `vike-datahub-client`'s until 2026-09-23 and moved to the crate BELOW both hub protocols, so the
# two clients could stop being a ladder; that crate's own doc carries the measurement. It names no
# vike-* crate at all, so this edge adds no package to any graph that did not already carry
# hmac/sha2/rand transitively.
vike-hub-protocol = { path = "../vike-hub-protocol" }
# R5c: the exec VOCABULARY — `Command`/`OrderIntent`, the shapes an order takes on its way to the
# backend's control channel. ⚠ No engine is built here any more; only the types cross the wire.
# It is also the home of the read model the panels render (`CoreSnapshot` and its views), so this
# crate links NO vike-core: `docs/decisions/0115-the-read-model-lives-in-vike-exec-and-the-gui-does-not-link-vike-core.md`
# has the measurement, and `crates/vike-desktop/tests/app_local_core_gate.rs` refuses the edge here
# and in vike-app-core. No default features: `runtime` is the lane senders (`tokio`, `core_affinity`),
# which a client never holds.
vike-execution = { path = "../vike-execution", default-features = false }
vike-model = { path = "../vike-model" }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../vike-paths" }
# The typed settings model + layered loader (settings unification, Phase 5). This binary resolves
# the POLICY ceiling `max_notional_per_order` (the order-entry preview cap) from
# `<project>/settings/policy.toml` and refuses to start when the REMOVED `VIKE_MAX_ORDER_NOTIONAL` is still
# set. A leaf: it pulls in only vike-model + serde + toml, all already in this graph.
vike-config = { path = "../vike-config" }
# The STARTUP SEQUENCE's one owner: refuse the removed variable, resolve `<project>/settings` ONCE,
# load the credentials and the settings — and hand back the BUILD IDENTITY line
# this app logs first (which commit it came from; a screenshot of a bug report now names it) and the
# log HOME off that same walk. This `main` used to spell all of it out, alongside four other roots,
# and it had the "two walks, two answers" bug the disclosure exists to surface: the rolling log file
# hung off a second `project_log_dir(&cwd)` call, which is `VIKE_SETTINGS_DIR`-blind.
#
# ⚠ It REPLACES the direct `vike-buildinfo` edge (that crate is still in this graph, one hop down,
# and is still a ZERO-dependency leaf) and it adds no package: its whole closure — vike-config,
# vike-model, vike-secrets, vike-buildinfo — was already here.
vike-boot = { path = "../vike-boot" }
# the universal cross-venue instrument catalog (Instrument/AssetClass/Tab/Catalog search + the
# CatalogProvider seam) driving the chart's Symbol picker (catalog workstream Task 12).
vike-catalog = { path = "../vike-catalog" }
# the eframe/wgpu-free logic (data-sink wiring, orderflow/tickvol aggregation, tool model +
# fetchers, and the egui-but-not-eframe window/windows draw modules) extracted so it runs in
# CI — the A5 vike-app-core extraction (like vike-chart before it)
vike-app-core = { path = "../vike-app-core" }
# ⚠ TOMBSTONE — `vike-journal` stood here for ONE type, `materialize::JournalMaterializerHandle`, the
# handle `App::materializer` held and only ever set to `None`. The field went with the GUI's other
# local-core leftovers (2026-10), and the edge with it. (The type moved to the data daemon on 2026-10-11
# and was deleted with the materializer on 2026-11-18, decision 0295; the desktop needs neither crate.)
# ⚠ TOMBSTONE — `vike-tradehub-core` and `vike-run` stood here, both `optional = true` and both turned on
# by the deleted `fat` feature. vike-tradehub-core is the venue→ExecutionClient/ReconClient composition root
# (`make_engine`, over each venue bridge's `VenueAdapter`) and, since decision 0098 merged `vike-run`
# into it, also owns `assemble_runtime`, the twelve-venue mount assembly that `vike-run` owned.
# The desktop mounts no venue and signs no order, so it needs neither: the daemon is the only
# mounting root.
#
# THE BACKEND EDGE, and since the rulings it is the only route an order out of this process has:
# TradehubCoreHandle + CoreSnapshotWire for `--observe <ADDR>` (connect to a headless vike-tradehub
# daemon's observe server; Scope::Control adds the write half). LIGHT + DataFusion-free by itself.
vike-tradehub-client = { path = "../vike-tradehub-client" }
# the Studio tool (SP2): Rhai-editor + store-backed slice picker + worker-thread backtest Run +
# tabbed results, mounted as the "studio" launcher's WindowKind::Studio tool window (Task 7).
# ⚠ NOT optional since split-plane I7 (it was `fat`-gated): a default vike-studio build is
# DataFusion-free (the `studio-standalone` suite is the gate), so this client links the Studio and
# drives it REMOTE-ONLY — `config.datahub_addr` set → `HistoryStoreDatahub`; unset → the
# "Studio: no data store" label naming the fix. ⚠ The LOCAL `HistoryStoreDataFusion` open in
# `open_studio_store` used to be the other arm, `fat`-gated; it went with the feature, so remote is
# not a mode any more — it is the only store this binary can reach.
# ⚠ And it links NO backtest engine (2026-11-10): every Run, sweep, walk-forward, Compare all and copilot
# candidate is the backtest server's, so `vike-backtest`, `vike-simulator`, `vike-fills`, `vike-paper` and
# DataFusion are out of this crate's normal closure, optional edges included —
# `crates/vike-ops/tests/architecture/named_run_closure_gate.rs`'s thin-client fence (decision 0078's amendment).
vike-studio = { path = "../vike-studio" }
# The DataFusion-FREE datahub RPC client: `HistoryStoreDatahub`, the trait store `open_studio_store`
# hands the Studio when `config.datahub_addr` is set (split-plane B12). Unconditional since I7 for
# the same reason as vike-studio above — the Studio's only store is this one; light by design
# (vike-data with DEFAULT features — the `HistoryStore` trait only), so no build's dep tree gains a
# second engine. `tool-feeds-poll`: the shell starts the tool windows' poll threads
# (`tool_feeds::poll::spawn::spawn_tool_fetchers`), off by default there because no headless consumer runs them.
vike-datahub-client = { path = "../vike-datahub-client", features = ["tool-feeds-poll"] }
# The user's OWN indicators (`<project>/user_data/indicators/*.rhai`), compiled into real
# `Indicator`s that `main`'s `install_user_indicators` installs on the chart's ƒx picker.
# ⚠ NOT optional, and it used to be. The old `fat`-only edge was justified by reachability: this
# crate reached vike-rhai only through vike-studio, and an observe-only build had no strategy
# runner an indicator could be called from. The CHART is the second consumer that argument did not
# anticipate — a user's own indicator has to plot in a plain `cargo run -p vike-desktop` — so the
# edge became unconditional, and it is now the ONLY consumer: the strategy-bindings install went
# with the `fat` feature (see `install_user_indicators`' tombstone).
# It stays cheap: vike-rhai's tree is rhai + vike-indicators + vike-model, no DataFusion and no
# venue bridge, so this crate's `cargo tree … -i datafusion` claim is untouched.
vike-rhai = { path = "../vike-rhai" }
# ⚠ TOMBSTONE — SIX VENUE-BRIDGE EDGES stood here, every one `optional = true` and turned on by the
# deleted `fat` feature: vike-binance (the live kline feed and the aggTrades REST backfill),
# vike-bybit and vike-okx (DOM depth feeds + credential-gated live exec clients), vike-aster (a
# REAL-MONEY mainnet venue — `ASTER_LIVE_*` keys spawned a live mainnet exec client),
# vike-hyperliquid (spot+perp feed + catalog) and vike-polymarket (`features = ["feeds"]`, the L2
# book/quote/trade tick feed). They were this crate's market-data plane and, through vike-tradehub-core, its
# exec plane. Ruling 2 removes the first and ruling 1 the second: no venue socket is opened here at
# all. The last one, vike-deribit (the Options tool's chain and its catalog), left when the options
# chain moved to the backend's datahub: no venue bridge is in this graph.
# The whole-map credential read (`vike_secrets::CredentialStore::read_all`, through the handle the boot
# opened).
# ⚠ This binary is no longer the live gate that read describes: it reads credentials for the backend
# handshake, the Gateway screen and the Studio's chat keys, and picks live-vs-paper for nothing.
# It lived in `vike-bridge-core` until docs/decisions/0135; this edge replaced that one, so the
# desktop links no transport/signing crate of its own (it is already in the graph through
# vike-account-manager and vike-app-core, so it adds no package).
vike-secrets = { path = "../vike-secrets" }
# The change journal (the process identity `Proc::current` in src/wiring.rs, handed to
# `vike_account_manager::AccountManagerCredentialHome`). It was a module of vike-secrets until it moved into its
# own crate (layer 12); it names only vike-model, vike-utility, serde and serde_json, all
# already in this graph.
vike-change-journal = { path = "../vike-change-journal" }
# symbol universes (datasets::SymbolSetStore) + the live DataClient/DataClientSink seam. ⚠ Trait-only
# (`HistoryStore`): the DataFusion-engine enable (`HistoryStoreDataFusion`, and with it `RecorderSink`,
# `ChainRecorder::open`, the Studio's local store arm and every Data-Manager write verb) was a
# `fat` enable and went with the feature, so the DataFusion+Arrow build tree is out of this
# crate's graph entirely.
vike-data = { path = "../vike-data" }
# the OptionChain snapshot types (Expiry) the Options tool hands to vike-chart's chain grid; the
# column math stays in vike-options, reached through vike-chart, so this crate no longer names it
vike-marketdata = { path = "../vike-marketdata" }
# ⚠ TOMBSTONE — FIVE MORE BRIDGE EDGES stood here, all `optional = true` under `fat`, and all of
# them for the Symbol picker alone: vike-alpaca and vike-oanda (credential-gated catalog providers,
# self-gating to an empty catalog when creds are absent), vike-dukascopy and vike-fxcm (bundled
# static FX/metals instrument lists — unit-struct providers, no fetch, no creds) and vike-ctrader
# (credential-gated like Alpaca/OANDA). A catalog fetch is a venue REST call, so they go with the
# rest of the venue plane; the picker offers the user's own symbols until the datahub's list loads.
vike-log = { path = "../vike-log" } # tracing-native logging init (see crates/vike-log)
vike-chart = { path = "../vike-chart" } # the chart engine (renderer/model/transforms) — extracted chart roadmap phase 2
# The chart's tick/volume and footprint aggregators (`vike_orderflow::{tickvol, bar_agg}`), which
# moved out of vike-app-core on 2026-09-27; this binary named them through that crate before.
vike-orderflow = { path = "../vike-orderflow" }
# Polymarket scalp-cockpit egui widgets (`vike_order_entry::cockpit`) — the actions of the WindowKind::Polymarket
# tool window's probability ladder / one-click ticket, which `app_ui/tool_pane.rs` maps onto commands,
# and the order dispatcher `app_ui/orders.rs` hands them to (`vike_order_entry::dispatch`). egui-without-wgpu.
vike-order-entry = { path = "../vike-order-entry" }
# the design system: themes, tokens, the component kit and the font-weight helpers
# (`vike_ui_theme::fonts`), named directly, with no re-export.
vike-ui-theme = { path = "../vike-ui-theme" }
# (vike-report moved to vike-app-core with the Tearsheet tool body — tool-view extraction batch 1;
# this crate reaches the execution history only through `vike_app_core::ui::windows`' Account window now.)
# ⚠ TOMBSTONE — `vike-account-window` stood here for `history::AccountWindowHistoryContext`, the shell's dial
# `tool_window.rs` hands the history down in. That type is `vike_app_core::ui::windows`' since the History
# read moved to vike-app-core (2026-11-22), so this crate names nothing of the widget's.
# the Data-Manager "Stored" catalog view (venue→symbol→series tree + coverage), shared with the
# Studio's Data pane (vike-data-manager extraction plan, Task 3).
vike-data-manager = { path = "../vike-data-manager" }
# the Gateway screen's credential panel (venues x Paper/Demo/Live credential status and masked
# editing), mounted as the Data Manager's Gateway destination.
vike-account-manager = { path = "../vike-account-manager" }
# The News window's body (`tool_window.rs`'s News arm) and its bundled source icons, which
# `app_setup.rs`'s `load_news_logos` decodes once.
vike-news = { path = "../vike-news" }
# The Calendar window's bundled flag PNGs (`vike_calendar::FLAG_PNGS`), which `app_setup.rs`'s
# `load_flag_images` decodes once; the window itself is drawn through vike-app-core's glue.
vike-calendar = { path = "../vike-calendar" }
# ⚠ TOMBSTONE — `vike-backfill` stood here, `optional = true` and enabled by `fat` together with its
# `venue-backfill` feature. It supplied the keyless kline-history collectors
# (`backfill_binance_klines`/`backfill_bybit_klines`/`backfill_okx_klines`) the Stored grid's bulk
# Backfill/Update action ran off-thread against the LOCAL hist store. Both halves are gone: those
# collectors are venue REST calls, and there is no local store to write into. The Stored grid's bulk
# action now only ever runs through the datahub's backfill verb, against the datahub's store.
tracing = { workspace = true }      # tracing::info! at startup (subscriber lives in vike-log)
arc-swap = { workspace = true }
# eframe 0.37 bundles egui 0.37 (root-pinned) — bump together. This crate names egui ONLY through
# eframe's re-export (`use eframe::egui;`), so it declares no direct `egui` edge.
eframe = { workspace = true }
# ⚠ TOMBSTONE — `serde_json = "1"` stood here. Its only use in this crate was the off-thread
# `hl-feed-symbology` loader inside `build_local_feeds`, which posted `{"type":"meta"}` /
# `{"type":"spotMeta"}` at the Hyperliquid mainnet transport so spot symbols resolved to their venue
# coins. That loader went with the local feed plane (ruling 2), and no other site in `src/` names
# the crate.
# C1 Task 2: WindowState's oscillator-uid -> pane assignment map (insertion-order stable,
# matching the repo-wide IndexMap convention — see root Cargo.toml's rationale comment).
indexmap = { workspace = true }
chrono = { workspace = true } # local time x-axis labels
# PNG decode: the bundled country flags and launcher icons, and the headless self-screenshot (VIKE_SHOT).
# The desktop has no HTTP client of its own: the tool feeds come from the datahub (the Studio chat's
# ureq is vike-studio's, reached through vike-ai).
image = { workspace = true }

# ⚠ TOMBSTONE — THIS CRATE HAS NO FEATURES, and it used to have five.
#
#   * `fat` (the DEFAULT) turned on the LOCAL trading core (`dep:vike-tradehub-core` + `dep:vike-run`, the
#     latter since merged into the former by decision 0098, i.e. `vike_tradehub_core::assemble_runtime` → every
#     venue bridge), the eleven venue-bridge deps below it
#     (binance/bybit/okx/aster/hyperliquid/polymarket/alpaca/oanda/dukascopy/fxcm/ctrader),
#     `dep:vike-backfill` WITH its `venue-backfill` feature (the Data Manager's bulk kline
#     collectors), and the DataFusion engine behind tick recording, the Studio's LOCAL store arm
#     and every Data-Manager write verb.
#   * `thin` was a documentary alias for "fat absent" and turned nothing on.
#   * `ibkr` and `polymarket` were `["fat", "vike-tradehub-core/<v>", "vike-run/<v>"]` — pure forwarders
#     that made vike-tradehub-core/vike-run compile one more `make_engine` arm. No `#[cfg]` in this crate's
#     own `src/` ever named either.
#
# All five are deleted by ruling: orders leave the desktop ONLY through the backend, and the
# desktop opens NO venue sockets at all. There is one configuration, and it is what `--observe`
# used to select. The `ibkr`/`polymarket` forwarders could not survive the deletion in any form —
# each names `fat` as its first entry, and re-spelling them without it would be a cargo error the
# moment the vike-tradehub-core/vike-run deps went.
#
# ⚠ `vike-data` stays, at DEFAULT features — the trait-only `HistoryStore` seam. That is what makes
# `cargo tree -p vike-desktop -i datafusion` empty, and it is now a property of the crate rather
# than of a feature resolution.

# The live smoke (`tests/live/desktop_live_smoke.rs`, compiled into this binary's unit tests): it
# drives the real `App` through egui's accessibility tree on the CPU (no `wgpu`/`snapshot`: the
# workspace pin's rationale) and keeps its workspace family in a temporary directory. Both packages
# are already in the lockfile; test-only, so no shipped binary links either.
[dev-dependencies]
egui_kittest = { workspace = true }
tempfile = { workspace = true }
# `tests/mcp_mode.rs` reads `vike-mcp`'s JSON goldens and the answers of `vike-desktop --mcp`. Already in
# the lockfile and in this graph through vike-app-core; a dev edge, so no shipped binary changes.
serde_json = { workspace = true }
# `vike_ui_theme::painted::texts`, the painted-text read-back the chart window's tests share with every
# GUI crate's. A dev-only FEATURE on a crate already linked normally above.
vike-ui-theme = { path = "../vike-ui-theme", features = ["test-support"] }
# `vike_app_core::ui::caption::test_shapes::pass`, the one-pass shape read-back the chart window's tests
# share with the app-core chrome tests. A dev-only FEATURE on a crate already linked normally above.
vike-app-core = { path = "../vike-app-core", features = ["test-support"] }

[[bin]]
name = "vike-desktop"
path = "src/main.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
