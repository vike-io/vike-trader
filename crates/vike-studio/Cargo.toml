[package]
name = "vike-studio"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "The egui Studio shell vike-desktop mounts: write a Rhai strategy or a Rust strategy file the backtest server holds, pick a data slice, and Run, Sweep or Walk-Forward it on the backtesthub (no backtest computes in this process); the tabbed results and the Strategy, Data, Indicators, Saved, Research and AI Copilot panes."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `ui-shell` — an egui shell assembled from the widget crates.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 80

[dependencies]
# The SHARED hub-protocol substrate: the HMAC-SHA256 nonce-challenge handshake generalized over
# its domain separator (`auth`) and the length-prefixed frame codec (`frame`). ⚠ Both were
# `vike-datahub-client`'s until 2026-09-23 and moved to the crate BELOW both hub protocols, so the
# two clients could stop being a ladder; that crate's own doc carries the measurement. It names no
# vike-* crate at all, so this edge adds no package to any graph that did not already carry
# hmac/sha2/rand transitively.
vike-hub-protocol = { path = "../vike-hub-protocol" }
vike-rhai = { path = "../vike-rhai" }
# ⚠ TOMBSTONE — `vike-backtest` (the harness) and `vike-simulator` (the simulator) stood here until
# 2026-11-10, for four GUI uses, none of them a backtest: the `WalkforwardResults` the results pane
# renders, `wire_record::from_wire_record` (every remote answer's decode), `cmp_scores_desc` (the Saved
# pane's rank) and the `OrderBrokerSimulator` type parameter of the editor's compile check. Every Studio backtest
# has run on the backtest server since decision 0078, so the GUI linked an engine it never ran. The
# first three came DOWN (`vike_analytics::walkforward::WalkforwardResults`,
# `vike_backtesthub_client::wire_record`, `vike_analytics::metrics::cmp_scores_desc`) and the editor
# checks through the broker-free `vike_rhai::discover_params`. The desktop links no engine
# (docs/decisions/0078's amendment of that day), and
# `crates/vike-ops/tests/architecture/named_run_closure_gate.rs`'s thin-client fence refuses either crate
# in `vike-desktop`'s normal closure, optional edges included. Do not add either back.
#
# The ANALYTICS the results/saved/remote views render (`TradingRecord`, `metrics`, `overfit`,
# `report`, the walk-forward report) — named at their owner since the simulator split (docs/decisions/0087).
vike-analytics = { path = "../vike-analytics" }
# Since split-plane B12 the Studio holds its store as `Arc<dyn HistoryStore + Send + Sync> = Arc<dyn HistoryStore + Send + Sync>`
# and never names the concrete HistoryStoreDataFusion outside #[cfg(test)]/examples, which get `vike-store`
# from [dev-dependencies] below — a default build of this crate is DataFusion-free (split-plane I7;
# the `studio-standalone` suite in scripts/ci_feature_suite.sh is the gate).
vike-data = { path = "../vike-data" }
# Data pane: the shared stored-catalog tree-model + egui view (also mounted by vike-app-core's Data
# Manager) — de-duplicates the pane's former bespoke grouping/render.
vike-data-manager = { path = "../vike-data-manager" }
vike-model = { path = "../vike-model" }
# The formula floor (decision 0294): the Param scan pane's powers of ten (`vike_math::powers::power_of_ten`,
# a range's decimals). Layer 2, `libm` only; already in this crate's graph through vike-model.
vike-math = { path = "../vike-math" }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../vike-paths" }
# The workspace's one atomic whole-file replace (`vike_utility::atomic_file::write_atomic`): the saved
# strategies and the workspace snapshot are replaced whole, never truncated in place. No dependency
# of its own without the `cli` feature (layer 3).
vike-utility = { path = "../vike-utility" }
# The Research pane's run vocabulary (`vike_runs::{BACKTEST_RUN_KIND, RunConfig}`). vike-model's
# `runs` module until it became a crate; adds no external crate.
vike-runs = { path = "../vike-runs" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `L2BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../vike-marketdata" }
vike-indicators = { path = "../vike-indicators" }
# The strategy file's header parser (`vike_strategy::file::StrategyFileHeader`), for ONE key: the `[strategy] sdk`
# pin of the Rust strategy in the editor, which the SDK source view resolves on the server's list
# (`src/panes/sdk_source/mod.rs`'s `strategy_pin`; decision 0296). The one parser, not a second reading of the
# header. Layer 20, no engine: everything it names (vike-model, vike-math, vike-marketdata, vike-paths,
# vike-utility, serde, toml, sha2, hex) this crate's graph already holds.
vike-strategy = { path = "../vike-strategy" }
vike-studio-core = { path = "../vike-studio-core" }
# PR-5 backend selector: dispatch a Studio Run/Sweep/Walk-Forward over TCP to the REMOTE COMPUTE
# daemon — `vike-backend backtesthub --addr`. ⚠ NOT the datahub, which this line said until 2026-09-20:
# ruling 7 moved every `Run*` verb onto the backtest plane, and the data daemon now REFUSES them by
# plane before it even checks scope. The CRATE is still named for the datahub because one client
# speaks both planes; the SERVER on the other end is the other daemon.
# The LIGHT, DataFusion-free client crate (vike-data DEFAULT features + vike-model + serde),
# so it adds no Arrow/DataFusion weight and cannot cycle (it never depends on vike-studio/-core).
vike-datahub-client = { path = "../vike-datahub-client" }
# `StudioRunBackend::Source` runs on the backtesthub through its own client (decision 0252's verdict 4).
vike-backtesthub-client = { path = "../vike-backtesthub-client" }
# The NAMED-RUN backend's address DEFAULT, and nothing else from this crate
# (`docs/decisions/0064-a-named-run-carries-no-source.md`). `vike_config::DEFAULT_BACKTEST_ADDRESS` is
# the ONE authority for where the backtesthub listens; `crates/vike-mcp/src/config.rs` reads
# the same constant the same way, and a second literal here would be a port two files could
# eventually disagree about — with the failure mode being a named run dialling the DATA daemon,
# which refuses it by PLANE and sends the reader hunting for a key they do not need. Layer 20 and
# light (vike-model + vike-secrets + serde/toml): no Arrow, no DataFusion, so the
# `studio-standalone` lane is unaffected.
vike-config = { path = "../vike-config" }
vike-ai = { path = "../vike-ai" }
# ⚠ NO vike-bridge-core (split-plane I8). It was here for ONE reason — StudioChatPane called
# the bridge's no-argument store loader (deleted since) to find ANTHROPIC_API_KEY/
# CEREBRAS_API_KEY — and it cost this crate the whole bridge stack (vike-execution behind it) so that a
# GUI pane could open `<project>/settings/secrets.env` for itself. The keys arrive as a
# `chat::StudioChatApiKeys` parameter now, resolved by the composition root from the credential map it
# already loads, so a crate on its way to being a thin client links no venue-execution code to run
# a chat panel.
egui = { workspace = true }
# The design system (`docs/superpowers/specs/2026-09-28-gui-design-system-design.md`): the icon
# registry, the tokens (`components::ThemeTokens`/`ThemeStatus`, `type_scale`) and the component kit every
# Studio pane paints with. The Studio keeps no colour or size of its own since step 7 deleted its
# theme module. Layer 70 under this crate's 80, egui its only dependency, so the
# `studio-standalone` lane's DataFusion-free tree is unchanged.
vike-ui-theme = { path = "../vike-ui-theme" }
egui_plot = { workspace = true }
egui_code_editor = { workspace = true }
similar = { workspace = true } # StudioChatPane "review changes" diff view (chat.rs diff_rows)
# Saved-strategies pane: persist Vec<StudioSavedStrategy> as pretty JSON next to the store.
serde = { workspace = true }
serde_json = { workspace = true }

# Headless Studio → PNG capture (examples/studio_shot.rs), OFF by default. Same shape and the same
# pinned versions as vike-chart's `png-export` harness (see its Cargo.toml for why these are normal
# optional deps rather than dev-deps: Cargo forbids OPTIONAL dev-deps, and an unconditional dev-dep
# would drag wgpu into every `--all-targets` run). Nothing new enters the lockfile — vike-desktop/eframe
# already resolve these exact versions.
# The four this feature used to name — egui-wgpu / wgpu / pollster / image — moved to
# `vike-ui-theme` with the renderer they served (`src/offscreen.rs`). They were spelled HERE and in
# vike-studio, two independent pins for one job, and they had already come apart once: `pollster`
# on 1.0 against 0.4, with a Dependabot bump going green because CI then built neither harness.
# One home, one pin, nothing left to drift.

[features]
# `cargo run -p vike-studio --features png-export --example studio_shot -- <tab>` renders the REAL
# `StudioState::ui` off-screen — the vike-studio twin of vike-chart's `png-export`. It exists so a
# Studio UI change can be eyeballed WITHOUT building vike-desktop (wgpu + eframe; every bridge crate
# too, until the desktop's `fat` build was deleted on 2026-09-09).
png-export = ["vike-ui-theme/offscreen"]

# NON-default: enables the StudioChatPane "Connect to Claude" MCP-command generator
# (`chat::StudioChatPane::connect_to_claude` over the `connect` module) — the `claude mcp add …` line that
# registers `vike-mcp` (the one MCP server since the vike-mcp retirement, Phase B of #842). Its
# backtest tools go over a RUNNING backtesthub (`just backtesthub-serve`) and its data tools over a
# running datahub (`just datahub-serve`), not an in-process store, so the generated command carries
# BOTH addresses. ⚠ This named `just datahub-serve` alone until 2026-09-20, which was a reproducible
# dead end: that recipe starts the DATA daemon, and since ruling 7 it refuses every `Run*` verb by
# plane. Pure code gate, no crate dep. Off,
# the button emits a "rebuild with --features mcp" note.
mcp = []

# `required-features` keeps the wgpu stack out of a plain `--all-targets` run: without the feature
# cargo skips this target entirely instead of building it.
[[example]]
name = "studio_shot"
required-features = ["png-export"]
test = true

# `studio_seed` has no required feature; `test = true` makes `cargo test` build it as a test target so its argv pins
# (decision 0155) run in the roster lane.
[[example]]
name = "studio_seed"
test = true

[dev-dependencies]
# Both examples read their argv through `vike_utility::cli` over `clap` (decision 0155): the `cli`
# feature is a DEV edge, since the shell's library names neither `cli` nor `clap`.
# And `vike_utility::libm_walk` — the production-code walk the tree's source gates strip test items
# with — for `tests/disabled_controls_say_why.rs`, which reads this crate's `src/` for a disabled
# control that cannot say why: `test-support` compiles the walker and brings no dependency of its
# own, and `-e normal` cannot see a dev-dep, so the `studio-standalone` lane's tree check is unaffected.
vike-utility = { path = "../vike-utility", features = ["cli", "test-support"] }
clap = { workspace = true }
# `test-support` adds `vike_data::hist_store_stubs!`, the stub list `tests/common/mod.rs`'s
# `RefusingCatalogStore` uses (no dependency of its own).
vike-data = { path = "../vike-data", features = ["test-support"] }
# Test/example-only DataFusion (split-plane I7): the #[cfg(test)] modules (studio/ / slice_picker.rs /
# data_browser.rs) and BOTH examples (studio_seed, studio_shot) seed a real HistoryStoreDataFusion over a
# temp dir — seed-then-scan needs real read-back, which the DataFusion-free HistoryStoreMemory double
# cannot provide. A DEV edge only, so the default normal tree stays DataFusion-free
# (`studio-standalone` asserts it with `cargo tree -e normal`).
vike-store = { path = "../vike-store" }
# The backtesthub the tests dial (`src/studio/tests/support.rs`, `tests/headless/common/mod.rs`:
# `vike_backtesthub::backtesthub_server::serve` on an ephemeral loopback port), because a Studio run leaves
# the process (docs/decisions/0078-one-backtest-path-studios-local-backend-is-deleted.md). Layer 65
# against this crate's 80, so the edge points down, but it stays a DEV edge: the shell is a thin
# client of a REMOTE backtesthub and must not link one.
vike-backtesthub = { path = "../vike-backtesthub" }
# The stand-in `src/studio/tests/support.rs` hands `StrategyFiles::stand_in` (`vike_strategy_lab::stand_in`,
# the shipped files compiled in the dev-only strategy-lab crate): a DEV edge only, as the one above.
vike-strategy-lab = { path = "../vike-strategy-lab" }
# Seed a real HistoryStoreDataFusion over a temp dir for bar-store tests (HistoryStoreMemory is a
# filters/equity-only stub and cannot store bars).
tempfile = { workspace = true }
# Accessibility-tree tests over the real pane and shell renders (`tests/saved_pane_a11y.rs`,
# `tests/headless/picker_disclosure.rs`, `tests/headless/studio_shell_render/mod.rs`). NO wgpu / NO snapshot — see the
# workspace manifest's `egui_kittest` rationale.
egui_kittest = { workspace = true }
# `frame_sanity::assert_frame_sane` — the ONE shared headless-frame geometry assertion, called from
# `tests/headless/studio_shell_render/support.rs`'s `settle` so every frame the shell paints is also a geometry test,
# and `harness::type_ready`, the first-frame guard the kittest harnesses open with (the Studio draws
# icons, whose family only the app's bundled type binds). The normal dependency above carries the
# icon registry; what `test-support` adds is the module, which a default build compiles none of.
# The feature brings no dependency of its own (vike-ui-theme's only dep is egui), so the cargo-deny
# surface is unchanged, and `-e normal` cannot see a dev-dep at all, so the `studio-standalone`
# lane's DataFusion-free tree check is unaffected. Do NOT copy the helpers in.
vike-ui-theme = { path = "../vike-ui-theme", features = ["test-support"] }
# A real scratch settings database holding the backtest key's row, read back the way the desktop
# reads its credential map (`src/backend/backtesthub/tests.rs`), and the live smoke's read of THIS
# machine's row (`tests/studio_live_path_smoke.rs`). A DEV edge only: the shell opens no store, its
# composition root (`vike-desktop`) hands it the credential map, and `-e normal` cannot see this.
vike-secrets = { path = "../vike-secrets", features = ["test-support"] }
# `vike_marketdata::test_support`: the shared bar/tick builders. A DEV edge only; the normal edge
# above already exists, so no lockfile entry.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }

[lints]
workspace = true
