[package]
name = "vike-config"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the TYPED settings model and its layered loader (Phase 1 of the settings-unification program). Four types split by AUTHORITY — Policy / Config / Preferences / Flags — with per-type override power enforced by the type system: Policy has no env or CLI layer at all, so overriding a ceiling is unrepresentable rather than merely discouraged. Depends on vike-model ONLY (for the shared utilization bounds), plus serde + toml."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `domain` — one hop over the vocabulary: a single-purpose pure core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 20

[dependencies]
# The FIRST vike dependency, and still by design: `rate_limits::{MIN_UTILIZATION, MAX_UTILIZATION}`
# are the canonical bounds for a target-utilization value and this crate must NOT define a second
# copy — a duplicated bound is exactly the split-brain the rate-limit work just removed. Nothing
# else is needed: this crate is a leaf that every layer above (bins, GUI, daemons) can depend on.
vike-model = { path = "../vike-model" }
# The credential store's own crate, for the boot disclosure (`src/boot.rs`) alone — the settings
# directory that answered and whether `secrets.env` is beside the four TOMLs is the fact the CI box's
# silent all-paper daemon needed and nothing rendered.
#
# ⚠ This said "It adds NO package to anything: vike-secrets has ZERO dependencies, which is the
# whole reason it exists as a crate" until 2026-09-13. It adds FOUR now, plus a C compilation:
# decision 0054 moves the credential store into a SQLite database and vike-secrets declares
# `rusqlite` (bundled) ahead of the migration code — see
# `crates/vike-boot/tests/dependency_floor.rs`'s `FLOOR_EXCEPTIONS`. What survives is the reason
# this edge is cheap in the way that matters HERE: this crate is in every composition root's
# closure, and vike-secrets still carries no transport, no TLS stack and no query engine into it.
# Only its stat-only probes
# are used (`permission_warning` / `legacy_store_warning` / `SECRETS_FILE`); this crate never opens
# the store, and must not — see `src/boot.rs`.
vike-secrets = { path = "../vike-secrets" }
serde = { workspace = true } # the file model (Deserialize) + `config show`-style dumps (Serialize)
toml = { workspace = true }  # the human-edited layer's format — see the crate doc for why not YAML
# The settings STORE's value format (`src/mirror.rs`): a `setting` row holds one JSON SCALAR, and
# the read path PARSES it — `serde_json` decides the type, and the patch type is deserialized from
# the assembled object. It replaces a TOML rendering that the reader spliced back into a synthetic
# document and re-parsed. Pinned with `float_roundtrip` at the root, which is what makes an `f64`
# ceiling bit-exact across the round trip. It was already a DEV-dependency here (one provenance
# gate needs a format that renders `null`, which TOML cannot), so this adds no package to anything
# and no row to `crates/vike-boot/tests/dependency_floor.rs` — see the lockfile, unchanged.
serde_json = { workspace = true }
# The settings-file WRITE half (src/write.rs, split-plane REQ-7): comment-preserving single-key
# edits. Same parser family and exact lockfile version as `toml` above — see the root manifest's
# rationale line.
toml_edit = { workspace = true }

[dev-dependencies]
# dev-only: the loader takes its two roots as PARAMETERS, so every test builds a throwaway
# a throwaway settings dir + project dir, never a real one. Not a workspace dep — matches the
# vike-data / vike-backfill / vike-backtest / vike-alerting convention.
tempfile = "3"
# ⚠ `serde_json` used to be declared HERE, dev-only. It is a normal dependency now (see above) and
# the test that first asked for it still asks for the same property: `tests/provenance.rs`'s
# completeness gate walks the REAL serialized `Settings` and demands a `provenance::setting_keys`
# row for every leaf it finds, which needs a format that RENDERS an `Option::None` — TOML has no
# null, so such a field simply VANISHES from a TOML table, and a field the gate cannot see is
# exactly the drift it exists to catch.

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
