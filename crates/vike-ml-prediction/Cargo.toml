[package]
name = "vike-ml-prediction"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the PREDICTION half of the gradient-boosted-model crates: PURE RUST, parsing LightGBM's v4 text model and walking the trees itself, so a live trading binary — or a strategy file — predicts with no native dependency, no process spawn and no file write. The model types, the parser, the walker, the importance and category-map readers, the model-text format pin and the prediction trait. ONE vike dependency, the libm-only helper floor `vike-math` (the one logistic, logit and softmax), and one external crate: `libm`, whose portable `exp` keeps a probability bit-identical across MSVC and glibc. Training (the LightGBM driver, the search, the learner seam, the fit cache) is `vike-ml-training`. Nothing in its API names a strategy or a study."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `leaf` — names at most the
# floor: the market-data vocabulary at 5 and the domain vocabulary at 10; this crate names only the formula floor
# `vike-math` (2).
# The band's rule is machine-checked by `every_tier_15_crate_names_nothing_above_the_vocabulary`; the verdict is
# docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 15

[dependencies]
# ⚠ NO `vike-*` DEPENDENCY but the formula floor `vike-math`, and that is a property worth protecting
# rather than an accident. A consumer of this crate — a live binary, a strategy file built against the
# strategy template — links a tree walker and nothing else: not the domain vocabulary, not the venue
# roster, not a store, not a trainer. Weigh any addition against
# `docs/decisions/0071-the-leaf-libraries-publish-the-product-does-not.md`'s admission test: the
# closure IS the commitment. HELD by `crates/vike-ops/tests/architecture/layer_gate/vike_free.rs`'s
# `every_vike_free_crate_names_no_vike_crate` (this crate's `VIKE_FREE_CRATES` row and its one
# `FLOOR_EDGES` exception), optional and target-specific edges included; the `vike-model` under
# `[dev-dependencies]` is a test edge and exempt.
#
#   vike-math — the owner's rulings of 2026-11-17 (decision 0294): the one logistic and logit
#   (`special_functions::logistic`, `special_functions::logit`), shared with `vike-analytics` and
#   `vike-market-making`, which sit at this crate's own layer and so cannot name it, and the one softmax
#   (`special_functions::softmax`, LightGBM's steps), shared with `vike-nlp`'s sentiment head. Layer 2,
#   names no vike crate, `libm` its only dependency, published per decision 0071, and in both strategy
#   templates' closure.
vike-math = { path = "../vike-math" }
#
#   libm — ONE transcendental call site, `libm::exp` in `rbf_kernel`
#   (`crates/vike-ml-prediction/src/gaussian_process.rs`). The binary sigmoid, the logistic link and
#   `log_odds` go through `vike-math`'s logistic pair, the multiclass softmax through its `softmax`. Pinned by
#   `crates/vike-ml-prediction/tests/libm_platform_probe.rs` (its `predict_proba` hash row drives the
#   sigmoid; `rbf_kernel` by its source scan only, no hash row yet). An
#   `f64` METHOD call reaches the PLATFORM's libm — MSVC's CRT on the Windows dev box, glibc on the CI box
#   and CI — and the two disagree in the last bit; the `libm` CRATE is the same source everywhere,
#   which makes a probability a property of the model rather than of the box. This site is this
#   crate's whole share of `docs/decisions/0032-transcendentals-come-from-the-libm-crate-not-the-platform.md`.
#   Already linked into every binary (vike-math's `up_probability`, vike-options' greeks), so it adds no
#   package to the lockfile or the `cargo deny` surface.
libm = { workspace = true }

[dev-dependencies]
# TEST-ONLY, and this crate's only `vike-model` edge: the corpus hasher (`vike_model::test_support::corpus`)
# `tests/libm_platform_probe.rs` runs. `infer_tests`' compensated sum is the normal `vike-math`
# edge's (`vike_math::summation::compensated_sum`).
vike-model = { path = "../vike-model", features = ["test-support"] }
# `vike_utility::libm_walk`, the shared source parser `tests/libm_platform_probe.rs` reads `src/` with
# (decision 0074), behind vike-utility's `test-support`. A DEV edge with the feature, never a normal one.
vike-utility = { path = "../vike-utility", features = ["test-support"] }

[lints]
workspace = true
