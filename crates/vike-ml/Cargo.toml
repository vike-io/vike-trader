[package]
name = "vike-ml"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the general-purpose gradient-boosted-model crate. `train` DRIVES the upstream LightGBM CLI binary as a child process (config in, model text out — no FFI, no linked library); `infer` is PURE RUST, parsing LightGBM's v4 text model and walking the trees itself, so a live trading binary predicts with no native dependency at all. `fit_cache` is the content-addressed cross-run cache over the learner seam. NO vike dependency at all — three crates already linked into every binary in this workspace are the whole of it: the SHA-256/hex pair the fit cache needs, and `libm`, whose portable `exp` keeps a probability bit-identical across MSVC and glibc. ONE cargo feature, `test-support`, which a shipped build never compiles. Nothing in its API names a strategy or a study."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `leaf` — names at most the
# floor: the market-data vocabulary at 5 and the domain vocabulary at 10.
# ⚠ WAS `domain` (20) until 2026-09-23. This crate has NO vike-* dependency at all, so `domain` overstated it by a whole tier and the
# rank was pure slack: the highest thing it could have named was nothing. The band's rule is machine-checked by
# `every_tier_15_crate_names_nothing_above_the_vocabulary`; the verdict is
# docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 15

[dependencies]
# ⚠ NO `vike-*` DEPENDENCY AT ALL, and that is a property worth protecting rather than an accident.
# These three lines used to read "The ONLY vike dependency, by design: `py_sum` for
# metrics::binary_logloss" over a `vike-model` entry. That entry served ONE import, in ONE function
# — `metrics::binary_logloss` — which had NO CALLER anywhere in this workspace and said so in its
# own doc. Deleting the function deleted the edge; every other `vike_model` use in `src/` sits
# below a `#[cfg(test)]` marker and is covered by the `[dev-dependencies]` entry further down.
#
# What that buys, concretely: a consumer of this crate links a LightGBM driver and a tree walker
# and nothing else — not the domain vocabulary, not the venue roster, not the rate-limit or margin
# tables. Anything added here takes that back, so weigh it against
# `docs/decisions/0071-the-leaf-libraries-publish-the-product-does-not.md`'s admission test before
# adding one: the closure IS the commitment.
# ⚠ THE THREE NON-VIKE DEPENDENCIES, and this crate's description used to say it had none. This
# heading read "THE TWO" until `libm` joined it on 2026-08-26; the count is corrected here rather
# than the sentence rewritten, because the interesting part is that this crate's zero-dependency
# headline has now expired twice for two unrelated reasons, each argued below.
#
# The first two arrived with `src/fit_cache.rs`: a content-addressed fit cache IS a hash, and the
# framing it needs — a domain-separated transcript that hashes each part's own digest — cannot be
# faked with anything cheaper. ALL THREE are ALREADY linked into every binary in this workspace
# (sha2/hex by vike-bridge-core's signer, libm by vike-model's `fair::p_up` and by vike-options'
# greeks), so none is a new crate in the merge gate's audit surface (`cargo deny --all-features`)
# and none is a second spelling of anything: the root Cargo.toml pins one SHA-256, one hex encoder
# and one libm for the whole tree.
#   sha2 — the key transcript and every digest a learner's `fit_identity` builds.
sha2 = { workspace = true }
#   hex — entry file names only (`<key hex>.score`); the same crate the signers already use.
hex = { workspace = true }
#   libm — `libm::exp` in `crates/vike-ml/src/infer.rs`'s `GbdtModel::predict_proba`, now the
#   crate's ONLY transcendental call site. ⚠ This read "the crate's only TWO" and named
#   `metrics.rs`'s `binary_logloss` beside it; that module is deleted, so the count is one.
#   IEEE 754 requires `+`, `-`, `*`, `/` and `sqrt` to be correctly
#   rounded and requires NOTHING of `ln`/`exp`, so an `f64` METHOD call reaches whichever libm the
#   PLATFORM ships — MSVC's CRT on the Windows dev box, glibc on the CI box and on every CI runner — and
#   the two disagree in the last bit. The `libm` CRATE is the same source everywhere, which is what
#   makes a probability out of this crate a property of the model rather than of the box.
#   `docs/decisions/0032-transcendentals-come-from-the-libm-crate-not-the-platform.md` is the
#   verdict; its Consequences section names this crate as one of the not-yet-converted, and those
#   two sites are the whole of its share, so this edge is complete rather than a beachhead.
libm = { workspace = true }
# ⚠ THE FOURTH, and this heading's count has now expired three times. It arrived with `src/tpe.rs`,
# the ask/tell sampler that came down from vike-backtest (layer 50) so the study host at 35 can
# reach it. Weighed against 0071's admission test as the paragraph above demands:
#
#   * it adds NO package to this tree - `indexmap` is already a workspace dependency, carried by
#     vike-analytics, vike-user-research, vike-model and others, so the lockfile and the
#     `cargo deny` surface are unchanged;
#   * the ORDER is load-bearing, which is why it is not a `HashMap`. The sampler's proposal map is
#     built in the parameter space's own axis order, and this workspace's rule (root CLAUDE.md) is
#     `IndexMap` wherever iteration order can reach an f64 fold. A sampler whose map order varied
#     per run would fork its own proposal sequence, which the tpe module doc spends a section on;
#   * what a consumer still links is a LightGBM driver, a tree walker and a sampler - no domain
#     vocabulary, no venue roster, no store.
indexmap = { workspace = true }

[features]
# The shared learner DOUBLE (`src/test_support.rs`: ScriptedLearner/ScriptedModel) for downstream
# crates' tests — the only way code that fits models is testable on a box with no LightGBM binary,
# which is every Windows box and every CI runner. EMPTY array and no `dep:` entry: the double is
# std-only, so THE FEATURE adds no dependency to the four above it. (⚠ This sentence used to read
# "so this crate's `[dependencies]` is still `vike-model` and nothing else" — a claim about the
# TABLE rather than about the feature, and one that stopped being true the moment `sha2`/`hex`
# landed and is now wrong by three. The point it was making — that turning `test-support` on costs
# no crate — survives intact and is what it now says.) Gated
# `#[cfg(any(test, feature = "test-support"))]`, so a shipped build compiles NONE of it — the
# `vike-data`/`vike-model` test-support model, and the reason there is no self-referential
# dev-dep anywhere but the line below.
#
# ⚠ This table was DELIBERATELY EMPTY, and the argument for keeping it so has one premise that
# turned out to be false. It ran: a feature needs a CI lane
# (crates/vike-ops/tests/feature_lane_coverage.rs), the lane is then forced into the justfile's
# clippy/features recipes (crates/vike-ops/tests/local_gate_mirrors_ci.rs), and the Windows dev box
# could no longer run `just ci` at all. The premise is that a feature's only route to a lane is a
# NEW arm in scripts/ci_feature_suite.sh. It is not: a dev-dependency edge activates a feature for
# everything built alongside it (resolver-2 unification — that gate's rule 3), which is how
# `vike-bridge-core/test-support` and `vike-data/test-support` are covered today. So this feature
# rides the DEFAULT roster lane through the dev-dep below: no suite arm, no justfile recipe, no
# `xtask/src/ci/tables.rs` trigger set, and `just ci` on the Windows box is untouched. It is also
# strictly stronger than a check-only lane would have been, because the roster lane RUNS the tests.
test-support = []

[dev-dependencies]
# ⚠ **This is now the ONLY `vike-model` edge this crate has**, and the comment here used to say the
# opposite: "NOT a new dependency — `vike-model` is already this crate's ONE `[dependencies]` entry
# above." That entry is gone with `metrics.rs`, so what was a repetition is now the whole
# relationship — TEST-ONLY, which is exactly where a scratch-directory helper belongs and why the
# normal edge was never load-bearing. A `[dev-dependencies]` edge is invisible to a consumer and to
# `cargo package`'s tarball, so it costs the property above nothing.
# It is here because an integration test links the crate under test plus its DEV-deps only,
# never the lib's normal deps, and `crates/vike-ml/tests/` needs `vike_model::scratch::ScratchDir`:
# the std-only, self-deleting scratch guard that replaced the pid-keyed `env::temp_dir()` paths this
# crate's suites used to leak (44,840 directories measured on the CI box, 2026-08-25). Nothing new joins
# `Cargo.lock` or the `cargo deny --all-features` graph, so the plan's zero-dependency constraint is
# untouched — which is also why this is `ScratchDir` and not `tempfile`.
vike-model = { path = "../vike-model", features = ["test-support"] }
# Self-referential dev-dep, the `vike-bridge-core` idiom: it turns `test-support` on for THIS
# crate's own `tests/` targets (an integration test compiles the lib WITHOUT `cfg(test)`, so the
# double is visible to it only through the feature), and it is what puts the feature on a CI lane —
# see the comment above. Never affects a normal build; `crates/vike-ops/tests/layer_gate.rs`
# discounts a self-edge in both directions.
vike-ml = { path = ".", features = ["test-support"] }

[lints]
workspace = true
