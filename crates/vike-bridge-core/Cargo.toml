[package]
name = "vike-bridge-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Shared venue-bridge plumbing every crates/bridges/<venue> crate is built from: blocking REST transport + signers, the venue-neutral WS user-data pump (reconnect/backoff/keepalive/resync), the ExecActor command thread, credentials (the absent-credentials-is-the-live-gate authority), and the pinned Decimal wire-format site. Depends on vike-model, vike-secrets and, under `full`, vike-exec and vike-data."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs): 25 is the
# arithmetic floor set by ONE edge, `vike-exec` (20), which the `full` feature's exec lanes name.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 25

[dependencies]
# NOT optional — named by modules OUTSIDE the `full` feature: vike-model by
# credentials/trigger/klines/event_map/pacer, serde_json by json/rate_discovery/capture, tracing by
# connectivity/ratelimit.
vike-model = { path = "../vike-model" }
# The credential store (`<project>/settings/db/vike.db`) and its readers, re-exported from
# `credentials`. It links no transport stack, so it stays UNGATED: exactly what a
# `default-features = false` consumer (vike-cli) wants.
vike-secrets = { path = "../vike-secrets" }
serde_json = { workspace = true }
tracing = { workspace = true }                      # transport / user-data-pump diagnostics
# --- the `full` set: every dep below is named ONLY by a `full`-gated module ------------------
vike-exec = { path = "../vike-exec", optional = true }        # exec_actor / rest / user_data
# venue_mount's `MountRequest::properties_rec` (vike-data's PropertiesRecorder). DEFAULT features
# only: that tree adds no package this crate does not already have (docs/decisions/0096).
vike-data = { path = "../vike-data", optional = true }
ureq = { workspace = true, optional = true }        # blocking REST (rustls, no OpenSSL) — http/transport/ws_proxy
hmac = { workspace = true, optional = true }        # signer
sha2 = { workspace = true, optional = true }        # signer
hex = { workspace = true, optional = true }         # signer + eip712 (BOTH features carry it)
base64 = { workspace = true, optional = true }      # OKX signatures are base64, not hex — signer
rust_decimal = { workspace = true, optional = true } # the ONE Decimal wire site (format_to_step)
# Blocking WS: the generic TungsteniteStream/WsSocket plumbing every WS venue bridge uses.
tungstenite = { workspace = true, optional = true } # depth/market_pump/ws/ws_proxy
k256 = { workspace = true, optional = true }        # EIP-712 secp256k1 signing (eip712.rs, feature-gated)
tiny-keccak = { workspace = true, optional = true } # EIP-712 keccak256 hashing (eip712.rs, feature-gated)
# SOCKS5 egress for the blocking WS dial (ws_proxy.rs, `socks-proxy`). NOT a second transport
# stack: the same crate `ureq`'s own `socks-proxy` feature pulls in, so deny.toml stays green.
socks = { workspace = true, optional = true }
# --- `test-support` only -------------------------------------------------------------------------
# The workspace's ONE scoped `tracing` capture (`vike_log::capture`), read by
# `venue_mount_fixture::found_tier_events`. Enabled by `test-support` alone, so no shipped build
# links vike-log's subscriber tree. Points DOWN (vike-log is layer 15).
vike-log = { path = "../vike-log", optional = true }

[features]
# ON BY DEFAULT: every bridge crate and other full consumer takes this crate with default
# features. The feature exists so a LIGHT consumer can opt OUT.
default = ["full"]
# The TRANSPORT/SIGNING half — the 15 modules that name a venue socket, an HTTP agent, a signer,
# the execution lanes or the venue mount contract built on them: depth / error_kind / exec_actor /
# format / http / market_pump / net_probe / pump_spec / rest / signer / transport / user_data /
# venue_mount / ws / ws_proxy (plus two test doubles: `scripted`, the WS doubles built on them, and
# `venue_mount_fixture`, the mount contract's). With it off, this crate is its PURE half:
# account_directory, concurrent, connectivity, credentials, event_map, halt, json, key_permissions,
# klines, leverage, mark_stream, market_slippage, pacer, poller, rate_discovery, ratelimit, retry,
# stream_health, sub_ack, trigger and venue_passphrase — std + vike-model + vike-secrets +
# serde_json + tracing, and no transport stack at all.
#
# WHY THE SPLIT: `credentials` is the workspace's ONE credential-store authority, and a light
# consumer (vike-cli) must reach that one definition without linking ureq+rustls, tungstenite,
# hmac/sha2/base64, rust_decimal and vike-exec. `src/lib.rs` carries the gating rule.
#
# ⚠ Cargo unifies features per build, so any workspace-wide invocation turns `full` back on and this
# crate is built once, complete. The split buys a light STANDALONE `cargo build -p vike-cli`.
full = [
    "dep:vike-exec",
    "dep:vike-data",
    "dep:ureq",
    "dep:tungstenite",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:base64",
    "dep:rust_decimal",
]
# The generic EIP-712 primitive (eip712.rs). Opt-in so venues that don't sign with an EVM key stay
# k256-free. vike-aster and vike-hyperliquid enable it via their default-on `exec` features,
# vike-polymarket via its `polymarket` feature; all three consume THIS module as the one shared copy.
# `hex` is shared with `signer` (which rides `full`), so BOTH features carry it — `eip712` must
# stand alone under `--no-default-features`.
eip712 = ["dep:k256", "dep:tiny-keccak", "dep:hex"]
# Shared test doubles (`scripted`'s WS doubles, `venue_mount_fixture`) for downstream crates' tests.
# Only dev-dependency edges turn it on, so it never reaches a shipped binary. Implies `full` (the
# doubles ARE depth/market_pump/user_data streams), and turns on vike-log's own `test-support` (the
# scoped `tracing` capture a bridge's mount test reads).
test-support = ["full", "dep:vike-log", "vike-log/test-support"]
# Sanitized real-frame capture (capture.rs) behind the fixture-faithfulness harness: capture smokes
# and captured-wire replay tests in the bridge crates enable it via their dev-deps. No extra deps;
# gated so the shipped order-signing binary never compiles the fixture writer.
capture = []
# Optional SOCKS5 egress for the shared WS dial (ws_proxy.rs). Off, a default build compiles NO
# proxy code and `connect_ws(url, None, _)` is the plain dial; a `Some(proxy)` is then a named
# error, never a silent direct fallback. `vike-polymarket/polymarket` turns it on (its CLOB hosts
# are geo-blocked). Implies `full`: the dial arm it gates lives INSIDE `ws_proxy`.
socks-proxy = ["full", "dep:socks"]

[dev-dependencies]
# Self-referential dev-dep: enables `test-support` for THIS crate's own `tests/` targets (an
# integration test compiles the lib without `cfg(test)`, so the shared doubles are only visible to
# it through the feature). Standard cargo idiom; never affects normal builds.
vike-bridge-core = { path = ".", features = ["test-support"] }
# `vike_exec::recon::FakeReconClient` (`src/venue_mount_tests.rs`) and
# `vike_exec::testing::RecordingClient` (the conformance and fill-label suites under `tests/`),
# compiled only under vike-exec's `test-support`, which a DEV edge may turn on and a normal one may
# not. The optional normal edge above (`full`) stays feature-free.
vike-exec = { path = "../vike-exec", features = ["test-support"] }
# test-only: the ExecActor and conformance tests read the ingest lane (a tokio mpsc receiver), with
# a timeout around each read.
tokio = { workspace = true }
# test-only: `tests/halt_default_path.rs` drives the REAL `boot` to prove `$VIKE_SETTINGS_DIR` moves
# the HALT sentinel (`halt::declare_project_state_dir` <- `vike_boot::Booted::state_dir`); a test
# that walked for its own answer would prove only half of it. LEVEL with this crate (both 25), which
# only a dev edge may be.
vike-boot = { path = "../vike-boot" }
# test-only: the cross-bridge conformance suites under `tests/` drive each covered venue's REAL
# mapper through one shared scenario table. DEV edges only — the venue crates normal-depend on this
# crate, and cargo permits a cycle that closes through dev-dependencies. Nothing under `src/` may
# reach for these.
vike-binance = { path = "../bridges/binance" }
vike-bybit = { path = "../bridges/bybit" }
vike-okx = { path = "../bridges/okx" }
vike-deribit = { path = "../bridges/deribit" }
vike-aster = { path = "../bridges/aster" }
vike-hyperliquid = { path = "../bridges/hyperliquid" }
# The non-WS venues the conformance harness covers via the FillShape::Whole axis — oanda/ig (FX/CFD
# streaming), alpaca (SSE) — default-buildable, so plain path dev-deps.
vike-oanda = { path = "../bridges/oanda" }
vike-ig = { path = "../bridges/ig" }
vike-alpaca = { path = "../bridges/alpaca" }
# FXCM joins the same FillShape::Whole axis. A PLAIN path dep: `vike-fxcm`'s `fxcm` feature gates
# only `build.rs`'s native-shim compile, so this edge builds no C++ and links no proprietary SDK.
vike-fxcm = { path = "../bridges/fxcm" }
# Property-based testing: tests/format_props.rs proves the pinned Decimal wire site (format_to_step)
# never over-emits precision, stays a step-multiple, truncates toward zero and round-trips.
proptest = { workspace = true }
# test-only: temp directories for tests that build a real project tree on disk
# (`tests/credential_chain_roots.rs` and others): a fixed name under the system temp directory is
# what `crates/vike-ops/tests/hygiene/temp_path_gate.rs` refuses.
tempfile = "3"

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
