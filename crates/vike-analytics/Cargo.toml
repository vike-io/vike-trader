[package]
name = "vike-analytics"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the pure performance-analytics cluster extracted out of vike-backtest: the metrics catalog, TradingRecord/TradingResults, benchmark/excursions/periods/montecarlo/stability/overfit/validation analytics and the zero-trade diagnoser — plus, since it moved out of vike-report, the live tearsheet's pure core: the TradingResultsTable document, its self-contained HTML renderer and the fill-to-trade and mark-to-market folds. Depends on vike-model and the two crates below it ONLY — no engine, no execution, no journal, no data layer — so a consumer that just needs the numbers or the document does not compile the simulator or a journal reader to get them."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `leaf` — a crate that
# names at most the floor. (This line still said `domain` until 2026-09-28, beside the note below
# recording the move off it.)
# ⚠ WAS `domain` (20) until 2026-09-23. Tier `leaf` — *a crate that names AT MOST THE FLOOR* —
# describes it structurally and exactly: its ONE vike-* edge is `vike-model` (10), and there is no
# other. `crates/vike-ops/tests/architecture/layer_gate/tiers.rs`'s
# `every_tier_15_crate_names_nothing_above_the_vocabulary` holds that wording to the band, so the
# claim is machine-checked rather than asserted here.
# ⚠ Since 2026-11-18 it also names `vike-trade-ledger` (12), the closed-trade ledger that left this crate,
# an edge above the floor that `TIER_15_EXCEPTIONS` declares in that file.
#
# ⚠ 15 and 20 genuinely OVERLAP — `domain` reads *one hop over the vocabulary: a single-purpose
# pure core*, which a crate naming only the vocabulary also satisfies. What breaks the tie is the
# ROLE qualifier in 20: this crate is a metrics LIBRARY (the catalog, the folds, the periods
# bucketing), not a core anything executes against. `vike-execution` and `vike-fills` sit the other side
# of that line and stay at 20 for it. The slack cost nothing while it lasted — the lowest consumer
# is `vike-user-research` at 35 then (25 now) — so this is 0085's correction rather than an
# unblocking.
# docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 15

[dependencies]
# The vocabulary edge, by design (see the crate doc): Trade / Bar / time,
# and — for the tearsheet core that moved in from vike-report — FillEvent / TradeFold /
# EquitySample / the notional helpers. Adding vike-execution, vike-core, vike-journal or vike-data here
# would defeat the reason this crate exists; the tearsheet's journal and store READERS stayed in
# vike-report for exactly that reason.
vike-model = { path = "../vike-model" }
# `vike_marketdata::interval::interval_ms`: the bar-interval vocabulary, which moved out of
# `vike_model::time`. Layer 5, serde only; already in this crate's closure through vike-model.
vike-marketdata = { path = "../vike-marketdata" }
# The formula floor (decision 0294, layer 2, `libm` only; already in this crate's closure through
# vike-model): every pure formula this crate's strategy metrics, overfitting tests and fits compute with:
# the dense linear algebra, the ADF regression and its supremum (SADF), the ONE
# GARCH(1,1) variance step and two-state HMM forward step the `garch` and `hmm` fits run (the same copy
# the `garch_volatility` and `hmm_regime` indicator rows run), the normal CDF and quantile, the logistic and
# logit the `garch` search and `overfit`'s PBO logits take, and Nelder–Mead.
vike-math = { path = "../vike-math" }
# The closed-trade ledger (`vike_trade_ledger::TradeClosedMetrics`, the block a `TradingRecord` and its
# `TradingResults` carry and `html` renders, and the null-as-infinity serde helpers `TradingResults::profit_factor`
# shares). It was
# this crate's `closed_trades` module until 2026-11-18. Layer 12, over vike-model, vike-math and
# vike-utility only: the one edge above rank 10, declared in
# `crates/vike-ops/tests/architecture/layer_gate/tiers.rs`'s `TIER_15_EXCEPTIONS`.
vike-trade-ledger = { path = "../vike-trade-ledger" }
# TradingResults + ZeroTradeReport derive Serialize; TradingResultsTable (moved in from vike-report)
# derives both directions, and its TradingResultsTableMetricValues implements both by hand to serialize FLAT.
serde = { workspace = true }
chrono = { workspace = true }   # periods.rs calendar bucketing (daily/weekly/monthly/quarterly/yearly)
indexmap = { workspace = true } # periods.rs periodic_returns — Python dict insertion order
rand = { workspace = true }     # montecarlo.rs seeded resampling (statistical, not bit, parity — see montecarlo.rs)
rand_chacha = { workspace = true } # synthetic.rs: a PORTABLE seeded stream, so one seed is one synthetic path (root pin)
libm = { workspace = true }     # the transcendentals of this crate (vike-options precedent; the normal CDF and quantile are vike-math distributions.rs)
# `TradingResults::read_stored`, the ONE typed read of a stored `report.json`, which must be handed the
# source and period its bytes do not carry. Already in this crate's closure through vike-model and
# already a dev edge here, so the lockfile entry does not move.
serde_json = { workspace = true }

[dev-dependencies]
# vike-model's `test-support` for the `vike_model::test_support` helpers this crate's tests name. A DEV
# edge with the feature, never a normal one: a normal edge would compile them into shipped builds.
vike-model = { path = "../vike-model", features = ["test-support"] }
# The shared libm walk (decision 0074): `vike_utility::libm_walk` holds the text parser this crate's
# `libm_platform_probe` used to keep a private copy of. A DEV edge with the feature, never a normal
# one — `test-support` is gated `#[cfg(any(test, feature = "test-support"))]` and a normal edge
# would compile it into shipped builds. `cargo package` strips a dev-dependency carrying no
# version, so a published closure is untouched.
vike-utility = { path = "../vike-utility", features = ["test-support"] }
# tests/research_property_tests.rs — the labels / sample-weights / factor-evaluation / purged-fold
# property suite. Root-pinned; dev-dep only.
proptest = { workspace = true }
# `vike_marketdata::test_support`: the shared bar/tick builders. A DEV edge only; the normal edge
# above already exists, so no lockfile entry.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }
# (The `vike-utility` dev edge above also serves `vike_utility::fnv` for `src/results/tests/wire.rs`'s digest pin;
# the library names no helper of it. One key: #3362 moved that use here while #3370 added the edge with the feature.)

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
