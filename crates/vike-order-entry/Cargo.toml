[package]
name = "vike-order-entry"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "The order-entry egui widgets (chart-engine-free): the Trade window (price ladder, tick chart, order ticket, instrument bar, status line), the Polymarket cockpit (window-chain rail, Price-to-Beat header, probability ladder, one-click ticket), the Options window's chain grid and order ticket, and the one dispatcher that turns their intents into vike_execution commands."
# The integration tests are ONE test binary, `tests/integration.rs` (every `tests/<name>.rs` a `mod` of it), declared
# below: one binary links instead of one per file. Discovery is off so each file keeps the path its citations name; a
# new root file builds only as a `mod` there or a `[[test]]` row (`crates/vike-ops/tests/hygiene/test_registry_gate.rs`'s `every_root_test_file_is_built_where_discovery_is_off`).
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `ui-widget` — an egui widget / engine crate (no eframe/wgpu).
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 75

[dependencies]
vike-model = { path = "../vike-model" } # the types the Trade window paints over; the option chain's `Position` and `OrderSide`
vike-math = { path = "../vike-math" } # the formula floor (decision 0294): the ladder's step median, the heatmap's nearest-rank scale and the ticket's powers of ten
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162),
# and `LANE_TWINS` (`vike_venues::lane_twin`: which venue runs a lane twin), so this widget links no credential store.
vike-venues = { path = "../vike-venues" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `L2BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../vike-marketdata" }
# The options-chain column model (`vike_options::chain::columns`) the chain grid (`option_chain`) paints;
# the chain snapshot types it renders are vike_marketdata's.
vike-options = { path = "../vike-options" }
vike-ui-theme = { path = "../vike-ui-theme" } # the design system: tokens read from the installed appearance, and the component kit
egui = { workspace = true }
# The dispatcher (`src/dispatch/`): the plan it emits is `vike_execution::Command`s over the snapshot's
# `CoreSnapshot` / `VenueBlock`, the read model alone, so no async runtime (`runtime` off, the shape
# vike-tradehub-client takes).
vike-execution = { path = "../vike-execution", default-features = false }
# The dispatcher's lane rules: `on_futures_lane`, `engine_lane_holds_stop`, and `books_cash`, the node's spot
# rule the order ids' intent letter reads (ONE rule with the CLI's).
vike-catalog = { path = "../vike-catalog" }
# The dispatcher's ONE local preview cap (`order_checks`) and the node's Directory reply
# (`wire::AccountDirectoryWire`, read by `lane_twin_account`).
vike-tradehub-client = { path = "../vike-tradehub-client" }
tracing = { workspace = true } # the dispatcher's one debug line (a modify the venue cannot take)

[features]
# `examples/trade_shot.rs`: the Trade window's body drawn off-screen on the app's own renderer,
# posed with the owner's v3 design's numbers, for a capture to lay beside a capture of that design.
# The feature adds the theme crate's `offscreen` module (the wgpu stack), never a dependency of this
# crate, so the lockfile's package set is unchanged. Off by default, and the example below carries
# `required-features`, so a plain `--all-targets` run compiles none of it.
png-export = ["vike-ui-theme/offscreen"]

[[example]]
name = "trade_shot"
required-features = ["png-export"]
test = true

[dev-dependencies]
# The dispatcher's tests: `vike_execution::testing::position_view`, and the `IndexMap` a block's
# contract-value grid is.
vike-execution = { path = "../vike-execution", features = ["test-support"] }
indexmap = { workspace = true }
# The `trade_shot` example reads its argv through `vike_utility::cli` over `clap` (decision 0155). A DEV edge.
vike-utility = { path = "../vike-utility", features = ["cli"] }
clap = { workspace = true }
# Accessibility-tree tests over the REAL widget (`tests/trade_actions.rs`). NO wgpu / NO snapshot —
# `Context::run_ui` is pure CPU, so these run on the GPU-less CI runners like any other test. See
# the workspace manifest's `egui_kittest` rationale.
egui_kittest = { workspace = true }
# `harness::appearance_ready` — the Trade window draws icons, whose family only the app's bundled type binds, and
# kittest's build-time frame runs on egui's default fonts. The feature adds a module, no dependency,
# and the crate is already a normal dependency, so the lockfile's package set is unchanged.
vike-ui-theme = { path = "../vike-ui-theme", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`. This crate is unsafe-free.
[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
