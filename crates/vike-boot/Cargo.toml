[package]
name = "vike-boot"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the STARTUP SEQUENCE's one owner: refuse a removed environment, resolve <project>/settings ONCE, load the credentials, then the settings, and hand back everything a binary needs to build its log subscriber and disclose what it resolved. Takes the environment as a PARAMETER and performs no logging, no transport and no DataFusion, so every composition root shares one order without any of them acquiring the others' dependencies."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain-stacked` —
# one hop over the domain band: `vike-config` (20) is this crate's highest vike-* edge and sets the
# floor. The crate's JOB is its own sentence, not the tier's: the composition-root startup
# sequence, over the settings/credential domain crates and below every binary that runs it.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 25

[dependencies]
# The typed settings model + layered loader, and the things this crate SEQUENCES around it:
# `refuse_removed_env`, `load_with_source` and `boot_lines`. Pure — it reads no environment and
# walks for no directory, which is exactly why the order has to live somewhere.
vike-config = { path = "../vike-config" }
# The credential store's own crate, for the project walk (`project_settings_dir_for`), the
# settings-database read (`read_settings_in`) and the credential store this crate OPENS
# (`Booted::store`, a `CredentialStore`; a root that runs no boot opens the same handle with
# `vike_secrets::open_credential_store`). It
# names nothing above the vocabulary floor (`vike-model` and below) but the change journal and the per-venue tables one rung
# over it (`vike-change-journal` and `vike-venues`, its tier-15 exception row, declared below too), and one
# external crate (`rusqlite`, the store's database home) — no transport, no TLS stack and no query
# engine — which is the whole reason this crate can be depended on by `vike-cli`. (The credential loaders sat in
# `vike-bridge-core` with ureq/tungstenite/rustls until docs/decisions/0135, which is why this crate
# once took the root's own loader as a function rather than opening the store; that reason is gone.)
vike-secrets = { path = "../vike-secrets" }
# The change journal (the `boot_settings` anchor, src/boot_anchor.rs). It was
# a module of vike-secrets until it moved into its own crate (layer 12); it names only
# vike-model, vike-util, serde and serde_json, all already in this graph.
vike-change-journal = { path = "../vike-change-journal" }
# `state_path::{STATE_SUBDIR, LOGS_SUBDIR}` — the log home derived from the ONE resolved settings
# directory. Already in this crate's graph through vike-config and vike-secrets, so it adds no
# package; std-only, layer 7. (This edge was `vike-model` until the paths left it for vike-paths.)
vike-paths = { path = "../vike-paths" }
# The BUILD IDENTITY line that opens the startup disclosure. ZERO dependencies, same argument.
vike-buildinfo = { path = "../vike-buildinfo" }

# ⚠ DELIBERATELY ABSENT, and each absence is load-bearing — `tests/dependency_floor.rs` is the gate:
#   * `vike-log` — this crate does NOT call `vike_log::init`. Measured on the tree this crate was
#     written against, that one edge would add 43 packages (tracing-subscriber, tracing-appender,
#     `time`, `regex-automata` and the whole ICU4X `idna` tree) to `vike-cli`, whose entire
#     identity is being light and on the FAST CI lane. The root builds its own `LogConfig` and HOLDS
#     the returned guards; what this crate hoists is the ORDER around it and the log HOME derived
#     from the one settings walk.
#   * `vike-bridge-core` — the venue transport stack; nothing this crate does needs it (see the
#     vike-secrets note above).
#   * `tracing` — this crate must run BEFORE a subscriber exists (the log directory and both log
#     levels are themselves settings), so anything it wants to say comes back as DATA.

# The ONE signal surface in the workspace, carried for `stop::install_handlers` — the graceful
# SIGTERM/SIGINT stop both headless daemons install (`docs/ops/graceful-stop.md` is the decision
# record; the root manifest's `[workspace.dependencies]` entry carries the one-package measurement).
# These two edges moved here from `vike-ops` WITH `stop.rs` (wave 5), unchanged.
#
# NOT optional, on purpose. Behind a feature, a daemon could build with the graceful stop silently
# absent and look identical from the outside, which is the exact failure mode this whole change
# exists to remove.
#
# `cfg(unix)`: there is no POSIX signal on Windows, so the dependency is absent from a Windows build
# entirely and `install_handlers` is a documented no-op there (`just windows-check` is a real gate).
[target.'cfg(unix)'.dependencies]
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The Windows console-ctrl → stop-flag bridge (split-plane B10) — see the workspace manifest's
# rationale beside signal-hook, its unix twin.
ctrlc = { workspace = true }

[dev-dependencies]
# The project walk and the settings database must be exercised against a real directory tree; a
# pure-string test would only re-assert `join`. Already in the lockfile, and dev-only, so the
# crate's runtime graph is unchanged.
tempfile = { workspace = true }
# `vike_model::libm_walk::cfg_test_module_rel_files` for `tests/one_owner.rs`: a test module that
# lives in its own file (`#[cfg(test)] mod NAME;`) is test code, not a composition root. vike-model
# is already in the normal closure (through vike-config); this only turns on the feature that
# compiles the parser.
vike-model = { path = "../vike-model", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
