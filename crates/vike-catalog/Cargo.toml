[package]
name = "vike-catalog"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Universal cross-venue instrument catalog: the Instrument model, the picker Tab grouping over `vike_model::AssetClass`, a two-mode CatalogProvider trait, per-venue addressing/availability/session tables over the canonical `vike_model::VENUES` roster, and tiered fuzzy search. Bridge-free (depends on vike-model and vike-venues only) so bridges and vike-chart can depend on it down-only."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain` — one hop over the vocabulary: a single-purpose pure core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 20

[dependencies]
vike-model = { path = "../vike-model" }
# The per-venue tables (`caps_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../vike-venues" }
# The pure helpers (decision 0141, layer 3) this crate calls: `calendar`.
vike-util = { path = "../vike-util" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../vike-marketdata" }
serde = { workspace = true }
serde_json = { workspace = true }

# Workspace lint policy (root manifest): forbids `unsafe_code`. This crate is unsafe-free.
#
# ⚠ These two lines were MISSING until the unsafe ratchet was added. Cargo applies
# `[workspace.lints]` only to members that opt in, so this crate — added by PR #274, before the
# lint policy landed, and never retrofitted — sat silently OUTSIDE the workspace forbid, and
# nothing about it looked wrong. It happened to contain no `unsafe`, so the hole was latent rather
# than exploited; `crates/vike-ops/tests/hygiene/unsafe_and_toolchain_gate/pins.rs`'s `UNSAFE_EXEMPT` is what
# makes the next one loud.
[lints]
workspace = true
