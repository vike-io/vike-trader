[package]
name = "vike-run"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike run/composition crate — MOUNT a strategy on the PRODUCTION live core (spawn_core + StrategyMount), over the paper exchange (vike-paper) or over every venue's engine (build_node, through vike-mount's generic fold over the venue registry the daemon hands it as NodeConfig::registry — vike-tradehub's, which names every bridge). Names no venue bridge of its own; the daemon (vike-tradehub) wires the live feeds."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `engine-stacked` — one
# hop over the engine band: its highest normal vike-* edges are vike-core and vike-mount (30). It
# was `mount-stacked` (62) until the venue mount contract finished (docs/decisions/0096, amended
# 2026-09-29): the venue registry is vike-tradehub's, so this crate names no bridge, and once
# vike-mount dropped to 30 nothing above 30 was left.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 35

[dependencies]
# The durable command JOURNAL and its single-writer directory lock. ⚠ Both were this crate's own
# `journal`/`journal_lock` modules until 2026-09-23; `crates/vike-journal/src/lib.rs` carries why
# they left. Layer 25 to this crate's 35, so the edge is down-only.
vike-journal = { path = "../vike-journal" }
vike-model = { path = "../vike-model" }
# `fee_lane`: the `.P` spot-vs-perp split applied to the FEE table's key. Both fee sites here take a
# `(venue, symbol)` PAIR — the maker mount's paper book and the xEMM legs' break-even offset — and on
# binance/aster the SYMBOL picks the order API, so the lane must be resolved before reading
# `fee_schedule_for`. No external package: vike-catalog depends on vike-model alone.
vike-catalog = { path = "../vike-catalog" }
vike-exec = { path = "../vike-exec" }
# the single-writer live core (spawn_core / StrategyMount / LiveBroker) — the PRODUCTION runtime the
# mount validates the maker on.
vike-core = { path = "../vike-core" }
# the A-S SpreadMaker (impl<B: HftBroker> Strategy<B>) mounted here.
vike-mm = { path = "../vike-mm" }
# the generic venue mount (`make_engine`): `build_node` (src/node.rs) mounts every venue through it,
# handing it the registry `NodeConfig::registry` carries — vike-tradehub's `REGISTRY`, where the
# bridges are named; this crate names none. vike-mount is trait-only over vike-data now (the
# DataFusion-edge cut): the PIT-properties recorder a NodeConfig may carry is CONSTRUCTED by the
# binary that owns the store backend, so this edge no longer pulls the Arrow/DataFusion tree. (Those
# binaries were vike-app fat / vike-tradehub record-feeds|materialize; all three builds are deleted,
# 2026-09-09 and 2026-09-22, and the daemon passes `None`.)
vike-mount = { path = "../vike-mount" }
# the paper exchange behind the ExecutionClient seam (R7) — fills the maker's resting book with the
# backtest fill semantics, so a paper mount is real-fill-faithful with no venue creds.
# THIS LINE USED TO READ `vike-backtest`, which owned the same module. All 4 call sites in this
# crate named `vike_backtest::paper::…` and NOTHING else from it, so the whole simulator was
# compiled to obtain one `ExecutionClient`. The fill semantics are unchanged: vike-paper fills with
# the SAME vike-fills core the engine uses, which is what keeps "backtest == paper" true.
vike-paper = { path = "../vike-paper" }
# the live-data seam: MakerSink implements vike_data::LiveDataSink, and NodeConfig.properties_rec
# names the ungated PropertiesRecorder type. DEFAULT features (trait surface only): since vike-mount
# dropped its hist-datafusion enable, a default vike-run build is DataFusion-FREE.
vike-data = { path = "../vike-data" }
vike-log = { path = "../vike-log" } # tracing-native logging init (the bin holds the guards)
tracing = { workspace = true }      # bin diagnostics (subscriber lives in vike-log)
# `incident` subcommand (src/incident.rs + src/bin/incident.rs): serde derives the bundle manifest,
# serde_json writes/reads it, flate2 gzips each frozen evidence file (the raw_tap.rs GzEncoder
# pattern — per-file gz in a timestamped directory; deliberately NO `tar` dep). All three are
# already-pinned workspace deps, so this adds no new lockfile entry.
serde = { workspace = true }
serde_json = { workspace = true }
flate2 = { workspace = true }
# ⚠ NO venue bridge is named here, and two were until 2026-09-28: optional `vike-polymarket` and
# `vike-ibkr` edges, for the `polymarket_maker_paper` and `ibkr_mount` bins (and the Gamma picker and
# toxicity producer only the first used). All four were DELETED, measured unused on every box
# (`src/lib.rs`'s module doc). The three features below are MARKERS: each gates this crate's wiring
# of one venue (`src/node.rs`), while the bridge edge, the bridge's features and the registry row
# that names the bridge are all `vike-tradehub`'s, handed to `build_node` as `NodeConfig::registry`
# (docs/decisions/0096, amended 2026-09-29). This crate takes no bridge edge, normal or dev. ⚠ They
# were pure forwards to `vike-mount`'s own `polymarket`/`ibkr`/`fxcm` features until the venue mount
# contract deleted those.

[dev-dependencies]
vike-log = { path = "../vike-log" } # test_init() for the offline mount test
# a planted venue row for `node_tests.rs` (docs/decisions/0096) — the contract crate, not a bridge.
# Its `VenueMount` trait is behind the default `full` feature, which this edge takes.
vike-bridge-core = { path = "../vike-bridge-core" }
# Self-deleting, uniquely-named scratch directories for the tests that need one on disk: the
# `venue_mounted` journal state dir, and the HALT sentinel each scripted-mount binary pins. Replaces
# the `env::temp_dir().join(format!("..-{pid}"))` idiom, which leaked one directory per run forever
# and collided across the two users that run tests on the the CI box box. Per-crate rather than a
# workspace dep, matching the convention noted in `crates/bridges/polymarket/Cargo.toml`.
tempfile = "3"

[features]
# A MARKER, like `ibkr` and `fxcm` below: it enables nothing, and this crate names no bridge
# (docs/decisions/0096, amended 2026-09-29). It gates `src/node.rs`'s `POLYMARKET_MARKET` row and
# `build_node`'s polymarket call, which mount the venue through the registry
# `NodeConfig::registry` hands in; the offline mount tests compile with no native deps, no creds and
# no geo access either way. `vike-tradehub`'s `polymarket` owns the bridge edge and the registry
# row, and turns this on. ⚠ ON is still not enough to trade: the mount needs `flags.poly_exec`
# (which the daemon folds into the credential map as `POLY_EXEC`), a live key and a `live` ceiling
# — the venue has no testnet. It forwarded `vike-mount/polymarket` until the venue mount contract
# deleted that feature. CI lane: `bash scripts/ci_feature_suite.sh polymarket-stack`.
polymarket = []
# A MARKER: it enables nothing, and this crate names no bridge (docs/decisions/0096, amended
# 2026-09-29). It gates `src/node.rs`'s `IBKR_MARKET` row and `build_node`'s ibkr call, which mount
# the venue through whatever registry `NodeConfig::registry` hands in. `vike-tradehub`'s `ibkr`
# owns the bridge edge and the registry row, and turns this on. ⚠ It forwarded `vike-mount/ibkr`
# until the venue mount contract deleted that feature.
# CI lane: `bash scripts/ci_feature_suite.sh ibkr`.
ibkr = []
# A MARKER: it enables nothing, and this crate names no bridge (docs/decisions/0096, amended
# 2026-09-29). It gates `src/node.rs`'s `FXCM_MARKET` row and `build_node`'s fxcm call, which mount
# the venue through the registry `NodeConfig::registry` hands in. `vike-tradehub`'s `fxcm` owns the
# bridge edge and the registry row, and turns this on (the shipped `vike-backend`'s `full` forwards
# `vike-tradehub/fxcm`). ⚠ ON is still not enough to trade: the mount REFUSES to go live unless
# `vike_fxcm::sdk_available()` finds a loadable shim on the box, and no CI runner has one. ⚠ Not a
# daemon PROFILE venue either: the bridge serves no market data, so `vike-tradehub`'s
# `LIVE_WIRED_VENUES` refuses it and the engine is reached by ROUTING (that const's doc argues it).
# It forwarded `vike-mount/fxcm` until the venue mount contract deleted that feature. CI lane:
# `bash scripts/ci_feature_suite.sh fxcm`.
fxcm = []

[[bin]]
# `incident --since <dur>` — freeze perishable run evidence (journal segments + trace logs
# overlapping the window, the resolved RunProfile + hash, the latest EngineSnapshot + state_hash,
# git/build info, a REDACTED env dump) into a timestamped directory of per-file gzips + a manifest.
# No required-features: feature-free (no venue/native deps), so it builds in the default/CI lane.
name = "incident"

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
