[package]
name = "vike-alerting"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "The alerting primitive: a persisted serde rule model, an alerts.json loader, the rule evaluator, and the delivery seam (in-process buffer + Telegram/generic-webhook POST over the shared ureq+rustls stack). EVERY build has ZERO vike-* dependencies — the evaluator asks its caller for facts through the SnapshotFacts trait rather than naming a CoreSnapshot — so a standalone watchdog binary links no part of the trading core."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/arch/layer_gate.rs). Tier `leaf` — a crate that
# names at most the floor; this one names no vike-* crate at all, in any build.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
#
# ⚠ This line read "Tier `engine-optional` — a library whose DEFAULT build is a pure leaf, carrying
# an OPTIONAL edge over the engine crates" until 2026-09-28, five days after that tier and that edge
# had both gone. The rank's history, oldest first:
#
# ⚠ This declared `service` (50) until 2026-09-20, and that number was doing real damage two crates
# away. Nothing in the DEFAULT build reached a vike crate at all — the `core` feature was the only
# vike-* edge, it was enabled by `vike-ops` alone, and the gate counts an optional normal dep like
# any other, so one caller's opt-in set this crate's rank. Every consumer then had to outrank 50:
# `vike-recorder` (a live-tape RECORDER) and `vike-ops` both took `service-stacked` (55) and sat
# ABOVE the simulator, which neither uses.
#
# That is the exact opposite of why this crate exists. It was extracted so a watchdog could PAGE
# without linking `vike-core -> vike-exec -> vike-model`, after the latency box crashed and ~6h of Polymarket
# L2 tape was lost unnoticed. A rank that forced its consumers upward made the split pay for itself
# in the graph while delivering the lightness only in the build.
#
# 32 was the floor the gate then imposed (the optional `vike-core` edge declared 30), not a chosen
# number. What keeps the crate honest is `crates/vike-ops/tests/arch/layer_gate/vike_free.rs`'s `VIKE_FREE_CRATES`
# — a manifest read that fails on ANY `vike-*` normal dependency, optional or target-specific
# included, which no rank can say (tier 15 still admits the vocabulary floor). It was a CI lane's
# `cargo tree` check until 2026-09-28.
# ⚠ WAS `engine-optional` (32) until 2026-09-23 — a rank the table gained on 2026-09-20 FOR this
# crate, to describe a default build that is a pure leaf carrying an optional edge over the engine
# crates. With the `core` feature and both optional edges gone there is no widest configuration to
# describe: this crate names nothing at all, in any build, so `leaf` (15) is simply true.
[package.metadata.vike]
layer = 15

# WHY THIS CRATE EXISTS (the dependency argument, not a taste argument):
# the latency box crashed and ~6h of recorded Polymarket L2 tape was lost UNNOTICED. The fix wanted is a
# small STANDALONE watchdog that pages (Telegram) when an external recorder stops writing. While
# this tree lived inside `vike-ops`, that binary would have had to link
# vike-ops -> vike-core -> vike-exec -> vike-model (plus vike-data + vike-bridge-core) just to POST
# a message. Three of the five modules here (`rule`/`delivery`/`persist`) were already vike-free;
# only `eval` + `AlertEngine` ever touched `vike_core::CoreSnapshot` / `vike_model::events::Event`.
# Splitting on that existing seam turns the watchdog's dependency set into serde + ureq.
#
# The rule this crate is under: EVERY build stays vike-*-free, and there is only one build. An input
# that would name a vike type is asked for through a type this crate owns (`SnapshotFacts`,
# `AlertEvent`) and the caller converts — `crates/vike-tradehub/src/alerts.rs`'s `SnapshotView` does
# it for a `CoreSnapshot`. ⚠ This sent a module needing a vike type "behind `core` (or a new named
# feature), never into the default half" until 2026-09-28; `core` was deleted on 2026-09-23, and
# the features table below says why no feature replaced it.
[dependencies]
serde = { workspace = true }      # the persisted AlertRuleSet JSON model (`rule`)
serde_json = { workspace = true } # alerts.json load/save + the webhook POST body
tracing = { workspace = true }    # off-fold diagnostics (subscriber lives in vike-log)
ureq = { workspace = true }       # blocking webhook/Telegram POST on the shared rustls stack (no second HTTP client)
# deterministic per-rule state ordering in `AlertEngine` (repo-wide insertion-order convention).
# NON-optional since the engine joined the vike-free half: `AlertEngine` is the fold + the sinks,
# and nothing about THAT is vike-specific — only two of its four input methods ever were, and none
# has been since `core` went on 2026-09-23 (⚠ this said "only two of its four input methods are"
# until 2026-09-28). indexmap is not a vike crate, and an external crate cannot depend on a
# workspace member, so the crate still names none (`crates/vike-ops/tests/arch/layer_gate/vike_free.rs`'s
# `VIKE_FREE_CRATES` is what proves it, not this comment).
indexmap = { workspace = true }

# --- NO vike-* edge, optional or otherwise --------------------------------------------------------
# ⚠ This header read "optional, feature-gated: the ONLY vike-* edges in this crate", over one line
# each for `CoreSnapshot` and `Event`, until 2026-09-28. Both edges went with the `core` feature on
# 2026-09-23: `eval_snapshot_rule` and `eval_event_rule` take `SnapshotFacts` and `AlertEvent`,
# which this crate owns.
#
# ⚠ There is deliberately NO vike-bridge-core edge here any more. One existed — optional, behind a
# `workspace-env` feature — for a single convenience function that opened the workspace credential
# store itself (`webhook_configs_from_workspace_env`). That is a LIBRARY reading global
# configuration its caller can neither see nor substitute: the exact class
# `crates/vike-ops/tests/settings/settings_registry.rs`'s `CREDENTIAL_STORE_PIN` ratchets down. Its ONE
# caller (vike-tradehub's `main.rs`) already resolves the full credential chain for the live mount,
# so the read moved there and `delivery::webhook_configs_from_env` takes the map. Do not
# reintroduce it: a caller that wants targets built from the store loads the store and passes it.

[features]
# ⚠ **THERE ARE NO FEATURES, and that is the point of this table still existing.** The whole
# crate — `rule` + `delivery` + `persist` + `eval` + `AlertEngine` — is unconditionally compiled
# and names no vike-* crate in any configuration. `cargo tree -p vike-alerting -e normal` lists
# none, and now there is no second configuration in which it could.
#
# ⚠ A `core` feature lived here until 2026-09-23, gating the two evaluator entry points that
# NAMED a vike type — `eval_snapshot_rule` over a vike_core::CoreSnapshot and `eval_event_rule`
# over a vike_model::events::Event. It was this crate's ONLY vike-* edge, exactly ONE consumer
# ever enabled it (vike-ops, under its own `full`), and the two crates that actually link this one
# — vike-recorder and vike-datahub — took the vike-free default and paid the rank anyway: the
# layer gate counts an optional normal dep like any other, so the rank described a configuration
# nobody used. The evaluator now asks its caller for facts through the `SnapshotFacts` trait, the
# feature is gone with both optional edges, and the crate sits at `leaf` (15) instead of
# `engine-optional` (32) — a rank that existed only to describe this workaround.
# docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
default = []

[dev-dependencies]
tempfile = "3" # the alerts.json disk round-trip in `persist`

# Workspace lint policy (root manifest): forbids `unsafe_code`. This crate is unsafe-free.
[lints]
workspace = true
