[package]
name = "vike-paper"
version.workspace = true
edition = "2024"
rust-version.workspace = true
# Test discovery is OFF so the suites keep their `tests/<suite>.rs` paths (other crates cite them) as modules of ONE
# binary, `tests/integration.rs`. A new `tests/*.rs` runs only once it is a `mod` there or a `[[test]]` row below.
autotests = false
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike R7 PAPER EXCHANGE: the backtest fill semantics running behind the live core's ExecutionClient seam (ExecutionClientPaper + replay_bars). Re-extracted out of vike-backtest once vike-fills gave the shared fill core its own home — the dedup concern that folded the original vike-paper crate away in crate-reorg Phase 0 (D8) is now answered by a common dependency instead of a common crate. Depends on vike-model + vike-venues + vike-marketdata + vike-execution + vike-fills (+ vike-catalog for its pure symbol-name and contract-value functions) ONLY: no engine, no harness, no analytics (the impact model it charges is vike-fills' since 2026-11-18), no DataFusion — so vike-tradehub-core (and vike-run, since merged into it), which wanted nothing from vike-backtest except this client, stop compiling the simulator to get one."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain-stacked` — one
# hop over the domain band: a crate composed of layer-20 pieces. (This line still named `engine` and
# quoted its old role text until 2026-09-28, five days after the move recorded below.)
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
# ⚠ WAS `engine` (30) until 2026-09-23. Tier `domain-stacked` — one hop over the domain band, a
# crate composed of layer-20 pieces — which describes this one exactly: `vike-execution` (20),
# `vike-fills` (20) and `vike-model` (10), and nothing else. `engine` overstated it by a tier: this
# crate is no runtime and no simulator, it is a client that fills orders with the shared fill
# core's own primitives.
#
# The slack cost nothing while it lasted — the lowest consumer was `vike-backtest` (45 then), and that
# edge became a DEV one in the same change — so this is the 0085 correction rather than an
# unblocking: a rank follows what a crate DECLARES, not what it is called.
# docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
[package.metadata.vike]
layer = 25

[dependencies]
# The domain types (Event/OrderRequest/Fill/FeeSchedule/SymbolProperties/…) this client speaks.
vike-model = { path = "../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../vike-venues" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../vike-marketdata" }
# The `ExecutionClient` seam this crate implements, plus `ContingencyBook` (the OCO/OTO contingency
# fold the paper book applies). Down-only: vike-execution depends on vike-model alone.
vike-execution = { path = "../vike-execution" }
# THE POINT OF THIS CRATE'S EXISTENCE. "backtest == paper == live" is a law only while ONE
# definition of a fill exists, so the paper book fills with the ENGINE'S OWN primitives —
# `FillModelBar::fill_price`, `resolve_intrabar_fills`, `adverse_fill_price`, `broker_sim::commission`.
# Those now live in vike-fills, shared with vike-simulator's engine, which is exactly what makes this
# extraction safe: the two sides share a DEPENDENCY rather than a crate, so neither can drift.
# The opt-in market-impact slippage (`ExecutionClientPaper::with_slippage_terms`) is vike-fills' too:
# the backtest's ONE impact model (`vike_fills::market_impact::ImpactModelAlmgrenChriss`) and its market
# context (`vike_fills::market_impact::window_stats_before`), so a paper fill is charged what the
# simulator charges for the same fill and bars. It was vike-analytics' until 2026-11-18, which this crate
# named for it alone; since then no analytics is in this crate's closure.
vike-fills = { path = "../vike-fills" }
# Pure symbol-name functions the book asks before it accepts an order. `fiat_quote_of`: a symbol whose
# name says it is quoted in a fiat currency other than the book's one dollar ledger is refused in words
# (decision 0183), never booked at par. `is_inverse_contract` and `kept_contract_value`: a coin-margined
# contract is valued by the live law, or refused when only its row states its unit and no kept row of it is
# read (decision 0170).
# Down-only (layer 20 against this crate's 25) and free: it adds
# NO PACKAGE, vike-catalog's whole dependency set being crates this one already links or workspace
# members (vike-model, vike-venues, vike-marketdata, vike-utility, serde, serde_json).
vike-catalog = { path = "../vike-catalog" }
# Insertion-ordered maps for the resting book / per-symbol state: this repo's standing rule is
# IndexMap wherever iteration order can reach an f64 fold order, and the paper book's fills feed
# `Account`'s PnL accumulation. Already a workspace-pinned dependency.
indexmap = { workspace = true }

[dev-dependencies]
# The paper client's own unit tests drive vike-model's shared `OrderBrokerMock` / domain fixtures.
vike-model = { path = "../vike-model", features = ["test-support"] }
# test-only: the self-deleting scratch directories the two HALT suites mint their sentinels in
# (`crates/vike-paper/tests/paper_halt.rs`'s `sentinel_for`, and the inline one in
# `crates/vike-paper/tests/paper_halt_process_wide.rs`). They replace a pid-keyed
# `std::env::temp_dir()` path that leaked 4,957 `/tmp` directories on the CI box and flaked on PID reuse
# across the box's two test users — `sentinel_for`'s doc carries the measurement and the argument.
tempfile = { workspace = true }
# `vike_marketdata::test_support::quoted_bar` (the combo suites' quote-priced bar),
# `vike_execution::testing::pump` (the drain of the client's venue events through the engine's fold) and the
# event finders the unit tests share with other crates' (`vike_execution::testing::rejection`). Both
# crates are NORMAL dependencies above; these DEV edges only turn their `test-support` on, so the
# shipped graph and `Cargo.lock` are unchanged.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }
vike-execution = { path = "../vike-execution", features = ["test-support"] }
# `vike_catalog::hold_recorded_kept_lists`: the recorded binance and okx kept lists `src/client/inverse_tests.rs`
# holds in its process, the only rows a COIN-M or okx inverse face is read from. Same shape as the two above.
vike-catalog = { path = "../vike-catalog", features = ["test-support"] }

# The suites are ONE binary (a `mod` each); `paper_halt_process_wide` stays its own: it re-executes its own binary
# under `--exact <test>` in a child whose working directory is a synthetic project (its module doc).
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "paper_halt_process_wide"
path = "tests/paper_halt_process_wide.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`. This crate is unsafe-free.
[lints]
workspace = true
