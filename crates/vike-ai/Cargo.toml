[package]
name = "vike-ai"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "Headless in-app AI copilot: LlmClient (Anthropic + Cerebras over ureq) + the develop_strategy agentic loop that generates compile-validated, OOS-backtested Rhai strategies (Studio SP3, BYO key)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain-stacked` —
# one hop over the domain band: a crate composed of layer-20 pieces. This one is an `LlmClient` and an
# agentic loop that generates and compile-validates candidate strategies and hands each to the CALLER's
# out-of-sample backtester; it mounts no venue.
#
# 25 is the ARITHMETIC FLOOR, MEASURED 2026-11-22: the ceiling is `vike-rhai`, `vike-data` and `vike-catalog`
# (20); `vike-analytics` and `vike-alerting` (15) and `vike-model` (10) sit under it. Its only consumer is
# `vike-studio` (80). At 25, equal rank refuses it `vike-simulator`, `vike-bridge-core` and the hub clients by
# arithmetic, beside the NAMED thin-client fence (`crates/vike-ops/tests/architecture/named_run_closure_gate.rs`).
#
# ⚠ WAS `engine` (30) from 2026-09-28 until 2026-11-22, set by ONE edge, `vike-simulator` (25). That edge has
# been a DEV edge since 2026-11-10 (the compile check went broker-free), and 30 stood a rung above the floor
# until 2026-11-22: a rank above what a crate uses is permission for an edge it should not take.
# ⚠ WAS `engine-stacked` (35) from the simulator split (2026-09-27) until 2026-09-28, while
# `vike-simulator` held 30 — one rung over its own floor. `vike-simulator` dropped to 25 and took this crate's
# floor down with it.
# ⚠ WAS `research` (45) until the simulator split out of `vike-backtest` (2026-09-27,
# docs/decisions/0087-the-simulator-leaves-the-harness.md), and `service` (50) before that. The
# harness was this crate's ceiling, and it never used the harness: every simulator item it names
# is now `vike-simulator`'s. MEASURED at the split: its four normal vike edges were `vike-analytics` (15),
# `vike-rhai` (20), `vike-data` (20) and `vike-simulator` (then 30), so its arithmetic floor was 31 and
# `engine-stacked` (35) the nearest tier — the rank follows what the crate DECLARES
# (docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md), and nothing it declares
# is a harness any more.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 25

[dependencies]
vike-rhai = { path = "../vike-rhai" }
# ⚠ TOMBSTONE — `vike-simulator` stood here as a NORMAL edge until 2026-11-10, for ONE production use: the
# `OrderBrokerSimulator` type parameter the develop loop compile-validated each candidate with
# (`RhaiStrategy::<OrderBrokerSimulator>::compile`). It validates through the broker-free
# `vike_rhai::discover_params` now (the same compile and one top-level run), because this crate's one
# consumer is the Studio and the desktop links no engine (docs/decisions/0078's amendment of that day).
# A candidate's run was already the CALLER's (`OutOfSampleSlice` -> result; Studio's sends it to the backtest
# server as a Run's `RunSlice`). The tests' stand-in backtester still runs `StrategyEngine`: a DEV edge
# below. NOT `vike-backtest` either way (docs/decisions/0087).
# `metrics`, `overfit` (the deflated Sharpe the loop gates a candidate on) and
# `results::periods_per_year_for_interval` — named at their owner, the way every caller names them
# since the re-exports that once reached them through `vike_backtest::` were retired (0087).
vike-analytics = { path = "../vike-analytics" }
# The symbol-NAME reader (`foreign_fiat_quoted_list`) the authoring loop refuses a foreign-quoted
# symbol with: a candidate runs on one dollar ledger with no rate, so a yen
# series would be scored as dollars (decision 0183 item 13). Layer 20, depends on `vike-model`
# alone, and already in this crate's consumer's closure through `vike-backtest`: no new crate.
vike-catalog = { path = "../vike-catalog" }
# The library operates on `&dyn HistoryStore` + TimestampRange, and since the tests moved onto HistoryStoreMemory's
# real bar storage (the `test-support` enable in [dev-dependencies] below) NO target of this crate
# names the concrete HistoryStoreDataFusion (`vike-store`) — the whole Arrow/DataFusion tree stays out of
# `cargo test -p vike-ai`'s graph entirely.
vike-data = { path = "../vike-data" }
# The wall clock the trial ledger and the learnings store stamp with (`vike_model::now_ms`), in
# place of the crate's own copy of it (docs/decisions/0141; the owner approved this edge
# 2026-10-12). Layer 10, so it moves nothing in this crate's floor.
vike-model = { path = "../vike-model" }
# The trial ledger + learnings store (`ledger.rs`) persists as JSON, so `AgentResult`/`Trial`/
# `Learning` derive Serialize/Deserialize. Already a workspace dep in most crates here; nothing
# new enters the lockfile.
serde = { workspace = true }
serde_json = { workspace = true }
# The `tracing` FACADE only (library crate — only binaries call `vike_log::init`): the ledger is
# best-effort, so a missing/corrupt/unwritable file is exactly one `warn!` rather than a failed
# authoring run.
tracing = { workspace = true }
ureq = { workspace = true }
# The providers' HTTP agent, `vike_transport::http::blocking_agent_with_timeout` (4xx/5xx as responses, no redirect,
# the DNS resolver, the caller's timeout): the one spelling the webhook transport and the tradehub's Telegram poll
# share (decision 0299; it was vike-alerting's `no_redirect_agent`, this crate's only use of that crate). Layer 4,
# and it names no `vike-*` crate itself, so it adds nothing below it; no `websocket`.
vike-transport = { path = "../vike-transport" }

[dev-dependencies]
# Test-only: the stand-in for the backtest server the develop-loop tests hand the loop
# (`crates/vike-ai/src/agent/tests/support.rs`'s `sim`, a zero-fee `StrategyEngine` run over the held-out
# slice). A DEV edge since 2026-11-10 (see the tombstone above); nothing shipped links the simulator.
vike-simulator = { path = "../vike-simulator" }
# Test-only: the develop-loop tests build `Bar` fixtures to seed the store with. This crate's
# PRODUCTION code names no market-data and no domain type at all — it moved out of
# `[dependencies]` when `vike-marketdata` split from `vike-model`, and the measurement that found
# it is in `crates/vike-marketdata/src/lib.rs`'s module doc.
vike-marketdata = { path = "../vike-marketdata" }
# The trial-ledger tests still park their files under a real directory — the ledger is a real
# filesystem seam regardless of what backs the bars — so tempfile stays through the store switch.
tempfile = { workspace = true }
# Test-only store double: the develop-loop tests seed bars with `append_bars` and read them back
# through `HistoryStore::load_bars` — shapes `HistoryStoreMemory` now serves for REAL (in-memory bar
# storage behind `test-support`, matching HistoryStoreDataFusion's observable semantics), so
# `cargo test -p vike-ai` no longer compiles the Arrow/DataFusion tree at all.
vike-data = { path = "../vike-data", features = ["test-support"] }
# Test-only: `vike_log::loopback::redirecting_origin`, the one loopback 302 origin every no-redirect agent
# test dials (`test-support`). A DEV edge onto the std-only logging leaf; nothing ships it.
vike-log = { path = "../vike-log", features = ["test-support"] }

[lints]
workspace = true
