[package]
name = "vike-ai"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "Headless in-app AI copilot: LlmClient (Anthropic + Cerebras over ureq) + the develop_strategy agentic loop that generates compile-validated, OOS-backtested Rhai strategies (Studio SP3, BYO key)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `service` — a library
# composed over the engine crates, which is what this is: an `LlmClient` and an agentic loop over
# `vike-backtest`'s harness and `vike-script`'s compiler.
#
# ⚠ WAS `service-stacked` (55) until 2026-09-23, and the move releases pure slack rather than
# changing anything. MEASURED: this crate's three normal edges are `vike-script` (20), `vike-data`
# (20) and `vike-backtest` (45), so its arithmetic floor is 50 — and `service-stacked` was the
# wrong NAME besides, since nothing it names is a service. The rank cost nothing to hold because
# its only consumer is `vike-studio` (80), which is 30 rungs clear either way; what it cost was a
# tier table that did not describe its occupant.
# docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 50

[dependencies]
vike-script = { path = "../vike-script" }
vike-backtest = { path = "../vike-backtest" }
# Default surface only (NO hist-datafusion): the library operates on `&dyn HistStore` + TsRange,
# and since the tests moved onto MemHistStore's real bar storage (the `test-support` enable in
# [dev-dependencies] below) NO target of this crate names the concrete DataFusionHist — the whole
# Arrow/DataFusion tree stays out of `cargo test -p vike-ai`'s graph entirely.
vike-data = { path = "../vike-data" }
# The trial ledger + learnings store (`ledger.rs`) persists as JSON, so `AgentResult`/`Trial`/
# `Learning` derive Serialize/Deserialize. Already a workspace dep in most crates here; nothing
# new enters the lockfile.
serde = { workspace = true }
serde_json = { workspace = true }
# The `tracing` FACADE only (library crate — only binaries call `vike_log::init`): the ledger is
# best-effort, so a missing/corrupt/unwritable file is exactly one `warn!` rather than a failed
# authoring run.
tracing = { workspace = true }
ureq = { workspace = true }

[dev-dependencies]
# Test-only: the develop-loop tests build `Bar` fixtures to seed the store with. This crate's
# PRODUCTION code names no market-data and no domain type at all — it moved out of
# `[dependencies]` when `vike-marketdata` split from `vike-model`, and the measurement that found
# it is in `crates/vike-marketdata/src/lib.rs`'s module doc.
vike-marketdata = { path = "../vike-marketdata" }
# The trial-ledger tests still park their files under a real directory — the ledger is a real
# filesystem seam regardless of what backs the bars — so tempfile stays through the store switch.
tempfile = "3"
# Test-only store double: the develop-loop tests seed bars with `append_bars` and read them back
# through `HistStore::load_bars` — shapes `MemHistStore` now serves for REAL (in-memory bar
# storage behind `test-support`, matching DataFusionHist's observable semantics), so
# `cargo test -p vike-ai` no longer compiles the Arrow/DataFusion tree at all.
vike-data = { path = "../vike-data", features = ["test-support"] }

[lints]
workspace = true
