[package]
name = "vike-panels"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Shared egui trading widgets (chart-engine-free). The future home for reusable egui panels; today it holds only the DOM (depth-of-market) order-entry ladder + order-flow heatmap, moved verbatim out of vike-chart."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `ui-widget` — an egui widget / engine crate (no eframe/wgpu).
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 75

[dependencies]
vike-model = { path = "../vike-model" } # L2Book/Level/VenueCaps — the only types the DOM paints over
vike-ui-theme = { path = "../vike-ui-theme" } # the design system: tokens read from the installed appearance, and the component kit
egui = { workspace = true }

[dev-dependencies]
# Accessibility-tree tests over the REAL widget (`tests/dom_a11y.rs`). NO wgpu / NO snapshot —
# `Context::run_ui` is pure CPU, so these run on the GPU-less CI runners like any other test. See
# the workspace manifest's `egui_kittest` rationale.
egui_kittest = { workspace = true }
# `harness::type_ready` — the DOM draws icons, whose family only the app's bundled type binds, and
# kittest's build-time frame runs on egui's default fonts. The feature adds a module, no dependency,
# and the crate is already a normal dependency, so the lockfile's package set is unchanged.
vike-ui-theme = { path = "../vike-ui-theme", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`. This crate is unsafe-free.
[lints]
workspace = true
