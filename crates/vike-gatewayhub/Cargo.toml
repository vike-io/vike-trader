[package]
name = "vike-gatewayhub"
version.workspace = true
edition = "2024"
rust-version.workspace = true
# Test discovery is OFF: the binaries are the `[[test]]` rows below, and the top-level suites that are not a row keep
# their `tests/<suite>.rs` paths (every bridge page cites one) as modules of `server` or `trade`. A new `tests/*.rs`
# runs only once it is a `mod` of a row's root or a row of its own.
autotests = false
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the GATEWAY daemon: the one process that owns every connection to every roster venue (docs/decisions/0164). The datahub, and in a later wave the tradehub, reach a venue only through vike-gatewayhub-client; this daemon holds the sessions, the credentials and the request budgets. It boots (command line, loopback-only bind guard, shadow request budget), requires its hub keys and serves the venue lanes of the `data` feature to its clients until it is stopped; a build without that feature links no bridge and exits 2 saying so."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `daemon` — a headless top-of-graph binary: nothing may depend on it.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
# It is a sibling of `vike-datahub` and `vike-tradehub` at 65, and like them it never names the
# other two: `crates/vike-ops/tests/architecture/named_run_closure_gate/fences.rs`'s
# `GATEWAYHUB_FENCE` refuses the store, the collectors, the tradehub's mount and core, the paper exchange
# and the simulator in its closure by NAME.
[package.metadata.vike]
layer = 65

[features]
default = []
# The venue bridges and the clients built on them: everything the datahub used to link behind its
# `live-*`, `venue-*`, `backfill-serve`, `catalog-serve` and `options-serve` features, as ONE feature
# because this daemon serves every lane or none. A default build of this crate links no bridge.
data = [
    "dep:vike-binance", "dep:vike-bybit", "dep:vike-okx", "dep:vike-aster", "dep:vike-hyperliquid",
    "dep:vike-polymarket", "vike-polymarket/feeds", "dep:vike-deribit", "dep:vike-dukascopy",
    "dep:vike-fxcm", "dep:vike-oanda",
    # The strategy lane's additions (W10): the tick pump's ingest channel (`vike-execution`) and the three
    # credentialed-data bridges the lane serves besides oanda.
    "dep:vike-execution", "dep:vike-alpaca", "dep:vike-ctrader", "dep:vike-ig",
    # The data clients the arms are built on (`vike_bridge_core::data_client`: the `ws` engine of the text-WS venues,
    # the `bus` of dukascopy's and fxcm's price streams), WITHOUT `eip712` (`trade` turns that on): guard (E) holds
    # this lane's tree free of k256.
    "dep:vike-bridge-core",
    # The venue-address probe's GET and its verified TLS handshake (`src/url_probe.rs`).
    "dep:vike-transport",
]
# The TESTKIT (`src/testkit.rs`): scripted data and REST lanes and a loopback gateway, so ANOTHER crate's
# tests (the datahub's twin test) can dial a scripted gatewayhub with the real client crate. It needs no
# bridge, so it composes with `data` or stands alone. ⚠ ONLY a `[dev-dependencies]` edge may turn it on
# (`crates/vike-ops/tests/architecture/test_surface_gate.rs` refuses a shipped one). The forwards: the
# shared `vike_data::SinkCall` / `RecordingSink` double the kit's sink helpers are built on, the client
# crate's fake peers' fixtures the trade rig leases with (`fake_trade_peer::account`), one copy for both, and
# the scoped `vike_log::capture` and the record-less store writers the credential suites' test kit is built on
# (`vike_bridge_core::credential_fixture`, which this crate's suites and each venue's bridge plant through).
test-support = [
    "vike-data/test-support", "vike-gatewayhub-client/test-support", "vike-log/test-support",
    "vike-secrets/test-support",
]# **The TRADE half** (wave 2, W8 + W9b): the order and execution sessions - `src/trade/` (the `TradeLane` seam, the
# leases, the per-account event rings, the dispatch) and `src/server/trade.rs` (the wire adapter) - AND the
# venue half they drive, `src/trade/adapters/` (`TradeLaneBridge`, the arming table, the preflight probes, the
# adapter start; it left `vike-tradehub-core` in W9b). It links `vike-execution` (the `ExecutionClient`/
# `ReconcileClient`/`EventSender` seams the lane hands back), turns on the client crate's own `trade` feature
# (the wire mirrors, the cancel-intent conversions) and links the bridges WITH their exec halves: this
# daemon is the one process that signs an order. `vike-bridge-core` carries `eip712` because the
# book-identity record derives an EVM address (aster, hyperliquid). The three bridges that were optional
# in the tradehub stay optional behind this crate's `ibkr`, `fxcm` and `polymarket` features below; a build
# without one registers the venue `FeatureAbsent`. A default build is unchanged.
#
# ⚠ `trade` IMPLIES `data` (wave 2, W15b), and `ibkr`, `fxcm` and `polymarket` imply `trade`: the trade surface is
# mounted by the wire hook next to the data lanes (`gatewayhub_cli/wire.rs`'s `serve_wire` builds the lanes first and
# hands them to `serve_with_trade`), so a build with the trade half and no data half could not serve the trade
# surface at all and the daemon would exit 2 at start. `--features ibkr` alone is the old tradehub's spelling of
# "this venue", and it now builds a daemon that serves. The edge points ONE way: `data` stays free of the
# signers (the `datahub-all` guard (E) reads `--features data`).
trade = [
    "data", "dep:vike-execution", "vike-gatewayhub-client/trade", "dep:vike-bridge-core", "vike-bridge-core/eip712",
    "dep:vike-binance", "vike-binance/execution", "dep:vike-bybit", "vike-bybit/execution",
    "dep:vike-okx", "vike-okx/execution", "dep:vike-deribit", "vike-deribit/execution",
    "dep:vike-aster", "vike-aster/execution", "dep:vike-hyperliquid", "vike-hyperliquid/execution",
    "dep:vike-oanda", "dep:vike-ig", "dep:vike-dukascopy", "dep:vike-ctrader", "dep:vike-alpaca",
    "dep:vike-alerting",
    # IBKR's gateway probe (`vike_ibkr::gateway_watch`), the venue half of the link watch, with NO backend: the
    # `ibkr` feature below adds the umbrella (`ibapi` and the cpapi stack), so a build without it still has none.
    "dep:vike-ibkr",
    # vike:new-venue:row "dep:{crate}", # TODO(new-venue: {venue}): the bridge the `src/registry/trade.rs` row names; add its `execution` feature here once the bridge has one
]
# Arm the LIVE Polymarket venue (the A-S maker's native [0,1] price domain). The optional `vike-polymarket`
# edge with that crate's own `polymarket` feature (without which its exec plane is EMPTY, and which pulls the
# k256/keccak signing tree in). Also gates the registry row in `src/registry/trade.rs`. Orders still need
# the full gate stack (`flags.tradehub_live` + the account's key + `flags.poly_exec`) and egress through
# the Dublin SOCKS tunnel (US-geo-blocked otherwise).
polymarket = ["trade", "dep:vike-polymarket", "vike-polymarket/polymarket"]
# Arm the LIVE IBKR venue: the optional `vike-ibkr` edge with its `ibkr` umbrella (`ibkr-socket` +
# `ibkr-cpapi`), and the `#[cfg(feature = "ibkr")]` row of `src/registry/trade.rs`. OFF, a build registers
# ibkr `FeatureAbsent`, with no `ibapi` crate in the graph.
ibkr = ["trade", "dep:vike-ibkr", "vike-ibkr/ibkr"]
# Arm the LIVE FXCM venue: the optional `vike-fxcm` edge - whose own `fxcm` feature only lets `build.rs` try the
# shim compile - and the `#[cfg(feature = "fxcm")]` row of `src/registry/trade.rs`. The SDK is opened at RUNTIME
# (`crates/bridges/fxcm/src/transport/loader.rs`), so the feature adds no native link. OFF, fxcm is `FeatureAbsent`.
fxcm = ["trade", "dep:vike-fxcm", "vike-fxcm/fxcm"]

[dependencies]
# The wire this daemon serves. The PROTOCOL is `vike-gatewayhub-client`'s, as the datahub's is
# `vike-datahub-client`'s: the server imports the schema from the client crate, so there is one
# definition and no re-export. `data` is the data half, and every module of the client crate is
# behind it (the server imports the whole wire from there); naming it here is also what counts it as
# compiled by a lane (`xtask/tests/feature_lane_coverage.rs`). This edge is what carries the fences'
# proof that the walk can find the client crate from a real consumer.
vike-gatewayhub-client = { path = "../vike-gatewayhub-client", features = ["data"] }
# The live-data TUBE (decision 0167): the stream frames, the per-session bounded queue, the wire sink and
# the writer this daemon serves them with. Layer 22: no bridge, no transport crate.
vike-market-stream = { path = "../vike-market-stream" }
# The SHARED hub-protocol substrate: the HMAC-SHA256 nonce-challenge handshake over its domain
# separator (`auth`) and the length-prefixed frame codec (`frame`), in the crate BELOW both node
# protocols. This daemon authenticates its clients with its own domain and the existing read and
# write scopes. It names no vike-* crate, so the edge adds no package any graph did not carry.
vike-hub-protocol = { path = "../vike-hub-protocol" }
# The seams the daemon implements on the venues' side: `vike_data::DataClient`, the live sink and
# the source traits. The TRAIT crate only — this daemon names no `vike-store` (the fence above).
vike-data = { path = "../vike-data" }
# The domain types the wire carries.
vike-model = { path = "../vike-model" }
# The per-venue tables (`capabilities_for`, `rate_limits_for`, the credential-field table ...) that left `vike-model` (decision 0162): the request budgets are counted against them.
vike-venues = { path = "../vike-venues" }
# The `Instrument` and the `CatalogProvider` seam the daemon's catalog providers implement.
vike-catalog = { path = "../vike-catalog" }
# The option-chain snapshot the options verb carries. Layer 5, serde only; already in this graph through vike-model.
vike-marketdata = { path = "../vike-marketdata" }
# The STARTUP SEQUENCE's one owner (`docs/decisions/0155-every-command-line-is-read-by-clap-through-one-vike-util-cli-module.md`
# for the command line it sits beside): this root boots through it rather than re-spelling the order.
vike-boot = { path = "../vike-boot" }
# The settings TYPES the boot phases take by name. Already in this graph through vike-boot.
vike-config = { path = "../vike-config" }
# This root's OWN credential reads. ⚠ `vike-secrets`, NOT `vike-bridge-core`: the daemon is the one
# process that reads venue credentials (decision 0164, verdict 6), and it reads them through the
# credential store, never through the transport stack. Already in this graph through vike-boot.
vike-secrets = { path = "../vike-secrets" }
# The execution seams the trade lane hands back and the sessions drive (`ExecutionClient`, `ReconcileClient`,
# `EventSender` and its `event_channel`, the HALT predicate), OPTIONAL and behind `trade` and `data` (the
# tick pump's ingest channel). Layer 20, no bridge, no transport crate; `event_channel`'s own doc names this
# daemon as a production caller.
vike-execution = { path = "../vike-execution", optional = true }
vike-log = { path = "../vike-log" } # tracing-native logging init — the BIN calls vike_log::init (see crates/vike-log)
# The BUILD IDENTITY `--version` prints and the daemon logs on startup. A ZERO-dependency leaf.
vike-buildinfo = { path = "../vike-buildinfo" }
# The command line (decision 0155): derived with `clap::Parser` and read through `vike_utility::cli`
# (layer 3, the `cli` feature), the one argv layer every program shares.
vike-utility = { path = "../vike-utility", features = ["cli"] }
clap = { workspace = true }
# tracing facade for connection-boundary spans and events (the subscriber lives in vike-log).
tracing = { workspace = true }
serde = { workspace = true }        # derive on the daemon's own status DTOs
serde_json = { workspace = true }   # the frame payload codec at the decode site

# THE VENUE BRIDGES, optional and behind `data` (decision 0164: this daemon is the one process that
# owns every venue connection, so these edges LEFT `vike-datahub`, where the same rows sat behind its
# `venue-*`/`backfill-serve`/`catalog-serve`/`options-serve` features). Every row is the datahub's own,
# unchanged: the CEX and hyperliquid bridges FEEDS-ONLY (`default-features = false`: no signed REST
# client, no private user-data pump, no `websocket_auth`, no reconcile client, no signer in the closure),
# polymarket through its keyless `feeds` half (the default build of that crate is empty), the rest as
# the datahub linked them. The fence `GATEWAYHUB_FENCE` keeps `vike-store`, `vike-backfill`,
# `vike-recorder` and `vike-tradehub-core` out of this closure; a bridge is layer 40, below this daemon.
vike-binance = { path = "../bridges/binance", default-features = false, optional = true }
vike-bybit = { path = "../bridges/bybit", default-features = false, optional = true }
vike-okx = { path = "../bridges/okx", default-features = false, optional = true }
vike-aster = { path = "../bridges/aster", default-features = false, optional = true }
vike-hyperliquid = { path = "../bridges/hyperliquid", default-features = false, optional = true }
vike-polymarket = { path = "../bridges/polymarket", optional = true }
vike-deribit = { path = "../bridges/deribit", default-features = false, optional = true }
vike-dukascopy = { path = "../bridges/dukascopy", optional = true }
vike-fxcm = { path = "../bridges/fxcm", optional = true }
vike-oanda = { path = "../bridges/oanda", optional = true }
# W10 (strategy lane): the credentialed-data bridges (alpaca, ctrader, ig; oanda is above) the gatewayhub
# logs in to as the account a strategy trades. Optional edges enabled by `data` and nothing else. (`data` also
# turns on `vike-execution`, declared above for `trade`: the CEX tick pump's ingest channel is `event_channel`.)
vike-alpaca = { path = "../bridges/alpaca", optional = true }
vike-ctrader = { path = "../bridges/ctrader", optional = true }
vike-ig = { path = "../bridges/ig", optional = true }

# THE TRADE HALF'S BRIDGES (feature `trade`, wave 2 W9b): the exec halves the tradehub linked behind its registry,
# which moved here with the venue half (`crates/vike-gatewayhub/src/registry/trade.rs`). Same paths as the
# `data` rows above - one crate edge each, the `execution` feature turned on by `trade` - plus ibkr (behind this
# crate's `ibkr` feature), the signing tree of polymarket (behind `polymarket`) and the three bridges W10's
# strategy lane links above (ig, ctrader, alpaca), which `trade` turns on as well.
vike-ibkr = { path = "../bridges/vike-ibkr", optional = true }
# vike:new-venue:row {crate} = { path = "../bridges/{venue}", optional = true } # TODO(new-venue: {venue}): the bridge crates/vike-gatewayhub/src/registry/trade.rs names, turned on by the `trade` feature's scaffolded row
# The venue-adapter contract (`VenueAdapter`, `AdapterInputs`, `ClockDeclaration`...), the account-credential loaders
# and the net probe, WITH `eip712` (turned on by `trade`): `trade/adapters/book_identity.rs` calls
# `eth_address_from_private_key` to answer "which wallet does this account trade" for a `Named` declaration
# with EVM key suffixes. `data` names it too, without `eip712`, for `data_client::bus` (the dukascopy and fxcm
# streams). Every bridge above already depends on it; this names it where the moved code uses it.
vike-bridge-core = { path = "../vike-bridge-core", optional = true }
# `vike_paths::state_path::PROJECT_BIN_DIR`: the bin directory a bridge is handed as `ProcessPaths::bin_dir`
# (dukascopy's JForex jar, ctrader's token store), and `instruments_dir_beside`, the kept instrument lists the `data`
# wire hook hands the bridges. Layer 7, std only; already in this closure through vike-boot, so a PLAIN edge: an
# optional one behind `trade` left a `data`-only build unable to compile the wire hook.
vike-paths = { path = "../vike-paths" }
# The operator pager the hyperliquid API-wallet approval watch (`src/trade/adapters/agent_watch.rs`) tells through:
# `webhook_configs_from_env` over the store's alerting scope and `WebhookSink::try_deliver` (Telegram / the
# generic URL), the same two calls the `notify` verb makes. Layer 15, NO vike-* dependency in any build, and
# `ureq` is already in this closure through the bridges; behind `trade` because only the venue half alerts.
vike-alerting = { path = "../vike-alerting", optional = true }
# The venue-address probe (`src/url_probe.rs`, decision 0265 verdict 8) judges a base host by a TCP connect and a
# VERIFIED TLS handshake, no HTTP, and a resource by one GET: the generic network layer's agent and its one verified
# TLS config (`vike_transport::tls`, rustls on ring with the webpki roots, the config `vike-ctrader` wraps its socket
# with), decision 0299. Layer 4, no vike-* dependency, already in the `data` closure through vike-bridge-core, so the
# edge adds no package; optional and behind `data`, like the probe. No `websocket`: the probe dials no WebSocket.
vike-transport = { path = "../vike-transport", optional = true }

[dev-dependencies]
# `vike_log::capture::captured`, the workspace's ONE scoped `tracing` capture, which the OANDA lane's
# credential tests (`tests/lanes/oanda_credential.rs`) read the lines a read logs with. vike-log is already a
# NORMAL dependency above; this dev edge only turns its `test-support` on for test builds, so it adds
# no package and no shipped build compiles the capture.
vike-log = { path = "../vike-log", features = ["test-support"] }
# `vike_secrets::create_store` and the unjournalled account writers (behind its `test-support`), which
# plant a REAL settings database for the same tests. vike-secrets is already a NORMAL dependency above;
# this dev edge only turns the feature on for test builds.
vike-secrets = { path = "../vike-secrets", features = ["test-support"] }
# The workspace `tempfile` the credential tests plant their settings directory in (the pin the
# datahub's, backtest's and studio's store fixtures share). Dev-only, already in the lock.
tempfile = { workspace = true }
# The fold the moved roster tests drive: `make_engine*`, `AdapterEnv`, `run_startup_preflight` and the
# `VenueBackend` port, which the in-process test backend (`tests/trade_roster/support/local_backend.rs`,
# `src/trade/adapters/testutil.rs`) implements OVER `TradeLaneBridge`. ⚠ A DEV edge only: the gatewayhub's NORMAL
# closure holds no `vike-tradehub-core` (`GATEWAYHUB_FENCE` reads normal edges). `test-support` for its
# `VenueBackendScript`-adjacent doubles.
vike-tradehub-core = { path = "../vike-tradehub-core", features = ["test-support"] }
# The live market-maker smoke (`tests/lanes/market_maker_smoke.rs`, `#[ignore]`d, run by hand) mounts `SpreadMaker`
# on a local core fed by this daemon's own pump table. ⚠ DEV edges only, like the row above (which already carries
# `vike-core` into the test closure, so that edge adds no package): the NORMAL closure holds no `vike-core`
# (`GATEWAYHUB_FENCE`). The maker is the shipped strategy file (`strategies/market_making/spread_maker.rs`),
# compiled by the dev-only strategy-lab crate (`vike_strategy_lab::makers::spread_maker`): a DEV edge, which the
# layer gate refuses as a normal one.
vike-core = { path = "../vike-core" }
vike-strategy-lab = { path = "../vike-strategy-lab" }
# `vike_bridge_core::venue_adapter_fixture::{PlantedAdapter, PLANTED_DECLARATION}`: the one planted
# `VenueAdapter` the contract tests plant their rows from. `test-support` implies the `full` the normal edge
# carries; a dev edge's features reach no shipped binary.
vike-bridge-core = { path = "../vike-bridge-core", features = ["test-support"] }
# the planted-mount tests' exec doubles (`vike_execution::testing`) and the reconcile fakes.
vike-execution = { path = "../vike-execution", features = ["test-support"] }
# `DeribitOptionsProvider::with_book_summary_url` and the loopback stand-in `vike_deribit::options_fixture`
# (behind vike-deribit's `test-support`), which the options suite (`tests/lanes/rest_lane_surfaces.rs`) points
# the real lane at so the persistent provider's cache is observable with no network. vike-deribit is already an OPTIONAL normal dependency above with the same
# `default-features = false`; this dev edge only turns the test feature on for test builds, so it adds
# no package and no shipped build compiles the seam (`test_surface_gate` refuses a shipped one).
vike-deribit = { path = "../bridges/deribit", default-features = false, features = ["test-support"] }
# `vike_ibkr::testing::{IbkrTransportFake, ScriptedInbound}` and `run_execution_for_test` (behind vike-ibkr's `test-support`):
# the REAL IBKR bridge's exec loop over its no-gateway transport double, which `tests/trade/ibkr_reconnect.rs`'s
# `real_bridge` module drives under the gatewayhub's session (W14c B: the hold released by the bridge's own
# `ExecLink{up:true}`). vike-ibkr is already an OPTIONAL normal dependency above (`ibkr`); this dev edge only turns
# the test feature on for test builds, so it adds no package and no shipped build compiles the seam.
vike-ibkr = { path = "../bridges/vike-ibkr", default-features = false, features = ["test-support"] }
# `vike_fxcm::test_support::{offer, PanicsFirst}`, the scripted Offers pieces the price-stream tests
# (`src/data/session_guard_bus_tests.rs`) share with the bridge's own. vike-fxcm is already an OPTIONAL normal
# dependency above (`fxcm`); this dev edge only turns the test feature on for test builds, so it adds no package
# and no shipped build compiles it.
vike-fxcm = { path = "../bridges/fxcm", features = ["test-support"] }
# `vike_oanda::test_support::{row, currency}`, the docs-shaped instrument rows the facts tests
# (`src/trade/adapters/symbol_facts_oanda_grid_tests.rs`) share with the bridge's grid tests. vike-oanda is already
# an OPTIONAL normal dependency above; this dev edge only turns the test feature on for test builds.
vike-oanda = { path = "../bridges/oanda", features = ["test-support"] }
# `vike_dukascopy::test_support::{Wire, attached}`, the recording sidecar pipe and attached bus the price-lane tests
# (`src/data/session_guard_bus_tests.rs`, `src/trade/adapters/assumed_currency_tests.rs`) share with the bridge's own.
# vike-dukascopy is already an OPTIONAL normal dependency above; this dev edge only turns the test feature on.
vike-dukascopy = { path = "../bridges/dukascopy", features = ["test-support"] }
# Self-referential dev-dep (the `vike-bridge-core` idiom): turns the `test-support` TESTKIT on for THIS
# crate's own `tests/` targets (an integration test compiles the lib without `cfg(test)`), which is also
# what counts the feature as compiled by a lane (`xtask/tests/feature_lane_coverage.rs`, rule 3). A
# normal or build edge never carries it.
# `trade` and the three optional venues ride the same edge, so a plain test run compiles and runs this daemon as it
# ships (`crates/vike-backend/Cargo.toml`'s `vike-gatewayhub` row), and the features count as compiled by a lane (the same
# rule 3). CI tests each hub once, in that configuration (decisions 0131 and 0132, as amended 2026-11-06):
# `xtask/tests/ci_plan_gate/roster_features.rs` holds this line, because dropping one word compiles tests out in silence.
vike-gatewayhub = { path = ".", features = ["test-support", "trade", "ibkr", "fxcm", "polymarket"] }
# `vike_marketdata::test_support`: the shared bar/tick builders. A DEV edge only; the normal edge
# above already exists, so no lockfile entry.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }

# The SCRIPTED daemon (`src/testkit/scripted_daemon.rs`): the real server over a scripted polymarket lane, as a
# PROCESS the agent-evaluation world spawns (it can only spawn binaries). TEST SUPPORT: built only where the testkit
# is, which every test build of this crate turns on (the self dev edge above) and no release build does. The shipped
# `src/bin/vike-gatewayhub.rs` is still auto-discovered beside it.
[[bin]]
name = "vike-gatewayhub-scripted"
path = "src/bin/vike-gatewayhub-scripted.rs"
required-features = ["test-support", "data"]

# The two group binaries: `server` (with `tests/testkit.rs` and `tests/hop_latency.rs` as members) and `trade` (with
# `tests/trade_order_client_id_lookup.rs`). They stay TWO, not one: each is a large crate of its own (about 8,000 and
# 9,500 lines), and as one binary they compiled one after the other, measured slower than in parallel.
[[test]]
name = "server"
path = "tests/server.rs"

[[test]]
name = "trade"
path = "tests/trade.rs"

# The roster tests that moved with the venue half (wave 2, W9b): they drive the REAL bridges' arming, preflight
# probes and adapter start, so they run where the registry is. They are ONE binary, `trade_roster`
# (`tests/trade_roster/main.rs`), so the helpers every member used to `#[path]`-include compile once. nextest gives every test its own process,
# which the process-exclusive claim and the HALT resolver need (`main.rs`'s module doc). `server_time_smoke`
# (a live smoke) stays its own binary: it shares no helper.
[[test]]
name = "trade_roster"
path = "tests/trade_roster/main.rs"

[[test]]
name = "server_time_smoke"
path = "tests/trade_roster/server_time_smoke.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is the
# sole crate that does NOT inherit this.
[lints]
workspace = true
