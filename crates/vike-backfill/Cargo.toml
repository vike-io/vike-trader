[package]
name = "vike-backfill"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — backfill glue: ingest venue and vendor history into the DataFusion hist store (vike-data); the venue FETCH lives in each bridge crate now, dispatched by the datahub. The historical-backfill counterpart to those bridge crates' own live DataClient feeds (slice 6)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs).
#
# ⚠ **It declared 55 `service-stacked` until 2026-09-20, and that was an ARTEFACT of two bins.**
# The note here read: "its own highest normal vike-* dep is vike-backtest (50), so 55 is the honest
# floor" — true as arithmetic, and the premise was the defect. That dep existed only for
# `poly_ch_backtest` and `poly_mm_batch`; with both gone the highest remaining dep was aster (41),
# and the floor became 42. What the old rank COST is not tidiness: `vike_data::store::archive_store` was
# held here, so `vike-backtest` could not open it, which is why `poly_ch_backtest` existed at all
# and called itself "the leaf binary that can depend on it directly".
#
# The earlier history stays true and is why the crate was never a `daemon` either: it sat at 65
# until the split-plane backfill-on-demand verb made vike-datahub (65) a consumer, and the label had
# already stopped describing the crate rather than its bins.
#
# 42 → 30 on docs/decisions/0094: the venue adapters moved into their bridges and the registries
# into the datahub, so this crate names no bridge. Its ceiling is `vike-bridge-core` (25), reached
# only by the vendor programs' credential loading; 25 follows when those programs route through the
# datahub (CLI spec §11 P4).
[package.metadata.vike]
layer = 30

[dependencies]
vike-model = { path = "../vike-model" }
# The hist store: force the DataFusion+Parquet backend on — vike-backfill's whole job is to ingest
# into it, so the feature is not optional here (default-feature vike-data has no append target).
vike-data = { path = "../vike-data", features = ["hist-datafusion"] }
vike-log = { path = "../vike-log" } # tracing-native logging init (see crates/vike-log)
# `vike_boot::log_file_level` — every bin's rolling-log level is the `preferences.log_file_level`
# row (decision 0111, verdict 3), read before `vike_log::init` (`cli::log_config`). It brings the
# settings loader and the store reader (vike-config, vike-secrets with rusqlite), which the vendor
# features already link through vike-bridge-core; no transport stack.
vike-boot = { path = "../vike-boot" }
tracing = { workspace = true }      # tracing::info! at startup (subscriber lives in vike-log)
# Shared by the EOD (stooq/Yahoo HTTP) + pmxt (archive Parquet) backfill collectors, non-optional:
# EOD Yahoo v8 chart JSON + pmxt bids/asks JSON column decode (pmxt/map.rs, not feature-gated).
serde_json = { workspace = true }
# Derive on the vendor JSON the archive/events/cohort collectors decode (`events_api.rs`,
# `vike_archive.rs`, `vikedata/`). serde is already in this crate's transitive tree via vike-data
# (this crate names no bridge crate any more, docs/decisions/0094); this just names it directly so
# the derives are available here.
serde = { workspace = true }
# blocking HTTP GET (rustls): EOD sources (stooq/Yahoo) + pmxt hour-part download.
ureq = { workspace = true }
# pmxt archive ingest (pmxt/ingest.rs): the Parquet row-group reader (bounded memory) reads through
# datafusion's re-exported `arrow`/`parquet` — same import paths as vike-data's datafusion_hist.
datafusion = { workspace = true }
# The canonical credential loader (`vike_bridge_core::credentials`), called by the vendor BINS alone
# — databento/tardis/vikedata/vike_archive/events_api read their API keys through it — and pulled in
# only by the vendor features that build them (`databento`, `tardis`, `vikedata`, `vike-archive`).
# The library names nothing in it, so a default vike-backfill build compiles none of it. ⚠ It was
# also here for `StreamHealth`, the pump watchdog the `poly_reparse` drive fed, until
# docs/decisions/0094 deleted that re-parse.
vike-bridge-core = { path = "../vike-bridge-core", optional = true }
flate2 = { workspace = true, optional = true }
# Parallel fan-out. Behind `vike-archive`, which uses it for the row-group ingest; it was ALSO
# behind `poly-ch-backtest` for the poly_mm_batch sweep until that bin left for vike-poly-research
# on 2026-09-20.
rayon = { workspace = true, optional = true }
# ⚠ **THE `vike-backtest` EDGE IS GONE (2026-09-20), and removing it is the point of this change.**
# It was optional and behind `poly-ch-backtest`, carried for two bins that both left: the engine
# opens an archive day itself now (`backtest --archive`) and the MM research sweep moved to
# `vike-poly-research`. While it existed, this crate — a COLLECTOR that drives the venue bridges and
# writes the store — had to declare a layer ABOVE the simulator, so the simulator could not reach a
# store held here. That is the inversion the whole change exists to undo.
# vike.io archive backfill (vike-archive feature): `bytes::Bytes` is what `parquet::file::reader::
# ChunkReader::get_bytes` returns — needed to implement that trait over a ranged-HTTP reader
# (`vike_archive::HttpRangeReader`). Already resolved in the lockfile transitively (ureq's `http`
# crate + `datafusion-datasource-parquet`); optional so a default build never compiles it.
bytes = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
# serde_json is a regular dependency now (see pmxt/map.rs above), so it needs no separate
# dev-dependency entry for the tests that use it here.

[[bin]]
# Databento historical HTTP API backfill; only built under the `databento` feature.
name = "databento_backfill"
required-features = ["databento"]

[[bin]]
# Tardis datasets backfill; only built under the `tardis` feature.
name = "tardis_backfill"
required-features = ["tardis"]

[[bin]]
# data.vike.io cohort-metrics backfill (kind=cohort); only built under the `vikedata` feature.
name = "vikedata_backfill"
required-features = ["vikedata"]

# ⚠ `poly_ch_backtest` STOOD HERE and is DELETED (2026-09-20), with its cause rather than instead of
# it. It ran a BacktestProfile over whichever store the selector chose, and it lived in THIS crate
# — its own doc said so — "because the store it points at does, and vike-backtest must never depend
# on vike-backfill: this is the leaf binary that can depend on it directly". That is a workaround
# around an inverted arrow: a collector ranks above the venue bridges it drives, so a store held
# here sat above the engine. The store moved DOWN to vike-data, and `vike-backend backtest
# --archive PATH` now does the same job from the engine itself, with the whole profile/registry/
# report machinery it always shared. Operators typing the old name get a missing binary, not a
# silently different answer.
# ⚠ `poly_mm_batch` STOOD HERE and MOVED on 2026-09-20 to its own crate, `vike-poly-research`
# (layer 55). It is a RESEARCH sweep over market-making models, not a data job, and holding it here
# is what forced the optional `vike-backtest` edge onto this crate — which parked a COLLECTOR above
# the engine. That edge goes with it.

[[bin]]
# data.vike.io archive backfill (Polymarket L2 book_events/trades/l1_quotes, date-partitioned
# Parquet); only built under the `vike-archive` feature (needs the ranged-HTTP ChunkReader tree +
# vike-bridge-core's credential-store loader).
name = "vike_archive_backfill"
required-features = ["vike-archive"]

[[bin]]
# data.vike.io LIVE events API backfill (paged JSON /v1/events, one token at a time — no
# ClickHouse, no multi-GB day-file download). Shares the `vike-archive` feature with the sibling
# bulk-Parquet bin above (same auth/credential-store plumbing; no new feature).
name = "events_api_backfill"
required-features = ["vike-archive"]

[features]

# Databento historical HTTP API backfill into the DataFusion store (databento_backfill bin).
# Raw HTTP over the existing `ureq`. Pulls vike-bridge-core only for the canonical credential loader
# (`credentials::load_workspace_secrets_scoped_from_env`, the single credential authority). ⚠ That
# is a real edge now, not a free one: this crate names no bridge any more (docs/decisions/0094), so
# vike-bridge-core reaches its tree ONLY through the vendor features that enable it — this one and
# its three siblings below — and a default build compiles none of it.
# The BIN reads `DATABENTO_API_KEY` and passes it in; the adapter takes no env dependency of its
# own (settings STEP 2 — the same shape the vike-archive note below already describes).
databento = ["dep:vike-bridge-core"]

# Tardis downloadable-CSV datasets backfill into the DataFusion store (tardis_backfill bin).
# Reuses flate2 for the .csv.gz decode; vike-bridge-core for the canonical credential-store loader
# (see databento note above).
tardis = ["dep:flate2", "dep:vike-bridge-core"]

# data.vike.io COHORT METRICS backfill into the DataFusion store (vikedata_backfill bin): the
# `kind=cohort` graded positioning panel, paged by cursor over the existing `ureq` (no new HTTP
# stack — `deny.toml`'s [bans].deny is a merge gate on that) and decoded with the `serde_json` this
# crate already carries unconditionally. `dep:vike-bridge-core` for the canonical credential-store
# loader, exactly as the databento/tardis notes above describe — the BIN reads VIKE_API_KEY (and
# its `--api-base`) and passes both in; the library takes them as parameters and reads no environment.
#
# ⚠ Deliberately NOT folded into `vike-archive`, which is the SAME VENDOR: that feature is the
# Polymarket L2 lane (a ranged-HTTP Parquet ChunkReader plus the live events API) and pulls
# `dep:bytes` and `dep:rayon` for it. This lane needs neither, and sharing a feature would make a
# cohort-metrics build compile the archive's Parquet tree for nothing.
vikedata = ["dep:vike-bridge-core"]

# ⚠ TOMBSTONE — the feature this paragraph describes, and both of its bins, are DELETED (the ⚠ at
# its end says how); the present tense below is the record of what it was.
# The Polymarket backtest drivers (poly_ch_backtest, poly_mm_batch): the #691 callers — they point
# the harness' `run_backtest` at recorded Polymarket L2 so a BacktestProfile replays it. Pulls the
# vike-backtest harness (its own `hist-replay` feature). ⚠ This said "the ClickHouse store type
# itself is always compiled (backtest_bridge is a plain module); this only adds the driver bins" —
# that module is DELETED (2026-09-20) and there is no ungated store left to be always-compiled.
# `vike-archive` is pulled in because BOTH bins' `--archive` arm reads the downloaded archive
# Parquet in place through `archive_store::ArchiveParquetHistStore`, and their shared selector
# `vike_data::store::backtest_store` names that type, so both live behind that feature. ⚠ Since 2026-09-19 this
# is not an optional extra: naming no store flag is a REFUSAL rather than a ClickHouse default, and
# since the deletion `vike-archive` (plus `--store`) is the ONLY thing that gives these bins a store
# at all rather than the cheapest one. It still costs
# nothing beyond what this lane carries: `vike-archive` adds only `bytes`/`vike-bridge-core`/`rayon`,
# and two of the three are already here regardless (rayon on this very line, vike-bridge-core via
# databento/tardis) — `bytes` is the one crate this feature alone turns on, already resolved in the
# lockfile transitively (see the archive note below), so it costs nothing extra to fetch or vet.
# Depending on it rather than adding a CI lane means the existing
# `backfill` union suite covers the `--archive` arm with no workflow change.
# ⚠ `poly-ch-backtest` was DELETED here on 2026-09-20 with both bins it gated. What it actually
# bought was `dep:vike-backtest` — the harness — on a data crate.

# data.vike.io archive backfill (vike_archive.rs + vike_archive_backfill bin): a ranged-HTTP
# `parquet::file::reader::ChunkReader` reads ONLY the footer + row-group-pruned column chunks of
# each date-partitioned Parquet file over `X-API-Key`-authed `ureq` GETs — never the whole 7.4 GB/day
# file. `dep:bytes` for the `ChunkReader::get_bytes` return type; `dep:vike-bridge-core` for the
# canonical credential-store loader (see databento/tardis notes above) — the BIN reads
# `VIKE_ARCHIVE_API_KEY` and passes it in, the library itself takes no env dependency. `dep:rayon`
# fans the `--file` local-ingest path's row groups across a bounded worker pool
# (`ingest_local_file_parallel`, `--jobs N` on the bin) — the HTTP path is untouched (already
# solved by row-group pruning + `--file`, see the module doc).
vike-archive = ["dep:bytes", "dep:vike-bridge-core", "dep:rayon"]

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
