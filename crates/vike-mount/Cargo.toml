[package]
name = "vike-mount"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the GENERIC venue mount: the fold every venue's ExecutionEngine is built through (arming ceiling, arming probe, pre-connect budget, process-exclusive claim, the bridge's own mount, the paper fallback, the startup preflight). Names no venue: each bridge implements vike_bridge_core::venue_mount::VenueMount, and vike-tradehub's registry lists them."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `engine` — one hop
# over the domain-stacked band: its highest normal vike-* edges are vike-bridge-core and
# vike-paper (25). It was `mount` (60) until the venue mount contract finished
# (docs/decisions/0096): with every bridge dependency gone, nothing above 25 is left.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 30

[dependencies]
# the domain types engine construction names (SymbolProperties, now_ms/now_us)
vike-model = { path = "../vike-model" }
# `fee_lane`: the `.P` spot-vs-perp split applied to the FEE table's key. binance/aster route EXEC on
# that suffix, so `make_engine` must resolve the LANE before reading `fee_schedule_for` — keying it
# off the bare venue string filled every perp paper book at SPOT fees. Adds no external package:
# vike-catalog depends on vike-model alone.
vike-catalog = { path = "../vike-catalog" }
# ExecutionEngine/ExecutionClient/RiskGate/RiskLimits/Account/EventSender + the recon::ReconClient seam
vike-exec = { path = "../vike-exec" }
# DEFAULT features (trait surface only — NO hist-datafusion, so no Arrow/DataFusion tree through
# this edge): this crate names just the UNGATED `PropertiesRecorder` TYPE (it holds only
# `Arc<dyn HistStore>`), carried to every bridge's mount as `MountRequest::properties_rec`. The
# recorder is CONSTRUCTED by the calling BINARY (`PropertiesRecorder::open_from_env` names the concrete
# `DataFusionHist` and is gated on hist-datafusion, which vike-app's `fat` and vike-tradehub's
# `record-feeds`/`materialize` builds carried until they were deleted on 2026-09-09 and
# 2026-09-22) and RECEIVED here via `make_engine`'s `properties_rec` parameter — libraries take
# configuration as parameters; only binaries open stores. A binary without the backend passes
# `None`, byte-identical to the recorder's own disabled path — which is every caller today
# (`crates/vike-tradehub/src/tradehub_cli.rs`'s `properties_rec` is always `None`).
vike-data = { path = "../vike-data" }
# The TYPED settings model (settings-unification Phase 6c). This crate is the venue composition
# root, so it is where a machine's hard ceilings must actually REACH a venue — before this edge
# existed the whole `vike-config` tree had no consumer below the order-preview surfaces, and
# #1051's `spawn_with_market_slippage` seam had nothing to feed it. `src/policy.rs` owns the ONE
# projection (`MountPolicy`), so "which Policy fields does the mount apply?" has a single home and a
# compile-time completeness gate. Zero new EXTERNAL packages: vike-config is a leaf over vike-model
# + serde + toml, all already in this crate's tree. ⚠ This crate NEVER loads the settings — the
# BINARY does (`vike_config::load` takes the env as a MAP) and passes the projection in.
vike-config = { path = "../vike-config" }
# `vike_secrets::venue_setting::VenueSettings` — the snapshot `MountPolicy::venue_settings` carries
# and every bridge receives as `MountInputs::settings`. Named by its module path, never re-exported.
# No new package: vike-secrets is already in this tree through vike-bridge-core.
vike-secrets = { path = "../vike-secrets" }
# the venue mount contract (`venue_mount`), `AccountDirectory`, the credential loaders and `halt`.
# ⚠ `eip712` is spelled EXPLICITLY: `book_identity.rs` calls `eth_address_from_private_key` to
# answer "which wallet does this account trade" for a `Named` declaration with EVM key suffixes, and
# that primitive is feature-gated. It used to arrive through the aster bridge's `exec`; with no
# bridge edge left, this line is what turns it on here. It adds no package: every build that linked
# this crate before the venue mount contract finished carried it through that bridge, and
# `vike-tradehub`, which names the bridge, still does.
vike-bridge-core = { path = "../vike-bridge-core", features = ["eip712"] }
# the paper exchange the live gate falls back to when a venue's credentials are absent.
# THIS LINE USED TO READ `vike-backtest`, which owned the same module. All 12 call sites in this
# crate named `vike_backtest::paper::…` and NOTHING else from it, so the entire simulator — engine,
# harness, analytics — was compiled here to obtain one `ExecutionClient`. vike-paper carries the
# identical client (it fills with the shared vike-fills core the engine itself uses, so
# backtest == paper still holds BY CONSTRUCTION) over vike-model + vike-exec + vike-fills alone.
vike-paper = { path = "../vike-paper" }
# the fold warns at each venue's live/paper decision boundary (never per-message)
tracing = { workspace = true }
# the Account per-symbol contract-multiplier grid is an IndexMap (its insertion order is part of
# Account's f64 fold order — the repo-wide IndexMap-not-HashMap rule)
indexmap = { workspace = true }

# `src/startup.rs`'s `free_space_bytes`: the startup preflight's DISK-HEADROOM leg, which was
# configured with no directories and never called until this edge existed. `rustix::fs::statvfs` is
# a SAFE wrapper, so the leg costs no `unsafe` and no lint exemption in a crate every live mount
# folds through. Target-scoped: rustix's statvfs is POSIX-only, and the Windows half of
# `free_space_bytes` declares a reason instead of measuring. The root manifest carries the
# supply-chain argument (it adds zero packages on Linux).
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
# test-only: `tests/halt_paper_live_agree.rs`'s `drain_ingest` drains a client's
# tokio::sync::mpsc Ingest receiver within a bounded wait.
tokio = { workspace = true }
# test-only: `src/account_event_lane_tests.rs` serializes a delivered `AccountState` to pin the
# default account's payload byte for byte. It was a NORMAL dependency while `src/server_time.rs`
# parsed venue clock bodies; those parses live in their bridges now.
serde_json = { workspace = true }
# test-only: the self-deleting scratch directory each HALT sentinel is minted in
# (`crates/vike-mount/tests/halt_paper_live_agree.rs`'s `unique_sentinel`). It replaces a pid-keyed
# `std::env::temp_dir()` path that leaked 17,696 `/tmp` directories on the CI box and flaked on PID reuse
# across the box's two test users — that helper's doc carries the measurement and the argument.
tempfile = "3"

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
