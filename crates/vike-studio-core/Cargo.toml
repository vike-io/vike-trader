[package]
name = "vike-studio-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "Headless Studio backend: the Run pipeline (compile→backtest→score) + starter templates, extracted from vike-studio so a headless MCP server / AI loop can reuse it without egui (Studio SP3)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `service` — a library
# composed over the engine crates.
# ⚠ WAS `service-stacked` (55) until 2026-09-23, and it moved because what it was STACKED ON moved:
# its ceiling is vike-backtest, which went to `research` (45). `service-stacked` describes a service
# over another SERVICE, and the thing under this one is no longer one — so the rank follows rather
# than the tier being re-worded.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 50

[dependencies]
vike-script = { path = "../vike-script" }
# `hist-replay` brings BOTH halves of the native-strategy path: the `harness` module (the
# name -> `Box<dyn Strategy<SimBroker>>` registry a Studio "Native" run resolves through, plus the
# bounded sweep pool `map_bounded` its parallel sweep enters rayon by) and `hist_replay`
# (`replay_ticks`, which a `SliceKind::Ticks` slice routes to instead of `load_bars`). The feature
# is TRAIT-ONLY (the datafusion-store decouple — see vike-backtest's Cargo.toml), so it adds no
# native or heavy dep here.
vike-backtest = { path = "../vike-backtest", features = ["hist-replay"] }
# Default surface only (NO hist-datafusion): the Run pipeline operates on
# `StoreHandle = Arc<dyn HistStore + Send + Sync>` (split-plane B12) and the concrete DataFusionHist
# is named only under #[cfg(test)], so the feature enable lives in [dev-dependencies] below (vike-ai/
# vike-report's lib-default/dev-feature pattern) — a default build of this crate is DataFusion-free
# (split-plane I7; the `studio-standalone` suite in scripts/ci_feature_suite.sh is the gate).
vike-data = { path = "../vike-data" }
# The WIRE DTOs the compute-to-data boundary converts (`src/wire_run.rs`, moved here from
# `vike-datahub` by ruling 7 of
# `docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md`) plus the
# `StudioRunTable` type that boundary fills for `vike-backend backtest --addr`. Layer 30 against
# this crate's 55, so it is downward like every other edge here, and it is DataFusion-FREE by
# construction — its own `vike-data` edge takes DEFAULT features — so it cannot break the
# `studio-standalone` lane's structural check that this crate's default normal-dep tree carries no
# datafusion crate. It adds no package the workspace does not already build for `vike-studio`, which
# depends on it directly.
vike-datahub-client = { path = "../vike-datahub-client" }
# `fee_lane` — and ONLY for that, which is why the edge is worth stating rather than assuming.
# `src/cost_model.rs` derives a run's fee schedule from the slice the Studio's DTO door already
# carries, and `vike_model::fees`' `fee_schedule_for` forbids its own key being a bare venue string:
# binance and aster each front a SPOT and a PERP lane behind one id, selected by a trailing `.P` on
# the symbol, and the two are priced differently. `fee_lane(venue, symbol)` owns that split. Keying
# off `WireSlice::venue` alone would charge a perp slice the spot rates — the exact bug the lane
# sub-key rows exist to fix, and a RANKING under it is worse than a scaling under it because the
# maker/taker asymmetry differs per lane.
#
# Layer 20 against this crate's 55, so it is downward like every other edge here.
#
# ⚠ **Cost in the dependency graph: ZERO crates — including vike-catalog itself.** MEASURED, not
# reasoned about, by diffing `cargo tree -p vike-studio-core -e normal --prefix none` (and
# `-p vike-studio`) across the commit that adds this line: 146 crates before, 146 after, and no
# `^datafusion` in either. The crate was ALREADY in this tree twice over — `vike-backtest` names it
# in `[dependencies]` (its own manifest records the move, for `[engine.fee] kind = "venue"`), and so
# does `vike-datahub-client`. So this edge buys the right to SAY `vike_catalog::fee_lane` and
# nothing else; a crate must declare what it names.
#
# ⚠ Decision record 0063's own estimate was "exactly one crate", read off a stale comment that
# still called vike-backtest's edge dev-only. The measurement is cheaper than the record expected;
# it is written here rather than there because the manifest is where this file's other edges are
# argued, and because two earlier versions of the vike-user-research comment below claimed a count
# and both were wrong. The `studio-standalone` lane in scripts/ci_feature_suite.sh greps that same
# default normal-dep tree for `^datafusion` and is what would catch a wrong answer.
vike-catalog = { path = "../vike-catalog" }
# The INFERENCE half of the model crate, and nothing else follows it in: `cargo tree -p vike-ml -e
# normal` is `vike-ml -> vike-model`, which this crate already takes on the line below, so the whole
# cost of this edge in the dependency graph is ZERO new crates. That mattered enough to check before
# adding it — `crates/vike-app/Cargo.toml` links vike-studio (and so this crate) UNCONDITIONALLY in
# both the `fat` and `thin` builds since split-plane I7, so anything vike-ml dragged would land in
# the `--observe`-only client too. It also cannot disturb the `studio-standalone` lane's
# DataFusion-free tree check (`scripts/ci_feature_suite.sh`), for the same reason: no new crate.
#
# Deliberately NOT `features = ["test-support"]`: `crates/vike-ml/src/test_support.rs` is a learner
# DOUBLE, and a shipped build must compile none of it. Nothing here fits a model anyway — see
# `crates/vike-studio-core/src/ml.rs`'s module doc for why the surface stops at inference.
vike-ml = { path = "../vike-ml" }
vike-model = { path = "../vike-model" }
# THE JOIN (supersedes docs/decisions/0082): `run.rs`'s `build_strategy` `StrategySpec::Plugin` arm
# `dlopen`s `<project>/user_data/plugins/<name>-<sha>.so` and wraps the handle as an ordinary
# `Strategy<SimBroker>`. 0082 recorded the ABSENCE of this exact line — "`vike-studio-core` declares
# no dependency on `vike-strategy-plugin` (only a comment names it)".
#
# Layer 41 against this crate's 55, so it is downward like every other edge here. It costs ZERO new
# crates in the dependency graph: that crate's whole normal dependency table is `vike-model` +
# `vike-marketdata`, both already in this crate's tree (vike-marketdata through vike-model itself),
# and it carries nothing DataFusion-shaped — so the `studio-standalone` lane's structural grep of
# this crate's default normal-dep tree for `^datafusion` is untouched.
#
# ⚠ The `unsafe` stays QUARANTINED on the other side of this edge. That crate is the workspace's
# third `unsafe_code = "forbid"` exemption; this one inherits the forbid and names only the safe
# face (`loader::load`, `host::PluginStrategy`), which is the containment its own module doc argues
# for — "nothing above it sees `unsafe`".
vike-strategy-plugin = { path = "../vike-strategy-plugin" }
# The compiled user-STUDY HOST (layer 35), and the home of the STUDY CONTRACT —
# `StudyContext` / `StudyOutcome` / `StudyError` / `StudyLearner`. Both study tiers reach it from
# here: `study_run.rs` resolves a COMPILED study through its generated registry, and
# `src/rhai_study/` registers those same contract types as Rhai custom types so an INTERPRETED
# study satisfies the identical entry contract (R7: rhai OR rust, the author's choice).
#
# The edge goes DOWN and it is the only direction available, for BOTH tiers:
#   * run persistence lives in `vike-backtest` at 50, so nothing at or below the study host can
#     mint a run — `docs/decisions/0031-the-study-runner-lives-above-run-persistence.md`;
#   * `vike-script` (30) would be the obvious home for the interpreted tier, beside `RhaiStrategy`,
#     but 30 may not name 35, and moving the contract types down would undo
#     `crates/vike-user-research/src/lib.rs`'s argument for where they live.
# This crate is therefore the lowest one that can host either.
#
# It costs exactly ONE crate in the dependency graph — itself — and NO datafusion. Every entry in
# that manifest is already in this crate's normal tree: vike-model, vike-ml and vike-data (DEFAULT,
# trait-only) are named right here, and vike-analytics and vike-indicators arrive through
# vike-backtest and vike-script above. MEASURED with `cargo tree -p vike-studio -e normal` rather
# than reasoned about — TWO earlier versions of this comment claimed two new crates and both were
# wrong, which is why the measurement is named here instead of the reasoning.
# It matters for the reason the vike-ml comment above states: vike-app links this crate in both the
# `fat` and `thin` builds, and the `studio-standalone` lane in scripts/ci_feature_suite.sh greps
# that same default normal dep tree for `^datafusion`.
#
# ⚠ Its build.rs scans `<workspace>/user_data/research/studies/rust/` and compiles what it finds
# into this build. In every CI checkout and every fresh clone that directory is absent, so the
# generated registry is EMPTY and the edge costs a no-op build script. That is not a new class of
# thing here either: `vike-backtest`'s `hist-replay` above already enables `vike-user-strategies`,
# whose build.rs does the same for the strategy tier.
vike-user-research = { path = "../vike-user-research" }
# The interpreter itself. Already in this crate's tree through vike-script, so naming it adds no
# crate; named directly because `src/rhai_study/bind.rs` registers types and functions against
# `rhai::Engine` rather than going through a wrapper — the registration list IS the interpreted
# tier's boundary and it must be readable as what it is.
rhai = { workspace = true }
# A study's `print`/`debug` are REDIRECTED into the facade rather than left on stdout, where they
# would corrupt a root whose stdout is a protocol (`vike-cli mcp`). Facade only — this is a library.
tracing = { workspace = true }
indexmap = { workspace = true }
# `study_run.rs` serializes a `StudyOutcome` — the study returns DATA and the caller writes it
# (`crates/vike-user-research/src/contract.rs` refuses serde in the study crate for that reason), so
# the JSON has to be built on this side of the seam.
serde_json = { workspace = true }
# Native strategies read their params ad hoc from a `toml::Value` (`BuyHold::from_params`) — this is
# the type the Studio's free-form key/value param editor serializes into.
toml = { workspace = true }

[dev-dependencies]
# Test-only DataFusion (split-plane I7): run.rs's #[cfg(test)] module and tests/templates_execute.rs
# seed a real DataFusionHist over a temp dir. Dev targets resolve vike-data with the feature ON; the
# plain lib build does not.
#
# `test-support` rides the same line, now for BOTH tiers: `study_run.rs`'s tests and
# `tests/rhai_study_pipeline.rs` each build a `StudyContext` over the workspace's OWN store double
# (`vike_data::test_support::MemHistStore`) rather than a bespoke one, which is the "one owned
# double behind a `test-support` feature" rule — so the interpreted tier is proven on a box with no
# DataFusion at all. It reaches no shipped build for the same reason `hist-datafusion` does not —
# this is a dev-dependency, and the `studio-standalone` lane runs without `--all-targets` precisely
# so dev-dep features stay out of the resolution.
vike-data = { path = "../vike-data", features = ["hist-datafusion", "test-support"] }
# `ScriptedLearner` — the shared learner DOUBLE, pushed through the erased `StudyLearner` seam by
# `study_run.rs`'s tests and by tests/rhai_study_pipeline.rs, so the fitting half of a study context
# is proven on a box with no LightGBM binary: every CI runner and every Windows box. ⚠ Deliberately
# a DEV edge only, for the reason the normal `vike-ml` line above states — a shipped build compiles
# none of this crate's test doubles, and a dev feature is not unified into the lib build.
vike-ml = { path = "../vike-ml", features = ["test-support"] }
# Seed a real DataFusionHist over a temp dir for the moved bar-store tests, and a scratch/runs root
# for `study_run.rs`'s. ⚠ This line used to explain itself as "MemHistStore is a filters/equity-only
# stub and cannot store bars" — that stopped being true when the double grew real bar storage
# (`crates/vike-data/src/test_support.rs`'s `append_bars`), so the reason is now the narrower one it
# always should have been: those tests are about the CONCRETE store, and this is the crate that
# creates a directory to put one in. Ad hoc, not workspace-pinned — same as vike-studio.
tempfile = "3"
# The COMPUTE SERVER this crate's wire boundary is mounted into — `tests/studio_wire_parity.rs`
# drives `vike_backtest::compute_server::serve_with_studio` over a real socket and compares the
# answer against the local `*_local` entry, bit for bit (the S2 guarantee). A DEV edge, and it must
# stay one: the NORMAL `vike-backtest` line above takes `hist-replay` and this line adds
# `datafusion-store` only for the test build, which is where the concrete store the fixture seeds
# comes from. ⚠ It is the same package twice with different features on purpose — the
# `studio-standalone` lane runs WITHOUT `--all-targets` precisely so a dev-dep feature stays out of
# the lib resolution, which is what keeps a default build of this crate DataFusion-free.
vike-backtest = { path = "../vike-backtest", features = ["datafusion-store"] }
# The REAL builder, for `tests/plugin_run.rs` alone: that test builds an actual `.so` through
# `render::build_plugin` — the same function the deployed service calls — and then runs it through
# the PRODUCTION `build_strategy`. Using the real builder rather than a hand-rolled cargo
# invocation is what makes the artifact half of that test the production pipeline instead of an
# imitation of it, exactly as `vike-strategy-plugin`'s own equivalence test argues for its copy of
# this edge.
#
# ⚠ A DEV edge, and it points UP (layer 65 against this crate's 55). That is the one direction a
# dev-dependency may take (`crates/vike-ops/tests/layer_gate.rs` exempts the section and asserts
# the exemption is still needed), and it must stay dev-only: the builder shells out to `cargo`, and
# nothing shipped from this crate may carry a compiler.
vike-strategy-builder = { path = "../vike-strategy-builder" }

[lints]
workspace = true

# The `vike-study` bin's extra surface, OFF BY DEFAULT — and the default is the load-bearing part.
# `scripts/ci_feature_suite.sh`'s `studio-standalone` lane greps this crate's DEFAULT normal-dep
# tree for a datafusion crate and FAILS if it finds one; a feature nobody enables cannot appear
# there, and `required-features` below keeps the bin out of every build that has not asked for it.
[features]
# ⚠ Since 2026-09-23 this also buys the WIRE. Both arms arrive together because
# `open_routed_history` is ONE function naming both concrete stores, and the LOCAL one is a
# `DataFusionHist`; a wire-only configuration would need a second spelling of the route decision.
# The `vike-datahub-client` edge itself is already a normal dependency of this crate, so this adds
# a feature rather than a package.
study-cli = ["vike-data/hist-datafusion", "vike-datahub-client/hist-route"]

# The study runner that can FIT — see the bin's own module doc for why it lives beside
# `run_study_plan` rather than in `vike-cli`, which is deliberately DataFusion-free.
[[bin]]
name = "vike-study"
path = "src/bin/vike-study.rs"
required-features = ["study-cli"]
