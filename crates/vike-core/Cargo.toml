[package]
name = "vike-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false # proprietary — never to crates.io (also exempts it from deny.toml license checks)
description = "vike trading core — the single-writer live core: the vt-core runtime thread, CoreSnapshot, and the R7 live-strategy mount. Extracted from vike-exec (crate-reorg Phase 2, spec D3)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `engine` — a runtime / simulation / transport core over the domain crates.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 30

[dependencies]
vike-model = { path = "../vike-model" }
# the producer-side ingest lanes (Command/Ingest + the fire-and-forget senders) this core drains
vike-exec = { path = "../vike-exec" }
# CoreLaneSink (core_sink.rs) implements vike_data::LiveDataSink — the shared feed→core-lane bridge
# the app/run mount adapters delegate to. DEFAULT features only (no hist-datafusion → no DataFusion
# in the core's tree); vike-data depends only on vike-model, so this edge stays down-only.
vike-data = { path = "../vike-data" }
tokio = { workspace = true }    # ingest mpsc (core does blocking_recv off-runtime)
arc-swap = { workspace = true } # CoreSnapshot publish (lossy GUI observer)
indexmap = { workspace = true } # bar cache + strategy tag registry (insertion order)
tracing = { workspace = true }  # fault-transition + watchdog events (NOT in the hot fold)
# Write-ahead command journal (journal.rs): serde derives the JournalRecord wire shape; serde_json
# is the length-prefixed framed payload codec; memmap2 is the pre-allocated segment backing. memmap2
# also backs the opt-in counter mirror (counters.rs) — see the audited unsafe sites in [lints.rust].
serde = { workspace = true }
serde_json = { workspace = true } # journal framing + (dev) r5 fixture parsing / order-request literals
memmap2 = { workspace = true }
# RunProfile config schema/loader (run_profile.rs): parse the TOML run-profile artifact. Schema-only
# scope (audit co14) — not yet wired into any binary or CoreConfig; the converters return the real
# vike_exec RiskLimits/MarginCallConfig so the mapping is compile-checked.
toml = { workspace = true }
# recent.rs: the recent-events ring stores an UN-RENDERED note (perf audit finding #2), so it
# holds the event's already-interned venue/symbol (`Ustr`, 8-byte Copy) and its coid in a
# `CompactString` (inline ≤24 B ⇒ no fold-path malloc). Both crates are already in this build
# graph through vike-model's `Event` schema — no new supply-chain surface — but a direct `use`
# needs a direct dep. Versions match vike-model's own pins (see crates/vike-model/Cargo.toml).
ustr = "1.1"
compact_str = "0.10"

# `posix_fallocate` only (journal.rs `reserve_blocks`) — std exposes no fallocate, and a SPARSE
# segment pushes ext4 block allocation onto the append hot path. Unix-only target table so a
# Windows build never sees it (the fn is `#[cfg(unix)]`). See the root Cargo.toml rationale.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tracing-test = { workspace = true } # assert on emitted events (#[traced_test]) — fault visibility
# dev-only: the live-parameter-plane (live_params.rs) + runtime-smoke tests mount the `SpreadMaker`
# (which moved to vike-mm in the vike-mm extraction) to drive the runtime end-to-end. This is a
# TEST-only edge — vike-core's LIBRARY never depends on vike-mm, so the down-only layering holds; it
# pairs with vike-mm's own dev-dep on vike-core (LiveBroker in its white-box tests), a legal
# test-only cycle Cargo permits because neither library depends on the other.
vike-mm = { path = "../vike-mm" }
# dev-only: controller_live_params.rs mounts the vike-strategy ControllerHarness to exercise the
# live-parameter plane end-to-end. TEST-only edge — vike-core's LIBRARY never depends on
# vike-strategy (down-only holds; the runtime mounts it via a Box<dyn Strategy<LiveBroker>>).
vike-strategy = { path = "../vike-strategy" }
# dev-only: rhai_live_mount.rs proves RhaiStrategy<LiveBroker> boxes as the live mount's
# Box<dyn Strategy<LiveBroker> + Send> type and buffers orders through a real LiveBroker.
# TEST-only edge — vike-core's LIBRARY never depends on vike-script (down-only holds).
vike-script = { path = "../vike-script" }
# dev-only: the owned scratch guard in `src/scratch.rs` that every journal/replay/restore suite
# allocates its working directory through. The hand-rolled helpers it replaced returned a bare
# `PathBuf` and removed nothing, leaking 27,471 directories / 211 GB onto the the CI box CI box's `/tmp`
# (a journal segment is `posix_fallocate`d to its full 64 MiB, so each one is real). Per-crate
# rather than a workspace dep, matching the convention noted in
# `crates/bridges/polymarket/Cargo.toml` and the 20 other crates already on `tempfile = "3"`.
tempfile = "3"
# vike-data is a NORMAL dep above (default features); re-listed here ONLY to turn on `test-support`
# for this crate's test builds — the `vike-app-core`/`vike-cli`/`vike-datahub` idiom. That feature is
# what compiles `MemHistStore`, the DataFusion-free in-memory `HistStore` double that
# `tests/recon/recon_journal_view.rs` drives every branch of `journal_view_from_store` through.
# It adds nothing to a shipped build: the module it enables is `#[cfg(feature = "test-support")]`,
# and no non-dev resolution of this crate's graph turns the feature on.
vike-data = { path = "../vike-data", features = ["test-support"] }

# Workspace policy forbids unsafe_code; vike-core carves out a small, audited set of exceptions —
# all OS mmap entry points (no safe wrapper exists): journal.rs's `MmapMut::map_mut`, and counters.rs's
# `MmapMut::map_mut` (writer) + read-only `Mmap::map` (reader). deny (not the workspace's forbid) so a
# per-site `#[allow(unsafe_code)]` can override it; every OTHER unsafe in this crate stays denied. Same
# spirit as vike-fxcm's carve-out (which omits lints entirely; this is deliberately stricter — vike-core
# stays unsafe-denied except the audited mmap sites).
[lints.rust]
unsafe_code = "deny"
