[package]
name = "vike-rhai"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "Rhai-scripted strategies: run a Rhai script as a vike-model Strategy<B> (Studio SP1)."
# Test discovery is OFF so every `tests/*.rs` keeps its path while the plain suites link as ONE binary,
# `tests/integration.rs` (each a module of it); the `[[test]]` rows at the end are every test binary, and
# `crates/vike-ops/tests/hygiene/test_registry_gate.rs`'s `every_root_test_file_is_built_where_discovery_is_off` fails on a root file no row or module builds.
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain` — one hop over the vocabulary: a single-purpose pure core.
# ⚠ WAS `engine` (30) until 2026-09-23, and the drop is a CEILING being tightened rather than
# slack being released. This crate is the Rhai host: its normal dependencies are what a user's
# script can reach, so its rank is a permission. At 30 that permission covered the whole
# `domain` band — vike-data, vike-execution, vike-config, vike-catalog, vike-market-making, vike-analytics — none
# of which it names or should offer. At 20 it covers the vocabulary and the leaf band, which is
# exactly its surface: `vike-indicators` (which moved to 15 with this change) and `vike-model`.
# The residual, stated because a single threshold cannot express it: `vike-secrets` sits at 15
# and is therefore still nameable. docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 20

[dependencies]
vike-model = { path = "../vike-model" }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../vike-paths" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `L2BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../vike-marketdata" }
vike-indicators = { path = "../vike-indicators" }
# The order language a script's `strategy` object is (decision 0269's Rhai wave): a script whose
# `on_bar` takes `strategy` runs inside `vike_tactics::RuleRun`, the wrapper the lab's rules use. Layer
# 15, normal edges `vike-model` and `vike-marketdata` only, so it adds the order verbs to what a
# script can reach and nothing else.
vike-tactics = { path = "../vike-tactics" }
# `internals` for `AST::walk`: a script that still calls a removed order function (`buy`, `sell`,
# `market`, `limit`) is refused at compile by the call's name and line (`strategy.rs`'s
# `refuse_removed`), which needs the syntax tree. It adds API and no dependency.
rhai = { workspace = true, features = ["internals"] }
indexmap = { workspace = true }
tracing = { workspace = true } # fail-safe warn/error on a runtime script error (RhaiStrategy::run_hook)

[[bench]]
name = "eval_overhead"
harness = false

[lints]
workspace = true

# `crate::test_support`: the `Bar` builders, `Scratch` and the `OrderBrokerMock`/`drive` scaffold the unit
# tests, the integration binaries and the bench share, compiled once by the lib instead of once per
# binary. Turned on only by the self dev-dependency below; no shipped edge may enable it
# (`crates/vike-ops/tests/architecture/test_surface_gate.rs`).
[features]
test-support = []

[dev-dependencies]
# Self-referential dev-dep (the `vike-execution`/`vike-model` idiom): turns `test-support` on for THIS crate's
# own `tests/` and `benches/` targets, which compile the lib WITHOUT `cfg(test)`.
vike-rhai = { path = ".", features = ["test-support"] }
# `tests/strategy_object.rs` runs one script written both ways (the order functions and `strategy`)
# on the real simulator and compares their fills: an UPWARD dev edge (25), which the layer gate allows.
vike-simulator = { path = "../vike-simulator" }
# The starter templates' own compile+param gate builds a `RhaiStrategy<OrderBrokerMock>`. `vike-model` is
# already this crate's normal dependency, so enabling its `test-support` feature for dev targets
# adds NO package.
vike-model = { path = "../vike-model", features = ["test-support"] }
# `vike_log::capture::captured` — the workspace's ONE scoped `tracing` capture, which
# `tests/script_print_is_not_stdout.rs` reads the redirected `print`/`debug` lines with. Unlike the
# edge above, this one DOES add packages to this crate's test build (vike-log's subscriber tree —
# none of them new to the workspace lockfile). Taken anyway because the alternative is the
# hand-rolled collector this file used to carry, which could not hold against another thread's
# uncaptured first hit without a second copy of the process-lifetime interest anchor.
vike-log = { path = "../vike-log", features = ["test-support"] }

# Every test binary (discovery is off, above). `integration` holds every plain suite as a module. The three
# install suites stay one binary each: the installed set is a once-per-process `OnceLock`, so two of them in
# one process would race it (`crates/vike-rhai/CLAUDE.md`'s "The installed set is process-wide, once").
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "install"
path = "tests/install.rs"

[[test]]
name = "install_from_user_data"
path = "tests/install_from_user_data.rs"

[[test]]
name = "load_and_install"
path = "tests/load_and_install.rs"
