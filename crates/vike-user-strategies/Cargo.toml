[package]
name = "vike-user-strategies"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "The compiled user-strategy HOST: build.rs scans <workspace>/user_data/strategies/rust/<name>/<name>.rs (VIKE_USER_DATA_DIR overrides the root at BUILD time) and generates a name->constructor registry the backtest and live registries consult AFTER every built-in arm. User code stays in gitignored user_data — it compiles into the operator's own binary and never enters the repo — and compiles against the platform's PUBLIC API only: a separate compilation unit, not a module of vike-strategy, so an internals refactor can never break a user strategy and user strategies can never freeze framework internals (the spec's v2/v3 argument, docs/superpowers/specs/2026-08-11-user-native-strategies-design.md). No user_data (every CI checkout) => an EMPTY registry, byte-identical behavior everywhere."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Between vike-strategy (30,
# the framework this crate's user code writes against) and the registry consumers vike-backtest
# (50) / vike-tradehub (65).
# ⚠ **WAS `venue` (40) until 2026-09-23, and the move CLOSES A FENCE rather than releasing slack.**
# This crate is a build.rs host: its normal dependencies ARE the user-facing API, as the comment
# above says, so its rank is the PERMISSION governing what a user-authored strategy may name. At
# 40 that permission covered every crate at 30 — `vike-core`, `vike-bridge-core`, `vike-paper`,
# `vike-datahub-client` — the whole fence, plus `vike-boot` at 25. At 25 it covers none of them:
# the layer gate refuses a same-rank edge and every upward one, so a user strategy naming the LIVE
# CORE is a COMPILE ERROR rather than a convention. It reached 25 only because `vike-strategy`
# went to 20 and `vike-mm` to 15 first — the ladder spends one rung per link.
# ⚠ `venue` was also simply the wrong name: this crate is not a venue. The rank that names it
# correctly, `user-host` (35), sits ABOVE the fence and so could never be the answer.
# ⚠ The Rhai host sits at 20 and is therefore nameable BY RANK; what forbids that edge is
# `crates/vike-ops/tests/named_run_closure_gate.rs`, which walks this crate's whole transitive
# normal closure. 0085 measures the ladder; 0064 owns the compiler fence, and they are different
# mechanisms for different hazards.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 25

[lints]
workspace = true

[dependencies]
# The traits user strategies implement (`Strategy<B>`, `Broker`/`HftBroker`) and everything a
# strategy legitimately reaches: domain types from vike-model, the Controller/PositionExecutor
# framework from vike-strategy, the indicator catalog from vike-indicators. This dependency set IS
# the user-strategy API surface — a user file resolves `use vike_model::…` against THIS manifest,
# so adding a crate here (with a root-Cargo.toml rationale) is how a user strategy gains a
# dependency; the framework crates never change for it.
vike-model = { path = "../vike-model" }
vike-strategy = { path = "../vike-strategy" }
vike-indicators = { path = "../vike-indicators" }
# The `params: &toml::Value` table every `build` constructor reads — the same lenient-reader
# convention as the built-in `from_params` arms. Workspace-pinned already.
toml = { workspace = true }

[build-dependencies]
# build.rs parses each strategy folder's optional `strategy.toml` manifest (`live = true`). Same
# workspace-pinned `toml`, no new supply-chain entry.
toml = { workspace = true }

# No dev-dependencies: the pipeline test carries its own ~30-line `HftBroker` double
# (`vike_model::MockBroker` implements only `Broker`, not the tagged-verb extension the generated
# registry's bound requires).
