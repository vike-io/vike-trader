[package]
name = "vike-market-making"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike market-maker maths — the pure pricing and risk functions (Avellaneda–Stoikov / Guéant pricing, inventory-skew sizing, fill-rate netting, quote-style placement, own-order-book filtration, refresh tolerance, ladder, liquidity rewards, the cross-exchange maker's basis/guard/hedge/pricing) and the spread maker's presets that the market-making strategy files price through."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `leaf` — a crate that
# names at most the floor. (This line still said `domain` until 2026-09-28, beside the note below
# recording the move off it.)
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
# ⚠ WAS `domain` (20) until 2026-09-23. Its one edge is the vocabulary at 10, so the `leaf` band —
# `names at most the floor` — describes it exactly, and the rank was a tier of pure slack. It is
# the first link of a chain: at 20 it held `vike-strategy` at 25, which held the user-strategy
# host at 30 and therefore ABOVE the live core. Each of the three moves one rung, and the last one
# closes a fence. docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
[package.metadata.vike]
layer = 15

[dependencies]
# The maths reference ONLY vike-model domain types (AsParams/QuoteStyle/OrderBookOwn/FeeSchedule/
# params) — so this crate depends on vike-model alone among the domain crates, keeping the down-only layering intact (nothing
# here reaches up into vike-execution or vike-core).
vike-model = { path = "../vike-model" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `L2BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../vike-marketdata" }
# The formula floor (decision 0294, layer 2, `libm` only): `fairvalue::lmsr_reservation`'s logit and logistic
# are the workspace's one `special_functions::logit`/`logistic`, the pair `vike-ml-prediction` and
# `vike-analytics` use; the σ̂² EWMA alpha (`smoothing::alpha_from_half_life`) and the basis estimate's
# decay (`smoothing::half_life_decay`).
vike-math = { path = "../vike-math" }
# The transcendentals in the quote math (`exp`/`log`/`pow` in alpha/avellaneda/fits/
# spread_source/underlying). ⚠ NOT a preference: `f64::exp`/`ln`/`powf` call the PLATFORM's libm,
# which IEEE 754 does not require to be correctly rounded, and this crate was MEASURED diverging —
# seven of nine hashed rows differed between Windows/MSVC and Linux/glibc, on the Avellaneda-Stoikov
# half-spread, the LMSR reservation price and the LS-LMSR prices themselves. Two boxes running the
# same strategy over the same tape posted different quotes. `src/platform_probe.rs` carries the
# measurement; `docs/decisions/0032-transcendentals-come-from-the-libm-crate-not-the-platform.md` is
# the accepted verdict. Already a workspace-pinned dep shared with vike-indicators/vike-analytics/
# vike-model/vike-backtest/vike-options/vike-orderflow — no new external crate enters the tree.
libm = { workspace = true }
serde = { workspace = true } # `xemm::guards::HaltReason`'s wire shape
tracing = { workspace = true } # the edge-triggered HOLD/RESUMING warns and `rearm_fee_floor`'s lines

[dev-dependencies]
# TEST-ONLY: the `rearm_fee_floor` test (`src/tests/from_params.rs`) writes its params tables as TOML text and parse them into
# `vike_model::params::Params` (serde). The library reads `Params` and names no `toml`.
toml = { workspace = true }
# vike-model's `test-support` for the `vike_model::test_support` helpers this crate's tests name. A DEV
# edge with the feature, never a normal one: a normal edge would compile them into shipped builds.
vike-model = { path = "../vike-model", features = ["test-support"] }
# The shared libm walk (decision 0074): `vike_utility::libm_walk` holds the text parser this crate's
# `libm_platform_probe` used to keep a private copy of. A DEV edge with the feature, never a normal
# one — `test-support` is gated `#[cfg(any(test, feature = "test-support"))]` and a normal edge
# would compile it into shipped builds. `cargo package` strips a dev-dependency carrying no
# version, so a published closure is untouched.
vike-utility = { path = "../vike-utility", features = ["test-support"] }
# TEST-ONLY: `AsState::note_fee_floor`'s break-even refusal warn is edge-triggered, and its whole
# purpose is to be SAID — a silent hold is the defect it exists to remove. Asserting
# `price() == None` does not test that, so the tests capture the emitted event through `vike_log::capture::captured`, the
# workspace's ONE scoped `tracing` capture (vike-log's `test-support`). It replaced a
# `tracing-subscriber` formatter writing into a buffer, which a sibling test reaching the same
# HOLD line uncaptured could leave empty — the shared capture's process-lifetime interest anchor
# is what closes that, and a second copy of it here is what this edge avoids. A DEV edge, LEVEL
# (both crates declare 15), which the layer gate exempts; nothing it pulls in is new to the
# workspace lockfile, and it is absent from every shipped binary.
vike-log = { path = "../vike-log", features = ["test-support"] }
# The shared L1-quote builder (`vike_marketdata::test_support::quote`: sizes 1.0, empty symbol),
# which `src/tests/mod.rs` reads for the quote-style tests. A DEV edge with the
# feature, never a normal one: `test-support` is gated `#[cfg(any(test, feature = "test-support"))]`
# and a normal edge would compile the builders into shipped builds. vike-marketdata is layer 5 and
# names no vike crate, so there is no cycle; the library already reaches it through vike-model, and
# this adds one `vike-market-making` line to `Cargo.lock`'s dependency list.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`. The maker is unsafe-free.
[lints]
workspace = true
