[package]
name = "vike-strategy-builder"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # proprietary — never to crates.io
description = "The service that compiles an authenticated caller's Rust strategy source into a vike-rust-strategy-shaped cdylib: the cdylib template renderer, the content-addressed build/cache, the authenticated wire protocol, the retention pruner, and the vike-strategy-builder binary. Split out of vike-rust-strategy so a compiled user strategy file never inherits this service's dependency tree."
# The integration tests are ONE test binary, `tests/integration.rs` (every `tests/<name>.rs` a `mod` of it), declared
# below: one binary links instead of one per file. Discovery is off so each file keeps the path its citations name; a
# new root file builds only as a `mod` there or a `[[test]]` row (`crates/vike-ops/tests/hygiene/test_registry_gate.rs`'s `every_root_test_file_is_built_where_discovery_is_off`).
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `daemon` — a headless
# top-of-graph binary. The SAME tier `vike-datahub`/`vike-tradehub` declare, for the same shape: a
# standalone systemd service speaking its own authenticated loopback wire protocol.
#
# ⚠ This comment said "only the layer-68 multicall dispatcher may depend on it, and nothing does",
# and the runtime-strategy-file JOIN made both halves false. `src/client.rs` — the CLIENT half of this
# service's protocol — lives here deliberately (its module doc argues why: a client written
# elsewhere would be a second statement of the handshake, the domain separator, the protocol
# version and the scope ceiling, kept in step by nothing), so its callers take this crate. Since
# decision 0288's amendment of 2026-11-16 those are the server's daemons alone, through the
# multicall (`vike`, 68: the backtesthub's and the tradehub's builder) and `vike-strategy-sandbox`;
# `vike-studio` and `vike-desktop` dropped the edge when Studio's Build moved onto the backtesthub.
# Those edges go DOWN, which is the rule the gate actually enforces; what the rank still buys is
# that nothing BELOW 65 may name this tree.
#
# ⚠ ABOVE `vike-rust-strategy`'s 15, and this crate DOES carry a normal Cargo dependency edge on
# it now (`src/render.rs` names the SDK vocabulary, `vike_rust_strategy::sdk` and `::artifact`, and
# reads the templates from the SDK it builds against, decision 0296). That edge is DOWN the stack (65
# depends on 15), the permitted direction; only the reverse would be wrong, and it is not what this is
# — a strategy file still links only `vike-rust-strategy` itself. 65 is also where every other sibling authenticated-wire-protocol daemon in this
# tree (`vike-datahub`, `vike-tradehub`) already sits, for the identical shape.
[package.metadata.vike]
layer = 65

# Ordinary workspace lints — unlike `vike-rust-strategy`, this crate is NOT part of the
# quarantined FFI surface and carries no `unsafe`. See crates/vike-ops/tests/hygiene/unsafe_and_toolchain_gate.rs;
# no new row is needed there for this crate (`UNSAFE_EXEMPT` names crates that do NOT inherit the
# workspace forbid, and this one does).
[lints]
workspace = true

[dependencies]
# The SHARED hub-protocol substrate: the HMAC-SHA256 nonce-challenge handshake generalized over
# its domain separator (`auth`) and the length-prefixed frame codec (`frame`). ⚠ Both were
# `vike-datahub-client`'s until 2026-09-23 and moved to the crate BELOW both hub protocols, so the
# two clients could stop being a ladder; that crate's own doc carries the measurement. It names no
# vike-* crate at all, so this edge adds no package to any graph that did not already carry
# hmac/sha2/rand transitively.
vike-hub-protocol = { path = "../vike-hub-protocol" }
# The SDK vocabulary (`sdk`: the marker, the usability rule; `artifact`: the build folder, the
# artifact path, the work directory), the loader's record check a cache hit runs, and the
# quarantined FFI surface a rendered strategy file links against — this crate never calls into that
# surface itself (it writes a template it reads from the SDK into a work directory and shells out to
# cargo). Down-only: `vike-rust-strategy` is layer
# 41, strictly below this crate's 65 (see the layer comment above for why the edge is legal and
# does not widen a strategy file's own dependency tree).
vike-rust-strategy = { path = "../vike-rust-strategy" }
# The builder service's wire protocol (`src/builder.rs`) and its `Build`/`Response` frames — the
# same pair every other node-auth-speaking crate in this tree already uses for its own protocol.
serde = { workspace = true }
serde_json = { workspace = true }
# The frames past the `Welcome` (`PROTO_VERSION` 4): positional msgpack (`src/builder.rs`'s
# `write_message`, the owner's "JSON only at the edges" of 2026-11-19). A workspace dependency already in
# the tree (the sandbox and live strategy pipes), so no package joins any graph that lacked it.
rmp-serde = { workspace = true }
# This binary's OWN provenance (`vike_buildinfo::version_line`, its `--version`). It no longer
# checks a source tree's commit: a tree is an SDK its marker names, or a checkout (decision 0296,
# `src/render.rs`'s `source_tree_refusal`). Leaf crate, layer 15 — strictly below this crate's 65, a
# down-only edge that adds no package: every binary in this tree already links it.
vike-buildinfo = { path = "../vike-buildinfo" }
# The command line (decision 0155): `builder::BuilderArgs` derives `clap::Parser` and is read through
# `vike_utility::cli` (layer 3, the `cli` feature), the one argv layer every program shares.
vike-utility = { path = "../vike-utility", features = ["cli"] }
clap = { workspace = true }
# The moved-name hint (`vike_model::host_build::moved_name::moved_name_hint`) a `Compile` failure
# carries after rustc's own text when the caller's source still reaches a market-data name through
# `vike_model` (`src/render.rs`'s `compile_diagnostics`) — one home for that knowledge, shared with
# the two compiled user-code hosts' build scripts. Layer 10, strictly below this crate's 65, and no
# new package: `vike-rust-strategy` already links it.
vike-model = { path = "../vike-model" }
# The strategy FILE header (`vike_strategy::file::StrategyFileHeader`, plan 2b): a `rule` file's
# `[run]` options are rendered into its entry at build time (`src/render.rs`'s `Entry`). Layer 20,
# below this crate's 65; the multicall program already links it, and its tree adds no network or
# signing crate.
vike-strategy = { path = "../vike-strategy" }
# The Rust study folder-name rule (`vike_paths::state_path::is_rust_study_name`, `src/render.rs`'s
# `check_study`), the one rule the backtesthub's host checks too. Layer 7, below this crate's 65; no
# package joins: `vike-strategy` already links it.
vike-paths = { path = "../vike-paths" }
# The SETTINGS DATABASE (`<project>/settings/db/vike.db`) — the ONE place the service's key lives
# (the owner's ruling of 2026-10-31, "all in the SQLite, not files"). `builder::resolve_keys` opens
# it with `vike_secrets::open_credential_store` (the door for a root that runs no boot, out of the
# caller's environment map) and reads that one deployment name, scoped — the service and the
# daemons that dial it (`client::build_file`) alike. Layer 15, strictly below this crate's 65, so a
# down-only edge; every daemon already links it, so no package joins any graph that did not carry it.
vike-secrets = { path = "../vike-secrets" }
# ⚠ **`tracing` was here for "connection-boundary logging" and is DELETED, because it logged
# nothing.** `tracing` is a facade: an event reaches a destination only through an installed
# subscriber, and `src/bin/vike-strategy-builder.rs` installs none (it calls no `vike_log::init`,
# and deliberately no `vike_boot::boot` either). So the two `tracing::warn!` sites in
# `src/builder.rs` — an accept failure and a failed retention prune — produced no output at all,
# and this comment promised an operator something the binary could not deliver. Both are
# `eprintln!` now, which systemd captures, and which is what every other operator-facing line in
# this crate's binary already uses. `src/builder.rs`'s module header carries the argument for why
# installing a subscriber was refused rather than chosen. The day this service boots through
# `vike-boot`, this dependency comes back WITH one.

# The build jail (decision 0273): `vike-sandbox` applies it (Landlock for the filesystem and TCP,
# seccomp for every other socket, the probe in a child); `src/jail.rs` keeps only what a cargo build is
# granted. Off Linux the jail cannot be applied and every Build is refused by name. Layer 15, strictly
# below this crate's 65, and it names no vike-* crate.
vike-sandbox = { path = "../vike-sandbox" }

# `tests/refusal_reaches_stderr.rs` plays a unit written before `@sandbox`: a seccomp filter that
# kills on the three Landlock calls, built from these two (numbers from `libc`).
[target.'cfg(target_os = "linux")'.dev-dependencies]
seccompiler = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# Scratch directories for `render.rs`'s tests and `builder.rs`'s retention tests; dev-only
# (production code builds its own scratch path from the content hash instead; see `render.rs`'s
# module doc).
tempfile = { workspace = true }
# A real settings database in a scratch project, with the key filed in it exactly as
# `vike-cli secrets set` files it — the tests plant the row and the code under test reads it back
# (`plant_settings_rows` makes the store, `save_credentials_to_store_unjournalled` files the row).
vike-secrets = { path = "../vike-secrets", features = ["test-support"] }
# `vike_log::reaper::Reaper`: the kill-on-drop guard the daemon-spawning tests hold.
vike-log = { path = "../vike-log", features = ["test-support"] }
# `vike_model::strategy::OrderBrokerMock`: the broker a built file's host is typed over in
# `tests/build_errors.rs`, which reads its facts, refusal and echo and dispatches nothing.
vike-model = { path = "../vike-model", features = ["test-support"] }
# `vike_rust_strategy::sdk::with_adapters`: `src/render_sdk_tests.rs` serves an SDK it made up through an
# adapter it made up, in place of the ones the binary was built with. The normal edge already exists.
vike-rust-strategy = { path = "../vike-rust-strategy", features = ["test-support"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
