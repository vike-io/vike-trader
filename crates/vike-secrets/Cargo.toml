[package]
name = "vike-secrets"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the credential store: ONE store in the project, the settings database `<project>/settings/db/vike.db` (decision 0054; the credential FILE store was removed on 2026-10-07, and nothing reads or carries such a file any more), resolved at runtime by walking up for the project root. It names NOTHING ABOVE RANK 10 — the vocabulary floor, where its vike-model, vike-util and vike-paths edges sit — but the change journal one rung over it (vike-change-journal, rank 12, the declared row of tier 15's exception table), and ONE external crate of weight (rusqlite, the store's database home) plus the `tracing` facade (the scoped loaders log; see [dependencies]), so vike-bridge-core (which owns the transport stack) and vike-cli (DataFusion-free, transport-free, FAST CI lane) both link it without dragging the other in: neither gains a transport, a TLS stack or a query engine from either line. ⚠ Until 2026-09-13 this line said \"ZERO dependencies at all — no vike-* crate and no external crate\", and \"NO vike-* crate\" until decision 0072; 0054 took the external half and 0072 took the vike-* half, and what survives both is WEIGHT and ALTITUDE, not the absence of an edge."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `leaf` — a crate that
# names AT MOST THE FLOOR: the helper floor at 3, the market-data vocabulary at 5, the project
# layout at 7 and the domain vocabulary at 10, none of which drags anything behind it. This crate
# names three of them (`vike-util`, `vike-paths`, `vike-model`) and ONE crate above them, the change
# journal at 12 (`vike-change-journal`, see [dependencies]), by a declared exception row (below).
# ⚠ This line read "a pure leaf with no vike-* dependency of its own", which is the tier's own
# wording from BEFORE 2026-09-23 — so it went on citing layer_gate.rs as its authority while
# disagreeing with it. That wording was repaired precisely because it was already false of THIS
# crate, the band's one long-standing occupant, and the band's rule is now machine-checked:
# `crates/vike-ops/tests/architecture/layer_gate/tiers.rs`'s `every_tier_15_crate_names_nothing_above_the_vocabulary`,
# whose exception table `TIER_15_EXCEPTIONS` was EMPTY from 2026-09-23 (this crate used to be the
# row in it, for `vike-model`) until 2026-10-12, when the change journal left this crate for rank 12:
# this crate is its one row again, for that edge alone.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 15

[dependencies]
# ⚠ THIS TABLE WAS EMPTY UNTIL 2026-09-13, and it said so: "Deliberately EMPTY. Reading a
# `KEY=value` file and walking up for a project root need nothing but `std`, and the empty list is
# the property this crate exists to hold: both consumers link it without pulling in anything, so
# nothing here can widen the `cargo deny --all-features` surface."
#
# The last clause is the one that expired. `docs/decisions/0054-settings-move-into-one-database.md`
# (accepted 2026-09-13) moves settings, credentials and node keys into one SQLite database, and the
# owner ruled the credential half NOT severable — so the store this crate owns acquires a database
# home, and its constraint 3 makes THIS edge the thing the whole credential half stands on. The
# argument for the engine, the `default-features = false` measurement and the `cargo tree` delta are
# in the root manifest beside the pin; the gate row is
# `crates/vike-boot/tests/dependency_floor.rs`'s `FLOOR_EXCEPTIONS`.
#
# WHAT SURVIVES, and it is the half both consumers actually rest on: this crate names NOTHING ABOVE
# RANK 10 — the vocabulary floor — but the change journal one rung over it (its declared
# `TIER_15_EXCEPTIONS` row, see that dependency below). `vike-bridge-core` (which owns the
# ureq/tungstenite/rustls transport stack) and `vike-cli` (DataFusion-free, transport-free, FAST CI lane) still link the
# same store without dragging each other in, and neither one gains a transport, a TLS stack or a
# query engine from this line. What is genuinely gone is "this crate widens NOTHING": it now costs
# four packages on `vike-cli`'s normal tree and the first C compilation in that graph.
#
# ⚠ That clause read "this crate still declares NO `vike-*` dependency" until
# `docs/decisions/0072-vike-secrets-takes-one-vike-edge-and-is-not-split.md` (accepted 2026-09-20)
# admitted `vike-model`. It is stated as a RANK for the reason the `description` above gives — the
# edge is one fact about one day, the band survives the next occupant — and the band is
# machine-checked by `crates/vike-ops/tests/architecture/layer_gate/tiers.rs`'s
# `every_tier_15_crate_names_nothing_above_the_vocabulary`.
#
# ⚠ Worth carrying because it is a property of the SWEEP and not of this crate: this occurrence
# outlived the 2026-09-25 sweep of 0072's prose, which corrected the `description` and the tier
# comment a dozen lines above and never saw this one, because the claim is WRAPPED across two lines
# and the sweep's grep was line-at-a-time. A prose claim spanning a line break is invisible to the
# tool that finds the others; the next sweep of a sentence needs a multi-line search.
#
# ⚠ THE MIGRATION HAS LANDED. This comment read "NO MIGRATION CODE YET, deliberately — no schema,
# no reader, no writer, no call-site change" from 2026-09-13, when the dependency was bought ahead of
# its first use so that a migration could not discover the gate refusal with the schema already
# written. That is spent: `src/db.rs` now opens `<project>/settings/db/vike.db` (two tables,
# `journal_mode = DELETE`, 0600 in a 0700 directory), `migrate` creates it (`--init`), and
# `store.rs`'s `Backend` reads it — per RUN, never per KEY. The credential FILE store it
# replaced was removed on 2026-10-07; nothing in this crate deletes, moves or rewrites a file an
# operator left behind.
# ⚠ THE `vike-*` HALF FELL TOO — `docs/decisions/0072-vike-secrets-takes-one-vike-edge-and-is-not-split.md`
# is the verdict, and it also refuses the OTHER candidate (splitting this crate into a file plane
# and a database plane) on a measurement worth reading before proposing it again. The paragraph
# above is why the vike-* half could fall: its surviving argument is
# about WEIGHT — "neither one gains a transport, a TLS stack or a query engine from this line" —
# not about the absence of an edge. This edge gains none of the three, and it is the rarest kind of
# dependency: one that costs NOTHING anywhere. `vike-model` is already a normal dependency of all
# ten crates that declare this one, and it is already a member of
# `crates/vike-boot/tests/dependency_floor.rs`'s `VIKE_CLOSURE`, so no graph acquires a package and
# that gate's exact-set assertion is untouched. Layers 15 -> 10, down-only; `vike-model` names this
# crate nowhere, so there is no cycle.
#
# WHAT IT BUYS: `src/store_locator.rs` stops RE-SPELLING `vike_paths::state_path`'s project walk. The two
# copies existed only because this table was empty, and the test that held them equal
# (`crates/vike-bridge-core/tests/settings_dir_spellings.rs`) had to live in a THIRD crate because
# neither owner could see the other — its own module doc says so, and says the pin both copies'
# docs had promised DID NOT EXIST until somebody wrote it. One definition needs no pin.
#
# ⚠ The stated reason for the old rule was "vike-cli ... FAST CI lane", and
# `docs/decisions/0004-crate-splits-do-not-shrink-ci.md` forbids exactly that as a justification.
# The four properties worth keeping are measurable and all four survive: no transport, no TLS
# stack, no query engine, and no new package in `vike-cli`'s graph.
vike-model = { path = "../vike-model" }
# The pure helpers (decision 0141, layer 3) this crate calls: `atomic_file`, for
# `src/account_confirmation.rs`'s write.
vike-util = { path = "../vike-util" }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../vike-paths" }
rusqlite = { workspace = true }
# The `tracing` FACADE (macros only; the subscriber stays in `vike-log`, which only binaries call).
# Added 2026-10-11 for the scoped loaders and `warn_once`, which moved here from `vike-bridge-core` so
# the `vike-backfill` vendor bins load their one API key without linking the transport stack. A
# workspace-pinned facade: it is no transport, no TLS stack and no query engine, the three things this
# crate's weight argument above refuses, and every binary that logs links it already. The READS
# still return their findings as data; only the `load_workspace_secrets_scoped_*` loaders and
# `warn_once` emit. Its gate rows: `crates/vike-boot/tests/dependency_floor.rs`'s `EXTERNAL_FLOOR`
# and `crates/vike-ops/tests/settings_secrets/credential_source_roster_gate/roster_table.rs`'s
# `STORE_CRATE_DEPS`.
tracing = { workspace = true }
# The CHANGE JOURNAL every public writer here records into (`crates/vike-change-journal/src/lib.rs`'s
# module doc is its contract). It lived in this crate as `change_journal` and moved out WHOLE. Layer 12,
# one hop over the vocabulary: `crates/vike-ops/tests/architecture/layer_gate/tiers.rs`'s
# `TIER_15_EXCEPTIONS` carries this edge, since tier 15's rule otherwise admits nothing above rank
# 10. Beyond itself it adds no package to any graph: it names only `vike-model` and `vike-util`
# (both already dependencies here) and `serde`/`serde_json`, which `vike-model` already links, and
# it is no transport, no TLS stack and no query engine. Its gate rows: `crates/vike-ops/tests/settings_secrets/credential_source_roster_gate/roster_table.rs`'s
# `STORE_CRATE_DEPS` and `crates/vike-boot/tests/dependency_floor.rs`'s `VIKE_CLOSURE`.
vike-change-journal = { path = "../vike-change-journal" }
# `serde` (the derive) and `serde_json` (the reader and writer) are `src/account_confirmation.rs`'s:
# the parked handshake confirmations (moved here from `vike-model` on 2026-10-12) are one JSON file
# of `#[derive(Serialize, Deserialize)]` records. Neither adds a package to any graph, because
# `vike-model`, a normal dependency of this crate, already links both, and neither is a transport, a
# TLS stack or a query engine, the three things the weight argument above refuses. The suites under
# `tests/store/` also use `serde_json` to parse the change-journal line a writer appended. Their gate
# rows: `crates/vike-ops/tests/settings_secrets/credential_source_roster_gate/roster_table.rs`'s
# `STORE_CRATE_DEPS`, and `crates/vike-boot/tests/dependency_floor.rs`'s `EXTERNAL_FLOOR`.
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# TEST-ONLY, and it carries no dependency — it exposes the fixture constructors
# (`db::create_empty_store_for_test`, `settings::plant_settings_rows`, `settings::hold_write_lock`).
# Behind a feature rather than `pub` so nothing in a shipped binary can reach a constructor that
# creates or holds a store outside the production writers. Self-referenced as a dev-dependency
# below, the same shape `vike-bridge-core`'s `test-support` uses.
test-support = []

[dev-dependencies]
# The crate's own integration tests, with `test-support` on — see the feature's comment above.
vike-secrets = { path = ".", features = ["test-support"] }

# TEST-ONLY. `vike_log::capture::captured` reads back the log lines the scoped loaders emit
# (`tests/reads/scoped_loader_logs.rs`); the workspace's one scoped `tracing` capture
# (`crates/vike-ops/tests/hygiene/tracing_capture_gate.rs` refuses a hand-rolled one). A dev edge:
# `vike-log` names no `vike-*` crate, so this is no cycle, and it never reaches a shipped binary.
vike-log = { path = "../vike-log", features = ["test-support"] }

# TEST-ONLY. The project-root walk must be exercised against a real directory tree; a pure-string
# test would only re-assert `join`. Already in the lockfile (vike-config and others use it), so it
# adds ZERO packages to the `cargo deny` surface — and being a dev dep it never reaches a shipped
# binary, so the crate's RUNTIME graph is unchanged by it. (⚠ That last clause read "so the crate's
# zero-dependency runtime graph is unchanged" until 2026-09-13; the runtime graph is no longer
# zero-dependency — see the `[dependencies]` table above — but this dev edge still adds nothing to
# it, which is the claim being made here.)
tempfile = { workspace = true }

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
