[package]
name = "vike-datahub-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the LIGHT client half of the vike-datahub data-service (Phase 2, \"thin-client GUI\"): the wire protocol (proto), the blocking DatahubClient, and RemoteHistStore — a vike_data::HistStore whose GUI read verbs are answered by a remote datahub server over RPC. DataFusion-FREE by construction in a DEFAULT build (vike-data DEFAULT features = the HistStore TRAIT only), so the GUI links this without the Arrow/DataFusion tree; the off-by-default `hist-route` feature is the one configuration that forwards it, and nothing the GUI takes enables that. The Phase-3 enabler."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `engine` — a runtime / simulation / transport core over the domain crates.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 30

# ⚠ **This table did not exist until 2026-09-23** — see `src/lib.rs`'s `named_run` comment, which
# used its absence as half an argument.
[features]
# **The ROUTE half** (`src/route.rs`): the local-or-wire decision
# `docs/decisions/0084-only-the-datahub-touches-the-store.md` leaves every reader with, plus the
# one call that opens whichever arm it named.
#
# It is a FEATURE rather than an ungated module because its LOCAL arm names the concrete
# `DataFusionHist`, and this crate is the light one nine others take — the vike-data edge comment
# below carries the whole argument and the lane that holds it. With this OFF the crate is exactly
# what it was before the module arrived: no vike-secrets, no vike-config, no Arrow, no DataFusion.
#
# ⚠ ONE feature rather than three, on the precedent `crates/vike-report/Cargo.toml`'s `journal`
# states: the three arrive together and leave together, because `open_routed_history` names all
# of them in one function and splitting them would publish configurations nobody has a use for.
hist-route = ["vike-data/hist-datafusion", "dep:vike-secrets", "dep:vike-config"]

[dependencies]
# The SHARED node-protocol substrate: the HMAC-SHA256 nonce-challenge handshake generalized over
# its domain separator (`auth`) and the length-prefixed frame codec (`frame`). ⚠ Both were
# `vike-datahub-client`'s until 2026-09-23 and moved to the crate BELOW both node protocols, so the
# two clients could stop being a ladder; that crate's own doc carries the measurement. It names no
# vike-* crate at all, so this edge adds no package to any graph that did not already carry
# hmac/sha2/rand transitively.
vike-node-proto = { path = "../vike-node-proto" }
# The `HistStore` TRAIT (+ its query/error/row types) — DEFAULT features, so NO hist-datafusion:
# `RemoteHistStore` IMPLEMENTS the trait purely by RPC and never names the concrete `DataFusionHist`
# backend. Keeping this edge DataFusion-free is the WHOLE POINT of the Phase-2 split — the GUI links
# this crate, which must stay light. (The concrete engine lives only in vike-datahub, behind its
# `serve-datafusion` feature.)
#
# ⚠ **`hist-route` above is the ONE feature that forwards `hist-datafusion` onto this edge, and
# the split is what keeps the point intact rather than undoing it.** That module has to open the
# LOCAL arm of the route it decides, and the concrete backend is the only thing that opens one.
# What protects the GUI is not this edge's default features alone — it is that `vike-studio` and
# `vike-studio-core` take this crate with DEFAULT features and take `vike-backtest` as
# `features = ["hist-replay"]`, the trait-only half, which forwards nothing. The
# `studio-standalone` lane (`scripts/ci_feature_suite.sh`) asserts that STRUCTURALLY, with a
# `cargo tree` that must print no datafusion crate at all — so the day somebody enables this
# feature anywhere in the Studio's graph, a lane says so rather than a reviewer noticing.
vike-data = { path = "../vike-data" }
# The domain value types the wire carries (Bar / QuoteTick / TradeTick / SymbolProperties) — already
# serde in vike-model, so the proto reuses those derives rather than growing its own mirror types.
vike-model = { path = "../vike-model" }
# The `Instrument` the venue-catalog verb carries (`catalog.rs`), and the `CatalogProvider` /
# `CatalogSource::ServerBacked` seam its client-side consumer implements
# (`docs/decisions/0062-a-venue-catalog-fetch-is-an-observe-verb-and-not-a-write.md`).
#
# ⚠ It adds NO PACKAGE to this crate's graph, which is why the edge is taken rather than mirrored:
# vike-catalog's whole dependency set is vike-model + serde + serde_json, and all three are already
# here. The alternative — a second `Instrument`-shaped DTO declared in `proto.rs` — would be a
# parallel type with nothing holding it equal to the one the picker actually stores, i.e. exactly
# the `pub use` shim failure the conventions forbid, wearing a struct instead of a re-export.
# vike-catalog is layer 20 to this crate's 30, so the edge is down-only.
vike-catalog = { path = "../vike-catalog" }
serde = { workspace = true }        # derive on the Request/Response wire enums (proto.rs)
serde_json = { workspace = true }   # the length-prefixed frame payload codec (proto.rs)
# The SHARED node-auth primitive (`node_auth.rs`) both localhost services sign with — HMAC-SHA256
# over a domain-separated nonce challenge. These are the EXACT crates
# `crates/vike-bridge-core/src/signer.rs` already links (hmac 0.13 + sha2 0.11), so this adds ZERO
# new external packages to the workspace audit surface (deny.toml bans a second crypto crate). The
# `Mac` trait's constant-time `verify_slice` is the verification path — no `subtle`, no `==` on the
# mac bytes. They arrived here from vike-tradehub-client when 0025 was adopted: this is the LIGHT
# crate BELOW both node protocols, and the module is generalized over its domain constant rather
# than copied. Still no transport and no I/O — the keys come from a caller-supplied map.
hmac = { workspace = true }
sha2 = { workspace = true }
# The per-connection auth NONCE (`node_auth::fresh_nonce`) — 32 bytes from the OS-backed default
# generator, which is what makes a captured handshake transcript unreplayable against a later
# connection. It lives HERE rather than in either server because ruling 7 gave the node protocol a
# SECOND daemon and that one is `vike-backtest`, which
# `crates/vike-ops/tests/clock_pin.rs`'s `no_scoped_crate_declares_an_rng_dependency` forbids from
# naming an RNG at all — it is one of the two sides `tests/r7_gate.rs` compares bit for bit, and
# randomness in the fold breaks replay exactly as a wall clock does. Already a workspace dep, so no
# new package enters the audit surface, and it adds no transport and no I/O to this light crate.
rand = { workspace = true }
# ROUTE-ONLY (`hist-route`). The node keys the wire arm signs with come from the credential STORE
# rather than the environment — both boxes migrated to the settings database on 2026-09-14, so
# the datahub pair is a row and an env read would resolve `None` and connect unauthenticated.
# vike-secrets is layer 15 to this crate's 30 and carries no vike-* edge but vike-model, which is
# already here, so the feature adds one workspace crate and no external package.
vike-secrets = { path = "../vike-secrets", optional = true }
# ROUTE-ONLY (`hist-route`). `DEFAULT_DATAHUB_ADDR` — the compiled peer an unconfigured reader
# dials, and the ONE place this workspace spells it. ⚠ The `VIKE_DATAHUB_ADDR` NAME is spelled
# separately in `route.rs` and deliberately so: `vike_ops::scan` resolves constants CRATE-WIDE, so
# importing that one would take this crate's read out of the settings-registry sweep. The constant
# that is a VALUE is imported; the constant that is a KEY is spelled, and a test holds them equal.
vike-config = { path = "../vike-config", optional = true }

[dev-dependencies]
# End-to-end loopback test: drive the REAL vike-datahub `serve` over a `MemHistStore` and read it
# back through `RemoteHistStore`. A DEV-dependency (NOT a library dep) — the client library never
# depends on the server, so the down-only lib graph stays clean and DataFusion-free; this is the
# same upward-dev-dep pattern the workspace already uses (vike-core [dev]-> vike-script, etc.).
# vike-datahub's vike-backtest edge is `hist-replay` (DataFusion-free), so even the test build pulls
# no Arrow/DataFusion tree.
vike-datahub = { path = "../vike-datahub" }
# The DataFusion-free in-memory `HistStore` double the loopback server runs over (behind vike-data's
# `test-support` feature; unified onto the default-features dep above only for the test/bench build).
vike-data = { path = "../vike-data", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is the sole
# crate that does NOT inherit this.
[lints]
workspace = true
