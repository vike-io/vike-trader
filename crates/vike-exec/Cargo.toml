[package]
name = "vike-exec"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core - the live-exec fold: ManagedOrder FSM, per-venue Account, RiskGate, EventBus, the ExecutionClient seam, reconciliation core, the producer-side ingest lanes and the published read model (CoreSnapshot)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain` — one hop over the vocabulary: a single-purpose pure core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 20

[dependencies]
vike-model = { path = "../vike-model" }
serde = { workspace = true }
serde_json = { workspace = true }   # recon divergence payloads + snapshot serde
indexmap = { workspace = true }
tokio = { workspace = true }        # ingest mpsc (core does blocking_recv off-runtime)
tracing = { workspace = true }      # coarse per-order spans + fault-transition events (NOT in the hot fold)
core_affinity = { workspace = true } # opt-in VIKE_PIN_CORES thread pinning (affinity module; OFF by default)
# ustr is NOT workspace-pinned (only vike-model depends on it directly, with its own
# `version = "..."` — see crates/vike-model/Cargo.toml); `{ workspace = true }` here would fail
# workspace resolution since the key doesn't exist under the root Cargo.toml's
# `[workspace.dependencies]`. recon::resolve interns FillEvent's venue/symbol/commission_asset
# (Ustr) so this crate needs its own pin, matching vike-model's version (see vike-ibkr's identical
# comment for the same reason). `serde` is declared HERE and not merely inherited by feature
# unification through vike-model: `AccountSnapshot` (engine_snapshot.rs) serializes `Ustr` keys
# directly, so this crate's own build must enable it or the journal DTO stops compiling.
ustr = { version = "1.1", features = ["serde"] }

[features]
# The workspace's "one owned double behind a `test-support` feature" convention (root CLAUDE.md):
# `testing::{RecordingClient, TestExecutionClient}` and `recon::FakeReconClient` are gated
# `#[cfg(any(test, feature = "test-support"))]`, so a default (production) build never compiles
# them. ⚠ Until 2026-10-03 they were UNGATED `pub` items — a fake venue that fills every order at
# the requested price, compiled into every binary linking this crate, the order-signing daemon
# included, behind nothing but a "NEVER trade against these" doc line. Consumers enable it as a
# DEV-dependency feature, never on a normal edge. Empty/additive: it pulls in no dependency.
test-support = []

[dev-dependencies]
# Self-referential dev-dep, the `vike-model`/`vike-bridge-core` idiom: it turns `test-support` on for
# THIS crate's own `tests/` targets (an integration test compiles the lib WITHOUT `cfg(test)`, so the
# doubles are visible to it only through the feature). Never affects a normal build;
# `crates/vike-ops/tests/architecture/layer_gate.rs` discounts a self-edge in both directions.
vike-exec = { path = ".", features = ["test-support"] }
serde_json = { workspace = true }
# Property suite over the ManagedOrder FSM (tests/order_fsm_props.rs): randomized lifecycle
# folds beside the r5 fixture pins. Workspace-pinned; the root manifest carries the rationale
# (dev-dependency only — never reaches the shipped binary's SBOM).
proptest = { workspace = true }

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
