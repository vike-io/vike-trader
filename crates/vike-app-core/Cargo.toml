[package]
name = "vike-app-core"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
# Test discovery is OFF so every `tests/*.rs` keeps its path while the plain suites link as ONE binary,
# `tests/integration.rs` (each a module of it); the `[[test]]` rows at the end are every test binary, and
# `crates/vike-ops/tests/hygiene/test_registry_gate.rs`'s `every_root_test_file_is_built_where_discovery_is_off` fails on a root file no row or module builds.
autotests = false
description = "vike-desktop's eframe-free / wgpu-free logic, extracted so it runs in CI (like vike-chart): live-data sink wiring (DataClientSinkGuiFeed/L2BookStore/TickStore), the CoreSnapshot-to-render-model fold, backend connection/registry state, and the per-window view model (WindowView, in ui::windows::view; the datahub poll that fetches the tools' data is vike-datahub-client's; orderflow and tick/volume aggregation live in vike-orderflow). vike-desktop (the wgpu GUI shell) depends on it; egui IS used (the window/windows draw modules) but nothing here touches eframe/wgpu, so it builds and tests on CI."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `ui-shell` — an egui shell assembled from the widget crates.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 80

[features]
# `src/test_support.rs` and `ui::caption::test_shapes`: the fixtures a `src/` unit test, an
# integration suite and vike-desktop's chart-window tests share (a catalog row, the planted
# preferences store, a dead address, a datahub dial, the one-pass shape read-back), compiled once in
# the library. Only dev-dependency edges turn it on (this crate's own and vike-desktop's). It forwards
# `vike-secrets/test-support` for `plant_settings_rows` and `vike-ui-theme/test-support` for
# `painted`, the two test-only modules it calls; no dependency is added.
test-support = ["vike-secrets/test-support", "vike-ui-theme/test-support"]

[dependencies]
# The SHARED hub-protocol substrate: the HMAC-SHA256 nonce-challenge handshake generalized over
# its domain separator (`auth`) and the length-prefixed frame codec (`frame`). ⚠ Both were
# `vike-datahub-client`'s until 2026-09-23 and moved to the crate BELOW both hub protocols, so the
# two clients could stop being a ladder; that crate's own doc carries the measurement. It names no
# vike-* crate at all, so this edge adds no package to any graph that did not already carry
# hmac/sha2/rand transitively.
vike-hub-protocol = { path = "../vike-hub-protocol" }
# Pure logic modules — NO eframe/wgpu (that's why this crate rides the derived CI roster, unlike
# the shell, `vike-desktop` — `vike-app` when this was written). They wire
# the live-data seam onto the core lanes, aggregate orderflow/tick/volume bars, and hold the tool
# view/data model + REST fetchers.
vike-model = { path = "../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../vike-venues" }
# The pure helpers (decision 0141, layer 3) this crate calls: `atomic_file`.
vike-utility = { path = "../vike-utility" }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../vike-paths" }
vike-catalog = { path = "../vike-catalog" }
# The order vocabulary AND the read model (`CoreSnapshot`, `VenueBlock`, ...) the observe bridge
# rebuilds from the wire. This crate links NO vike-core:
# `docs/decisions/0115-the-read-model-lives-in-vike-exec-and-the-gui-does-not-link-vike-core.md`.
# No default features: `runtime` is the lane senders (`tokio`, `core_affinity`), which a client never holds.
vike-execution = { path = "../vike-execution", default-features = false }
vike-data = { path = "../vike-data" } # feature-free: only the pure SeriesId/SeriesCoverage + live seam (no DataFusion)
# The inventory tree-model (build_inventory_tree/DataManagerInventoryVenue/…) lives here and is named here —
# at `vike_data_manager`'s root. The `vike_app_core::inventory` alias was deleted 2026-09-27.
vike-data-manager = { path = "../vike-data-manager" }
vike-orderflow = { path = "../vike-orderflow" }
vike-chart = { path = "../vike-chart" }
# The indicator catalog the chart's study picker lists (`Category`, `IndicatorMeta`, `registry`), named
# under its one path: vike-chart no longer re-exports it (D52). Already in this tree through vike-chart.
vike-indicators = { path = "../vike-indicators" }
# shared egui trading widgets — the Trade window's ladder and ticket live here (`vike_order_entry::trade_window`;
# WindowView.trade / trade_actions), as the DOM ladder did after it moved out of vike-chart, and the one
# order dispatcher (`vike_order_entry::dispatch`). No egui_plot/wgpu. Also the Polymarket scalp-cockpit widgets the Polymarket
# tool window mounts (`vike_order_entry::cockpit`: chain rail / Price-to-Beat header / probability ladder /
# one-click ticket); their per-window view state lives in WindowView (cockpit_* fields).
vike-order-entry = { path = "../vike-order-entry" }
vike-options = { path = "../vike-options" }
# The option-chain snapshot TYPES the Options tool holds (`OptionChain`, `Expiry`, `OptionQuote`,
# `OptionChainStrike`, `OptionKind`) moved out of vike-options into vike-marketdata (decision 0126); the
# maths and the chrono-using constructors stay in vike-options above. Layer 5, serde only, and
# already in this crate's `Cargo.lock` entry through the dev edge below, so the lockfile is unchanged.
vike-marketdata = { path = "../vike-marketdata" }
# (A `vike-analytics` edge stood here for the Tearsheet's Summary tab, its only reader in this crate. It
# left with the window for `vike-account-window` (top layers, wave 2), whose manifest carries its reason.)
# The Account window (layer 75), its History tab (the former Execution-history window) included: its
# body, the equity view-model and the page types its History tab is handed. This crate keeps the wiring,
# `ui/windows/account.rs`, over `WindowToolContext` and `WindowView`, and the History READ,
# `data/execution_history.rs` (a widget opens no connection); the Trade window reads the Account
# window's `delay_badge`, `order_client_id_words` and `not_running_because` from it.
vike-account-window = { path = "../vike-account-window" }
vike-ui-theme = { path = "../vike-ui-theme" } # canonical palette (rail.rs) — no more hand-copied Color32 consts
# The Data Manager's Gateway destination renders vike-account-manager's credential grid
# (`account_manager_ui` over an `AccountManagerGrids`, which carries the `vike_secrets::credentials::StoreHealth`
# of its own reads), and the catalog refresh reads its `venues_with_credentials`. ⚠ This said the edge was for "reconcile_config's feed-status → health map"
# until 2026-09-28: `reconcile_config` left this crate (it is vike-tradehub's now) and `feed_status`
# lives in vike-model. vike-account-manager depends on vike-model/vike-secrets/vike-ui-theme — nothing
# that reaches back here — so this stays a down-only edge (no cycle back to vike-app-core).
vike-account-manager = { path = "../vike-account-manager" }
# The News window (layer 75): this crate holds its view state (`WindowView::news`) and builds its inputs
# (`WindowToolContext::news_inputs`) from the datahub poll's snapshot.
vike-news = { path = "../vike-news" }
# The Calendar window (layer 75): this crate holds its view state (`WindowView::calendar`) and hands it
# the poll's snapshot, the decoded flags and the display zone (`ui/windows/calendar.rs`).
vike-calendar = { path = "../vike-calendar" }
# The TYPED settings model — the Settings window's appearance rows (`ui::appearance_settings`) write
# through `write_setting_row` (the loader-validated, atomic per-key write) and read the
# `Preferences` vocabulary. ⚠ It is deliberately NOT `vike-tradehub-core`: the desktop links no mount, and
# such an edge would put every venue bridge into its only build. vike-config is layer 20 and depends
# on vike-model + serde/toml only, so this edge adds no compile weight.
vike-config = { path = "../vike-config" }
# The settings-database access for the Data Manager's proxy box: `save_polymarket_proxy` writes the
# `venue.polymarket.socks_proxy` row (`set_venue_setting_in`, which journals the write) and
# `seed_polymarket_proxy_box` reads it back (`venue_setting::load_venue_settings`) — decision 0095.
# vike-secrets names nothing above the vocabulary floor but the change journal one rung over it
# (vike-change-journal, a declared tier-15 exception row, which this manifest declares too), so this
# edge brings nothing behind it that this crate does not already carry.
# ⚠ That read "carries no vike-* dependency of its own, so this adds no layering edge" until
# `docs/decisions/0072-vike-secrets-takes-one-vike-edge-and-is-not-split.md` (accepted 2026-09-20)
# admitted vike-model there. Both halves were loose and are corrected together: the property is the
# RANK (tier `leaf` means AT MOST THE FLOOR, machine-checked by
# `crates/vike-ops/tests/architecture/layer_gate/tiers.rs`'s
# `every_tier_15_crate_names_nothing_above_the_vocabulary`, whose one exception row is that journal
# edge), and this edge always added a layering edge — what it does not add is WEIGHT, since this
# manifest already declares vike-model and vike-change-journal itself.
vike-secrets = { path = "../vike-secrets" }
# The change journal (the appearance and Data Manager records, src/ui/). It was
# a module of vike-secrets until it moved into its own crate (layer 12); it names only
# vike-model, vike-utility, serde and serde_json, all already in this graph.
vike-change-journal = { path = "../vike-change-journal" }
# ⚠ A `vike-bridge-core` edge stood here until decision 0095: it existed for exactly one caller,
# `save_polymarket_proxy`, which handed `vike_bridge_core::credentials::classify_credential_name` to
# `vike_secrets::save_credentials_to_store` (its journalled form). That function writes a venue-setting row now
# and names no classifier, so nothing in this crate names `vike_bridge_core` any more, and the edge
# went with its only reader. Since docs/decisions/0135 moved the credential half into `vike-secrets`,
# `vike-account-manager` above no longer carries it either: bridge-core is out of this closure.
# thin-client Scope::Control WRITE path (`tradehub_control`): the CommandWire vocabulary +
# TradehubControlHandle the desktop observer uses to drive a remote headless vike-tradehub daemon's
# core. LIGHT + DataFusion-free (serde + framing + in-tree hmac/sha2 only), so this stays a
# down-only edge with no heavy compile weight — the shell (`vike-desktop`) already links this crate
# for the observe bridge. (It named `vike-app --observe` until 2026-09-28.)
vike-tradehub-client = { path = "../vike-tradehub-client" }
# The datahub wire client (`backfill`): the Data-Manager/chart-gap backfill's REMOTE arm
# (split-plane REQ-9, GUI half) drives `DatahubClient::backfill` from here so the routing logic is
# CI-tested against scripted loopback servers instead of living untestable in the shell's main.rs.
# LIGHT + DataFusion-free (serde + framing over one blocking TcpStream, layer 25) and already in
# the shell's own tree unconditionally (`vike-desktop` names it directly), so this down-only edge
# adds no new compilation weight to its one build. (It said `vike-app` and "either build" until
# 2026-09-28.) `tool-feeds-poll`: the tool windows' poll snapshot (`WindowToolContext::tool_feeds`), off by
# default in that crate because no headless consumer runs it.
vike-datahub-client = { path = "../vike-datahub-client", features = ["tool-feeds-poll"] }
# `vike_client::attach`: the Server group attaches this PC to its server IN THIS PROCESS (the device
# key, its registration over ssh or `docker exec -i`, a guest's invitation, the tunnel), the ONE
# implementation `vike-cli backend connect` calls too, so a user with only `vike-desktop` needs no
# `vike-cli` beside it. Also the rules the programs and the desktop answer alike: the one device-key
# read (`resolved::device_key_of`) and the journalled dial-row write (`settings_row`). Layer 30, down-only;
# its closure (the hub clients, `vike-boot`, `vike-rhai`,
# `vike-indicators`) is already in the desktop's, and it carries no backtest engine and no DataFusion.
vike-client = { path = "../vike-client" }
# `vike-desktop --mcp` (`src/backend/mcp_mode.rs`): the MCP server `vike-mcp` is, its own start and loop
# (`vike_mcp::boot`, `vike_mcp::run`), so an agent host launches the desktop a user installed and no second
# program. Layer 35, down-only; it adds rmcp, tokio's `rt` and schemars, and no backtest engine or DataFusion.
vike-mcp = { path = "../vike-mcp" }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true } # the window module (window state/layout/workspace/rail) is egui — but NOT eframe/wgpu, so still CI-able
indexmap = { workspace = true } # deterministic window ordering in the workspace state
chrono = { workspace = true }
# (`libm` left 2026-09-27 with `nice_orderflow_tick`, now `vike_orderflow::bar_agg`; this crate names no
# transcendental any more, and `tests/libm_platform_probe.rs` keeps it that way.)
tracing = { workspace = true } # tool-fetcher / sink diagnostics (subscriber lives in vike-log)
# Help → Console reads `vike_log::recent::RecentLines`, the tail the desktop hands `vike_log::init`
# (`crates/vike-app-core/src/ui/help.rs`). Already in this graph as the dev edge below, so no package
# is added.
vike-log = { path = "../vike-log" }
# Help → About prints the build's version line facts (`GIT_SHA`, `BUILD_TIMESTAMP`, `TARGET`). A
# zero-dependency leaf this crate already reached through `vike-client` → `vike-boot`, so the edge
# adds no package and no rebuild.
vike-buildinfo = { path = "../vike-buildinfo" }

[dev-dependencies]
# `vike_execution::testing::position_view`, the read-model position the order-dispatch tests build over.
# Widens the normal edge; no new package.
vike-execution = { path = "../vike-execution", features = ["test-support"] }
# `vike_datahub_client::test_support::accept_keyless`, the key-less handshake the scripted fake datahubs
# open every connection with (this crate kept it in `tests/common/mod.rs` until 2026-10-31, compiled once
# per binary). The NORMAL edge above carries the client; this dev edge only turns `test-support` on.
vike-datahub-client = { path = "../vike-datahub-client", features = ["test-support"] }
# `vike_log::poll::wait_until`, the one test polling loop `tests/common/poll.rs`'s `until` asserts over
# (dev only).
vike-log = { path = "../vike-log", features = ["test-support"] }
# The Help → Console test logs through a real `fmt` layer into the tail, the way `vike_log::init`
# installs it (`crates/vike-app-core/src/ui/help_tests.rs`). Already in the graph through `vike-log`.
tracing-subscriber = { workspace = true }
# vike-model's `test-support` for the `vike_model::test_support` helpers this crate's tests name. A DEV
# edge with the feature, never a normal one: a normal edge would compile them into shipped builds.
vike-model = { path = "../vike-model", features = ["test-support"] }
# The shared libm walk (decision 0074): `vike_utility::libm_walk` holds the text parser this crate's
# `libm_platform_probe` used to keep a private copy of. A DEV edge with the feature, never a normal
# one — `test-support` is gated `#[cfg(any(test, feature = "test-support"))]` and a normal edge
# would compile it into shipped builds. `cargo package` strips a dev-dependency carrying no
# version, so a published closure is untouched.
vike-utility = { path = "../vike-utility", features = ["test-support"] }
# ⚠ TOMBSTONE — a `vike-ops` DEV edge stood here until 2026-10-12, for ONE reader:
# `tests/credential_editor_completeness_gate.rs`'s `vike_config::settings::all_settings`. The
# registry moved into `vike-config` (decision 0085's Verdict 3), which this crate already links
# normally, so the edge went with its only reader.
# The headless render gates of the tool windows (`tests/screens/data_manager_screens.rs` and its
# siblings). ⚠ It is the accessibility TREE that makes them possible: a screen's promise is that a
# control REACHES the screen, and a pure test of the view-model would stay green with the renderer
# wired to nothing. The same argument (and the same dependency) as `vike-account-manager`'s
# `connections_a11y.rs`. NO wgpu / NO snapshot — see the workspace manifest's `egui_kittest`
# rationale. Already a workspace dependency, so it adds no package to the `cargo deny` surface.
egui_kittest = { workspace = true }
# `harness::type_ready` — the ONE first-frame guard the kittest harnesses above open with: the tool
# windows draw icons and named weights, whose families only the app's bundled type binds, and
# kittest's build-time frame runs on egui's default fonts. The feature adds a module, no
# dependency, and the crate is already a normal dependency, so the lockfile is unchanged.
vike-ui-theme = { path = "../vike-ui-theme", features = ["test-support"] }
# `vike_chart::test_support::user_scaled`, the user study the workspace's save-by-name tests
# (`src/ui/window/workspace/persist_tests/user_studies.rs`) install: vike-chart's own indicator tests use the
# same one. The NORMAL edge above carries the chart; this dev edge only turns `test-support` on, so
# the lockfile is unchanged.
vike-chart = { path = "../vike-chart", features = ["test-support"] }
# the DataFusion-free HistoryStoreMemory test double (`data::stored`' tests).
vike-data = { path = "../vike-data", features = ["test-support"] }
# The settings-row tests (`ui::appearance_settings`, `tests/screens/settings_window.rs`,
# `tests/polymarket_proxy_journal.rs`) plant a fixture store straight into the database —
# `plant_settings_rows` is vike-secrets's own test-only fixture,
# behind this feature so a default build never compiles it. The normal dependency above stays
# feature-bare; dev-dependency features are not unified into it.
vike-secrets = { path = "../vike-secrets", features = ["test-support"] }
# `vike_account_manager::test_support` — the dry `AccountManagerCredentialWrite`, the typed values and the pencil's
# name `tests/data_manager_credentials_panel.rs` shares with the panel's own suites. The NORMAL edge
# above carries the panel; this dev edge only turns `test-support` on, so no package is added.
vike-account-manager = { path = "../vike-account-manager", features = ["test-support"] }
# The shared flat-bar builder (`vike_marketdata::test_support::flat_bar_unit_volume`), which the
# fold/direct-bar tests (`src/ui/*_tests.rs`) and `src/data/data_sink_tests.rs` each used to re-type.
# A DEV edge with the feature, never a normal one: `test-support` is gated
# `#[cfg(any(test, feature = "test-support"))]` and a normal edge would compile the builders into
# shipped builds. vike-marketdata is layer 5 and names no vike crate, so there is no cycle; the
# library already reaches it through vike-model, and this adds one `vike-app-core` line to
# `Cargo.lock`'s dependency list.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }
# `vike_tradehub_client::test_support::observe_frame::full_wire_snapshot`, the one fully populated observe frame
# the Trade-window and portfolio tests fold through `observe_decode::wire_to_core` (it moved down with the decode,
# D56). The NORMAL edge above carries the client; this dev edge only turns `test-support` on, so no package is
# added and no shipped build compiles the scripted node (`crates/vike-ops/tests/architecture/test_surface_gate.rs`).
vike-tradehub-client = { path = "../vike-tradehub-client", features = ["test-support"] }
# `vike_options::test_support::{test_option, test_delta_one}`: the deribit instrument builders the
# Greeks tests (`src/orders/option_chain_position_greeks_tests.rs`) index. They kept a copy beside the Options poll
# until the poll moved to vike-datahub-client. A dev-only feature on the normal edge.
vike-options = { path = "../vike-options", features = ["test-support"] }
# Self-referential dev-dep (the `vike-execution`/`vike-model` idiom): turns `test-support` on for THIS
# crate's own test targets, so `src/test_support.rs` compiles once in the library.
vike-app-core = { path = ".", features = ["test-support"] }
# back for `window::workspace`'s disk round-trip: a FIXED `<temp>/<name>` is unusable on a box
# where CI and agents run as different users (whoever creates it owns it), so the test takes a
# unique self-deleting directory instead.
tempfile = { workspace = true }

# Every test binary (discovery is off: `autotests` above). `integration` holds every plain suite as a module;
# `screens` and `market_data_session_scripted` are the two suites over `tests/common/`. Four stay one binary
# each because they write PROCESS state a sibling thread would race: `datahub_device_dial` and
# `hub_key_store_spellings` refresh the device-key cell (`vike_app_core::backend::registry::fill_hub_keys`),
# `workspace_state_dir_declaration` declares the once-per-process state folder, and `server_link_in_process`
# re-runs its own binary by exact test name (and is `cfg(unix)`).
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "screens"
path = "tests/screens.rs"

[[test]]
name = "market_data_session_scripted"
path = "tests/market_data_session_scripted/main.rs"

[[test]]
name = "datahub_device_dial"
path = "tests/datahub_device_dial.rs"

[[test]]
name = "hub_key_store_spellings"
path = "tests/hub_key_store_spellings.rs"

[[test]]
name = "workspace_state_dir_declaration"
path = "tests/workspace_state_dir_declaration.rs"

[[test]]
name = "server_link_in_process"
path = "tests/server_link_in_process.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`. This crate is unsafe-free.
[lints]
workspace = true
