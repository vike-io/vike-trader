[package]
name = "vike-model"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — domain model (Bar/ticks/orders/events) + the compute_fill primitive. Exact port of vike-trader-app core/model, core/ticks, core/fill, core/order_intent, exec/events."
# The integration tests are ONE test binary, `tests/integration.rs` (every `tests/<name>.rs` a `mod` of it), declared
# below: one binary links instead of one per file. Discovery is off so each file keeps the path its citations name; a
# new root file builds only as a `mod` there or a `[[test]]` row (`crates/vike-ops/tests/hygiene/test_registry_gate.rs`'s `every_root_test_file_is_built_where_discovery_is_off`).
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `vocabulary` — vike-model itself: the shared domain vocabulary every other layer names.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 10

[dependencies]
# The MARKET-DATA vocabulary — `Bar`, the two tick types, `L2Book`/`L2BookUpdate` and the
# `BarConsolidator` — which lived in THIS crate until the split. It declares `layer = 5`, below
# this crate, and carries one dependency of its own (`serde`), so taking it costs a consumer of
# vike-model nothing it was not already paying. This crate's own signatures name its types (a
# `OrderBroker` method takes a `vike_marketdata::L2Book`) but re-export none of them: every consumer
# spells `vike_marketdata::X` and takes its own edge (decision 0067's amendment).
# `crates/vike-marketdata/src/lib.rs`'s module doc argues the split and names what did NOT move.
vike-marketdata = { path = "../vike-marketdata" }
# The formula floor (decision 0294): `layer = 2`, carrying only `libm` (already a dependency here), so
# taking it costs a consumer of vike-model nothing it was not already paying. `money/ledger.rs`'s
# `ledger_sums` (`summation::compensated_sum`) calls it; nothing re-exports it.
vike-math = { path = "../vike-math" }
# The pure non-math helpers (decision 0141) that were this crate's `util` module, and the civil
# calendar's two primitives that were `time`'s: `layer = 3`, below this crate, std only. The
# order-client-id session prefix (`hex`), `fnv` and `time` (`calendar`) call it; nothing re-exports it.
# `serde`: `ProfileRisk::keys`, the `[risk]` keys as serde's derive lists them (`serde_fields`).
vike-utility = { path = "../vike-utility", features = ["serde"] }
serde = { workspace = true }
# JSON documents (an OLD strategy state's sidecar reads through it, `StrategyState::from_json_value`) and
# the params and wire types' text forms: a real dependency, not just test/bench scaffolding.
serde_json = { workspace = true }
# A strategy's durable state is msgpack with field names (`src/strategy/state.rs`'s `StrategyState`, decision
# 0296's ABI 15): encoded from the strategy's own serde types, it crosses a strategy file's ABI, the live
# pipe and the state sidecar as the same bytes. It adds a crate to every strategy file's link (the
# workspace already pins it for the hub protocols), the price of not formatting a 227 KB state as text
# every second.
rmp-serde = { workspace = true }
indexmap = { workspace = true }  # insertion-ordered maps: the own-order ladder (own_order.rs) and the per-venue knob (rate_limits.rs)
# High-cardinality id fields (trade_id / venue_order_id / reason): SSO string, inline ≤24 B else heap,
# serde-transparent. NOT interned (unbounded per-fill cardinality would leak the never-freed
# `vike_marketdata::Symbol` table, the interned venue/symbol of the Event schema — see events.rs).
compact_str = { workspace = true, features = ["serde"] }
# The geometric ladder's `libm::pow` (`strategy/maker_params.rs`'s `ladder_size_multiplier`): the platform-
# independent transcendental of decision 0032, the one site of the workspace's `powi` census where the two
# platforms measurably disagreed.
libm = { workspace = true }
# `profile.json`'s `data.kind` and `[risk]` (`vike_backtest::run::profile_surface`): the `JsonSchema`
# derive on `run_request::replay::ReplayKind` and `ProfileRisk`, field types of the backtest profile.
# Optional and off, so no shipped build carries it (owner ruling 8, 2026-11-11).
schemars = { workspace = true, optional = true }

[features]
# The `JsonSchema` derives a profile field type carries (`ReplayKind`, `ProfileRisk`). Only
# `vike-backtest`'s own `profile-schema` feature turns it on, and nothing that ships turns that on.
profile-schema = ["dep:schemars"]
# Exposes the shared `strategy::OrderBrokerMock` (the `OrderBroker` test double) as a `pub` item for the
# strategy-layer crates' tests — one recording mock instead of a near-identical copy per crate
# (Phase 4 test-support consolidation). Empty/additive + the mock is gated
# `#[cfg(any(test, feature = "test-support"))]`, so a default (production) build never compiles it.
# Mirrors the `vike-data` `test-support` model; consumers enable it as a dev-dependency feature.
# The same gate compiles `scan` and `test_support` (helpers
# several crates' tests used to copy: `fn_body`, `as_test_params`, the ETXTBSY budget, `assert_bars_bit_eq`).
# The shared libm walk is `vike_utility::libm_walk` since 2026-11-22 (decision 0074's amendment).
# ⚠ A NORMAL edge enabling it falsifies every "never compiles it" in this crate — vike-chart's did,
# from #2031 to 2026-10-03, into vike-desktop. crates/vike-ops/tests/architecture/test_surface_gate.rs refuses one.
test-support = []

[dev-dependencies]
# Self-referential dev-dep, the `vike-indicators`/`vike-ml-training`/`vike-bridge-core` idiom: it turns
# `test-support` on for THIS crate's own `tests/` targets (an integration test compiles the lib
# WITHOUT `cfg(test)`, so `test_support` is visible to it only through the feature), and it is what
# puts the feature on a CI lane. Never affects a normal build; `crates/vike-ops/tests/architecture/layer_gate.rs`
# discounts a self-edge in both directions.
vike-model = { path = ".", features = ["test-support"] }
# strong-types spike benches (dev-only): the head-to-head string/number candidates (the interned one,
# `vike_marketdata::Symbol`, comes through the NORMAL vike-marketdata edge above).
arrayvec = { workspace = true }
rust_decimal = { workspace = true } # fixed-point-vs-f64 numerics bench
# Property-based testing (testing-arch plan Phase 6): tests/scalar_property_tests.rs proves the pinned
# round_to_step/round_to wire-rounding invariants (idempotence, step-multiple) over random inputs.
# Root-pinned; dev-dep only.
proptest = { workspace = true }
# `vike_marketdata::test_support`: the shared bar/tick builders. A DEV edge only; the normal edge
# above already exists, so no lockfile entry.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }
# `vike_utility::libm_walk`, the shared parser `tests/libm_platform_probe.rs` scans with (decision 0074). A DEV
# edge only, onto a crate this one already names normally, so no lockfile entry.
vike-utility = { path = "../vike-utility", features = ["test-support"] }

[[bench]]
name = "strtypes"
harness = false # custom timing harness, repo style (mirrors vike-chart/vike-backtest benches)

[[bench]]
name = "numerics"
harness = false # fixed-point (i64/i128/Decimal) vs f64 — the "parity retired" question

[[bench]]
name = "enumbox"
harness = false # box-the-fill-variants vs inline enum — measure-first on the 208 B god-enum

[[bench]]
name = "orderside"
harness = false # side: i32 vs enum OrderSide (+.sign()) vs signed-qty — the Tier-1b order_side cost

[[test]]
name = "integration"
path = "tests/integration.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
