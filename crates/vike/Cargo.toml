[package]
# ⚠ There is NO `[lib]` section and NO `[[bin]]` for the multicall in this manifest, so BOTH the
# executable and the lib crate follow this name: the shipped artifact is `vike-backend` and the lib
# is `vike_backend`. (The one `[[bin]]` below is the standalone `tearsheet`, which names the multicall
# no differently.)
# Renaming this line renames the release asset, every `ExecStart=` that names it and the container's
# symlink target, with nothing else in the manifest saying so.
name = "vike-backend"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license-file.workspace = true
publish = false

# The multicall dispatcher. Layer 68 — above every headless top-of-graph binary (65) and below the
# egui tiers (70), because it depends on those binaries' crates and nothing may depend on it.
[package.metadata.vike]
layer = 68

[dependencies]
# The one NON-optional dep: the dispatcher itself answers `--version`, and a version printer
# without build identity is what identity_adoption.rs exists to refuse (a release binary was once
# built four commits behind main). Leaf crate, layer 15 — the light lanes stay light.
vike-buildinfo = { path = "../vike-buildinfo" }
# Each tool is an OPTIONAL dependency behind a feature of the same shape as its own binary's
# `required-features`. ⚠ Optional and NOT default: a dispatcher that always linked every tool would
# make `cargo check -p vike-backend` build the whole DataFusion closure for anyone touching the
# routing, and would defeat the per-crate feature lanes that keep the light crates light.
vike-studio-core = { path = "../vike-studio-core", optional = true }
vike-backtesthub = { path = "../vike-backtesthub", optional = true }
vike-datahub = { path = "../vike-datahub", optional = true }
vike-tradehub = { path = "../vike-tradehub", optional = true }
vike-cli = { path = "../vike-cli", optional = true }
# The plugin BUILDER service (`docs/superpowers/specs/2026-09-21-runtime-loaded-rust-strategies-design.md`,
# "The builder service") — the one process in this tree that runs `cargo` against an authenticated
# caller's source. Optional and behind its own feature for the same reason as every row above: a
# default `cargo check -p vike-backend` must not link a fifth daemon's tree, and `full` is what
# `.github/workflows/release.yml` builds.
#
# ⚠ This is NOT `34b8d6756` undone. That commit split the builder OUT of `vike-strategy-plugin`
# specifically so a COMPILED PLUGIN (which links only `vike-strategy-plugin`) would not inherit the
# builder's `vike-datahub-client`/`tracing` tree. This dependency is the dispatcher taking on the
# BUILDER's own crate — `vike-strategy-builder` — the same shape as the `vike-tradehub` row above
# taking on the trading daemon. A plugin's link is unaffected: it never sees `vike-backend` at all.
# `cargo tree -p vike-strategy-plugin -e normal --prefix none` (unaffected by this manifest, which
# that crate does not depend on) is the proof this dependency does not touch.
vike-strategy-builder = { path = "../vike-strategy-builder", optional = true }
# The GATEWAY daemon (`docs/decisions/0164-one-daemon-owns-every-venue-connection-vike-gatewayhub.md`,
# wave 1): the one process that owns every venue connection. Optional and behind its own feature for
# the reason every row above is: a default `cargo check -p vike-backend` must not link its tree.
vike-gatewayhub = { path = "../vike-gatewayhub", optional = true }

# ⚠ NOT a tool: the SHARED VOCABULARY one tool's call site needs. `backtest_main` hands
# `vike_model::time::clock::now_unix_secs` to the harness as its clock. Naming an item requires a
# DIRECT edge, so this is that edge, and it is optional behind the features whose arms name it: a
# default `cargo check -p vike-backend` links nothing new. The `tearsheet` feature turns it on too:
# the store reads under `src/tearsheet_cli/` name `Bar`, `Trade` and `FillEvent`.
vike-model = { path = "../vike-model", optional = true }
# The per-venue tables (`caps_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../vike-venues" }
# ⚠ NOT a tool either: `backtest_main` fills `vike_runs::BuildStamp` — the seam a library declares
# and a composition root fills. That module came down to the bottom of the graph when `vike-cli`
# needed to READ a run directory without linking the engine (`crates/vike-runs/src/lib.rs`'s own doc
# carries the argument). Naming a type requires a DIRECT edge, so this is that edge, optional behind
# the one feature whose arm names it.
vike-runs = { path = "../vike-runs", optional = true }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../vike-marketdata", optional = true }

# --- the `tearsheet` feature's body (`src/tearsheet_cli.rs` and its `store`/`excursions` modules) ---
# `vike-journal` below is the journal reader it calls (`fills_from_journal`), and `vike-analytics`
# the fold (`tearsheet_from_fills`); the store reads (`equity_curve_from_store`,
# `mtm_curve_from_store`, `backfill_excursions`) live HERE, under `src/tearsheet_cli/`, because
# the journal reader reads the command journal only. These are what that code NAMES besides
# `vike-model`; each is optional behind `tearsheet` alone, so a default build of the dispatcher
# links none of them. (The `vike-report` crate that held the reader and the fold was dissolved on
# 2026-10-12.)
#
# The journal READ: `fills_from_journal`. Layer 25; also a DEV dependency below (the end-to-end
# test's `JournalFileConfig`).
vike-journal = { path = "../vike-journal", optional = true }
#
# The history route: `route::{datahub_addr_for_bin, history_route, open_routed_history}`.
# `hist-route` is switched on by the `tearsheet` feature below, not
# here — the dep is the same package for every tool that takes it.
vike-datahub-client = { path = "../vike-datahub-client", optional = true }
# The tearsheet reads the datahub hub keys through the credential store handle
# (`vike_secrets::open_credential_store`); layer 15, optional behind `tearsheet`.
vike-secrets = { path = "../vike-secrets", optional = true }
# `HistStore` (the `&dyn` the store reads take) and `TsRange` (the equity series window, the per-symbol bar window).
# DEFAULT features: the trait only, no DataFusion.
vike-data = { path = "../vike-data", optional = true }
# The document and the folds the CLI composes: `LiveTearsheet`, `reconstruct_trades`,
# `equity_curve_from_trades`, `mtm_equity_curve`, `RuntimeStats`, `render_html*`, and the pure
# folds the store reads hand their data to (`equity_curve_from_samples`, `reconstruct_mtm`, `excursions::mae_mfe`).
vike-analytics = { path = "../vike-analytics", optional = true }
# `cli` (decision 0155): the rules the tearsheet CLI reads its argv under, on top of `clap`. The helper floor
# (layer 3, `libm` only); `clap` below is what the `cli` feature adds, behind `tearsheet` alone.
vike-util = { path = "../vike-util", optional = true, features = ["cli"] }
# `#[derive(clap::Parser)]` on the tearsheet CLI's args (decision 0155). OPTIONAL: only `tearsheet` names it.
clap = { workspace = true, optional = true }
# `--json`: `serde_json::to_string_pretty(&sheet)`.
serde_json = { workspace = true, optional = true }

[features]
# ⚠ A FEATURE NAME AND A TOOL VERB ARE NO LONGER THE SAME STRING, and they used to be. The verbs
# dropped their `vike-` prefix (`vike-backend trade`, not `vike-backend vike-tradehub`); these
# feature names did NOT, because each one gates an optional DEPENDENCY whose package genuinely is
# `vike-tradehub`/`vike-datahub`/`vike-cli` — the prefix is accurate here in a way it
# was not on a verb. `crates/vike/src/main.rs`'s `TOOLS` rows carry both strings side by side
# (`#[cfg(feature = "vike-datahub")] Tool { name: "datahub", … }`) and that mismatch is deliberate.
# Renaming a feature here is a manifest+main.rs pair with `full` rewritten in the SAME edit —
# `multicall_gate::resolve_forwards` PANICS on a `full` entry naming a feature this table does not
# define.
default = []
# `study-cli` forwards to the crate feature of the same name — the bin it replaces carries
# `required-features = ["study-cli"]` for the same reason.
study-cli = ["dep:vike-studio-core", "vike-studio-core/study-cli"]
# The `report` tool, and the `tearsheet` bin that shares its body (`[[bin]]` below).
#
# ⚠ **`vike-datahub-client/hist-route` IS THE LOAD-BEARING ENTRY, and it used to be forwarded
# through `vike-report/hist` (that crate is gone).** `--datahub`, and with it `--mtm`/`--venue`/`--interval`, is the
# store-backed path: it routes history through the `config.datahub_addr` row and the hub keys, and
# that route exists only under the client's `hist-route` feature. A build without it cannot reach
# `vike_datahub_client::route` at all. This row once forwarded nothing, and the shipped
# `vike-backend tearsheet --datahub` flags could not work in any artifact; the pair is now in
# `crates/vike-ops/tests/container_deploy/multicall_gate.rs`'s `SHIPPED_TOOL_FEATURES`, so a drop
# from `full` is a red gate, not a quiet exit 2.
#
# The CLI moved here from `vike-report` on 2026-10-11, which is why this row names the crates the
# CLI's body names (`crates/vike/src/tearsheet_cli.rs`) instead of one `vike-report/…` forward:
# `vike-report` was the journal reader alone then and had no feature; it is gone (2026-10-12).
#
# COST, measured by reading the manifests rather than estimated: NONE for a shipped build.
# `vike-datahub-client` is already linked through `backtesthub`, and `vike-data` and `vike-analytics`
# through everything beside it. The row pulls NO `vike-store`: nothing in the
# CLI opens a concrete store (decision 0084 closed the local read door), and `full` gets it
# through `backtesthub` for the data verbs, which WRITE.
tearsheet = ["dep:vike-journal", "dep:vike-model", "dep:vike-marketdata", "dep:vike-datahub-client", "vike-datahub-client/hist-route", "dep:vike-secrets", "dep:vike-data", "dep:vike-analytics", "dep:vike-util", "dep:clap", "dep:serde_json"]
# `backtesthub` is the tool: `dep:vike-backtesthub` carries the whole closure the bin it replaces
# linked (the DataFusion store, the starter-dataset HTTPS client, `vike-studio-core`'s Studio
# runners the `backtesthub --addr` daemon calls directly) — the two features that used to gate it,
# `datafusion-store` and `venue-fetch`, died with the move. NO `vike-studio-core/study-cli` here:
# that feature gates the `study` VERB's CLI and is forwarded by the `study-cli` row above.
backtesthub = ["dep:vike-backtesthub", "dep:vike-model", "dep:vike-runs"]
# `vike-datahub` forwards `datafusion-serve`; without it the tool still answers --help and then
# reports it has no backend, exactly as the standalone binary does.
#
# ⚠ **AND SINCE RULING 10 IT FORWARDS THE RECORDER'S VENUE FEEDS TOO** — there is no separate
# `recorder` verb any more, because `crates/vike-datahub/src/recorder.rs` IS the recorder daemon
# (`docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md` §0.5: one process owns
# venue connections, the store and serving). The two `record-*` rows carry over the warning the
# retired `vike-recorder` feature row made, unchanged and for the same reason: **a dropped venue
# here ships a daemon that records nothing for it — silently, since an unconfigured venue looks the
# same as an unbuilt one.** `crates/vike-ops/tests/container_deploy/multicall_gate.rs`'s `SHIPPED_TOOL_FEATURES` is
# the second spelling that catches a drop.
# ⚠ **`backfill-serve` JOINED 2026-09-15, and its ABSENCE was the reason a released box could not
# paint a 5m/15m/1h chart.** The feature has existed and been wired since split-plane REQ-9 —
# `crates/vike-datahub/src/datahub_cli.rs` mounts `backfill::real_backfill_table` behind it, and
# `crates/vike-datahub/tests/backfill_roundtrip.rs` proves request → store → `BackfillDone` →
# `LoadBars` every PR — but `full` never forwarded it, and `.github/workflows/release.yml` builds
# `--features full`. So every deployed datahub omitted `backfill` from `Welcome.features` and
# answered `Request::Backfill` with `server/backfill.rs`'s `backfill_verb` refusal naming this very feature:
# the daemon told its own operator how to fix a build nobody could rebuild. A client that reads the
# handshake (`crates/vike-app-core/src/data/backfill_wire.rs`) then refuses CLIENT-side before a frame
# leaves, so the chart's gap-fill was dead from the handshake outward.
# ⚠ It costs ONE new package in THIS binary — `vike-backfill`, the workspace member its own `dep:`
# names — and NO bridge crate and no third-party crate, which is why it can ride `full` at all.
# ⚠ This cited `crates/vike-datahub/Cargo.toml`'s `venue-backfill` warning until
# docs/decisions/0094 deleted that feature — it had named no bridge crate even before the
# deletion, only `dep:vike-bridge-core`. Since decision 0164 `backfill-serve` names no bridge crate
# at all (`crates/vike-datahub/Cargo.toml`: its sources are the gatewayhub's, and the datahub links
# no bridge in any feature set), so a STANDALONE datahub build pays only for `vike-backfill` and
# `vike-bi5`. The bridges in THIS binary come from `vike-tradehub` and `vike-gatewayhub`.
# ⚠ MEASURED, not asserted, and the measurement is why this comment says ONE rather than ZERO.
# `cargo tree -p vike-backend --features full -e normal --prefix none`, this commit against its
# parent, one the CI box lane, 2026-09-15: the package SETS differ by exactly `vike-backfill`. All eight
# crates above are present in BOTH — dukascopy and datafusion appear on the new side only as `(*)`
# back-references, i.e. a second path to a package that was already there, which is the same thing
# the other six show. Anyone re-checking this should compare the sorted `cargo tree` output of the
# two commits rather than trusting the sentence; a prose claim of "zero" was what this replaced.
# ⚠ ONE LINE, deliberately: `crates/vike-ops/tests/container_deploy/multicall_gate.rs`'s `feature_table` reads a
# feature per LINE, so a rustfmt-shaped multi-line array makes the gate report this feature as
# undeclared while `full` enables it — measured on this very edit.
# ⚠ `catalog-serve` JOINED with the Data Manager's refresh button being wired to the verb, and
# WITHOUT it that button is dead against every deployed daemon: a build lacking this feature takes
# `datahub_cli`'s `#[cfg(not(feature = "catalog-serve"))]` arm, constructs `CatalogTable::new(vec![])`
# and answers EVERY venue — binance included — with `NotServed { supported: [] }`. All three deploy
# units run `bin/vike-backend datahub`, so this is the same failure class the `live-*` rows
# guard: the plane ships and mounts nothing.
# ⚠ This line read "It changes NO RUNTIME BEHAVIOUR on any box. The lane is still armed by
# an opt-in switch unset everywhere" — and `docs/decisions/0066` made both halves false. The
# lane is ON BY DEFAULT now and the switch is its REFUSAL (`flags.venue_catalog_off`, unwritten on
# every deployed box), so this feature is what decides whether those daemons serve a real
# instrument list or an empty supported set. Build-time forwarding is still not runtime arming; the
# runtime arming is now the ABSENCE of a written refusal.
# ⚠ It adds no package and no dependency at all: since decision 0164 `catalog-serve` is an ARMING
# MARKER in `crates/vike-datahub/Cargo.toml` (its eight providers are the gatewayhub's, which links
# the bridges), and so are `venue-<v>`, `live-<v>` and `record-<v>`.
# ⚠ `live-deribit` JOINED 2026-10-04 (the Trade window's DOM for a Deribit instrument). It adds NO
# package: `venue-deribit` is a marker, and the Deribit feed it arms is the gatewayhub's.
# ⚠ `options-serve` JOINED with the desktop's Options tool moving onto the datahub (it opens no Deribit
# socket now): without it the deployed daemon answers every `OptionsChain` with `NotArmed` and the
# Options tool is empty on every box. It rides `catalog-serve` wherever that is on. It adds no
# package: `vike-options` is already in this binary's graph, and the Deribit provider and feeds are
# the gatewayhub's.
# ⚠ `tool-feeds-serve` JOINED with the desktop's news, calendar, earnings, dividends and IPO windows moving onto the
# datahub: without it the deployed daemon answers every `NewsFeed`/`EconomicCalendar`/`EquityCalendar` with
# `NotArmed` and those windows are empty on every box. It adds no package: `ureq` is already in this binary's
# graph (vike-bridge-core), and `chrono` is in the lock.
vike-datahub = ["dep:vike-datahub", "vike-datahub/datafusion-serve", "vike-datahub/backfill-serve", "vike-datahub/catalog-serve", "vike-datahub/options-serve", "vike-datahub/tool-feeds-serve", "vike-datahub/record-polymarket", "vike-datahub/record-binance", "vike-datahub/live-binance", "vike-datahub/live-bybit", "vike-datahub/live-okx", "vike-datahub/live-aster", "vike-datahub/live-hyperliquid", "vike-datahub/live-polymarket", "vike-datahub/live-deribit"]
# ⚠ `fxcm` JOINED 2026-09-09, and this comment said it NEVER would: "that feature links
# libForexConnect and the ELF then dies at exec wherever the SDK is absent. The fxcm-linked daemon
# stays its own separately-named release asset." Every word of that was true of the feature as it
# then was, and none of it is true now. `crates/bridges/fxcm/build.rs` no longer emits
# `cargo:rustc-link-lib=ForexConnect`: the C++ boundary is a shared object, `libfcshim.so`, that
# `crates/bridges/fxcm/src/loader.rs` opens at RUNTIME. So this binary carries no `DT_NEEDED` on the
# SDK, starts everywhere the feature-free one started, and arms FXCM exactly on the boxes where the
# shim is installed — which is what the separate asset existed to arrange, at the cost of a second
# 148 MB daemon nobody could reach any other way.
# ⚠ `ibkr` JOINED 2026-09-08, and it was a plain omission rather than a decision. The feature has
# existed and been CI-tested (`scripts/ci_feature_suite.sh`'s `ibkr` lane compiles the whole
# mount chain every PR), and `grep -c ibkr .github/workflows/release.yml` returned **0** — so no
# shipped binary could reach IBKR at all and the only way to get it was to build from source.
# Nothing was blocking it: there is no native SDK, no link line and no rpath — `vike-ibkr` is a
# pure-Rust `ibapi` client plus a gateway process the operator runs.
vike-tradehub = ["dep:vike-tradehub", "vike-tradehub/telegram", "vike-tradehub/polymarket", "vike-tradehub/ibkr", "vike-tradehub/fxcm"]
# The set the RELEASE builds. ⚠ It must enumerate exactly what `.github/workflows/release.yml`'s
# `--features` line does: a silently-dropped tool feature ships a dispatcher whose `--help` lists
# one tool fewer, and whose installed link for that tool exits 2.
# ⚠ `vike-cli` is not optional in practice: four systemd units and the container entrypoint run
# `vike-cli config check` as a pre-flight, so an image whose link for it exits 2 fails every start.
vike-cli = ["dep:vike-cli"]
# `vike-strategy-builder` forwards nothing — that crate declares no feature table of its own (see
# its manifest: ordinary workspace lints, no `[features]`), so this row is the plain `dep:` switch
# every other single-crate tool row uses (`vike-cli` above is the same shape).
vike-strategy-builder = ["dep:vike-strategy-builder"]
# The `gatewayhub` tool (decision 0164, wave 1). ⚠ `vike-gatewayhub/data` IS THE LOAD-BEARING ENTRY:
# it is the one feature that links the venue bridges and the clients built on them, so without it the
# tool answers `--help` and then serves a lane with no venue behind it (a default build of that crate
# links no bridge at all). `crates/vike-ops/tests/container_deploy/multicall_gate.rs`'s
# `SHIPPED_TOOL_FEATURES` is the second spelling that catches a drop from `full`.
# ⚠ It adds ONE package to the shipped binary, MEASURED on the wave-1 base (2026-10-14, one the latency box lane):
# `cargo tree -p vike-backend --features full -e normal --prefix none`, package names sorted and
# deduplicated, before and after this row differ by exactly `vike-gatewayhub` itself. The client crate
# and every venue bridge were already in that graph through `vike-datahub` and `vike-tradehub`. A later
# wave that takes the bridges out of the datahub moves that measurement, not this row.
# ⚠ ONE LINE, deliberately, for the reason the `vike-datahub` row above gives: `feature_table` reads a
# feature per LINE.
vike-gatewayhub = ["dep:vike-gatewayhub", "vike-gatewayhub/data"]
full = ["study-cli", "tearsheet", "backtesthub", "vike-datahub", "vike-tradehub", "vike-cli", "vike-strategy-builder", "vike-gatewayhub"]

# ⚠ The ONE explicit `[[bin]]`; the multicall itself stays the implicit `src/main.rs` bin named after
# the PACKAGE (`vike-backend`), so declaring this does not rename it. `tearsheet` is the standalone
# shim over the same `tearsheet_cli::run` the `report` row calls, kept for the process
# `tests/tearsheet_cli.rs` spawns (`CARGO_BIN_EXE_tearsheet` exists only for a bin of the SAME
# package, which is why the bin moved here with the CLI rather than staying in the since-dissolved `vike-report`). The
# module it calls exists only under `tearsheet`, hence the `required-features`. It is not shipped:
# the release builds `--bin vike-backend` alone.
[[bin]]
name = "tearsheet"
path = "src/bin/tearsheet.rs"
required-features = ["tearsheet"]

[dev-dependencies]
# The tearsheet CLI's integration test (`tests/tearsheet_cli.rs`) spawns a REAL core to write the
# journal it then renders, so it needs the core's types and the exec double. They are dev-only (a dev
# edge may point upward) and the test file compiles to nothing without `tearsheet`.
#
# `spawn_core` + `CoreConfig`/`JournalConfig`: the writer whose output the CLI is proven against.
vike-core = { path = "../vike-core" }
# `ExecutionEngine`/`Account`/`RiskGate` and the `TestExecutionClient` double — `test-support` is what
# compiles that double at all.
vike-exec = { path = "../vike-exec", features = ["test-support"] }
# `OrderRequest`, `RiskLimits`, `TestClock`.
vike-model = { path = "../vike-model" }
# `JournalFileConfig`, the segment sizing the test hands to the core.
vike-journal = { path = "../vike-journal" }
# A scratch directory that is removed on the panic path too (the journal is posix_fallocate'd).
tempfile = { workspace = true }
# `test-support` compiles `hist_store_stubs!` (`src/tearsheet_cli/excursions_tests.rs`) and the
# `MemHistStore` double (`tests/mtm_store.rs`); only a dev edge may turn it on. The normal edge
# above stays the optional, default-features one.
vike-data = { path = "../vike-data", features = ["test-support"] }

[lints]
workspace = true
