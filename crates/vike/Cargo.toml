[package]
# ⚠ There is NO `[[bin]]` and NO `[lib]` section in this manifest, so BOTH the executable and the
# lib crate follow this name: the shipped artifact is `vike-backend` and the lib is `vike_backend`.
# Renaming this line renames the release asset, every `ExecStart=` that names it and the container's
# symlink target, with nothing else in the manifest saying so.
name = "vike-backend"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license-file.workspace = true
publish = false

# The multicall dispatcher. Layer 68 — above every headless top-of-graph binary (65) and below the
# egui tiers (70), because it depends on those binaries' crates and nothing may depend on it.
[package.metadata.vike]
layer = 68

[dependencies]
# The one NON-optional dep: the dispatcher itself answers `--version`, and a version printer
# without build identity is what identity_adoption.rs exists to refuse (a release binary was once
# built four commits behind main). Leaf crate, layer 15 — the light lanes stay light.
vike-buildinfo = { path = "../vike-buildinfo" }
# Each tool is an OPTIONAL dependency behind a feature of the same shape as its own binary's
# `required-features`. ⚠ Optional and NOT default: a dispatcher that always linked every tool would
# make `cargo check -p vike-backend` build the whole DataFusion closure for anyone touching the
# routing, and would defeat the per-crate feature lanes that keep the light crates light.
vike-studio-core = { path = "../vike-studio-core", optional = true }
vike-report = { path = "../vike-report", optional = true }
vike-backtest = { path = "../vike-backtest", optional = true }
vike-datahub = { path = "../vike-datahub", optional = true }
vike-tradehub = { path = "../vike-tradehub", optional = true }
vike-cli = { path = "../vike-cli", optional = true }
# The plugin BUILDER service (`docs/superpowers/specs/2026-09-21-runtime-loaded-rust-strategies-design.md`,
# "The builder service") — the one process in this tree that runs `cargo` against an authenticated
# caller's source. Optional and behind its own feature for the same reason as every row above: a
# default `cargo check -p vike-backend` must not link a fifth daemon's tree, and `full` is what
# `.github/workflows/release.yml` builds.
#
# ⚠ This is NOT `34b8d6756` undone. That commit split the builder OUT of `vike-strategy-plugin`
# specifically so a COMPILED PLUGIN (which links only `vike-strategy-plugin`) would not inherit the
# builder's `vike-datahub-client`/`tracing` tree. This dependency is the dispatcher taking on the
# BUILDER's own crate — `vike-strategy-builder` — the same shape as the `vike-tradehub` row above
# taking on the trading daemon. A plugin's link is unaffected: it never sees `vike-backend` at all.
# `cargo tree -p vike-strategy-plugin -e normal --prefix none` (unaffected by this manifest, which
# that crate does not depend on) is the proof this dependency does not touch.
vike-strategy-builder = { path = "../vike-strategy-builder", optional = true }

# ⚠ NOT a tool: the SHARED VOCABULARY one tool's call site needs. `backtest_main` fills
# `vike_model::runs::BuildStamp` — the seam a library declares and a composition root fills — and that
# module came down to `vike-model` when `vike-cli` needed to READ a run directory without linking
# the engine (`crates/vike-model/src/runs.rs`'s own doc carries the argument). Naming a type
# requires a DIRECT edge, so this is that edge, and it is optional behind the one feature whose
# arm names it: a default `cargo check -p vike-backend` links nothing new.
vike-model = { path = "../vike-model", optional = true }

[features]
# ⚠ A FEATURE NAME AND A TOOL VERB ARE NO LONGER THE SAME STRING, and they used to be. The verbs
# dropped their `vike-` prefix (`vike-backend trade`, not `vike-backend vike-tradehub`); these
# feature names did NOT, because each one gates an optional DEPENDENCY whose package genuinely is
# `vike-tradehub`/`vike-datahub`/`vike-cli` — the prefix is accurate here in a way it
# was not on a verb. `crates/vike/src/main.rs`'s `TOOLS` rows carry both strings side by side
# (`#[cfg(feature = "vike-datahub")] Tool { name: "datahub", … }`) and that mismatch is deliberate.
# Renaming a feature here is a manifest+main.rs pair with `full` rewritten in the SAME edit —
# `multicall_gate::resolve_forwards` PANICS on a `full` entry naming a feature this table does not
# define.
default = []
# `study-cli` forwards to the crate feature of the same name — the bin it replaces carries
# `required-features = ["study-cli"]` for the same reason.
study-cli = ["dep:vike-studio-core", "vike-studio-core/study-cli"]
# ⚠ **`tearsheet` was the ONE tool row here that forwarded nothing, and that is why four of its
# advertised flags could not work in any shipped artifact.**
#
# This comment read: *"`tearsheet` needs no crate feature — vike-report is DataFusion-free and
# binutil is feature-free."* Both halves were true and the conclusion was wrong. `--store`, and
# with it `--mtm`/`--venue`/`--interval`, is the mark-to-market path: it opens a hist store, reads
# the equity curve from its `kind=equity` series and back-fills each trade's `mae`/`mfe` from OHLC
# bars. That needs `vike-report/hist`, which forwards `vike-data/hist-datafusion` — and NO consumer
# edge in this workspace enabled it, so the shipped `vike-backend tearsheet --store` printed
# *"--store requires building with --features hist"* and exited 2 while the other three flags were
# parsed and ignored. `crates/vike-report/src/tearsheet_cli.rs` documents all four.
#
# The forward is what the convention here already is, not a new idea:
# `crates/vike-backtest/Cargo.toml`'s `datafusion-store` block names it outright — *"Named per this
# crate rather than reusing `hist-datafusion`, following the same crate-specific-name convention
# vike-report (`hist`) and vike-datahub (`serve-datafusion`) use for the same forward"* — and says
# who enables it: CALLERS THAT OPEN A STORE. `tearsheet --store` is exactly such a caller. Every
# other tool row below forwards its crate's own capability features (`backtest` →
# `datafusion-store` + `venue-fetch`, `vike-datahub` → `serve-datafusion` and eleven more,
# `vike-tradehub` → seven, `study-cli` → `study-cli`); this row forwarded none, alone among five.
#
# COST, measured rather than estimated: nothing that is actually built pays. `full` — what
# `.github/workflows/release.yml` compiles — also selects `backtest`, which forwards
# `vike-backtest/datafusion-store` → `vike-data/hist-datafusion`, so the Arrow/DataFusion tree is
# ALREADY linked into the shipped binary. And the `multicall` suite arm
# (`scripts/ci_feature_suite.sh`) builds `-p vike-backend --features full` and nothing else — no
# lane, recipe or workflow builds `--features tearsheet` alone, so the narrow build this note used
# to weigh the cost against does not exist. ⚠ If one is ever added, it gains that tree, and the
# honest answer then is a separate feature on this row rather than un-forwarding this one.
#
# The alternative was to DELETE `vike-report/hist` with both `build_from_store` arms and those four
# flags. Refused: it removes a working capability to save a cost that measures zero.
tearsheet = ["dep:vike-report", "vike-report/hist"]
# `backtest` forwards `datafusion-store` — the bin it replaces carries the same `required-features`.
# ⚠ `dep:vike-studio-core` JOINED under ruling 7 and it is not a widening of the backtest tool: the
# `backtest --addr` daemon serves the three STUDIO run verbs through an injected table
# (`vike_backtest::compute_server`'s `StudioRunTable`), and `crates/vike/src/main.rs`'s
# `backtest_main` is the only composition root that can name BOTH the table type (layer 50) and the
# runners that fill it (layer 55). Without this the dispatcher compiles a daemon that refuses three
# of its seven verbs. NO `vike-studio-core/study-cli` here — that feature gates the `study` VERB's
# CLI and is forwarded by the `study-cli` row above; the runners this needs are the crate's default
# surface, which is DataFusion-free.
backtest = ["dep:vike-backtest", "vike-backtest/datafusion-store", "vike-backtest/venue-fetch", "dep:vike-studio-core", "dep:vike-model"]
# `vike-datahub` forwards `serve-datafusion`; without it the tool still answers --help and then
# reports it has no backend, exactly as the standalone binary does.
#
# ⚠ **AND SINCE RULING 10 IT FORWARDS THE RECORDER'S VENUE FEEDS TOO** — there is no separate
# `recorder` verb any more, because `crates/vike-datahub/src/recorder.rs` IS the recorder daemon
# (`docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md` §0.5: one process owns
# venue connections, the store and serving). The two `record-*` rows carry over the warning the
# retired `vike-recorder` feature row made, unchanged and for the same reason: **a dropped venue
# here ships a daemon that records nothing for it — silently, since an unconfigured venue looks the
# same as an unbuilt one.** `crates/vike-ops/tests/multicall_gate.rs`'s `SHIPPED_TOOL_FEATURES` is
# the second spelling that catches a drop.
# ⚠ **`backfill-serve` JOINED 2026-09-15, and its ABSENCE was the reason a released box could not
# paint a 5m/15m/1h chart.** The feature has existed and been wired since split-plane REQ-9 —
# `crates/vike-datahub/src/datahub_cli.rs` mounts `backfill::real_backfill_table` behind it, and
# `crates/vike-datahub/tests/backfill_roundtrip.rs` proves request → store → `BackfillDone` →
# `LoadBars` every PR — but `full` never forwarded it, and `.github/workflows/release.yml` builds
# `--features full`. So every deployed datahub omitted `backfill` from `Welcome.features` and
# answered `Request::Backfill` with `server.rs`'s `backfill_verb` refusal naming this very feature:
# the daemon told its own operator how to fix a build nobody could rebuild. A client that reads the
# handshake (`crates/vike-app-core/src/backfill_wire.rs`) then refuses CLIENT-side before a frame
# leaves, so the chart's gap-fill was dead from the handshake outward.
# ⚠ It costs ONE new package in THIS binary — `vike-backfill`, the workspace member its own `dep:`
# names — and NO bridge crate and no third-party crate, which is why it can ride `full` at all.
# `crates/vike-datahub/Cargo.toml`'s own warning — that `venue-backfill` pulls seven bridge crates
# (binance/bybit/okx/dukascopy/hyperliquid/aster/deribit) plus vike-bridge-core — is correct for a
# STANDALONE datahub build and is the wrong frame here: `full` already enables `vike-tradehub`,
# whose `crates/vike-mount/Cargo.toml` takes every one of those bridges, and resolver-2 unifies
# them onto this build.
# ⚠ MEASURED, not asserted, and the measurement is why this comment says ONE rather than ZERO.
# `cargo tree -p vike-backend --features full -e normal --prefix none`, this commit against its
# parent, one the CI box lane, 2026-09-15: the package SETS differ by exactly `vike-backfill`. All eight
# crates above are present in BOTH — dukascopy and datafusion appear on the new side only as `(*)`
# back-references, i.e. a second path to a package that was already there, which is the same thing
# the other six show. Anyone re-checking this should compare the sorted `cargo tree` output of the
# two commits rather than trusting the sentence; a prose claim of "zero" was what this replaced.
# ⚠ ONE LINE, deliberately: `crates/vike-ops/tests/multicall_gate.rs`'s `feature_table` reads a
# feature per LINE, so a rustfmt-shaped multi-line array makes the gate report this feature as
# undeclared while `full` enables it — measured on this very edit.
# ⚠ `catalog-serve` JOINED with the Data Manager's refresh button being wired to the verb, and
# WITHOUT it that button is dead against every deployed daemon: a build lacking this feature takes
# `datahub_cli`'s `#[cfg(not(feature = "catalog-serve"))]` arm, constructs `CatalogTable::new(vec![])`
# and answers EVERY venue — binance included — with `NotServed { supported: [] }`. All three deploy
# units run `bin/vike-backend datahub`, so this is the same failure class the six `live-*` rows
# guard: the plane ships and mounts nothing.
# ⚠ This line read "It changes NO RUNTIME BEHAVIOUR on any box. The lane is still armed by
# `VIKE_DATAHUB_VENUE_CATALOG=1`, unset everywhere including
# `deploy/vike-datahub-project.service`" — and `docs/decisions/0066` made both halves false. The
# lane is ON BY DEFAULT now and the switch is its REFUSAL (`flags.venue_catalog_off`, unwritten on
# every deployed box), so this feature is what decides whether those daemons serve a real
# instrument list or an empty supported set. Build-time forwarding is still not runtime arming; the
# runtime arming is now the ABSENCE of a written refusal.
# ⚠ It adds no package either: six of its eight bridge edges are the same ones the `live-*` rows on
# this very line already turn on, and the other two — vike-dukascopy, vike-fxcm — are already in
# this binary's graph through `vike-tradehub` (`vike-mount` takes both; `full` forwards
# `vike-tradehub/fxcm`), which is why `cargo tree -i` on either names a parent that is not
# vike-datahub.
vike-datahub = ["dep:vike-datahub", "vike-datahub/serve-datafusion", "vike-datahub/backfill-serve", "vike-datahub/catalog-serve", "vike-datahub/record-polymarket", "vike-datahub/record-binance", "vike-datahub/live-binance", "vike-datahub/live-bybit", "vike-datahub/live-okx", "vike-datahub/live-aster", "vike-datahub/live-hyperliquid", "vike-datahub/live-polymarket"]
# ⚠ `fxcm` JOINED 2026-09-09, and this comment said it NEVER would: "that feature links
# libForexConnect and the ELF then dies at exec wherever the SDK is absent. The fxcm-linked daemon
# stays its own separately-named release asset." Every word of that was true of the feature as it
# then was, and none of it is true now. `crates/bridges/fxcm/build.rs` no longer emits
# `cargo:rustc-link-lib=ForexConnect`: the C++ boundary is a shared object, `libfcshim.so`, that
# `crates/bridges/fxcm/src/loader.rs` opens at RUNTIME. So this binary carries no `DT_NEEDED` on the
# SDK, starts everywhere the feature-free one started, and arms FXCM exactly on the boxes where the
# shim is installed — which is what the separate asset existed to arrange, at the cost of a second
# 148 MB daemon nobody could reach any other way.
# ⚠ `ibkr` JOINED 2026-09-08, and it was a plain omission rather than a decision. The feature has
# existed and been CI-tested (`scripts/ci_feature_suite.sh`'s `ibkr` lane compiles the whole
# mount chain every PR), and `grep -c ibkr .github/workflows/release.yml` returned **0** — so no
# shipped binary could reach IBKR at all and the only way to get it was to build from source.
# Nothing was blocking it: there is no native SDK, no link line and no rpath — `vike-ibkr` is a
# vendored pure-Rust `ibapi` plus a gateway process the operator runs.
vike-tradehub = ["dep:vike-tradehub", "vike-tradehub/telegram", "vike-tradehub/polymarket", "vike-tradehub/ibkr", "vike-tradehub/fxcm"]
# The set the RELEASE builds. ⚠ It must enumerate exactly what `.github/workflows/release.yml`'s
# `--features` line does: a silently-dropped tool feature ships a dispatcher whose `--help` lists
# one tool fewer, and whose installed link for that tool exits 2.
# ⚠ `vike-cli` is not optional in practice: four systemd units and the container entrypoint run
# `vike-cli config check` as a pre-flight, so an image whose link for it exits 2 fails every start.
vike-cli = ["dep:vike-cli"]
# `vike-strategy-builder` forwards nothing — that crate declares no feature table of its own (see
# its manifest: ordinary workspace lints, no `[features]`), so this row is the plain `dep:` switch
# every other single-crate tool row uses (`vike-cli` above is the same shape).
vike-strategy-builder = ["dep:vike-strategy-builder"]
full = ["study-cli", "tearsheet", "backtest", "vike-datahub", "vike-tradehub", "vike-cli", "vike-strategy-builder"]


[lints]
workspace = true
