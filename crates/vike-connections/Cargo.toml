[package]
name = "vike-connections"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false
description = "Venues x Sim/Demo/Live credential-status panel + in-app masked key and account editing (which venues have API keys configured in the workspace credential store), mounted by vike-desktop."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `ui-widget` — an egui widget / engine crate (no eframe/wgpu).
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 75

[dependencies]
# credential loader + Environment — the naming authority this crate reads through, never
# reimplements (`load_credentials_from` and the `load_workspace_secrets_*` loaders).
vike-bridge-core = { path = "../vike-bridge-core" }
# the design system: the status colours (`status`), the icons, and the theme's tokens
# (`components::Tokens`): the selection's ACCENT and the venue heading's TEXT, read from the
# installed theme rather than a fixed palette.
vike-ui-theme = { path = "../vike-ui-theme" }
# the pure live connection-state model + string classifier (`feed_status::{ConnectionState,
# parse_feed_status}`) that `view.rs` and `summary.rs` name directly, AND the canonical venue roster
# `VENUES` that `status.rs` enumerates the credential grid from. It is 142 dependency-free lines and
# lives at the BOTTOM layer: the classifier's other consumer,
# `vike_tradehub::reconcile_config::health_from_feed_status`, is called by the HEADLESS daemon, which must
# not link this (egui) crate to reach it — and while the module sat in vike-ops, this crate would
# have had to link vike-ops (and with it vike-core, vike-data, vike-alerting: ~42k lines) to reach
# 142 lines. ⚠ That read "must not link vike-ops (hence vike-core, vike-data, vike-alerting…)", in
# the present tense, until 2026-09-28: vike-ops has named `vike-model` alone since 2026-09-26 and
# carries no `feed_status` at all, so the argument is history — the module's home at the bottom
# layer is what settles it. vike-model costs neither side anything; it is already in this crate's
# closure via vike-bridge-core.
# ⚠ The `vike-catalog` edge that stood here is GONE with `BRIDGE_VENUES` (the 2026-09-18 alias
# ruling): that dependency existed to reach a second NAME for this same roster, so deleting the name
# deleted the edge.
vike-model = { path = "../vike-model" }
# the credential STORE itself — the editor's writes call `vike_secrets`' journalled upserts rather
# than keeping a second copy of them (the write has a headless caller too, see src/env_write.rs).
# It carries one external crate (rusqlite, decision 0054). What makes the edge cheap is the RANK —
# that crate names nothing above the vocabulary floor, tier `leaf`'s rule, machine-checked by
# `crates/vike-ops/tests/architecture/layer_gate.rs` — and vike-model is declared in this manifest
# anyway, so the edge costs this graph no package.
vike-secrets = { path = "../vike-secrets" }
egui = { workspace = true }
# non-secret status logging only ("saved credentials for binance/live") — never a key/secret value.
tracing = { workspace = true }

[dev-dependencies]
# Accessibility-tree tests over the REAL grid + edit form (`tests/panel/a11y_*.rs`). This is
# the crate where the a11y tree is not merely convenient but LOAD-BEARING: the module's security
# contract says the edit fields are masked, and `Role::PasswordInput` vs `Role::TextInput` is
# exactly what `TextEdit::password(true)` decides. NO wgpu / NO snapshot — see the workspace
# manifest's `egui_kittest` rationale.
egui_kittest = { workspace = true }
# TEST-ONLY. `tests/panel/write_journal.rs` reads the change-journal line the Save arm wrote and
# asserts on its FIELDS. Parsing it is the point: a `contains`-based assertion over the raw text
# cannot tell `"tier":"LIVE"` from a tier that leaked into some other cell, and this is the one
# surface where a value landing in the wrong field is the whole failure mode. Already in the
# lockfile (a workspace dependency of a dozen crates), so it adds ZERO packages to the `cargo deny`
# surface, and being a dev dep it never reaches a shipped binary.
serde_json = { workspace = true }
# `harness::type_ready` — the panel draws icons (the legend's and the cells' edit pencil), whose
# family only the app's bundled type binds, and kittest's build-time frame runs on egui's default
# fonts. The feature adds a module, no dependency, and the crate is already a normal dependency,
# so the lockfile's package set is unchanged.
vike-ui-theme = { path = "../vike-ui-theme", features = ["test-support"] }

[lints]
workspace = true
