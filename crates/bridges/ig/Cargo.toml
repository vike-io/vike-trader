[package]
name = "vike-ig"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "IG (IG Group) FX/CFD venue bridge — co-located data + exec (stateful session-auth REST + Lightstreamer trade-update stream). Moved into crates/bridges/ig (crate-reorg Phase 3, PR C)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/arch/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
vike-exec = { path = "../../vike-exec" }
# shared venue-bridge plumbing (credentials::Environment, exec_actor, http::blocking_agent) —
# crate-reorg Phase 3 (D4); the direct-path style survives every later venue move unchanged.
vike-bridge-core = { path = "../../vike-bridge-core" }
vike-catalog = { path = "../../vike-catalog" }
vike-data = { path = "../../vike-data" }   # the live market-data seam (DataClient/LiveDataSink/FeedRegistry) the Lightstreamer market feed implements
serde_json = { workspace = true }
ureq = { workspace = true }   # blocking REST (rustls, no OpenSSL) + the Lightstreamer streaming body reader
tungstenite = { workspace = true } # the SHARED blocking WS stack — IG's Lightstreamer TLCP is a TEXT protocol spoken over it (no Lightstreamer client crate; see crates/bridges/ig/CLAUDE.md)
tracing = { workspace = true } # LS trade-stream reconnect diagnostics

[dev-dependencies]
# `vike_exec::testing`'s doubles for this crate's tests — compiled only under vike-exec's
# `test-support`, which a DEV edge may turn on and the normal edge above may not.
vike-exec = { path = "../../vike-exec", features = ["test-support"] }
# dev-only, test-support feature: the venue mount contract's test double
# (`venue_mount_fixture::MountFixture`) — the normal [dependencies] vike-bridge-core entry above is
# untouched for normal builds.
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only, test-support feature: `vike_log::capture::captured`, the workspace's one scoped
# `tracing` capture, which the mount tests read a mount's log lines with (it moved there out of
# `venue_mount_fixture`). The test tree already builds vike-log, through `vike-bridge-core`'s own
# `test-support`; this edge is what lets a test NAME it.
vike-log = { path = "../../vike-log", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
