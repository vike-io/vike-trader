[package]
name = "vike-alpaca"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Alpaca Broker API venue bridge — OAuth2 Bearer REST exec + market-data WS. US equities + crypto, single pinned account_id."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
vike-exec = { path = "../../vike-exec" }
vike-data = { path = "../../vike-data" }
vike-bridge-core = { path = "../../vike-bridge-core" }
vike-catalog = { path = "../../vike-catalog" }
serde_json = { workspace = true }
ureq = { workspace = true }          # blocking Bearer REST + the SSE /v2/events/trades reader
tungstenite = { workspace = true }   # market-data WebSocket
tracing = { workspace = true }       # boundary/fault diagnostics only (never hot-path)

[dev-dependencies]
# `vike_exec::testing`'s doubles for this crate's tests — compiled only under vike-exec's
# `test-support`, which a DEV edge may turn on and the normal edge above may not.
vike-exec = { path = "../../vike-exec", features = ["test-support"] }
tokio = { workspace = true }         # ExecActor-wiring test drains a tokio mpsc Ingest receiver
vike-log = { path = "../../vike-log", features = ["test-support"] } # test_init() for live-smoke diagnostics; `capture` for the mount tests
# The venue mount contract's test double (`venue_mount_fixture::MountFixture`, `test-support`).
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only: the decoder totality harness (tests/decoder_never_panics.rs) — arbitrary + structured JSON
# through the real WS / SSE / reconcile decoders; no panic, no event flood.
proptest = { workspace = true }

[lints]
workspace = true
