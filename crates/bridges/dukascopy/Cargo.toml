[package]
name = "vike-dukascopy"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Dukascopy FX venue bridge — keyless deep tick-history data (.bi5) + JForex execution via a colocated Java sidecar (jforex-bridge/, Gradle project, sibling of src/). The only venue with no REST execution API: execution/mod.rs drives java as a child process over JSON-lines stdio. Moved into crates/bridges/dukascopy (crate-reorg Phase 3, PR J — the last venue move)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../../vike-paths" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../../vike-marketdata" }
# The `.bi5` FORMAT (the tick record, the hourly decoder, the daily archive decoder, the price-scale table):
# bridge-free and network-free, so the datahub's archive-import lane can decode without linking this venue.
# This crate keeps the FETCH (`history.rs`) and imports the format from there.
vike-bi5 = { path = "../../vike-bi5" }
vike-execution = { path = "../../vike-execution" }
# shared venue-bridge plumbing (http::blocking_agent for the .bi5 CDN fetch) — crate-reorg Phase
# 3 (D4); the direct-path style survives every later venue move unchanged. Dukascopy's execution
# is 100% bespoke (child process, not REST/WS); `feed.rs` implements `data_client::bus`'s traits for the
# gatewayhub's price stream over its bus.
vike-bridge-core = { path = "../../vike-bridge-core" }
# `DataClientError`, the refusal the bus's `DataClientBusSpecHold::ask` answers in (`feed.rs`). Already in this crate's
# graph through vike-bridge-core.
vike-data = { path = "../../vike-data" }
# reads its addresses through `VenueSettings::urls` (the `venue_url` rows: the demo JNLP, the
# history feed) and the mounted account's `LOGIN`/`PASSWORD` fields through
# `account_credentials::AccountCredentials`. Already in this crate's graph through vike-bridge-core.
vike-secrets = { path = "../../vike-secrets" }
# The held-list seam (catalog.rs): the account's instrument list the sidecar's login states is pushed
# into `vike_catalog::held_list`, which the gatewayhub's catalog entry answers from (down-only:
# vike-catalog depends on vike-model only, never on any bridge crate).
vike-catalog = { path = "../../vike-catalog" }
serde = { workspace = true }       # sidecar JSON-lines protocol derives (transport.rs)
serde_json = { workspace = true }  # sidecar JSON-lines encode/decode (transport.rs)
chrono = { workspace = true }      # .bi5 URL calendar math (history.rs)
tracing = { workspace = true }     # structured adapter diagnostics (sidecar lifecycle)

[features]
# `src/test_support.rs`: the crate's own test helpers: the sidecar-side pieces (the recording `Wire`, an
# attached bus) the price-lane tests share, here and in the gatewayhub's (its dev edge turns this on), and
# the market order its protocol unit tests encode and its `sidecar` suites submit (through the self
# dev-dependency below). No dependency; never on a normal edge.
test-support = []

[dev-dependencies]
# dev-only, `test-support`: `vike_secrets::smoke_directory`, the live smokes' one way to the credential store.
# Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
# dev-only, `test-support`: `vike_execution::testing::RecordingClient`, the engine double `tests/dukascopy_currency_money.rs`
# books a converted position on. Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-execution = { path = "../../vike-execution", features = ["test-support"] }
tokio = { workspace = true }         # test-only: timeout around ingest receiver reads
# dev-only: test_init() for the live-fetch unit test + live smoke, and `capture::captured` for the
# mount tests' lines.
vike-log = { path = "../../vike-log", features = ["test-support"] }
# The venue-adapter contract's test double (`venue_adapter_fixture::AdapterFixture`, `test-support`).
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only, `test-support`: `vike_data::RecordingSink`, the sink the price stream's suite (`src/feed_stream_tests.rs`,
# moved from the gatewayhub) records into. Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# test-only: the self-deleting state directory `src/adapter_tests.rs` parks a confirmation into.
tempfile = { workspace = true }
# dev-only: the decoder totality harness (tests/decoder_never_panics.rs and src/execution/netting_property_tests.rs) —
# arbitrary + structured bytes/JSON through every wire decoder; no panic.
proptest = { workspace = true }
# dev-only, `test-support`: `vike_bi5::test_support`'s record and LZMA-alone builders, which feed the
# daily decoder in `tests/decoder_never_panics.rs` and `tests/bi5_agrees_with_the_bridge.rs`. Widens the
# normal edge; no new package.
vike-bi5 = { path = "../../vike-bi5", features = ["test-support"] }
# Self-referential dev-dep, the `vike-ctrader` idiom: it turns `test-support` on for THIS crate's own
# `tests/` binaries (`vike_dukascopy::test_support`).
vike-dukascopy = { path = ".", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
