[package]
name = "vike-polymarket"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Polymarket CLOB venue bridge — prediction markets, native pure-Rust EIP-712 order signing + L2-HMAC CLOB REST (no runtime SDK dep). Split-plane: the `feeds` feature is the keyless market-data surface alone (no signing crate in its tree), `polymarket` (implies `feeds`) adds the exec/signing/settlement plane via the feature-gated `vike_bridge_core::eip712` primitive — a default (no-feature) build is an empty crate. Moved into crates/bridges/polymarket (crate-reorg Phase 3, PR I)."
# The test binaries are the `[[test]]` rows below: discovery is off so every top-level `tests/*.rs` keeps its path
# and joins `tests/integration.rs` as a module (one binary to link, not one per file). A root file no row and no
# `mod` line builds is refused by `crates/vike-ops/tests/hygiene/test_registry_gate.rs`.
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# The pure helpers (decision 0141, layer 3) this crate calls: `calendar`, `percent`, `poller`.
vike-utility = { path = "../../vike-utility" }
# The outcome-set arbitrage maths of a prediction market, venue-neutral (layer 20, under this crate's 40): the two
# locks on the live books and the cached-marks screen. A bridge is a connection and holds none of it; the wiring
# (`execution/convert_arb.rs`, `NegRiskSet::arb_edge`) calls `vike_arbitrage::prediction_market`, and the catalog of
# sets and the on-chain convert stay here. Non-optional, as every entry of this manifest is.
vike-arbitrage = { path = "../../vike-arbitrage" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../../vike-marketdata" }
vike-execution = { path = "../../vike-execution" }
# shared venue-bridge plumbing (credentials, exec_actor, transport,
# user_data pump) — crate-reorg Phase 3 (D4); the direct-path style survives every later venue
# move unchanged.
vike-bridge-core = { path = "../../vike-bridge-core" }
# The generic network layer (decision 0299): the agents (`http`) and the WS socket and dial (`websocket`, `websocket_proxy`), which
# moved out of vike-bridge-core. Layer 4, no vike-* dependency, already in this crate's tree through it.
vike-transport = { path = "../../vike-transport", features = ["websocket"] }
# D2 (crate-reorg spec): polymarket's market feed is the source of the shared live DataClient engine
# (vike-bridge-core's DataClientBus), tick-producer T2 — the venue-agnostic live-data seam it reaches into.
vike-data = { path = "../../vike-data" }
# universal cross-venue instrument catalog (`Instrument`/`CatalogProvider`) — the
# `CatalogProviderPolymarket` provider in catalog/mod.rs (crate-reorg catalog workstream).
vike-catalog = { path = "../../vike-catalog" }
# DATA, nothing more (decision 0095): `transport/mod.rs`'s `declare_from_rows` takes the `venue_setting`
# rows a composition root already READ (`VenueSettings`), and the mount reads its own fields from
# the `AdapterInputs::settings` it is handed — the bridge opens no store and reads no environment.
# (`declare_from_rows` also rendered the five egress fields' legacy credential names for a warned
# fallback until decision 0095's Task 7 deleted it.) The crate is already in this closure through
# `vike-bridge-core`, so this edge adds no package and no weight; it only lets the bridge NAME the
# types instead of every root re-deriving them. Layer 15 under this crate's 40.
vike-secrets = { path = "../../vike-secrets" }
serde_json = { workspace = true } # CLOB REST/WS JSON bodies (no serde derive — Value-based)
# insertion-ordered map: the dust-snap fill tracker's capped order client id ledger evicts FIFO (oldest
# first), which needs insertion order — already a workspace dep, no new external crate.
indexmap = { workspace = true }
ureq = { workspace = true }       # blocking REST (rustls, no OpenSSL); `socks-proxy` gated below
hex = { workspace = true }        # hex DECODING of keys, words and condition ids (encoding: vike_utility::hex::hex_lower)
base64 = { workspace = true }     # L2 auth signature is base64url (auth.rs)
tracing = { workspace = true }    # adapter diagnostics (client.rs, l1.rs)
flate2 = { workspace = true }     # gzip raw-frame tap writer (feed/tap.rs)
tokio = { workspace = true, optional = true } # `test-support` only: the smokes' ingest-lane wait (test_support.rs)

[features]
# The feeds/exec seam (split-plane Phase-5 hardening; the design's §7 measured the whole
# +26-crate cost of client feeds as the shared secp256k1/EIP-712 stack). BOTH features are OFF
# by default — a default (no-feature) build is still an empty crate, exactly as before the split.
#
# `feeds` is the KEYLESS market-data surface alone: market_feed/ws/data/rtds/raw_tap/instruments/
# gamma/catalog/neg_risk_set/neg_risk_lookup/universe/rewards/taker_hold/filters_rec/tick_regime/
# discovery/rolling_family/config, plus `egress` (the SOCKS
# proxy resolution, the proxy-aware ureq agents, the keyless `get_json` and the WS-proxy dial arm
# the feed pumps need — re-homed there from `exec` for this seam). It enables NO signing crate:
# vike-bridge-core's `eip712` (the k256/keccak stack) stays out of a `--features feeds` tree,
# and the `bridges-feeds` arm of scripts/ci_feature_suite.sh is the gate — a structural
# cargo-tree check, not just a compile.
#
# `polymarket` is the FULL venue (implies `feeds`): EIP-712 order signing, L2-HMAC exec, the
# authed user-channel pumps, reconcile, the mount and the settlement cluster, plus
# `transport/ratelimit/ws.rs` (gated here, deliberately, unlike hl/aster's feed-plane `ratelimit`
# modules — `exec_plane/mod.rs` argues why). The shared EIP-712 primitive lives ONCE in
# vike-bridge-core (its `eip712` feature, enabled here), so this crate still declares no
# k256/tiny-keccak of its own. Every existing consumer spells `polymarket` and builds
# byte-identically; `--features feeds` alone is the NEW capability.
#
# `vike-transport/socks-proxy` is the WS twin of `ureq/socks-proxy`: the CLOB market/user/RTDS
# WebSockets dialled DIRECT while only HTTP tunnelled (spec §0), so from a geo-blocked host the
# feeds could not connect at all. Both are SOCKS capability (`vike-transport/socks-proxy` is the one bounded SOCKS
# client, `vike_transport::socks`: the HTTP lane's `SocksDial` and the WS dial's proxied arm) — which is why they ride
# `feeds`, the plane whose pumps do the dialling. Whether a WS lane actually uses the
# tunnel is a separate RUNTIME gate (`venue.polymarket.ws_proxy_enabled`, declared by the root —
# `egress::websocket_proxy`; it can only narrow the WS lanes below the HTTP lane's tunnel); this only
# compiles the capability in.
feeds = ["ureq/socks-proxy", "vike-transport/socks-proxy"]
polymarket = ["feeds", "vike-bridge-core/eip712"]
# `crate::test_support`: the ingest-lane wait the live smokes share, compiled once by the lib instead
# of once per smoke. It names tokio's receiver, so it turns the optional `tokio` edge on (no new
# package: tokio is already in this crate's tree through vike-execution). Turned on only by the self
# dev-dependency below; no shipped edge may enable it (`crates/vike-ops/tests/architecture/test_surface_gate.rs`).
test-support = ["dep:tokio"]

[dev-dependencies]
# Self-referential dev-dep (the `vike-execution`/`vike-model` idiom): turns `test-support` on for THIS crate's
# own `tests/` targets.
vike-polymarket = { path = ".", features = ["test-support"] }
# `vike_execution::testing`'s doubles for this crate's tests — compiled only under vike-execution's
# `test-support`, which a DEV edge may turn on and the normal edge above may not.
vike-execution = { path = "../../vike-execution", features = ["test-support"] }
# vike-model's `test-support` for the `vike_model::test_support` helpers this crate's tests name. A DEV
# edge with the feature, never a normal one: a normal edge would compile them into shipped builds.
vike-model = { path = "../../vike-model", features = ["test-support"] }
# The shared libm walk (decision 0074): `vike_utility::libm_walk` holds the text parser this crate's
# `libm_platform_probe` used to keep a private copy of. A DEV edge with the feature, never a normal
# one — `test-support` is gated `#[cfg(any(test, feature = "test-support"))]` and a normal edge
# would compile it into shipped builds. `cargo package` strips a dev-dependency carrying no
# version, so a published closure is untouched.
vike-utility = { path = "../../vike-utility", features = ["test-support"] }
# Test-only: the project's filesystem layout (`vike_paths`, here its `scratch` guard or project walk): std-only.
vike-paths = { path = "../../vike-paths" }
tokio = { workspace = true }         # test-only: tests/polymarket_smokes/polymarket_user_smoke.rs polls a tokio::mpsc receiver
vike-log = { path = "../../vike-log", features = ["test-support"] } # dev-only: test_init() (client.rs/l1.rs unit tests + the live smoke), `vike_log::capture` (settlement/resolve_tests.rs)
# dev-only: tests/polymarket_smokes/market_ticks_live_smoke.rs spawns a real core + Mount; the library
# itself must never depend on vike-core (crate-reorg D3 — bridges depend on exec, not core).
vike-core = { path = "../../vike-core" }
tempfile = { workspace = true } # dev-only: feed/tap.rs tests write to a temp capture dir
# dev-only, test-support feature: the DataFusion-free HistoryStoreMemory + PropertiesRecorder test double for
# the PIT filter-recording wiring test (instrument/record.rs) — the normal [dependencies] vike-data entry
# above stays default-features so the venue's DEFAULT build never pulls DataFusion in.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# dev-only, test-support feature: the shared scripted WS stream doubles (testing-arch Phase 4c)
# — the normal [dependencies] vike-bridge-core entry above is untouched for normal builds.
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# The live smokes read `venue.polymarket.*` from the settings database and DECLARE egress, as a
# composition root does (decision 0095 — the bridge itself opens no store), and read the account's
# credentials through `vike_secrets::smoke_directory` (deployment names through `smoke_vars`). Tests
# only. The `test-support` feature is what plants a fresh
# settings store (`create_empty_store_for_test`, `set_venue_setting_in_unjournalled`) for
# `transport/transport_tests.rs`, which drives `declare_from_rows` over rows written in the exact shape the CI box
# stores them (the proxy trio, each at tier `any`); the normal edge above is data-only and turns none
# of it on.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
# `#[traced_test]` + `logs_contain`: `transport/transport_tests.rs` asserts what `declare_from_rows` logs — an
# unreadable store's error line and the address it dials instead, a quiet default, a repeated
# declaration. Same line `vike-core` and `vike-journal` carry.
tracing-test = { workspace = true }
# dev-only: the wire-decoder totality harness (tests/decoder_never_panics.rs) — arbitrary + shaped
# JSON/text through the real market/RTDS/user-channel/Gamma/reconcile/chain-log decoders; no panic,
# no event flood.
proptest = { workspace = true }

# The test binaries. Discovery is off (`autotests` above), so these rows are the whole list: every other top-level
# `tests/*.rs` is a module of `integration` (`tests/integration.rs`'s module doc). Feature-gated targets declare
# what they need (binance #2843 / okx parity): without it a feature-less `cargo test -p vike-polymarket` links EMPTY
# test binaries (each file's inner `#![cfg(feature = ...)]` compiles to nothing and reports `0 passed`); with it
# cargo skips the target. `feeds` is the narrower gate: `integration`'s two members exercise the keyless plane alone
# (decoder_never_panics gates its exec-plane child inside).
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["feeds"]

[[test]]
name = "offline"
path = "tests/offline.rs"
required-features = ["polymarket"]

# The seven `#[ignore]`d live smokes, one binary so their egress helper compiles once
# (tests/polymarket_smokes/main.rs).
[[test]]
name = "polymarket_smokes"
path = "tests/polymarket_smokes/main.rs"
required-features = ["polymarket"]

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
