[package]
name = "vike-hyperliquid"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Hyperliquid venue bridge — spot + perpetuals. From-scratch EIP-712/msgpack action signing (no HL SDK dep) on the shared workspace stack (ureq REST + tungstenite WS + reused k256/tiny-keccak). ExecutionClient (place/cancel/modify/batch) + live vike_data::DataClient feed (candles/bbo/trades/l2Book) + ReconClient + CatalogProvider. Design: docs/superpowers/specs/2026-07-16-hyperliquid-bridge-design.md."
# The test binaries are the `[[test]]` rows below: discovery is off so every top-level `tests/*.rs` keeps its path
# and joins `tests/integration.rs` as a module (one binary to link, not one per file). A root file no row and no
# `mod` line builds is refused by `crates/vike-ops/tests/hygiene/test_registry_gate.rs`.
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The formula floor (decision 0294): `instrument::properties`'s `pow10_neg` reads
# `vike_math::powers::power_of_ten`, the one exact power of ten. Layer 2, `libm` only, already in this crate's
# closure through vike-model, so no new package.
vike-math = { path = "../../vike-math" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# The pure helpers (decision 0141, layer 3) this crate calls: `fnv`. The shared command-line layer `cli`
# (decision 0155) the `hyperliquid_builder_fee_approve` bin reads its argv through is turned on by the
# `builder-fee-approve` feature below.
vike-utility = { path = "../../vike-utility" }
# `#[derive(clap::Parser)]` on that bin's args struct (decision 0155); the shared rules are `vike_utility::cli`'s.
# OPTIONAL: only the `builder-fee-approve` feature, which the bin requires, links it (the owner, 2026-11-22).
clap = { workspace = true, optional = true }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../../vike-marketdata" }
vike-execution = { path = "../../vike-execution" }
# shared venue-bridge plumbing (credentials, ExecutionClientActor, transport, ws helpers).
# Its `eip712` feature — the generic EIP-712 primitive block `signing/eip712.rs` re-exports (ONE
# shared golden-vector-gated copy — the former verbatim local copy was deleted) — now rides this
# crate's own `execution` feature (default-on) rather than the dep line, so a feeds-only build stays
# k256-free.
vike-bridge-core = { path = "../../vike-bridge-core" }
# The generic network layer (decision 0299): the agents (`http`) and the send-outcome rules, which
# moved out of vike-bridge-core. Layer 4, no vike-* dependency, already in this crate's tree through it.
vike-transport = { path = "../../vike-transport" }
# The credential half that moved down out of vike-bridge-core (docs/decisions/0135): the mounted
# account's fields (`vike_secrets::account_credentials::AccountCredentials`), `attribution_code_from`,
# and the account directory the builder-fee bin reads its account through. Already in this crate's
# graph through vike-bridge-core, so it adds no package.
vike-secrets = { path = "../../vike-secrets" }
# the live DataClient seam its market_feed::DataClientSpecHyperliquid serves on the shared engine (default features — no DataFusion).
vike-data = { path = "../../vike-data" }
# universal cross-venue instrument catalog (`Instrument`/`CatalogProvider`) — CatalogProviderHyperliquid.
vike-catalog = { path = "../../vike-catalog" }
# The store's ONE naming rule (`store_path::store_name_of_user_name`, decision 0290, «Б» simplified): the properties tape
# files a builder-dex coin's grid under its store name. std-only; the tests' `scratch` guard and project walk too.
vike-paths = { path = "../../vike-paths" }
serde = { workspace = true }        # #[derive(Serialize/Deserialize)] on action + wire structs
serde_json = { workspace = true }   # /info + /exchange JSON bodies, WS frames
# The three signer-stack deps are `exec`-optional (split-plane Phase-5 hardening): every module
# that names them is `#[cfg(feature = "execution")]`, so the feeds-only build links no signing crate.
rmp-serde = { workspace = true, optional = true }    # msgpack action hashing (to_vec_named — field-order signing)
k256 = { workspace = true, optional = true }         # secp256k1 recoverable ECDSA (order signing)
tiny-keccak = { workspace = true, optional = true }  # keccak256 (action hash + EIP-712 hashing)
hex = { workspace = true }          # hex DECODING of the private key and test vectors (encoding: vike_utility::hex)
rust_decimal = { workspace = true } # float_to_wire decimal-string formatting (px.rs)
indexmap = { workspace = true }     # instrument maps keyed by symbol (insertion order)
ureq = { workspace = true }         # blocking REST (rustls, no OpenSSL) — /info + /exchange
tracing = { workspace = true }      # adapter diagnostics (per-order boundaries, not the hot fold)

[dev-dependencies]
# dev-only, `test-support`: `vike_secrets::smoke_directory`, the live smokes' one way to the credential store.
# Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
# `vike_execution::testing`'s doubles for this crate's tests — compiled only under vike-execution's
# `test-support`, which a DEV edge may turn on and the normal edge above may not.
vike-execution = { path = "../../vike-execution", features = ["test-support"] }
# dev-only, test-support feature: the shared RecordingSink DataClientSink double (testing-arch
# Phase 4d) — the normal [dependencies] vike-data entry above stays default-features.
vike-data = { path = "../../vike-data", features = ["test-support"] }
vike-log = { path = "../../vike-log", features = ["test-support"] }  # dev-only: test_init() for unit/smoke diagnostics; `capture` for log assertions
# dev-only, test-support feature: the shared scripted WS stream doubles (testing-arch Phase 4c) —
# `WebsocketSessionUserStreamScript` drives the REAL run_user loop across a reconnect in
# tests/hyperliquid_userdata_reconnect.rs. The [dependencies] entry above is untouched for normal
# builds; features are additive, so the normal `eip712` stays on. Mirrors aster/binance.
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only: the decoder totality harness (tests/decoder_never_panics.rs and
# src/instruments_props.rs) — arbitrary + structured JSON/text through every wire decoder.
proptest = { workspace = true }
# Self-referential dev-dep, the `vike-ctrader` idiom: it turns `test-support` on for THIS crate's own
# `tests/` binaries (`vike_hyperliquid::test_support`), and `builder-fee-approve`, so the operator bin and its
# argv tests build with them.
vike-hyperliquid = { path = ".", features = ["test-support", "builder-fee-approve"] }

[[bin]]
# One-time on-chain approveBuilderFee grant (task 7, unified-venue-attribution) — an operator
# utility, not part of the live exec/mount path. Only built under the builder-fee-approve feature,
# which also brings the one dependency only the bin needs, `clap` (with `vike_utility::cli`).
name = "hyperliquid_builder_fee_approve"
required-features = ["builder-fee-approve"]

[features]
# The exec/feeds seam (split-plane Phase-5 hardening; the design's §7 measured the whole +26-crate
# cost of client feeds as the shared secp256k1/EIP-712 stack). DEFAULT-ON, so every existing
# consumer builds byte-identically; a feeds-only client opts out with `default-features = false`
# and gets `base` + `feeds` (market_feed/market_data/history/instruments/catalog/funding) — the keyless
# `/info` + WS surface — with NO compiled order signer in its binary. `exec` gates `exec/` (client,
# user_data, recon_client, event_mapper, outcome_settlement), `signing/`, `account/user_signed/` (transfer,
# builder_fee), `adapter` and `transport/mod.rs`'s `/exchange` half. The `bridges-feeds` arm of
# scripts/ci_feature_suite.sh is the gate for the feeds half — a structural cargo-tree check, not
# just a compile.
default = ["execution"]
execution = ["dep:k256", "dep:tiny-keccak", "dep:rmp-serde", "vike-bridge-core/eip712"]
# Gates the hyperliquid_builder_fee_approve bin so a default build's bin list stays exactly the
# live-path set (mirrors vike-backfill's per-tool feature idiom). Implies `exec`: the bin signs a
# real on-chain approval, so it needs the signer stack. `clap` rides it too, so the bridge (and the
# gatewayhub that links it) compiles no `clap` (the owner, 2026-11-22). CI compiles the bin in `ci.yml`'s
# `tradehub-all` `cargo check --workspace --bins --features …` line, and the self dev-dependency turns it
# on in every test build, so the bin's own tests run in the roster.
builder-fee-approve = ["execution", "dep:clap", "vike-utility/cli"]
# `src/test_support.rs`: the crate's own test helpers (the SDK's canonical test order, the raw testnet
# `/exchange` POST), for its unit tests and, through the self dev-dependency, its `tests/` binaries.
test-support = []

# The test binaries. Discovery is off (`autotests` above), so these rows are the whole list: every other top-level
# `tests/*.rs` is a module of `integration` (`tests/integration.rs`'s module doc says which stay apart, and why).
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "hyperliquid_reconcile_smoke"
path = "tests/hyperliquid_reconcile_smoke.rs"

[[test]]
name = "hyperliquid_smokes"
path = "tests/hyperliquid_smokes/main.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
