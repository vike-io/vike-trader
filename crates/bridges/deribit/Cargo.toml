[package]
name = "vike-deribit"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Deribit venue bridge — options exec (JSON-RPC-over-WS order transport + private fill stream, no REST/HMAC) plus the keyless public options-chain provider (feed/options/chain.rs)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# NOT behind `exec`, although the order plane is its main consumer: the FEEDS half names it too —
# the data-client engine its feed/mod.rs spec runs on pins every feed thread through
# `vike_execution::affinity`, the edge every other seamed bridge keeps for the same reason — and vike-bridge-core, which the feeds
# half needs for its sockets, names it anyway.
vike-execution = { path = "../../vike-execution" }
# shared venue-bridge plumbing (credentials, signer, transport, http, user_data, format, json,
# ws/rest/klines fragments) — crate-reorg Phase 3 (D4); the direct-path style survives every
# later venue move unchanged.
vike-bridge-core = { path = "../../vike-bridge-core" }
vike-log = { path = "../../vike-log" } # `vike_log::poller`, the stop-aware poller-thread scaffold: the public feeds' `StopHandle`
# `vike_utility::retry::retry_on_pauses`, the fresh-combo wait's ladder (it moved down out of
# vike-bridge-core on 2026-11-13). Layer 3, already in this crate's graph through vike-bridge-core: no package.
vike-utility = { path = "../../vike-utility" }
# The credential half that moved down out of vike-bridge-core (docs/decisions/0135): the
# `vike_secrets::credentials` loaders, `account_var` and `TierKeys`, plus `key_permissions`,
# `venue_passphrase` or `account_directory` where this bridge names them. Already in this crate's graph
# through vike-bridge-core, so it adds no package.
vike-secrets = { path = "../../vike-secrets" }
# deribit's read-side chain provider (feed/options/chain.rs) consumes the venue-free options model/greeks —
# the layering twin of Python options/deribit.py importing options/{model,greeks}. Deribit is
# the ONLY crate-reorg bridge that carries a data/options/*.py port (D6 of the vike-options
# extraction plan): it moved here wholesale as part of the venue's own crate-reorg move.
vike-options = { path = "../../vike-options" }
# the venue-free feed vocabulary (docs/decisions/0126): the option-chain snapshot types feed/options/chain.rs
# builds (`OptionChain`, `Expiry`, `OptionChainStrike`, `OptionQuote`, `OptionKind`) and feed/dvol.rs's
# `VolatilityIndex` — moved out of vike-options into this layer-5 crate.
vike-marketdata = { path = "../../vike-marketdata" }
# PIT recording (opt-in): `VenueRestDeribit::with_properties_recorder` records the parsed instrument
# grid into the PropertiesRecorder store. (The `kind=chain` recording of fetched option chains is
# not here: the daemon that owns the store records what `DeribitOptionsProvider::fetch_chain`
# returns.)
vike-data = { path = "../../vike-data" }
# venue catalog contribution (catalog.rs): keyless public get_instruments → Instrument for the
# chart's cross-venue Symbol picker — mirrors binance/bybit/okx's catalog.rs.
vike-catalog = { path = "../../vike-catalog" }
serde_json = { workspace = true }
# Named by BOTH planes, so not behind `exec`: the option-instrument map keyed by instrument name
# (execution/rest.rs, exec) and the keyless chain's per-strike row map (feed/options/chain.rs, feeds).
indexmap = { workspace = true }
ureq = { workspace = true }         # blocking REST (rustls, no OpenSSL) — feed/options/chain.rs book-summary fetch
# EXEC-plane only — the authed order transport (transport/client.rs) and the private fill pump
# (execution/user_data.rs), both behind the default-on `execution` feature; every PUBLIC socket in this crate dials
# through vike-bridge-core's shared market pump instead. Declared optional so the manifest says
# which plane names it. ⚠ It still RESOLVES into a feeds-only tree through that crate's `full`
# feature, so no `cargo tree` grep can assert its absence — see the [features] block below.
tungstenite = { workspace = true, optional = true }
tracing = { workspace = true }      # adapter diagnostics

[dev-dependencies]
# dev-only, `test-support`: `vike_secrets::smoke_vars`, the live smokes' one way to the credential store.
# Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
# `vike_execution::testing`'s doubles for this crate's tests — compiled only under vike-execution's
# `test-support`, which a DEV edge may turn on and the normal edge above may not.
vike-execution = { path = "../../vike-execution", features = ["test-support"] }
# `vike_options::test_support`'s instrument and chain builders for the offline `option_*` members (the
# ones vike-options' own fold tests use). Widens the normal edge above; no new package.
vike-options = { path = "../../vike-options", features = ["test-support"] }
arc-swap = { workspace = true }   # smoke test reads the CoreSnapshot cell
vike-log = { path = "../../vike-log", features = ["test-support"] }  # dev-only: test_init() for smoke/dev diagnostics; `capture` for log assertions
# dev-only: smoke tests spawn a real core; the library itself must never depend on vike-core
# (crate-reorg D3 — bridges depend on exec, not core).
vike-core = { path = "../../vike-core" }
# dev-only: `tests/deribit_combo_smoke.rs` sends its combo through the node's door
# (`vike_tradehub::server::control::accept_command` over a `vike_tradehub_client::wire::CommandWire::Combo`, wave 6 of
# the order kinds), the path an operator's `trade order combo` takes. Upward dev edges (layer 65 and 25 over this 40):
# the layer gate reads normal edges only, and neither adds a package to the graph.
vike-tradehub = { path = "../../vike-tradehub" }
vike-tradehub-client = { path = "../../vike-tradehub-client" }
# dev-only, test-support feature: the DataFusion-free HistoryStoreMemory + PropertiesRecorder test double for
# the PIT filter-recording wiring test — the normal [dependencies] vike-data entry above stays
# default-features so the venue's DEFAULT build never pulls DataFusion in.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# dev-only, `capture` feature: `deribit_identity_probe.rs` sanitizes a live JSON-RPC result through
# `vike_bridge_core::capture::capture_frame` before printing it, so a real account identifier never
# reaches a terminal or a CI log — only `redacted_paths` names the field. Adds no PACKAGE to the
# graph (vike-bridge-core is already a normal dependency here), so the lockfile is unchanged; the
# binance, bybit and okx manifests carry the same entry for the same reason. `test-support` adds
# `venue_adapter_fixture`, the owned inputs `src/adapter_tests.rs` borrows the mount contract's
# `AdapterInputs`/`AdapterRequest` from — likewise no new package.
vike-bridge-core = { path = "../../vike-bridge-core", features = ["capture", "test-support"] }

# dev-only: the decoder totality harness (tests/decoder_never_panics.rs) — arbitrary + structured
# JSON/text through every wire decoder; no panic, no event flood.
proptest = { workspace = true }
# Self-referential dev-dep, the `vike-ctrader` idiom: it turns `test-support` on for THIS crate's own
# `tests/` binaries (`vike_deribit::test_support`, the testnet drills' socket).
vike-deribit = { path = ".", features = ["test-support"] }

[features]
# The exec/feeds seam — the shape vike-bybit/vike-okx took under ruling 8 of
# docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md, given to the one kline
# bridge still without it as a follow-up to docs/decisions/0094. DEFAULT-ON, so every consumer that
# takes default features (vike-tradehub, vike-app-core, vike-desktop and
# vike-bridge-core's conformance dev-dep) builds byte-identically. The feeds-only consumer is
# vike-gatewayhub's `data` feature (`default-features = false`), which reaches nothing but
# history.rs's keyless `KlineSourceDeribit`. `exec` gates the AUTHED half and everything built on it:
# transport/client.rs (the authed order socket), transport/ws_auth.rs, execution/rest.rs, execution/combo.rs (the order-entry wire
# model), execution/user_data.rs (the private fill pump), execution/event_mapper.rs and execution/resync.rs (the private-wire
# mappers), reconcile.rs, reconcile/mod.rs and execution/mod.rs. The keyless half — catalog/chain/data/dvol/
# market_data/market_feed/options_feed, plus the pure transport/rpc.rs and transport/ratelimit.rs helpers — compiles
# without it.
#
# ⚠ WHAT THIS SPLIT DOES NOT DO — ARGUED from the manifests, not measured on a box. Like bybit's and
# okx's, and unlike hyperliquid's and aster's, it removes NO CRATE from the dependency tree. Deribit
# signs nothing: `public/auth` is a client_credentials grant carried over TLS (transport/ws_auth.rs), so there
# is no signer crate to shed. The one dependency only `exec` names, tungstenite, rides
# vike-bridge-core (the shared market pump), which the feeds half needs; vike-execution is named
# by the feeds half itself (the affinity pin above) as well as by vike-bridge-core. So the default and the
# `--no-default-features` trees carry the same crate SET, and the `bridges-feeds` arm of
# scripts/ci_feature_suite.sh gates this crate with a compile check and no `cargo tree` grep.
# What the seam buys is the COMPILE surface: a data daemon linking this crate compiles no authed
# order transport, no private fill pump and no reconcile client.
default = ["execution"]
execution = ["dep:tungstenite"]
# `test-support` compiles `chain::DeribitOptionsProvider::with_book_summary_url` and
# `with_instruments_url`, the seams that point the book-summary and option-listing reads at a loopback
# server, and `src/options_fixture.rs`, that server. Dep-free, a pure cfg gate. Only a DEV edge may
# turn it on (vike-gatewayhub's, for `tests/rest_lane_surfaces.rs`), and
# crates/vike-ops/tests/architecture/test_surface_gate.rs refuses any shipped edge that does, so no
# shipped binary contains the method and every shipped book-summary read is the mainnet `live` `data`
# `venue_url` row's (`feed/options/chain.rs`'s `DeribitOptionsProvider::from_urls`). It
# also compiles `src/test_support.rs` (with `exec`): the authed TESTNET socket the order-placing drills
# read and clean up through, reached by the crate's own `tests/` binaries through the self dev-dep.
test-support = []

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
