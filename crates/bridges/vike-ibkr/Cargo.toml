[package]
name = "vike-ibkr"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Interactive Brokers venue bridge — one crate, three switchable transports (socket/cpapi/oauth) behind IbkrTransport. Phase 1: TWS/IB Gateway socket exec on the ibapi crate (sync). Live+paper by the mounted account's tier and its ACCOUNT field."
# The test binaries are the `[[test]]` rows below: discovery is off so every top-level `tests/*.rs` keeps its path
# and joins `tests/integration.rs` as a module (one binary to link, not one per file). A root file no row and no
# `mod` line builds is refused by `crates/vike-ops/tests/hygiene/test_registry_gate.rs`.
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# Decision 0290's translator and this process's KEPT ibkr list (`kept_list`, `kept_row_of_user_name`,
# `wire_name_of_row`): an engine's user name (`AAPL`, `USDJPY`) to the operator's row and its wire. Layer 20.
vike-catalog = { path = "../../vike-catalog" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# The pure helpers (decision 0141, layer 3) this crate calls: `calendar`.
vike-utility = { path = "../../vike-utility" }
# `vike_marketdata::interval::interval_ms`: the bar-interval vocabulary, which moved out of
# `vike_model::time`. Layer 5, serde only; already in this crate's closure through vike-model.
vike-marketdata = { path = "../../vike-marketdata" }
vike-execution = { path = "../../vike-execution" }
vike-bridge-core = { path = "../../vike-bridge-core" } # ExecutionClientActor, the venue-adapter contract
# The generic network layer (decision 0299): the cpapi agents (`http`), the WS socket and dial (`websocket`,
# `websocket_proxy`) and the loopback-only unverified rustls config (`tls`), which moved out of vike-bridge-core and of
# this crate. Layer 4, no vike-* dependency, already in this crate's tree through vike-bridge-core.
vike-transport = { path = "../../vike-transport", features = ["websocket"] }
# reads the mounted account's credential fields through `AccountCredentials` (decision 0156 item 6)
# and its `venue_setting` rows through `VenueSettings` (decision 0095) — the tier's gateway,
# `venue.ibkr.<tier>.backend` and its `venue_url` addresses. Already in this crate's graph through
# vike-bridge-core.
vike-secrets = { path = "../../vike-secrets" }
tracing = { workspace = true }       # adapter lifecycle diagnostics (never per-message on a hot path)
# compact_str (venue_order_id / trade_id) is not needed as a direct dep: FillEvent.trade_id and
# OrderAccepted.venue_order_id are populated via `.into()` from `String`, using the `From<String>`
# impl re-exported transitively through vike-model.

# Socket backend: the IBKR wire-protocol client, the published `ibapi` crate (5.4.0, `=`-pinned in
# the root manifest). BOTH `default-features = false` AND `features = ["sync"]` are LOAD-BEARING and
# are carried by the workspace entry, which this line inherits — ibapi's default feature is `async`
# (tokio); disabling defaults + selecting only `sync` forces the blocking (crossbeam-backed) client
# so NO tokio enters the otherwise-blocking bridge tree
# (see docs/superpowers/specs/2026-07-14-vike-ibkr-bridge-design.md §4). Optional: pulled in only by
# the `ibkr-socket` feature via `dep:ibapi`, so a default build never compiles it.
ibapi = { workspace = true, optional = true }

# Historical backfill (PR-3b) builds `OffsetDateTime` from epoch-ms for the `.ending()` paging
# request. Optional + pulled only by `ibkr-socket` (where ibapi — which requires time 0.3.47 or
# newer in the 0.3 line — exists). Matches ibapi 5.4.0's `time` requirement.
time = { workspace = true, optional = true }

# Live market-data seam (DataClient/DataClientSink). Optional: pulled by BOTH backends, each of which
# serves market data over its own session (socket: `market_feed` on the ibapi Client; cpapi:
# `cpapi_feed` on the CP Gateway, docs/decisions/0140). default-features = false; this crate never
# touches the DataFusion tree (`vike-store`).
vike-data = { path = "../../vike-data", default-features = false, optional = true }

# cpapi backend (Client Portal Web API): plain REST/JSON + WS, named directly by
# `transport/cpapi/*.rs` (`ureq::Agent`/`ureq::http::Response`, `serde_json::Value`,
# `tungstenite::connect`). All pure-Rust (rustls, no native). Optional: pulled in ONLY by the
# `ibkr-cpapi` feature via `dep:`, so a default build never compiles them.
serde_json = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
tungstenite = { workspace = true, optional = true }
# (The cpapi WS pump's loopback-only no-verify rustls config, the WS twin of `blocking_agent_loopback_insecure`, is
# `vike_transport::tls::loopback_insecure_client_config` since decision 0299, so this crate names no `rustls`.)

[dev-dependencies]
# Test-only: the project's filesystem layout (`vike_paths`, here its `scratch` guard or project walk): std-only.
vike-paths = { path = "../../vike-paths" }
vike-log = { path = "../../vike-log", features = ["test-support"] } # test_init() for lifecycle + smoke; `capture` for the mount tests
# The lifecycle integration test names `tokio::sync::mpsc::Receiver<Ingest>` (the ingest lane's
# receiver type returned by `event_channel`) in its `drain` helper — hence a dev-only tokio pin.
# It never spins a runtime: `try_recv` off a plain test thread is the only surface used.
tokio = { workspace = true }
# tests/ibkr_market_data_map.rs builds ibapi realtime-tick/Trade fixtures directly, which carry `time`
# (`OffsetDateTime`) fields — same crate ibapi 5.4.0 itself depends on (`time` 0.3.47 or newer).
time = { workspace = true }
# The shared capturing `DataClientSink` (`vike_data::test_support::RecordingSink`): tests/ibkr_market_data_map.rs
# asserts the quotes pump step sends the delay label beside the quote (decision 0140).
vike-data = { path = "../../vike-data", default-features = false, features = ["test-support"] }
# The venue-adapter contract's test double (`venue_adapter_fixture::AdapterFixture`, `test-support`).
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only: the wire-decoder totality harness (tests/decoder_never_panics.rs) and the EventMapper
# sequence harness (src/event_mapper_property_tests.rs) — arbitrary + shaped input through the real decoders
# and the real mapper; no panic, no event flood.
proptest = { workspace = true }
# dev-only, test-support feature: `vike_secrets::smoke_directory`, the live smokes' one way to the
# credential store (it reads `VIKE_SETTINGS_DIR` and `VIKE_NO_LIVE_KEYS` once). The normal
# [dependencies] vike-secrets entry above turns none of it on.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }

[features]
default = []
# `test-support` exposes the `testing` surface (IbkrTransportFake + run_exec_for_test) so the exec
# lifecycle is drivable with NO Gateway. It is dep-free (no optional dep table) — a pure cfg gate.
# The integration test runs under `--features test-support`; the default build never sees it.
test-support = []
# `ibkr` is the umbrella feature the app root / CI turn on to compile the live socket backend;
# `ibkr-socket` is the backend itself (`dep:ibapi` pulls in the blocking client). Split so
# Phase-2 backends (cpapi/oauth) can slot in as sibling features under the same `ibkr` umbrella.
ibkr = ["ibkr-socket", "ibkr-cpapi"]
ibkr-socket = ["dep:ibapi", "dep:vike-data", "dep:time"]
# cpapi (Client Portal Web API) backend: pulls the pure-Rust REST/WS/JSON deps. A default build
# compiles only the stub; `--features ibkr` (or `ibkr-cpapi`) compiles the cpapi module tree.
ibkr-cpapi = ["dep:serde_json", "dep:ureq", "dep:tungstenite", "dep:vike-data"]

# The test binaries. Discovery is off (`autotests` above), so these rows are the whole list: every other top-level
# `tests/*.rs` is a module of `integration` (`tests/integration.rs`'s module doc).
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "ibkr_smokes"
path = "tests/ibkr_smokes/main.rs"

[lints]
workspace = true
