[package]
name = "vike-oanda"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "OANDA v20 FX venue bridge — co-located data + exec (pure-Rust Bearer REST, no native SDK)."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The per-venue tables (`caps_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# `vike_marketdata::interval::interval_ms`: the bar-interval vocabulary, which moved out of
# `vike_model::time`. Layer 5, serde only; already in this crate's closure through vike-model.
vike-marketdata = { path = "../../vike-marketdata" }
vike-exec = { path = "../../vike-exec" }
# shared venue-bridge plumbing (venue_adapter, exec_actor, http::blocking_agent) —
# crate-reorg Phase 3 (D4); the direct-path style survives every later venue move unchanged.
vike-bridge-core = { path = "../../vike-bridge-core" }
# The credential half that moved down out of vike-bridge-core (docs/decisions/0135): the
# `vike_secrets::account_credentials` view of the mounted account's fields, plus `key_permissions`,
# `venue_passphrase` or `account_directory` where this bridge names them. Already in this crate's graph
# through vike-bridge-core, so it adds no package.
vike-secrets = { path = "../../vike-secrets" }
vike-catalog = { path = "../../vike-catalog" }
# the live market-data seam: market_feed::Feeds implements vike_data::DataClient (quotes stream +
# candle poller), riding the shared FeedRegistry per-subscription bookkeeping.
vike-data = { path = "../../vike-data" }
serde_json = { workspace = true }
ureq = { workspace = true }   # blocking REST (rustls, no OpenSSL) + the transactions-stream reader
tracing = { workspace = true } # A3 reconnect-resync-failure diagnostics

[dev-dependencies]
# dev-only, `test-support`: `vike_secrets::smoke_directory`, the live smokes' one way to the credential store.
# Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
# test-only: the ExecActor-wiring integration test drains a tokio::sync::mpsc Ingest receiver
# with a timeout (same pattern as vike-bridge-core/tests/exec_actor_dead_thread.rs).
tokio = { workspace = true }
# dev-only: test_init() for the gated live demo smoke test's diagnostics, and `vike_log::capture`
# (its `test-support`) — the scoped `tracing` capture the mount tests read lines with.
vike-log = { path = "../../vike-log", features = ["test-support"] }
# dev-only: the shared NoopSink LiveDataSink double for the market_feed lifecycle tests (testing-arch
# Phase 4d) — the normal [dependencies] vike-data entry above stays default-features.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# The venue-adapter contract's test double (`venue_adapter_fixture::AdapterFixture`, `test-support`).
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only: the decoder totality harnesses (tests/decoder_never_panics.rs, src/market_feed_props.rs,
# src/klines_props.rs) — arbitrary + structured JSON through the real stream / reconcile / history
# decoders; no panic, no event flood.
proptest = { workspace = true }

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
