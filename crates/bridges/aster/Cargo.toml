[package]
name = "vike-aster"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Aster DEX venue bridge — spot + USDⓈ-M perp exec (REST + listenKey user-data) with v3 EIP-712 wallet-signature auth, a live vike_data::DataClient feed, and public L2/tick market data. Binance-fork API (same endpoints/filters/streams); sole divergence is v3 signing via the bridge-core eip712 primitive."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue-stacked` — a venue bridge built on a SIBLING venue's family driver.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 41

[dependencies]
vike-model = { path = "../../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `L2BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../../vike-marketdata" }
vike-execution = { path = "../../vike-execution" }
# shared venue-bridge plumbing (credentials, signer seam, transport, http, user_data pump, ws,
# rest/VenueRest, klines, ratelimit). The eip712 primitive for v3 signing now rides this crate's
# own `execution` feature (default-on) rather than the dep line, so a feeds-only build stays k256-free.
vike-bridge-core = { path = "../../vike-bridge-core" }
# `vike_utility::poller`, the stop-aware poller-thread scaffold (layer 3, std only; already in this
# crate's graph through vike-model, so no package).
vike-utility = { path = "../../vike-utility" }
# The credential half that moved down out of vike-bridge-core (docs/decisions/0135): the
# `vike_secrets::credentials` slots (`Credentials`, `attribution_code_from`) and the mounted
# account's fields (`vike_secrets::account_credentials::AccountCredentials`). Already in this
# crate's graph through vike-bridge-core, so it adds no package.
vike-secrets = { path = "../../vike-secrets" }
# Aster's API is a Binance fork, so its PURE wire mappers AND its whole public market-data stack
# were byte-for-byte copies of Binance's. They now live once in `vike_binance::family` — the shared
# Binance-wire-grammar core, NOT a venue — and this crate's same-named modules are thin wrappers
# over it, each passing "aster" plus its own host table
# (docs/superpowers/specs/2026-07-17-dedup-extraction-design.md):
#   rung 1 (F0)          — event_mapper/perp_mapper/history/filters_rec (pure, venue as a param)
#   rung 2 (F8/F9/F11/F17) — market_data/trades/market_feed (hosts as a `UrlTable` param; Aster
#                            supplies its env-resolved row, Binance a const one)
# Since the owner's ruling of 2026-11-13 the signed REST bodies (`family::signed_rest`) and the exec
# plane (`family::execution_plane`) are the family's too, over aster's own facts; signing, the recon
# spec, the urls and the rate budgets stay Aster's own.
# ⚠ `default-features = false`, and the `execution` feature below forwards `vike-binance/exec` instead.
# Ruling 8 gave vike-binance the same feeds/exec seam this crate already had, and a plain dep line
# would have made that seam unreachable from here: features are additive, so requesting binance's
# default `exec` would have compiled the family's signed rungs (order_map/exec_loop/listenkey/recon
# and the exec mappers) into an aster FEEDS build — the very configuration the `bridges-feeds` lane
# exists to keep signer-free. A DEFAULT aster build is byte-identical, because `exec` is default-on
# here and forwards it straight back on.
vike-binance = { path = "../binance", default-features = false }
vike-data = { path = "../../vike-data" }        # market_feed::DataClientSpecAster is the live DataClient's venue half
vike-catalog = { path = "../../vike-catalog" }  # CatalogProviderAster CatalogProvider
serde_json = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# dev-only, `test-support`: `vike_secrets::smoke_directory`, the live smokes' one way to the credential store.
# Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
vike-log = { path = "../../vike-log", features = ["test-support"] } # `vike_log::loopback::serve_replies`, tests/offline/dial_bound.rs
vike-data = { path = "../../vike-data", features = ["test-support"] } # HistoryStoreMemory double for filters_rec test
# dev-only, test-support feature: the shared scripted WS stream doubles (testing-arch Phase 4c)
# and the venue-adapter contract's `AdapterFixture` — the normal [dependencies] vike-bridge-core
# entry above is untouched for normal builds.
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only: the live smoke's own agent (`tests/aster_smoke.rs`), the generic network layer's (decision 0299).
vike-transport = { path = "../../vike-transport" }
# dev-only: the decoder property harness (tests/decoder_never_panics.rs) — arbitrary + structured
# JSON through the aster wire decoders (the family mappers it re-exports, its own perp-instrument
# parser, the 1-arg recon parsers); totality: no panic, no event flood.
proptest = { workspace = true }

[features]
# The exec/feeds seam (split-plane Phase-5 hardening; the design's §7 measured the whole
# +26-crate cost of client feeds as the shared secp256k1/EIP-712 stack). DEFAULT-ON, so every
# existing consumer builds byte-identically; a feeds-only client opts out with
# `default-features = false` and gets market_feed/market_data/data/trades/catalog — the keyless
# public surface — with NO compiled order signer in its binary. `exec` gates transport/sign.rs and
# everything built on it: execution/mod.rs, execution/rest/spot.rs, execution/rest/perp.rs, transport/listenkey_auth.rs, execution/user_data/spot.rs,
# execution/user_data/perp.rs, reconcile.rs, plus the exec-plane mappers (execution/event_mapper/spot.rs,
# execution/event_mapper/perp.rs, execution/resync.rs, instrument.rs). The `bridges-feeds` arm of
# scripts/ci_feature_suite.sh is the gate for the feeds half — a structural cargo-tree check,
# not just a compile. Aster's own dep list carries no signing crate: the whole stack arrives
# through vike-bridge-core's `eip712` feature, which is exactly what this feature turns on.
# ⚠ It also forwards `vike-binance/exec`: since ruling 8 that crate carries the same seam, and this
# crate's exec plane is built on its family rungs (order_map/exec_loop/listenkey/recon and the exec
# mappers). Without the forward an aster exec build would not compile; with it, a feeds-only aster
# build compiles only the family's feeds rungs (catalog/depth/klines/market_feed/trades).
default = ["execution"]
execution = ["vike-bridge-core/eip712", "vike-binance/execution"]

# The test binaries. Discovery stays ON in this crate, unlike the other bridges: `scripts/publish_mirror.sh` DENIES
# `tests/testnet_claim_gate.rs`, so the public mirror deletes it, and a `[[test]]` row or a `mod` line naming it would
# not compile there; it stays an auto-discovered binary of its own. Every other top-level `tests/*.rs` but the
# `offline` group is a module of `integration` (`tests/integration.rs`), and its auto-discovered standalone target is
# switched off below: `test = false` keeps it out of `cargo test`, `--tests`, `--all-targets` and nextest, so it is
# compiled and linked once, inside `integration`. A NEW `tests/*.rs` is a binary of its own until it is added to
# both lists.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "aster_market_data_smoke"
test = false

[[test]]
name = "aster_reconcile_smoke"
test = false

[[test]]
name = "aster_smoke"
test = false

[[test]]
name = "aster_userdata_soak"
test = false

[[test]]
name = "decoder_never_panics"
test = false

[[test]]
name = "order_client_id_map_failure_repro"
test = false

# The plain offline group (tests/offline.rs). Its members import modules that exist only under the
# default-on `execution` feature (event_mapper, perp_mapper, perp, recon_client), so
# `required-features` makes `cargo check -p vike-aster --no-default-features --all-targets` skip the
# binary instead of dying with E0432. The default build compiles it exactly as before.
[[test]]
name = "offline"
path = "tests/offline.rs"
required-features = ["execution"]

[lints]
workspace = true
