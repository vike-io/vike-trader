[package]
name = "vike-ctrader"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "cTrader Open API venue bridge — one multiplexed protobuf/TLS socket carrying data + exec; OAuth2 token auth."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The pure helpers (decision 0141, layer 3) this crate calls: `percent`, and the shared command-line layer `cli`
# (decision 0155) the `ctrader_authorize` bin reads its argv through.
vike-util = { path = "../../vike-util", features = ["cli"] }
# `#[derive(clap::Parser)]` on that bin's args struct (decision 0155); the shared rules are `vike_util::cli`'s.
clap = { workspace = true }
# The project's filesystem layout (`vike_paths::state_path`, `store_path`, `scratch`): std-only, layer 7.
vike-paths = { path = "../../vike-paths" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../../vike-marketdata" }
vike-exec = { path = "../../vike-exec" }
vike-data = { path = "../../vike-data" }
vike-bridge-core = { path = "../../vike-bridge-core" }
vike-catalog = { path = "../../vike-catalog" }
# the credential STORE — read by every root, and WRITTEN by this crate in two places only: when
# the venue rotates its OAuth grant (src/token_store.rs) and when `ctrader_authorize` files the
# first grant, both through `vike_secrets::save_owned_credentials`' upsert of ONE account's two
# fields. ⚠ Read "Zero-dependency crate: it widens no audit surface" until 2026-09-13 — it carries
# one external crate now (rusqlite, decision 0054) — and the surviving half was then written as
# "no vike-* dependency" until decision 0072 (accepted 2026-09-20) admitted vike-model. What
# survives BOTH, and is why this edge is cheap: that crate names nothing above the vocabulary
# floor but the change journal one rung over it (tier `leaf`'s rule plus its one declared exception
# row, machine-checked by `crates/vike-ops/tests/architecture/layer_gate.rs`), so this bridge does
# not drag the workspace in — and its vike-* edges cost this bridge nothing: vike-model and
# vike-change-journal are declared outright in this manifest, and vike-util and vike-paths sit
# beneath vike-model. See src/token_store.rs.
vike-secrets = { path = "../../vike-secrets" }
# The change journal (the token rotation's `credential_write` record, src/token_store.rs). It was
# a module of vike-secrets until it moved into its own crate (layer 12); it names only
# vike-model, vike-util, serde and serde_json, all already in this graph.
vike-change-journal = { path = "../../vike-change-journal" }
prost = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
serde_json = { workspace = true }   # token JSON (Value-based: no serde derive in this crate)
tracing = { workspace = true }

# unix only, and for ONE constant: `libc::O_NOFOLLOW` in `ctrader_authorize`'s `write_private`, so
# the open of the live-OAuth-token file cannot follow a symlink (see that function). ZERO new
# packages — libc is already a direct workspace dependency of vike-journal and already in Cargo.lock,
# so the `cargo deny --all-features` audit surface is unchanged. There is no std spelling of the
# flag: `OpenOptionsExt::custom_flags` takes a raw `i32` whose value is per-platform.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# NO [build-dependencies]: the protobuf bindings are PRE-GENERATED and committed at
# src/generated/openapi.rs (there is no build.rs), so prost-build/protoc-bin-vendored/vendored
# protoc are OUT of the normal build + supply chain. The committed file is kept byte-identical to a
# fresh prost-build regen by .github/workflows/ctrader-proto.yml (the drift gate, which pins the
# prost-build/protoc versions used to regenerate). `prost` (runtime, in [dependencies]) still backs
# the generated derives.

[dev-dependencies]
# dev-only, test-support feature: the shared NoopSink/RecordingSink LiveDataSink doubles
# (testing-arch Phase 4d) — the normal [dependencies] vike-data entry above stays
# default-features.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# `vike_log::capture` (its `test-support`): the scoped `tracing` capture the mount tests read lines with.
vike-log = { path = "../../vike-log", features = ["test-support"] }
# test-only: the live demo smoke test drains a tokio::sync::mpsc Ingest receiver with a timeout
# (same pattern as crates/bridges/oanda/tests/oanda_demo_smoke.rs).
tokio = { workspace = true }
# test-only: throwaway project trees + files for `ctrader_authorize`'s token-path resolver and its
# 0600 permission assertion — neither may touch the real settings directory or a real token.
tempfile = { workspace = true }
# dev-only: the framing property harness (tests/framing_props.rs) -- encode/decode round-trip and
# totality over arbitrary byte streams.
proptest = { workspace = true }
# The venue mount contract's test double (`venue_mount_fixture::MountFixture`, `test-support`).
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# dev-only, test-support feature: `vike_secrets::smoke_directory`, the live smokes' one way to the
# credential store (it reads `VIKE_SETTINGS_DIR` and `VIKE_NO_LIVE_KEYS` once), and the record-less
# `edit_account_in_unjournalled` / `save_owned_credentials_unjournalled` the rotation tests seed a
# store with. The normal [dependencies] vike-secrets entry above turns none of it on.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }

[[bin]]
name = "ctrader_authorize"
path = "src/bin/ctrader_authorize.rs"

[lints]
workspace = true
