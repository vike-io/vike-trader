[package]
name = "vike-ctrader"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "cTrader Open API venue bridge — one multiplexed protobuf/TLS socket carrying data + exec; OAuth2 token auth."
# The test binaries are the `[[test]]` rows below: discovery is off so every top-level `tests/*.rs` keeps its path
# and joins `tests/integration.rs` as a module (one binary to link, not one per file). A root file no row and no
# `mod` line builds is refused by `crates/vike-ops/tests/hygiene/test_registry_gate.rs`.
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# The pure helpers (decision 0141, layer 3) this crate calls: `percent`. The shared command-line layer `cli`
# (decision 0155) the `ctrader_authorize` bin reads its argv through is turned on by the `authorize` feature below.
vike-utility = { path = "../../vike-utility" }
# The exact powers of ten (`vike_math::powers::power_of_ten`, layer 2, decision 0294): the money, pip and price
# scales, the literal `1e{k}`'s bits for |k| <= 22 (`crate::execution::close_detail`'s `money_scale` past it).
vike-math = { path = "../../vike-math" }
# `#[derive(clap::Parser)]` on that bin's args struct (decision 0155); the shared rules are `vike_utility::cli`'s.
# OPTIONAL: only the `authorize` feature, which the bin requires, links it (the owner, 2026-11-22).
clap = { workspace = true, optional = true }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../../vike-marketdata" }
vike-execution = { path = "../../vike-execution" }
vike-data = { path = "../../vike-data" }
vike-bridge-core = { path = "../../vike-bridge-core" }
# The generic network layer (decision 0299): the OAuth agent (`http`) and the protobuf socket's verified TLS wrap
# (`tls::verified_tls_stream`, rustls on ring with the webpki roots), so this crate names no `rustls` and no
# `webpki-roots` of its own. Layer 4, no vike-* dependency, already in this crate's tree through vike-bridge-core.
vike-transport = { path = "../../vike-transport" }
vike-catalog = { path = "../../vike-catalog" }
# the credential STORE — read by every root, and WRITTEN by this crate in two places only: when
# the venue rotates its OAuth grant (src/transport/token_store.rs) and when `ctrader_authorize` files the
# first grant, both through `vike_secrets::save_owned_credentials`' upsert of ONE account's two
# fields. ⚠ Read "Zero-dependency crate: it widens no audit surface" until 2026-09-13 — it carries
# one external crate now (rusqlite, decision 0054) — and the surviving half was then written as
# "no vike-* dependency" until decision 0072 (accepted 2026-09-20) admitted vike-model. What
# survives BOTH, and is why this edge is cheap: that crate names nothing above the vocabulary
# floor but the change journal one rung over it (tier `leaf`'s rule plus its one declared exception
# row, machine-checked by `crates/vike-ops/tests/architecture/layer_gate.rs`), so this bridge does
# not drag the workspace in — and its vike-* edges cost this bridge nothing: vike-model and
# vike-change-journal are declared outright in this manifest, and vike-utility sits beneath
# vike-model. See src/transport/token_store.rs.
vike-secrets = { path = "../../vike-secrets" }
# The change journal (the token rotation's `credential_write` record, src/transport/token_store.rs). It was
# a module of vike-secrets until it moved into its own crate (layer 12); it names only
# vike-model, vike-utility, serde and serde_json, all already in this graph.
vike-change-journal = { path = "../../vike-change-journal" }
prost = { workspace = true }
# `SO_LINGER=0` on a socket the actor calls dead, so the kernel drops its unsent frames (an order among them)
# instead of sending them once the path heals (src/transport/connection/stream.rs's `abort`; the root manifest has the reason).
socket2 = { workspace = true }
serde_json = { workspace = true }   # token JSON (Value-based: no serde derive in this crate)
tracing = { workspace = true }
# `test-support` only: `crate::test_support`'s ingest helpers name a `tokio::sync::mpsc::Receiver`.
# Already a dev-dependency below, so no new package.
tokio = { workspace = true, optional = true }

[features]
# `crate::test_support`: the fake cTrader server and helpers this crate's integration binaries share.
# Turned on only by the self dev-dependency below; no shipped edge may enable it
# (`crates/vike-ops/tests/architecture/test_surface_gate.rs`). It forwards vike-data's
# `test-support` because the module re-exports that crate's `NoopSink`/`RecordingSink` doubles.
test-support = ["dep:tokio", "vike-data/test-support"]
# The `ctrader_authorize` operator tool (its `[[bin]]` below requires it): `clap` and `vike_utility::cli` for its argv,
# so the bridge, and the gatewayhub that links it, compile no `clap` through this crate (the owner, 2026-11-22: no new
# crate for one bin). CI compiles the bin in `ci.yml`'s `tradehub-all` `cargo check --workspace --bins --features …`
# line, and the self dev-dependency below turns it on in every test build, so the bin's own tests run in the roster.
authorize = ["dep:clap", "vike-utility/cli"]

# NO [build-dependencies]: the protobuf bindings are PRE-GENERATED and committed at
# src/generated/openapi.rs (there is no build.rs), so prost-build/protoc-bin-vendored/vendored
# protoc are OUT of the normal build + supply chain. The committed file is kept byte-identical to a
# fresh prost-build regen by .github/workflows/ctrader-proto.yml (the drift gate, which pins the
# prost-build/protoc versions used to regenerate). `prost` (runtime, in [dependencies]) still backs
# the generated derives.

[dev-dependencies]
# `vike_change_journal::test_support::assert_no_secret_window`, the no-secret-in-the-ledger assertion
# the credential suites share. Widens the normal edge; no new package.
vike-change-journal = { path = "../../vike-change-journal", features = ["test-support"] }
# dev-only, test-support feature: the shared NoopSink/RecordingSink DataClientSink doubles
# (testing-arch Phase 4d) — the normal [dependencies] vike-data entry above stays
# default-features.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# `vike_log::capture` (its `test-support`): the scoped `tracing` capture the mount tests read lines with.
vike-log = { path = "../../vike-log", features = ["test-support"] }
# test-only: the live demo smoke test drains a tokio::sync::mpsc Ingest receiver with a timeout
# (same pattern as crates/bridges/oanda/tests/oanda_smokes/oanda_demo_smoke.rs).
tokio = { workspace = true }
# test-only: throwaway settings directories and files for the token-rotation and exec tests — none
# may touch the real settings directory or a real token.
tempfile = { workspace = true }
# dev-only: the framing property harness (tests/framing_property_tests.rs) -- encode/decode round-trip and
# totality over arbitrary byte streams.
proptest = { workspace = true }
# The venue-adapter contract's test double (`venue_adapter_fixture::AdapterFixture`, `test-support`).
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support"] }
# `vike_execution::testing::await_event`, the live smokes' terminal wait. The normal edge above already links
# the crate, so the feature changes no lockfile entry.
vike-execution = { path = "../../vike-execution", features = ["test-support"] }
# dev-only, test-support feature: `vike_secrets::smoke_directory`, the live smokes' one way to the
# credential store (it reads `VIKE_SETTINGS_DIR` and `VIKE_NO_LIVE_KEYS` once), and the record-less
# `edit_account_in_unjournalled` / `save_owned_credentials_unjournalled` the rotation tests seed a
# store with. The normal [dependencies] vike-secrets entry above turns none of it on.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
# Self-referential dev-dep, the `vike-execution`/`vike-model` idiom: it turns `test-support` on for THIS
# crate's own `tests/` targets, so `src/test_support/` (the fake server twenty-four binaries share) is
# compiled once by the library instead of once per binary, and `authorize`, so the bin and its tests build with
# them. Never affects a normal build.
vike-ctrader = { path = ".", features = ["test-support", "authorize"] }

# The test binaries. Discovery is off (`autotests` above), so these rows are the whole list: every other top-level
# `tests/*.rs` is a module of `integration` (`tests/integration.rs`'s module doc says which stay apart, and why).
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "offline"
path = "tests/offline.rs"

[[test]]
name = "ctrader_reconcile_smoke"
path = "tests/ctrader_reconcile_smoke.rs"

[[test]]
name = "ctrader_cfd_units_smoke"
path = "tests/ctrader_cfd_units_smoke.rs"

[[bin]]
name = "ctrader_authorize"
path = "src/bin/ctrader_authorize.rs"
required-features = ["authorize"]

[lints]
workspace = true
