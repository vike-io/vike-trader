[package]
name = "vike-binance"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Binance venue bridge — spot + USDS-M perp exec (REST + WS-API user-data session), REST kline history, a live vike_data::DataClient kline feed, and public L2/tick market data (HFT track). Moved into crates/bridges/binance (crate-reorg Phase 3, PR H) — binance was the cleave donor (PR A moved its venue-neutral WsSocket/WebsocketSessionUserStreamTungstenite, SymbolProperties/VenueRest/ExecutionClientRest, and kline_to_bar fragments into vike-bridge-core), so this move is the remaining self-contained venue code."
# The test binaries are the `[[test]]` rows below: discovery is off so every top-level `tests/*.rs` keeps its path
# and joins `tests/integration.rs` as a module (one binary to link, not one per file). A root file no row and no
# `mod` line builds is refused by `crates/vike-ops/tests/hygiene/test_registry_gate.rs`.
autotests = false

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
# The per-venue tables (`capabilities_for`, `fee_schedule_for`, the credential-field table ...) that left `vike-model` (decision 0162).
vike-venues = { path = "../../vike-venues" }
# The market-data vocabulary (`Bar`, the tick types, `L2Book`, `BookUpdate`, `OptionKind`, ...):
# spelled `vike_marketdata::X` everywhere -- vike-model names but does not re-export it (0067).
vike-marketdata = { path = "../../vike-marketdata" }
vike-execution = { path = "../../vike-execution" }
# shared venue-bridge plumbing (credentials, signer, transport, http, json, user_data, format,
# ws/rest/klines fragments) — crate-reorg Phase 3 (D4); the direct-path style survives every
# later venue move unchanged.
vike-bridge-core = { path = "../../vike-bridge-core" }
# The generic network layer (decision 0299): the agents (`http`) and the WS socket and dial (`websocket`, `websocket_proxy`), which
# moved out of vike-bridge-core. Layer 4, no vike-* dependency, already in this crate's tree through it.
vike-transport = { path = "../../vike-transport", features = ["websocket"] }
# `vike_utility::poller`, the stop-aware poller-thread scaffold (layer 3, std only; already in this
# crate's graph through vike-model, so no package).
vike-utility = { path = "../../vike-utility" }
# D2 (crate-reorg spec): binance's market_feed::DataClientSpecBinance is the live DataClient's venue half.
vike-data = { path = "../../vike-data" }
# universal cross-venue instrument catalog (`Instrument`/`CatalogFieldMap`/`CatalogProvider`) — the
# `CatalogProviderBinance` provider in catalog.rs (crate-reorg catalog workstream, Task 9).
vike-catalog = { path = "../../vike-catalog" }
serde = { workspace = true }        # #[derive(Deserialize)] on the live kline WS frame (feed/mod.rs)
serde_json = { workspace = true }
# EXEC-plane only — the SymbolProperties/instrument maps in execution/rest/spot.rs/perp.rs/filters_rec.rs and
# family/execution/order_map.rs, every one of them behind the default-on `execution` feature. Declared optional so
# the manifest says which plane names it. ⚠ It still RESOLVES into a feeds-only tree through
# vike-model and vike-execution (both non-optional deps that name it), so no `cargo tree` grep can
# assert its absence — see the [features] block below for what this split does and does not remove.
indexmap = { workspace = true, optional = true }
ureq = { workspace = true }         # blocking REST (rustls, no OpenSSL) — kline fetch + public endpoints
tungstenite = { workspace = true }  # blocking WS: user-data session + public market-data/kline feeds
tracing = { workspace = true }      # adapter diagnostics
# reads its `venue_setting` rows through `VenueSettings` (decision 0095) — the mount's
# `venue.binance.trade_lite_fill`. Already in this crate's graph through vike-bridge-core.
vike-secrets = { path = "../../vike-secrets" }

[dev-dependencies]
# dev-only, `test-support`: `vike_secrets::smoke_vars`, the live smokes' one way to the credential store.
# Widens the normal edge above; adds no package, so the lockfile is unchanged.
vike-secrets = { path = "../../vike-secrets", features = ["test-support"] }
# `vike_model::test_support::bars::assert_bars_bit_eq` for `tests/offline/kline_fixture.rs`, the bit-exact bar check
# five crates' tests used to copy. The normal edge above stays featureless, so no shipped build compiles
# it (`crates/vike-ops/tests/architecture/test_surface_gate/manifests.rs` refuses a normal edge that would).
vike-model = { path = "../../vike-model", features = ["test-support"] }
# `vike_catalog::recorded_kept_lists`: `catalog_class_tests.rs`'s `the_name_rule_agrees_with_every_row` holds the
# recorded COIN-M rows equal to this crate's dapi parse. Widens the normal edge; the lockfile is unchanged.
vike-catalog = { path = "../../vike-catalog", features = ["test-support"] }
# `vike_execution::testing`'s doubles for this crate's tests — compiled only under vike-execution's
# `test-support`, which a DEV edge may turn on and the normal edge above may not.
vike-execution = { path = "../../vike-execution", features = ["test-support"] }
arc-swap = { workspace = true }   # smoke tests read the CoreSnapshot cell
vike-log = { path = "../../vike-log", features = ["test-support"] }  # dev-only: test_init() for smoke/dev test diagnostics; `capture` for log assertions
# dev-only: smoke tests spawn a real core; the library itself must never depend on vike-core
# (crate-reorg D3 — bridges depend on exec, not core).
vike-core = { path = "../../vike-core" }
# dev-only, test-support feature: the DataFusion-free HistoryStoreMemory + PropertiesRecorder test double for
# the PIT filter-recording wiring test — the normal [dependencies] vike-data entry above stays
# default-features so the venue's DEFAULT build never pulls DataFusion in.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# dev-only bridge-core test surfaces: `test-support` = the shared scripted WS stream doubles
# (testing-arch Phase 4c); `capture` = the sanitized real-frame capture harness (testing-arch §5)
# — the opt-in capture arm (binance_capture_smoke.rs) writes tests/fixtures/captured/, and the
# normal CI'd offline/captured_wire_replay.rs decodes the committed fixtures back through the real
# event_mapper. The normal [dependencies] vike-bridge-core entry above stays default-features, so
# the shipped adapter never compiles either test surface.
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support", "capture"] }

# dev-only: the parser property harness (tests/mapper_property_tests.rs) — arbitrary + mutated JSON through
# the real event_mapper / route_frame; totality (no panic, no event flood).
proptest = { workspace = true }
# Self-referential dev-dep, the `vike-ctrader` idiom: it turns `test-support` on for THIS crate's own
# `tests/` binaries (`vike_binance::instrument::names::kept_list_for_tests`).
vike-binance = { path = ".", features = ["test-support"] }

[features]
# `instrument::names::kept_list_for_tests`: the kept binance list the crate's unit tests and, through the self
# dev-dependency above, its `tests/` binaries hold (decision 0290: a user name is read off its kept row). Forwards
# vike-catalog's, whose recorded COIN-M rows it holds.
test-support = ["vike-catalog/test-support"]
# The exec/feeds seam (ruling 8 of docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md),
# copied from vike-hyperliquid/vike-aster verbatim — DEFAULT-ON, so every existing consumer
# (vike-tradehub, vike-backfill, vike-recorder, vike-backtest, vike-aster and
# vike-bridge-core's conformance dev-deps all take default features) builds byte-identically.
# A feeds-only consumer opts out with `default-features = false` and gets the keyless public
# surface — data/market_data/market_feed/trades/catalog/ratelimit plus the family rungs they call
# (catalog/depth/klines/market_feed/trades) — with none of the order plane COMPILED into its
# binary. `exec` gates execution/rest/spot.rs, execution/rest/perp.rs, execution/mod.rs, execution/user_data/spot.rs, execution/user_data/perp.rs, transport/ws_auth.rs,
# account/identity.rs, reconcile/mod.rs, execution/event_mapper/spot.rs, execution/event_mapper/perp.rs, execution/resync.rs, instrument/record.rs,
# transport/error_codes.rs and the family exec rungs (event_mapper/perp_mapper/history/filters_rec/
# exec_loop/order_map/listenkey/recon).
#
# ⚠ WHAT THIS SPLIT DOES NOT DO, MEASURED on the CI box 2026-09-10 rather than assumed. Unlike
# hyperliquid's and aster's, this seam removes NO CRATE from the dependency tree: `diff`ing this
# crate's default `cargo tree -e normal` against its `--no-default-features` one reports NO
# difference at all. `cargo tree -i` over the feeds build names where each residual enters, and not one
# of them is the exec plane — hmac/sha2/hex/rust_decimal through vike-bridge-core, base64
# through `ureq` AS WELL AS that, and indexmap through vike-execution, vike-model, vike-catalog and
# vike-data. Binance signs with HMAC-SHA256 through `vike_bridge_core::signer`, and the FEEDS half
# needs that crate too (http/ws/depth/market_pump all live in it), so no `cargo tree` grep can
# assert any of them absent — which is why this crate has no structural check of its own and the
# `bridges-feeds` arm says so at length.
# ⚠ The obvious remedy is SMALLER than it looks, and the measurement is written down here because
# the intuition is wrong: splitting a `signer` feature out of vike-bridge-core would
# remove `hmac` and `sha2` and NOTHING ELSE — the feeds half dials over the very `ureq` that
# carries base64, three pure feeds crates carry indexmap, and its own format/rest modules name
# rust_decimal. That is a change to a SHARED HOME every bridge consumes, for two crates: a
# STOP-AND-REPORT under root CLAUDE.md, recorded under ruling 8 in
# docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md, not patched from here.
# What the seam buys today is the COMPILE surface, which is what ruling 8 asked for in as many
# words: a data daemon linking this crate compiles no signed REST client, no private user-data pump
# and no reconcile client.
default = ["execution"]
execution = ["dep:indexmap"]

[[bench]]
# route_frame decode baseline (perf-program measurement scaffolding): a main() that prints a
# report — the hand-rolled vike-backtest/benches/engines.rs pattern, NO criterion dep.
# Run: cargo bench -p vike-binance --bench route_frame
name = "route_frame"
harness = false

# The test binaries. Discovery is off (`autotests` above), so these rows are the whole list: every other top-level
# `tests/*.rs` is a module of `integration` (`tests/integration.rs`'s module doc says which stay apart, and why).
# An `exec`-only test (spot, perp, user_data, event_mapper, ReconcileClientBinance, family::listenkey ...) is gated:
# a row by `required-features`, a module of `integration` by `#[cfg(feature = "execution")]` on its `mod` line, so
# `cargo check -p vike-binance --no-default-features --all-targets` compiles what needs no `exec` and skips the rest
# instead of dying with E0432.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "offline"
path = "tests/offline.rs"
required-features = ["execution"]

[[test]]
name = "binance_smokes"
path = "tests/binance_smokes/main.rs"
required-features = ["execution"]

[[test]]
name = "binance_market_data_smoke"
path = "tests/binance_market_data_smoke.rs"

[[test]]
name = "feed_status_journal"
path = "tests/feed_status_journal.rs"

[[test]]
name = "listenkey_stream_pin"
path = "tests/listenkey_stream_pin.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
