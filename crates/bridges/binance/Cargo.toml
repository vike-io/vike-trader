[package]
name = "vike-binance"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # proprietary — never to crates.io (also exempts it from deny.toml license checks)
description = "Binance venue bridge — spot + USDS-M perp exec (REST + WS-API user-data session), REST kline history, a live vike_data::DataClient kline feed, and public L2/tick market data (HFT track). Moved into crates/bridges/binance (crate-reorg Phase 3, PR H) — binance was the cleave donor (PR A moved its venue-neutral WsSocket/TungsteniteStream, SymbolProperties/VenueRest/LiveRestClient, and kline_to_bar fragments into vike-bridge-core), so this move is the remaining self-contained venue code."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/layer_gate.rs). Tier `venue` — a per-venue bridge built on vike-bridge-core.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 40

[dependencies]
vike-model = { path = "../../vike-model" }
vike-exec = { path = "../../vike-exec" }
# shared venue-bridge plumbing (credentials, signer, transport, http, json, user_data, format,
# ws/rest/klines fragments) — crate-reorg Phase 3 (D4); the direct-path style survives every
# later venue move unchanged.
vike-bridge-core = { path = "../../vike-bridge-core" }
# D2 (crate-reorg spec): binance's market_feed::Feeds implements the live DataClient seam
# directly (default features only — the DataFusion tree stays behind hist-datafusion and must
# NOT enable).
vike-data = { path = "../../vike-data" }
# universal cross-venue instrument catalog (`Instrument`/`FieldMap`/`CatalogProvider`) — the
# `BinanceCatalog` provider in catalog.rs (crate-reorg catalog workstream, Task 9).
vike-catalog = { path = "../../vike-catalog" }
serde = { workspace = true }        # #[derive(Deserialize)] on the live kline WS frame (market_feed.rs)
serde_json = { workspace = true }
# EXEC-plane only — the SymbolProperties/instrument maps in spot.rs/perp.rs/filters_rec.rs and
# family/order_map.rs, every one of them behind the default-on `exec` feature. Declared optional so
# the manifest says which plane names it. ⚠ It still RESOLVES into a feeds-only tree through
# vike-model and vike-exec (both non-optional deps that name it), so no `cargo tree` grep can
# assert its absence — see the [features] block below for what this split does and does not remove.
indexmap = { workspace = true, optional = true }
ureq = { workspace = true }         # blocking REST (rustls, no OpenSSL) — kline fetch + public endpoints
tungstenite = { workspace = true }  # blocking WS: user-data session + public market-data/kline feeds
tracing = { workspace = true }      # adapter diagnostics

[dev-dependencies]
arc-swap = { workspace = true }   # smoke tests read the CoreSnapshot cell
vike-log = { path = "../../vike-log" }  # dev-only: test_init() for smoke/dev test diagnostics
# dev-only: smoke tests spawn a real core; the library itself must never depend on vike-core
# (crate-reorg D3 — bridges depend on exec, not core).
vike-core = { path = "../../vike-core" }
# dev-only: the market-maker smoke (binance_market_maker_smoke.rs) mounts the `SpreadMaker`, which
# lives in vike-mm (the vike-mm extraction). Test-only, like the vike-core dev-dep above.
vike-mm = { path = "../../vike-mm" }
# dev-only, test-support feature: the DataFusion-free MemHistStore + PropertiesRecorder test double for
# the PIT filter-recording wiring test — the normal [dependencies] vike-data entry above stays
# default-features so the venue's DEFAULT build never pulls DataFusion in.
vike-data = { path = "../../vike-data", features = ["test-support"] }
# dev-only bridge-core test surfaces: `test-support` = the shared scripted WS stream doubles
# (testing-arch Phase 4c); `capture` = the sanitized real-frame capture harness (testing-arch §5)
# — the opt-in capture arm (binance_capture_smoke.rs) writes tests/fixtures/captured/, and the
# normal CI'd captured_wire_replay.rs decodes the committed fixtures back through the real
# event_mapper. The normal [dependencies] vike-bridge-core entry above stays default-features, so
# the shipped adapter never compiles either test surface.
vike-bridge-core = { path = "../../vike-bridge-core", features = ["test-support", "capture"] }

# dev-only: the parser property harness (tests/mapper_props.rs) — arbitrary + mutated JSON through
# the real event_mapper / route_frame; totality (no panic, no event flood).
proptest = { workspace = true }

[features]
# The exec/feeds seam (ruling 8 of docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md),
# copied from vike-hyperliquid/vike-aster verbatim — DEFAULT-ON, so every existing consumer
# (vike-mount, vike-tradehub, vike-backfill, vike-recorder, vike-backtest, vike-aster and
# vike-bridge-core's conformance dev-deps all take default features) builds byte-identically.
# A feeds-only consumer opts out with `default-features = false` and gets the keyless public
# surface — data/market_data/market_feed/trades/catalog/ratelimit plus the family rungs they call
# (catalog/depth/klines/market_feed/trades) — with none of the order plane COMPILED into its
# binary. `exec` gates spot.rs, perp.rs, exec.rs, user_data.rs, perp_user_data.rs, ws_auth.rs,
# key_permissions.rs, recon_client.rs, event_mapper.rs, perp_mapper.rs, history.rs, filters_rec.rs,
# error_codes.rs and the family exec rungs (event_mapper/perp_mapper/history/filters_rec/
# exec_loop/order_map/listenkey/recon).
#
# ⚠ WHAT THIS SPLIT DOES NOT DO, MEASURED on the CI box 2026-09-10 rather than assumed. Unlike
# hyperliquid's and aster's, this seam removes NO CRATE from the dependency tree: `diff`ing this
# crate's default `cargo tree -e normal` against its `--no-default-features` one reports NO
# difference at all. `cargo tree -i` over the feeds build names where each residual enters, and not one
# of them is the exec plane — hmac/sha2/hex/rust_decimal through vike-bridge-core's `full`, base64
# through `ureq` AS WELL AS that, and indexmap through vike-exec, vike-model, vike-catalog and
# vike-data. Binance signs with HMAC-SHA256 through `vike_bridge_core::signer`, and the FEEDS half
# needs `full` too (http/ws/depth/market_pump all live behind it), so no `cargo tree` grep can
# assert any of them absent — which is why this crate has no structural check of its own and the
# `bridges-feeds` arm says so at length.
# ⚠ The obvious remedy is SMALLER than it looks, and the measurement is written down here because
# the intuition is wrong: splitting a `signer` feature out of vike-bridge-core's `full` would
# remove `hmac` and `sha2` and NOTHING ELSE — the feeds half dials over the very `ureq` that
# carries base64, three pure feeds crates carry indexmap, and `full`'s own format/rest modules name
# rust_decimal. That is a change to a SHARED HOME every bridge consumes, for two crates: a
# STOP-AND-REPORT under root CLAUDE.md, recorded under ruling 8 in
# docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md, not patched from here.
# What the seam buys today is the COMPILE surface, which is what ruling 8 asked for in as many
# words: a data daemon linking this crate compiles no signed REST client, no private user-data pump
# and no reconcile client.
default = ["exec"]
exec = ["dep:indexmap"]

[[bench]]
# route_frame decode baseline (perf-program measurement scaffolding): a main() that prints a
# report — the hand-rolled vike-backtest/benches/engines.rs pattern, NO criterion dep.
# Run: cargo bench -p vike-binance --bench route_frame
name = "route_frame"
harness = false

# Workspace lint policy (root manifest): forbids `unsafe_code`. vike-fxcm (the FFI shim) is
# the sole crate that does NOT inherit this.
[lints]
workspace = true
