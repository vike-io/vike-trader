[lints]
workspace = true

# Every test binary (discovery is off: `autotests` above). `integration` holds the suites that spawn the
# multicall (`CARGO_BIN_EXE_vike-backend` is set for every test target of the package); each member's
# whole-file feature gate is one `full` turns on, and the self dev-dependency turns `full` on in every test
# build. The rest stay one binary each because they write PROCESS state: `one_tool_per_process` flips the
# dispatcher's once-per-process guard, and the five strategy-file suites `set_current_dir` into a project.
[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "one_tool_per_process"
path = "tests/one_tool_per_process.rs"

[[test]]
name = "strategy_file_from_saved"
path = "tests/strategy_file_from_saved.rs"

[[test]]
name = "strategy_file_model"
path = "tests/strategy_file_model.rs"

[[test]]
name = "strategy_file_onnx"
path = "tests/strategy_file_onnx.rs"

[[test]]
name = "strategy_file_run"
path = "tests/strategy_file_run.rs"

[[test]]
name = "strategy_sandbox_backtest"
path = "tests/strategy_sandbox_backtest.rs"
