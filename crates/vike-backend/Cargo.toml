[package]
# ⚠ There is NO `[lib]` section and NO `[[bin]]` for the multicall in this manifest, so BOTH the
# executable and the lib crate follow this name: the shipped artifact is `vike-backend` and the lib
# is `vike_backend`.
# Renaming this line renames the release asset, every `ExecStart=` that names it and the container's
# symlink target, with nothing else in the manifest saying so.
name = "vike-backend"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license-file.workspace = true
publish = false
# Test discovery is OFF so every `tests/*.rs` keeps its path while the plain suites link as ONE binary,
# `tests/integration.rs` (each a module of it); the `[[test]]` rows at the end are every test binary, and
# `crates/vike-ops/tests/hygiene/test_registry_gate.rs`'s `every_root_test_file_is_built_where_discovery_is_off` fails on a root file no row or module builds.
autotests = false
description = "The multicall dispatcher: ONE shipped executable, `vike-backend <tool>`, whose verbs (datahub, tradehub, gatewayhub, backtesthub, report, strategy-builder, strategy-sandbox, ...) each run their own crate's entry point behind that tool's cargo feature; `full` builds every tool. No tool body lives here."

# The multicall dispatcher. Layer 68 — above every headless top-of-graph binary (65) and below the
# egui tiers (70), because it depends on those binaries' crates and nothing may depend on it.
[package.metadata.vike]
layer = 68

[dependencies]
# The one NON-optional dep: the dispatcher itself answers `--version`, and a version printer
# without build identity is what identity_adoption.rs exists to refuse (a release binary was once
# built four commits behind main). Leaf crate, layer 15 — the light lanes stay light.
vike-buildinfo = { path = "../vike-buildinfo" }
# Each tool is an OPTIONAL dependency behind a feature of the same shape as its own binary's
# `required-features`. ⚠ Optional and NOT default: a dispatcher that always linked every tool would
# make `cargo check -p vike-backend` build the whole DataFusion closure for anyone touching the
# routing, and would defeat the per-crate feature lanes that keep the light crates light.
# ⚠ `vike-studio-core` stood here, optional, for the `study` verb alone (`study_cli` behind its `study-cli`
# feature). That CLI moved to `vike-backtesthub` on 2026-11-10, beside the harness its studies may call, so
# the `study-cli` row below turns `vike-backtesthub` on instead.
vike-backtesthub = { path = "../vike-backtesthub", optional = true }
vike-datahub = { path = "../vike-datahub", optional = true }
vike-tradehub = { path = "../vike-tradehub", optional = true }
# The Telegram control channel (`vike-backend telegram`, decision 0256): a client of the tradehub, never a part of it.
vike-telegram = { path = "../vike-telegram", optional = true }
vike-cli = { path = "../vike-cli", optional = true }
# The strategy file BUILDER service (`docs/superpowers/specs/2026-09-21-runtime-loaded-rust-strategies-design.md`,
# "The builder service") — the one process in this tree that runs `cargo` against an authenticated
# caller's source. Optional and behind its own feature for the same reason as every row above: a
# default `cargo check -p vike-backend` must not link a fifth daemon's tree, and `full` is what
# `.github/workflows/release.yml` builds.
#
# ⚠ This is NOT `34b8d6756` undone. That commit split the builder OUT of `vike-rust-strategy`
# specifically so a COMPILED STRATEGY FILE (which links only `vike-rust-strategy`) would not inherit the
# builder's `vike-datahub-client`/`tracing` tree. This dependency is the dispatcher taking on the
# BUILDER's own crate — `vike-strategy-builder` — the same shape as the `vike-tradehub` row above
# taking on the trading daemon. A strategy file's link is unaffected: it never sees `vike-backend` at all.
# `cargo tree -p vike-rust-strategy -e normal --prefix none` (unaffected by this manifest, which
# that crate does not depend on) is the proof this dependency does not touch.
vike-strategy-builder = { path = "../vike-strategy-builder", optional = true }
# The GATEWAY daemon (`docs/decisions/0164-one-daemon-owns-every-venue-connection-vike-gatewayhub.md`,
# wave 1): the one process that owns every venue connection. Optional and behind its own feature for
# the reason every row above is: a default `cargo check -p vike-backend` must not link its tree.
vike-gatewayhub = { path = "../vike-gatewayhub", optional = true }
# The sandboxed strategy process (`vike-backend strategy-sandbox`, plan 2b): the ONE crate that links the strategy
# file loader, so no hub does. Optional behind its own feature for the reason every row above is.
vike-strategy-sandbox = { path = "../vike-strategy-sandbox", optional = true }

# ⚠ NOT a tool: the SHARED VOCABULARY one tool's call site needs. `backtesthub_main` hands
# `vike_model::time::clock::now_unix_secs` to the harness as its clock. Naming an item requires a
# DIRECT edge, so this is that edge, and it is optional behind the features whose arms name it: a
# default `cargo check -p vike-backend` links nothing new.
vike-model = { path = "../vike-model", optional = true }
# ⚠ NOT a tool either: `backtesthub_main` fills `vike_runs::BuildStamp` — the seam a library declares
# and a composition root fills. That module came down to the bottom of the graph when `vike-cli`
# needed to READ a run directory without linking the engine (`crates/vike-runs/src/lib.rs`'s own doc
# carries the argument). Naming a type requires a DIRECT edge, so this is that edge, optional behind
# the one feature whose arm names it.
vike-runs = { path = "../vike-runs", optional = true }
# ⚠ NOT tools either: the SDK reader `backtesthub_main` hands the backtesthub (decision 0296, verdict 3). The SDK
# vocabulary (`vike_rust_strategy::sdk`: the layout, the marker, the one usability rule) lives in the strategy
# file loader's crate, which `crates/vike-ops/tests/architecture/named_run_closure_gate/fences.rs`'s
# `STRATEGY_FILE_LOADER_FENCE` keeps out of every hub; this root reads the SDKs with it and hands the hub
# the rows, typed as the client's wire rows. Both add an edge, not a package: the builder's client
# (`vike-strategy-builder`, the row above this feature already turns on) links the loader's crate, and the
# backtesthub links its client.
vike-rust-strategy = { path = "../vike-rust-strategy", optional = true }
vike-backtesthub-client = { path = "../vike-backtesthub-client", optional = true }
# ⚠ TOMBSTONE — the `tearsheet` feature's BODY (`src/tearsheet_cli.rs` and its `store`/`excursions`
# modules) and the ten optional edges only it named (`vike-journal`, `vike-marketdata`,
# `vike-datahub-client` with `hist-route`, `vike-secrets`, `vike-data`, `vike-analytics`, `vike-catalog`,
# `vike-utility` with `cli`, `clap`, `serde_json`) left this package on 2026-11-17 (owner ruling) for
# `vike-cli`, and the body was RETIRED on 2026-11-18: the `report` row now prints
# `vike_cli::cmd::report::JOURNAL_DOORS_RETIRED` through the `vike-cli` edge above.

[features]
# ⚠ A FEATURE NAME AND A TOOL VERB ARE NO LONGER THE SAME STRING, and they used to be. The verbs
# dropped their `vike-` prefix (`vike-backend tradehub`, not `vike-backend vike-tradehub`); these
# feature names did NOT, because each one gates an optional DEPENDENCY whose package genuinely is
# `vike-tradehub`/`vike-datahub`/`vike-cli` — the prefix is accurate here in a way it
# was not on a verb. `crates/vike-backend/src/main.rs`'s `TOOLS` rows carry both strings side by side
# (`#[cfg(feature = "vike-datahub")] Tool { name: "datahub", … }`) and that mismatch is deliberate.
# Renaming a feature here is a manifest+main.rs pair with `full` rewritten in the SAME edit —
# `multicall_gate::resolve_forwards` PANICS on a `full` entry naming a feature this table does not
# define.
default = []
# `study-cli` is the `study` verb: `vike_backtesthub::study_cli::run`, ungated in that crate since it moved
# there from `vike-studio-core` (whose `study-cli` feature this row forwarded until 2026-11-10). The
# `backtesthub` row below turns the same crate on for its own verb; a pair-free row, like that one.
# ⚠ `dep:vike-strategy-builder` too (2026-11-15): a study is a FILE, and `study_main` hands the
# backtesthub the builder's client (`vike_strategy_builder::client::build_study`) to build it before its
# sandboxed run, as the `backtesthub` row does for a strategy file.
study-cli = ["dep:vike-backtesthub", "dep:vike-strategy-builder"]
# The `report` tool, RETIRED on 2026-11-18: its row prints `vike_cli::cmd::report::JOURNAL_DOORS_RETIRED`
# and exits 2, so the row is the `dep:vike-cli` switch alone, the same package the `vike-cli` row below
# turns on. NOT `"vike-cli"` (that FEATURE): a `--features tearsheet` build would then also answer the
# `vike-cli` verb, a tool it never had.
#
# COST: none for a shipped build, which links `vike-cli` through the `vike-cli` row anyway.
tearsheet = ["dep:vike-cli"]
# `backtesthub` is the tool: `dep:vike-backtesthub` carries the whole closure the bin it replaces
# linked (the DataFusion store, the starter-dataset HTTPS client, the Studio
# runners the `backtesthub --addr` daemon calls directly) — the two features that used to gate it,
# `datafusion-store` and `venue-fetch`, died with the move. The `study` VERB's CLI is the `study-cli`
# row above.
# ⚠ `dep:vike-strategy-builder` too: `backtesthub_main` hands the backtesthub the builder's client
# (`vike_strategy_builder::client::build_file`), which builds a `.rs` strategy file before its sandboxed run.
# ⚠ `dep:vike-rust-strategy` and `dep:vike-backtesthub-client` too (decision 0296, verdict 3): `backtesthub_main`
# hands the backtesthub the SDK reader its Studio verbs list and read the strategy SDKs with
# (`vike_backtesthub::sdk_source::use_reader`), over the SDK vocabulary no hub may link.
backtesthub = ["dep:vike-backtesthub", "dep:vike-model", "dep:vike-runs", "dep:vike-strategy-builder", "dep:vike-rust-strategy", "dep:vike-backtesthub-client"]
# `vike-datahub` forwards `datafusion-serve`; without it the tool still answers --help and then
# reports it has no backend, exactly as the standalone binary does.
#
# ⚠ **AND SINCE RULING 10 IT FORWARDS THE RECORDING PLANE TOO** — there is no separate
# `recorder` verb any more, because `crates/vike-datahub/src/recorder.rs` IS the recorder daemon
# (`docs/superpowers/specs/2026-09-09-datahub-market-data-wire-design.md` §0.5: one process owns
# venue connections, the store and serving). `vike-datahub/record` carries over the warning the
# retired `vike-recorder` feature row made, unchanged and for the same reason: **dropped here, it ships a
# daemon whose `--recorder-profile` is refused at startup on every box.**
# `crates/vike-ops/tests/container_deploy/multicall_gate.rs`'s `SHIPPED_TOOL_FEATURES` is
# the second spelling that catches a drop.
# ⚠ **`backfill-serve` JOINED 2026-09-15, and its ABSENCE was the reason a released box could not
# paint a 5m/15m/1h chart.** The feature has existed and been wired since split-plane REQ-9 —
# `crates/vike-datahub/src/datahub_cli.rs` mounts `backfill::real_backfill_table` behind it, and
# `crates/vike-datahub/tests/backfill_serve/backfill_roundtrip.rs` proves request → store → `BackfillDone` →
# `LoadBars` every PR — but `full` never forwarded it, and `.github/workflows/release.yml` builds
# `--features full`. So every deployed datahub omitted `backfill` from `Welcome.features` and
# answered `Request::Backfill` with `server/backfill.rs`'s `backfill_verb` refusal naming this very feature:
# the daemon told its own operator how to fix a build nobody could rebuild. A client that reads the
# handshake (`crates/vike-app-core/src/data/backfill/mod.rs`) then refuses CLIENT-side before a frame
# leaves, so the chart's gap-fill was dead from the handshake outward.
# ⚠ It costs ONE new package in THIS binary — `vike-backfill`, the workspace member its own `dep:`
# names — and NO bridge crate and no third-party crate, which is why it can ride `full` at all.
# ⚠ This cited `crates/vike-datahub/Cargo.toml`'s `venue-backfill` warning until
# docs/decisions/0094 deleted that feature — it had named no bridge crate even before the
# deletion, only `dep:vike-bridge-core`. Since decision 0164 `backfill-serve` names no bridge crate
# at all (`crates/vike-datahub/Cargo.toml`: its sources are the gatewayhub's, and the datahub links
# no bridge in any feature set), so a STANDALONE datahub build pays only for `vike-backfill` and
# `vike-bi5`. The bridges in THIS binary come from `vike-tradehub` and `vike-gatewayhub`.
# ⚠ MEASURED, not asserted, and the measurement is why this comment says ONE rather than ZERO.
# `cargo tree -p vike-backend --features full -e normal --prefix none`, this commit against its
# parent, one the CI box lane, 2026-09-15: the package SETS differ by exactly `vike-backfill`. All eight
# crates above are present in BOTH — dukascopy and datafusion appear on the new side only as `(*)`
# back-references, i.e. a second path to a package that was already there, which is the same thing
# the other six show. Anyone re-checking this should compare the sorted `cargo tree` output of the
# two commits rather than trusting the sentence; a prose claim of "zero" was what this replaced.
# ⚠ ONE LINE, deliberately: `crates/vike-ops/tests/container_deploy/multicall_gate.rs`'s `feature_table` reads a
# feature per LINE, so a rustfmt-shaped multi-line array makes the gate report this feature as
# undeclared while `full` enables it — measured on this very edit.
# ⚠ `options-serve` JOINED with the desktop's Options tool moving onto the datahub (it opens no Deribit
# socket now): without it the deployed daemon answers every `OptionsChain` with `NotArmed` and the
# Options tool is empty on every box. It adds no
# package: `vike-options` is already in this binary's graph, and the Deribit provider and feeds are
# the gatewayhub's.
# ⚠ `tool-feeds-serve` JOINED with the desktop's news, calendar, earnings, dividends and IPO windows moving onto the
# datahub: without it the deployed daemon answers every `NewsFeed`/`EconomicCalendar`/`EquityCalendar` with
# `NotArmed` and those windows are empty on every box. It adds no package: `ureq` is already in this binary's
# graph (vike-bridge-core), and `chrono` is in the lock.
# ⚠ `fetch-starter` JOINED when `store fetch-starter` moved here from the backtest engine: without it
# `vike-cli data history fetch --source starter` is refused naming the feature on every box. It adds no package,
# for the same reason `tool-feeds-serve` does.
vike-datahub = ["dep:vike-datahub", "vike-datahub/datafusion-serve", "vike-datahub/backfill-serve", "vike-datahub/options-serve", "vike-datahub/tool-feeds-serve", "vike-datahub/record", "vike-datahub/fetch-starter"]
# The tradehub declares no feature. The fxcm, ibkr and polymarket forwards this row carried moved to the `vike-gatewayhub`
# row below with the bridges they gated (wave 2, W15), and `vike-tradehub/telegram` left with the channel: it is the
# `vike-telegram` row (decision 0256).
# ⚠ `dep:vike-strategy-builder` and `dep:vike-strategy-sandbox` too (plan 2b): `tradehub_main` hands the
# tradehub the builder's client, which builds a `.rs` strategy file before its sandboxed mount, and names the
# artifact by the sandbox child's own rule (`vike_strategy_sandbox::artifact_of`).
vike-tradehub = ["dep:vike-tradehub", "dep:vike-strategy-builder", "dep:vike-strategy-sandbox"]
# The `telegram` tool: the Telegram control channel, a client of the tradehub's control wire in its own process
# (decision 0256). It adds ONE package to the shipped binary, `vike-telegram` itself: everything it names is already in
# this graph through `vike-cli` and `vike-tradehub`.
vike-telegram = ["dep:vike-telegram"]
# The set the RELEASE builds. ⚠ It must enumerate exactly what `.github/workflows/release.yml`'s
# `--features` line does: a silently-dropped tool feature ships a dispatcher whose `--help` lists
# one tool fewer, and whose installed link for that tool exits 2.
# ⚠ `vike-cli` is not optional in practice: four systemd units and the container entrypoint run
# `vike-cli config check` as a pre-flight, so an image whose link for it exits 2 fails every start.
vike-cli = ["dep:vike-cli"]
# `vike-strategy-builder` forwards nothing — that crate declares no feature table of its own (see
# its manifest: ordinary workspace lints, no `[features]`), so this row is the plain `dep:` switch
# every other single-crate tool row uses (`vike-cli` above is the same shape).
vike-strategy-builder = ["dep:vike-strategy-builder"]
# The `gatewayhub` tool (decision 0164, wave 1). ⚠ `vike-gatewayhub/data` IS THE LOAD-BEARING ENTRY:
# it is the one feature that links the venue bridges and the clients built on them, so without it the
# tool answers `--help` and then serves a lane with no venue behind it (a default build of that crate
# links no bridge at all). `crates/vike-ops/tests/container_deploy/multicall_gate.rs`'s
# `SHIPPED_TOOL_FEATURES` is the second spelling that catches a drop from `full`.
# ⚠ It adds ONE package to the shipped binary, MEASURED on the wave-1 base (2026-10-14, one the latency box lane):
# `cargo tree -p vike-backend --features full -e normal --prefix none`, package names sorted and
# deduplicated, before and after this row differ by exactly `vike-gatewayhub` itself. The client crate
# and every venue bridge were already in that graph through `vike-datahub` and `vike-tradehub`. A later
# wave that takes the bridges out of the datahub moves that measurement, not this row.
# ⚠ ONE LINE, deliberately, for the reason the `vike-datahub` row above gives: `feature_table` reads a
# feature per LINE.
# ⚠ **`vike-gatewayhub/trade` IS THE SECOND LOAD-BEARING ENTRY (wave 2, W15).** `data` links the bridges' DATA
# halves; the venue half the tradehub used to link — every bridge's execution client, the arming table, the
# preflight probes, the trade lane — is the gatewayhub's `trade` feature, and without it the shipped
# `vike-backend gatewayhub` serves no trade surface at all: every `demo`/`live` account of the tradehub
# would read `GatewayUnavailable` (NOT RUNNING, never a paper stand-in). `polymarket`, `ibkr` and `fxcm` are
# the gatewayhub's own features (they gate the optional bridge edges and the registry rows) and each implies
# `trade`; they were `vike-tradehub/polymarket|ibkr|fxcm` until W15 moved the venue half. Their history,
# which is the shipped binary's, moves with them:
# ⚠ `fxcm` JOINED (as `vike-tradehub/fxcm`) 2026-09-09, and this comment said it NEVER would: "that feature links
# libForexConnect and the ELF then dies at exec wherever the SDK is absent. The fxcm-linked daemon
# stays its own separately-named release asset." Every word of that was true of the feature as it
# then was, and none of it is true now. `crates/bridges/fxcm/build.rs` no longer emits
# `cargo:rustc-link-lib=ForexConnect`: the C++ boundary is a shared object, `libfcshim.so`, that
# `crates/bridges/fxcm/src/transport/loader.rs` opens at RUNTIME. So this binary carries no `DT_NEEDED` on the
# SDK, starts everywhere the feature-free one started, and arms FXCM exactly on the boxes where the
# shim is installed — which is what the separate asset existed to arrange, at the cost of a second
# 148 MB daemon nobody could reach any other way.
# ⚠ `ibkr` JOINED (as `vike-tradehub/ibkr`) 2026-09-08, and it was a plain omission rather than a decision. The feature has
# existed and been CI-tested (`scripts/ci_feature_suite.sh`'s `ibkr` lane compiles the whole
# mount chain every PR), and `grep -c ibkr .github/workflows/release.yml` returned **0** — so no
# shipped binary could reach IBKR at all and the only way to get it was to build from source.
# Nothing was blocking it: there is no native SDK, no link line and no rpath — `vike-ibkr` is a
# pure-Rust `ibapi` client plus a gateway process the operator runs.
vike-gatewayhub = ["dep:vike-gatewayhub", "vike-gatewayhub/data", "vike-gatewayhub/trade", "vike-gatewayhub/polymarket", "vike-gatewayhub/ibkr", "vike-gatewayhub/fxcm"]
# The `strategy-sandbox` tool. It names `vike-backtesthub` too: the backtest verb's body is that crate's
# `strategy_sandbox::serve_child`, handed to the sandbox crate as a function (both sit on layer 65). A pair-free row.
vike-strategy-sandbox = ["dep:vike-strategy-sandbox", "dep:vike-backtesthub"]
full = ["study-cli", "tearsheet", "backtesthub", "vike-datahub", "vike-tradehub", "vike-telegram", "vike-cli", "vike-strategy-builder", "vike-gatewayhub", "vike-strategy-sandbox"]

[dev-dependencies]
# Self-referential dev-dep: every test build of this crate is the dispatcher the RELEASE builds, every tool row at once.
# It is the one build that type-checks the `#[cfg]`-gated rows and the `run` signatures they call, and CI runs it once
# (decision 0132, as amended 2026-11-06). `xtask/tests/ci_plan_gate/roster_features.rs` holds it. Dev edges reach no
# shipped build: `ci.yml`'s `tradehub-all` guard (J) reads the shipped tree without them.
vike-backend = { path = ".", features = ["full"] }
# `vike_boot::descriptors`: the strategy-file tests play a hub that boots nothing, so they run the boot's step 0
# themselves before they start a strategy process (the owner, 2026-11-14). A dev edge.
vike-boot = { path = "../vike-boot" }
# ⚠ `vike-core`, `vike-execution` (with `test-support`) and `vike-journal` stood here while
# `tests/report_verb_dispatches.rs` spawned a REAL core to write the journal `report` then folded; the door was
# retired on 2026-11-18 and that file now asserts its refusal, so the three edges went with the fold.
#
# `Strategy`, `OrderBroker` and `params`, which the strategy-file suites below name.
vike-model = { path = "../vike-model" }
# A scratch directory that is removed on the panic path too.
tempfile = { workspace = true }
# The wire the sandboxed-backtest suites below decode. It was the `tearsheet` feature's optional normal
# edge, which `full` turned on in every test build, until the body left this package (2026-11-17); a DEV
# edge now.
serde_json = { workspace = true }
# `test-support` compiles the `HistoryStoreMemory` double the sandboxed-backtest suites below seed; only a dev
# edge may turn it on.
vike-data = { path = "../vike-data", features = ["test-support"] }
# --- the sandboxed-backtest suites (`tests/strategy_file_run.rs`, `tests/strategy_sandbox_backtest.rs`): the child
# is THIS package's binary (`CARGO_BIN_EXE_vike-backend`), which is why they live here. DEV edges only. ---
# The loopback backtesthub (`test_support::spawn_server_over`), the in-process and in-a-child answers, and
# `strategy_sandbox::use_program` (all behind `test-support`).
vike-backtesthub = { path = "../vike-backtesthub", features = ["test-support"] }
# The wire the suites speak (`Request`, `Response`, `StrategySpecWire`, `DataSliceWire`).
vike-backtesthub-client = { path = "../vike-backtesthub-client" }
# The frame codec and `hash::sha256_hex` (the artifact's sha).
vike-hub-protocol = { path = "../vike-hub-protocol" }
# The PRODUCTION builder (`render::build_strategy_file`) that builds the fixture strategy file.
vike-strategy-builder = { path = "../vike-strategy-builder" }
# The seeded random walk (`test_support::walk::random_walk_bars`).
vike-studio-core = { path = "../vike-studio-core", features = ["test-support"] }
# `tests/strategy_sandbox_backtest.rs`'s IN-PROCESS half: the loader and host, the file loaded by hand as the
# child loads it. `tests/strategy_file_run.rs` refuses to name it (its own source scan).
vike-rust-strategy = { path = "../vike-rust-strategy" }
vike-simulator = { path = "../vike-simulator" }
# `tests/strategy_file_model.rs`: the probabilities the committed fixture model predicts in THIS process,
# which the sandboxed strategy file must predict bit for bit. Layer 15, no `vike-*` dependency.
vike-ml-prediction = { path = "../vike-ml-prediction" }
# `tests/strategy_file_onnx.rs`: what the committed fixture network predicts in THIS process, which the sandboxed
# strategy file must predict bit for bit. A DEV edge only: no binary that trades links the ONNX runtime
# (`crates/vike-ops/tests/architecture/named_run_closure_gate/gate.rs`'s `no_binary_that_trades_links_the_onnx_runtime`).
vike-ml-onnx-prediction = { path = "../vike-ml-onnx-prediction" }
# `tests/strategy_file_onnx.rs`'s W25 measurement: the workspace's one percentile
# (`vike_math::statistics::percentile`, decision 0294) over the per-prediction timings. A DEV edge.
vike-math = { path = "../vike-math" }
# `tests/strategy_file_onnx.rs`'s one-at-a-time lock: `vike_utility::mutex::lock`, the workspace's one
# poisoned-lock spelling. A DEV edge.
vike-utility = { path = "../vike-utility" }
# `tests/refusal_catalog.rs` renders the workspace's `refusals.json` from every refusal enum's `ALL`, so it names each
# crate that declares one (this crate is the one that links them all), and holds the copy `vike-mcp` serves equal to the
# render. DEV edges: each also makes a change to that crate select this crate's tests. All but `vike-mcp` (not a tool of
# this multicall) are already in this graph.
vike-alpaca = { path = "../bridges/alpaca" }
vike-aster = { path = "../bridges/aster" }
vike-backfill = { path = "../vike-backfill" }
vike-backtest = { path = "../vike-backtest" }
