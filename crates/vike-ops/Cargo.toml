[package]
name = "vike-ops"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "The CI gates crate: the repo's machine-checked contract (architecture, hygiene, settings and secrets, venues, GUI, docs, container-deploy, release and CI gates) as integration tests under tests/. Its src/ is departure notes plus, under the test-only `test-support` feature, the gates' shared helpers compiled once; the settings registry is vike-config's and the process lifecycle (stop, shutdown, live lock) is vike-boot's."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `leaf` — a crate that
# names at most the floor: the market-data and domain vocabularies at 5 and 10.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer, and
# tier 15 adds its own rule on top (`every_tier_15_crate_names_nothing_above_the_vocabulary`).
#
# ⚠ WAS `service` (50) until 2026-09-26, and the drop is 35 rungs in one move because the thing
# holding it up LEFT rather than moved down. MEASURED on the day: the docs-data exporter
# (`vike_ops::docs_data`, its bin and its gate) was the only code in this crate naming anything
# above rank 10 — `vike-bridge-core` (30) for the TIF table, plus `vike-strategy`, `vike-execution`,
# `vike-data`, `vike-catalog` and `vike-indicators`. It is its own crate now, `crates/vike-docs`,
# and what was left here was std plus `vike-model` plus the per-platform stop-signal pair, which
# went with `stop` to `vike-boot` (wave 5, 2026-10-12): nothing is left but the gates.
#
# 15 is safe by measurement, not by hope: every consumer — vike-cli, vike-datahub, vike-tradehub,
# vike-app-core, vike-desktop — declares 30 or higher (vike-cli was 55 until 2026-09-28, then 30
# until 2026-11-06, and is 35 now).
[package.metadata.vike]
layer = 15

# WHY THIS CRATE EXISTS (the dependency argument, not a taste argument):
# `vike-tradehub` is the headless daemon that runs on the production trading box. It used exactly
# three modules out of `vike-app-core` (journal_mat / reconcile_config / shutdown) — and that ONE
# edge dragged the entire egui widget stack (egui, egui_plot, epaint, epaint_default_fonts,
# vike-chart, vike-order-entry, vike-ui-theme, vike-account-manager, vike-data-manager) into
# the daemon's build graph. The cost is not CI minutes: it is daemon build time, binary size, and
# the `cargo deny --all-features` supply-chain audit surface on the box that SIGNS REAL ORDERS.
# Everything here is off-fold (never in the vike-core hot path) and egui-free by construction; a
# module that needs egui belongs in vike-app-core, not here.

# ONE feature, `test-support`: it compiles the gates' shared helpers (`tests/common/*.rs`) ONCE, as
# `vike_ops::{common, repo, strip, ...}` (`src/lib.rs`), instead of once per gate binary through a
# `#[path]` include in each (counted 2026-10-31: 25,947 helper lines across 79 binaries). Only this
# crate's own tests turn it on, through the self dev-dependency below; a default build — the public
# mirror's, which withholds `tests/` — compiles none of it. ⚠ Three other features stood here until
# 2026-09-26: `default = ["full", "docs-data"]`, `full` (gating nothing since `journal_mat` left) and
# `docs-data` (the exporter that is now `crates/vike-docs`).
[features]
test-support = ["dep:proc-macro2", "dep:toml", "dep:vike-model", "dep:vike-utility"]

[dependencies]
# All four OPTIONAL, reached only through `test-support` (the helpers name them: `config_tokens.rs` tokenizes
# with `proc_macro2`; `manifest.rs`'s bridge roster parses the root manifest with `toml`, as the two gates
# that carried it did; `mod.rs`, `rust_text.rs` and `source_sites.rs` call `vike_model::test_support`,
# `vike_model::scan` and `vike_utility::libm_walk`). `toml` adds no package: it is the `[dev-dependencies]`
# entry below, already in the lockfile.
# ⚠ vike-model's and vike-utility's own `test-support`, which those helpers need, are NOT forwarded by the
# feature above: the CI planner reads any forward from this table as THIS normal edge enabling it, and then
# plans every `libm_walk` edit as shipped code (`xtask/tests/ci_plan_gate/feature_test_module.rs`'s
# `the_real_libm_walk_plans_its_dev_enablers_and_not_the_reverse_dependency_world` fails). It comes from
# the `[dev-dependencies]` entry instead, which cargo unifies in whenever this crate's tests build — the
# only build that turns `test-support` on (a `-p vike-ops --features test-support` LIBRARY build alone
# would not compile, and nothing runs one).
proc-macro2 = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
vike-model = { path = "../vike-model", optional = true }
vike-utility = { path = "../vike-utility", optional = true }
# ⚠ TOMBSTONE — `vike-model` was this crate's ONE normal vike-* edge (the vocabulary floor tier `leaf`
# permits) until 2026-10-11, and it is a `[dev-dependencies]` entry now. MEASURED 2026-09-26 and again
# 2026-10-11: no `src/` file names a vike-model item (`feed_status` was the last, and its re-export
# went on 2026-09-25); only the gates under `tests/` do (`collector_dispatch_gate.rs` reads
# `VENUES`, `deploy_tool_root_gate.rs` the project-bin resolver, the src-walking gates the
# `libm_walk` resolver). The edge cost nothing — every consumer already links vike-model — but a
# normal edge this crate's code never names is a claim the manifest should not make. (The optional
# entry above is not that edge back: a default build never takes it.)
# ⚠ TOMBSTONES for the edges that left with `docs-data` on 2026-09-26 — `vike-bridge-core`
# (`default-features = false`, the TIF table), `serde_json`, `vike-indicators`, `vike-strategy`,
# `vike-execution`, `vike-data` and `vike-catalog`. All seven were OPTIONAL and reached only through that
# feature; they are `crates/vike-docs/Cargo.toml`'s plain dependencies now, with their reasons.
# `vike-core`, `vike-journal`, `vike-alerting`, `indexmap` and `tracing` went earlier (2026-09-23 to
# 2026-09-25), each measured to zero code sites the day it left; git history carries those notes.

# ⚠ The `docs_data` `[[bin]]` stood here, `required-features = ["docs-data"]`, until 2026-09-26. It
# is `crates/vike-docs/Cargo.toml`'s now, under the same name.

[dev-dependencies]
# This crate's own library with the gates' shared helpers compiled in (`[features]` above): every gate
# binary links that one copy (`use vike_ops::repo;`). The same self-edge vike-model, vike-execution and
# vike-secrets use for their `test-support`.
vike-ops = { path = ".", features = ["test-support"] }
tempfile = { workspace = true } # the gates' scratch directories (`latency_contention_gate`, `deploy_shadowed_store_gate`, ...)
# `deploy_shadowed_store_gate`'s stand-in gateway holds `vike_log::reaper::Reaper`, the workspace's one
# kill-on-drop guard for a test's child process. No new package: the lockfile delta is one `"vike-log",`.
vike-log = { path = "../vike-log", features = ["test-support"] }
# `xtask/tests/build_config_gate.rs` — the AUTHORITY for what a committed TOML build
# setting resolves to. That gate hand-rolled its own line scanner for three rounds and leaked in all
# three: a line scanner reads `key = value` and can only ever judge the KEY side, so an inline table
# (`dev = { debug = 0 }`) puts the setting where no key matcher reaches it. That is an axis, not a
# pattern, and a parser is what closes an axis.
#
# Free, and VERIFIED rather than asserted — twice over. `cargo tree -p vike-ops -e normal` is
# byte-identical with and without this line (a dev-dependency is not in any production closure), and
# `cargo tree -p vike-ops -e normal -i toml` shows why the question was easy: `toml` is ALREADY in
# this crate's normal closure, through `vike-core`'s TOML run-profile loader. So the line adds no
# package to `Cargo.lock` and no compile unit to any build — the whole lockfile delta is one
# `"toml",` added to vike-ops' own dependency list. ⚠ It DOES mean this gate no longer compiles standalone on std alone:
# running it the way the dev box does (`rustc --test`, where a workspace build is denied) now needs
# `--extern toml=…`. See `walk_tests`' `scratch`, which states the cost at the one place that pays it.
# ⚠ The normal-closure half of that measurement EXPIRED with the `vike-core` edge (gone 2026-09-25)
# and this crate's normal closure no longer carries `toml` at all. The lockfile half still holds —
# the workspace resolves `toml` for other crates (vike-core and vike-strategy among them) — so the
# edge still adds no package; what it now adds is one compile unit to THIS crate's test build.
toml = { workspace = true }
# `crates/vike-ops/tests/hygiene/shipped_box_name_gate.rs` — the Rust tokenizer that gate runs over every
# `crates/**/src` file. The same SHAPE of argument as the `toml` edge above and for the same reason:
# a line scanner can only ever judge the line it is looking at, an inline table put a build setting
# where no key matcher reached it, and here a backslash continuation put a box name on a line with
# no quote character on it at all. A parser is what closes an axis. ⚠ The COST argument does NOT
# transfer — `toml` was already in this crate's normal closure through `vike-core` and this is not;
# the workspace entry carries that measurement and the reason `span-locations` is mandatory.
proc-macro2 = { workspace = true }
# ⚠ A `serde_json` DEV edge stood here from 2026-09-05 to 2026-09-09 and is GONE with the scoop
# bucket that was its only reason. It existed for `packaging_gate.rs`'s scoop half — the bucket
# manifest is JSON, both as a committed template and as the file the renderer wrote at publish time,
# and a line scanner over either is the axis the `toml` edge above was added to close — and that
# half was removed with the bucket. The last JSON reader in `tests/`, `docs_data_gate.rs`, left
# with `crates/vike-docs` on 2026-09-26, so nothing here reads JSON at all now.
# `crates/vike-ops/tests/venues/store_kind_gate.rs` — the store-kind gate, MOVED here from vike-data's own
# `tests/` on 2026-10-03 because it is a whole-tree text scan (it reads producer files in other
# crates) and this is the crate CI force-adds for every `.rs` change; its module doc carries the
# measurement that moved it. It reads `STORE_KINDS` and its helpers TYPED, so it needs the edge.
# DEFAULT features on purpose: vike-data's default build is trait-only and DataFusion-free, so this
# adds no DataFusion to a standalone vike-ops test build. A DEV edge pointing upward (vike-data is
# layer 20 to this crate's 15), which `layer_gate.rs` does not judge; it adds no package, so the
# lockfile delta is one `"vike-data",` in this crate's dependency list. (An earlier vike-data dev
# edge, `test-support` for `journal_mat`'s `HistoryStoreMemory`, left with that module on 2026-09-25.)
# `test-support` again since 2026-10-31, for `vike_data::test_support::text`, the citation readers the
# store-kind gate shares with vike-data's and vike-store's own table gates (still DataFusion-free).
vike-data = { path = "../vike-data", features = ["test-support"] }
# `xtask/tests/ci_plan_gate.rs` — the CI derivation's own gate. A DEV edge, and it points
# sideways at a build tool rather than upward at a product crate, so `crates/vike-ops/tests/architecture/layer_gate.rs`
# does not see it at all (that gate only classifies `vike-*` keys).
#
# It exists so the gate can call the derivation IN-PROCESS. The alternative is spawning
# `cargo run -p xtask` from inside a test — a nested cargo build, on a runner whose target directory
# the outer test run is already using — to compare two strings. This edge is also what makes CI
# COMPILE the tool that derives the merge gate on the same PRs that can break it: an xtask change
# selects `xtask` (its own crate) and, one dev hop later, `vike-ops`.
xtask = { path = "../../xtask" }
# `vike_model::scan` and `vike_model::test_support`, the source scanner and the shared test helpers the
# gates here call. This is the crate's ONLY non-optional vike-model edge (see the tombstone under
# `[dependencies]`); `test-support` is the feature that compiles them.
vike-model = { path = "../vike-model", features = ["test-support"] }
# `vike_utility::libm_walk::cfg_test_module_rel_files` — the ONE resolver for "which `src/` files does
# a `#[cfg(test)] mod NAME;` declaration pull in", so every src-walking gate here classifies a test
# module that lives in its own file the same way (code-layout Task 8 put hundreds there). It was
# vike-model's until 2026-11-22 (decision 0074's amendment); `test-support` is the feature that compiles it.
vike-utility = { path = "../vike-utility", features = ["test-support"] }
# The per-venue tables this crate's tests read (`vike-model` held them until decision 0162).
vike-venues = { path = "../vike-venues" }
# Test-only: the project's filesystem layout (`vike_paths`, here its `scratch` guard or project walk): std-only.
vike-paths = { path = "../vike-paths" }
# `tests/ui_glyph_coverage.rs` asks the fonts the app SHIPS (`vike_ui_theme::fonts::definitions()`,
# through egui's own `Fonts`) whether every character the GUI prints has a glyph. A dev edge may point
# upward (`layer_gate.rs` judges normal edges only); both crates are already in the workspace build.
vike-ui-theme = { path = "../vike-ui-theme" }
egui = { workspace = true }
# `crates/vike-ops/tests/settings_secrets/bridge_inputs_gate.rs`'s `no_bridge_reads_a_declared_field_from_the_credential_map`
# — the names a declared venue field was read under before decision 0095's Task 7 retired the
# credential-map fold, asked of `vike_secrets::venue_setting::declared_legacy_names` (the derivation
# the boot refusal uses) rather than re-spelled here. A DEV edge to a layer-15 sibling, which
# `layer_gate.rs` does not judge; it adds no package (vike-secrets is in the workspace lockfile), so
# the lockfile delta is one `"vike-secrets",` in this crate's dependency list.
vike-secrets = { path = "../vike-secrets" }
# `crates/vike-ops/tests/hygiene/shipped_wallet_gate.rs` hashes with `vike_hub_protocol::hash::sha256_hex`, the ONE
# home of that helper. A DEV edge to a layer-15 sibling, no new package: the lockfile delta is one line.
vike-hub-protocol = { path = "../vike-hub-protocol" }
# `crates/vike-ops/tests/settings_secrets/settings_registry/medium.rs`'s
# `refused_rows_are_exactly_the_removed_variables` — decision 0111's check that a registry row
# whose medium is `Refused` is a `vike_config::REMOVED_ENV` row and the reverse, asked of the TYPED
# table rather than re-parsed from its text. A DEV edge pointing upward (vike-config is layer 20 to
# this crate's 15), which `layer_gate.rs` does not judge; vike-config's own dependencies
# (vike-model, vike-secrets) are already in this crate's test build, so the lockfile delta is one
# `"vike-config",` in this crate's dependency list.
# Since 2026-10-12 it is also where the REGISTRY lives (`vike_config::settings::all_settings`, decision
# 0085's Verdict 3): every `settings_secrets/` gate that reads the typed table takes it through this edge.
vike-config = { path = "../vike-config" }
spellbook = { workspace = true } # the book's spellcheck, `tests/docs/book_text_gate.rs`

# ⚠ EVERY GATE LIVES IN A ROLE FOLDER AND IS A MODULE OF THAT FOLDER'S ONE TEST BINARY, `tests/<role>/main.rs`, registered below
# (name = the folder). One binary per folder, not one per gate: a dependency edit recompiles and relinks nine gate executables
# instead of 88. Each gate keeps its file and its path, so a test's id is `<gate>::<test>`,
# `cargo test -p vike-ops --test <role> -- <gate>::` runs one gate, and `scripts/run_mutations.sh`'s triples read
# `vike-ops:<role>:<gate>::<test>`. A gate no `main.rs` declares compiles into nothing and reads green:
# `crates/vike-ops/tests/hygiene/test_registry_gate.rs` fails when a gate file has no `mod` line, a folder has no entry here,
# an entry has no file, or a gate's child file is declared by no `#[path]`. `tests/run_checks_selftest.rs` stays at the
# root and is auto-discovered.

[[test]]
name = "architecture"
path = "tests/architecture/main.rs"

[[test]]
name = "ci"
path = "tests/ci/main.rs"

[[test]]
name = "container_deploy"
path = "tests/container_deploy/main.rs"

[[test]]
name = "docs"
path = "tests/docs/main.rs"

[[test]]
name = "gui"
path = "tests/gui/main.rs"

[[test]]
name = "hygiene"
path = "tests/hygiene/main.rs"

[[test]]
name = "release"
path = "tests/release/main.rs"

[[test]]
name = "settings_secrets"
path = "tests/settings_secrets/main.rs"

[[test]]
name = "venues"
path = "tests/venues/main.rs"

# Workspace lint policy (root manifest): forbids `unsafe_code`. This crate is unsafe-free.
[lints]
workspace = true
