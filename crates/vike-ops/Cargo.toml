# `scripts/run_mutations.sh`'s `vike-ops:<gate>:<test>` triples are unchanged). A gate nobody registered compiles into nothing and reads green:
# `crates/vike-ops/tests/hygiene/test_registry_gate.rs` fails when a gate file has no entry here, an entry has no file, or a gate's child file is
# declared by no `#[path]`. `tests/run_checks_selftest.rs` stays at the root and is auto-discovered.

