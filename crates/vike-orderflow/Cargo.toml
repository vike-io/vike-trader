[package]
name = "vike-orderflow"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "Pure trade-aggregation core (chart Phase 5 SP1): classify + tick/volume bars + CVD + volume-profile + footprint from vike_marketdata::TradeTick. Streaming+batch, bit-parity gated. Depends on the market-data vocabulary (vike-marketdata for the tick, the book, the aggressor side of a trade and the kline menu) and the helper floor (vike-util, for BVC's normal CDF) only: this crate names a tick and a book and never an order."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `leaf` — names at most the
# floor: the market-data vocabulary at 5 and the domain vocabulary at 10.
# ⚠ WAS `domain` (20) until 2026-09-23. Its one edge is the market-data vocabulary at 5, the same shape as `vike-indicators` beside it. The band's rule is machine-checked by
# `every_tier_15_crate_names_nothing_above_the_vocabulary`; the verdict is
# docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 15

[dependencies]
vike-marketdata = { path = "../vike-marketdata" }
# The standard-normal CDF for VPIN's Bulk Volume Classification (`math::norm_cdf`, decision 0141):
# `layer = 3`, below this crate, std plus `libm` (already a dependency here). This crate carried a
# byte-identical copy until the helper floor existed: it takes no normal `vike-model` edge (0141 §4).
vike-util = { path = "../vike-util" }
# `bar_agg::nice_orderflow_tick`'s `pow`/`log10` — pure-Rust FDLIBM, deterministic across platforms
# (decision 0032). Already a workspace-pinned, in-lockfile dep (see the root manifest rationale); no
# new supply-chain entry.
libm = { workspace = true }
# The `tracing` facade for `bar_agg`'s two loss warnings (a tick the footprint aggregator cannot keep
# must leave a trace). Came with the module from vike-app-core on 2026-09-27; already workspace-pinned
# and in the lockfile, and it names no vike crate.
tracing = { workspace = true }

[dev-dependencies]
# The shared libm walk (decision 0074) for `tests/libm_platform_probe.rs`, which moved here from
# vike-app-core with `nice_orderflow_tick` (2026-09-27). A DEV edge with the feature, never a normal
# one — `test-support` is gated `#[cfg(any(test, feature = "test-support"))]` and a normal edge would
# compile it into shipped builds. vike-model is layer 10, below this crate either way, and this is
# the crate's ONLY vike-model edge: the shipped code names `vike_marketdata` (the aggressor side and
# the kline menu moved there) and `vike_util` (the normal CDF) alone.
vike-model = { path = "../vike-model", features = ["test-support"] }
# The shared market-data test builders (`vike_marketdata::test_support::{trade, book}`), which this
# crate's tick and book tests used to each re-type. A DEV edge with the feature, never a normal one:
# `test-support` is gated `#[cfg(any(test, feature = "test-support"))]` and a normal edge would
# compile the builders into shipped builds. The NORMAL edge above already exists, so this adds no
# lockfile entry.
vike-marketdata = { path = "../vike-marketdata", features = ["test-support"] }

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
