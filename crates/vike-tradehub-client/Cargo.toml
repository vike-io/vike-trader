[package]
name = "vike-tradehub-client"
version.workspace = true
edition = "2024"
rust-version.workspace = true
publish = false # never to crates.io — also exempts it from deny.toml license checks
description = "vike trading core — the CLIENT half of the headless live-core (\"tradehub\") node protocol, begun as PR-10's Layer-2 auth+proto primitive. The node wire protocol (proto: Hello/Auth/Subscribe/Snapshot/Command over the shared length-prefixed serde_json framing), the HMAC-SHA256 nonce-challenge auth handshake (auth: sign/verify + scoped NodeKeys), the standalone serde wire mirrors of the core snapshot + order-command types (wire), and the thin-client side that DIALS a node over std TCP (remote_handle: the read-only RemoteCoreHandle and one-shot reads; remote_control: the order-write RemoteControlHandle and one-shot writes). DataFusion-FREE and SERVER-free — the node's listener lives in vike-tradehub, and this crate's only network I/O is the std::net connection its client side opens, with no async runtime and no bridge transport stack. Rides the FAST CI lane."

# The declared ARCHITECTURE LAYER (crates/vike-ops/tests/architecture/layer_gate.rs). Tier `domain-stacked` — one
# hop over the domain band. This crate names no layer-20 piece at all — its one vike-* edge is
# `vike-node-proto` (15) — so its ARITHMETIC floor is 20; it sits one rung higher, beside its peer
# `vike-datahub-client`, and the last paragraph below says why.
#
# ⚠ **WAS `service` (50) until 2026-09-23, and those twenty rungs were an artefact of WHERE a
# shared module lived rather than of anything this crate names.** Its ONLY vike-* dependency was
# `vike-datahub-client` (30), and the whole of that edge was two primitives both node protocols
# share — the auth handshake and the frame codec — which happened to be declared inside one of the
# two peers. So this crate sat above its own PEER because the peer housed the shared floor. With
# that floor extracted to `vike-node-proto` (15), this crate's ceiling is 15 and the two clients sit
# at the SAME rank, which is what they always were.
#
# ⚠ WAS `engine` (30) until 2026-09-28, on the argument this paragraph used to make: 30 was "the
# lowest rank whose NAME describes a transport client" — 20 is `domain` (a pure core over the
# vocabulary) and 25 `domain-stacked` (composed of layer-20 pieces) — and a correctly-named crate
# does not move into a wrongly-named tier
# (docs/decisions/0085-the-rank-follows-the-declaration-not-the-role.md). That argument ended when
# tier 30 stopped naming a role — tiers 25, 30 and 35 are all POSITIONAL now — and the transport,
# simulation and client crates dropped to their floors at 25 together.
# ⚠ **25, not the arithmetic 20, and the rung is HELD on purpose.** At 20 the user-code hosts
# (`vike-user-strategies`, `vike-user-research`, both 25) could name this crate by rank; at 25 equal
# rank refuses it, beside `crates/vike-ops/tests/architecture/named_run_closure_gate.rs`, which refuses it by
# name (docs/decisions/0089-the-user-code-fence-is-held-by-name-not-by-rank.md) — the same gate
# that refuses this crate reaching `vike-sim` or `vike-backtest`. The rung is
# free — the lowest consumer is `vike-cli` (30) — and it keeps the two node-protocol clients at the
# SAME rank, which is what they are. `vike-core` (30), which equal rank used to keep off this crate,
# now may name it by rank, and the same gate refuses that edge by name
# (docs/decisions/0091-the-live-core-names-no-transport-and-no-node-client.md) — ⚠ this said "no
# rule refuses that edge by name" until that row landed.
# Every NORMAL (non-dev) vike-* dependency of this crate must declare a STRICTLY LOWER layer.
[package.metadata.vike]
layer = 25

[dependencies]
# ONE framing and ONE handshake across both localhost services, taken from the crate BELOW both
# rather than from the peer beside this one. ⚠ This edge was `vike-datahub-client` until
# 2026-09-23 and the substitution is the whole of this crate's twenty-rung drop (50 to 30; the 25
# is the later move): see the layer block above. `vike-node-proto` names no vike-* crate at
# all, so the edge is as light as an edge gets and carries no HistStore, no DataFusion and no
# venue vocabulary into this graph.
vike-node-proto = { path = "../vike-node-proto" }
serde = { workspace = true }        # derive on the Request/Response wire enums + the wire mirrors
serde_json = { workspace = true }   # (transitively) the frame payload codec re-exported from proto
# ⚠ `hmac`/`sha2` are NO LONGER named here. The auth primitive MOVED DOWN when
# `docs/decisions/0025-datahub-remote-posture.md` gave the datahub the same handshake — one
# implementation generalized over its domain separator, the same "one framing, not two" argument
# the edge above already makes. (It moved down a SECOND time on 2026-09-23, out of the peer and
# into `vike-node-proto`; this paragraph's point survives both moves unchanged.) `src/auth.rs`
# is now this service's BINDING of it (its own DOMAIN + its own key names) and does no crypto of its
# own, so the crates arrive transitively through that same edge and this manifest stops claiming a
# direct use it no longer has. Still ZERO new external deps overall: they are the exact crates
# vike-bridge-core/src/signer.rs already links (deny.toml bans a second crypto crate).
# The receive thread's latest-wins snapshot cell (PR-11 RemoteCoreHandle): the SAME lossy arc-swap
# primitive vike-core publishes CoreSnapshots through, so the remote read mirrors the in-process one.
# Already a workspace dep (vike-core) — NOT a new external crate; keeps this crate DataFusion-free.
arc-swap = { workspace = true }
# NOTE: no key-store / credentials dep on purpose. `auth::from_vars` takes an already-loaded var
# MAP so the CALLER owns the I/O — the daemon's node server hands it the NODE store
# `vike_secrets::resolve_node_keys` answers (the settings database's `node_key` table) — so this
# crate reads no
# key store and never drags the bridge stack (ureq/tungstenite/rustls) into a LIGHT client that a
# thin GUI/CLI links. Its only I/O is the `std::net` TCP connection its client side opens to a
# node, in `crates/vike-tradehub-client/src/handshake.rs`'s `node_handshake`.
# ⚠ This named `NodeKeys::from_vars` and a workspace `.env` read through
# the bridge's no-argument store loader (deleted since) until 2026-09-28. The constructor became
# the free function `auth::from_vars` when `NodeKeys` moved to the shared auth module (decision
# 0025; it is `vike_node_proto::auth` since 2026-09-23), and node keys left the venue credential
# file for a store of their own (decision 0051, then the settings database under 0054).
# ⚠ This called the crate "a pure, I/O-free, transport-free wire primitive" until 2026-09-28. That
# was PR-10's crate (#727); it has dialled its node since PR-11 (#731), both on 2026-07-26.

# Workspace lint policy (root manifest): forbids `unsafe_code`.
[lints]
workspace = true
